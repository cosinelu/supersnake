      wobblyRoundRect(ctx, x, y, cw, ch, 18, 71, 73, 2.4);
      ctx.save();
      ctx.clip();
      for (var nx = x; nx < x + cw; nx += 160) {
        for (var ny = y; ny < y + ch; ny += 160) ctx.drawImage(tile, nx, ny);
      }
      ctx.restore();
    }
    wobblyRoundRect(ctx, x, y, cw, ch, 18, 71, 73, 2.4);
    ctx.strokeStyle = cfg.INK;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.save();
    ctx.translate(1.4, -1);
    ctx.globalAlpha = aCard * 0.3;
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.restore();

    // ---- 标题区（按名次变化；掉线判负覆盖）----
    // 标题按模式/战绩变化：团队模式看本队 outcome（夺冠 / 全队阵亡 / 惜败）
    var title, titleColor;
    if (r.team && r.teamResult) {
      if (r.teamResult.outcome === 'win') { title = '团队冠军！'; titleColor = '#C47F17'; }
      else if (r.teamResult.outcome === 'elim') { title = '全队阵亡'; titleColor = cfg.INK; }
      else { title = '惜败'; titleColor = cfg.INK; }
    } else {
      title = r.dropped ? '掉线判负' : (r.rank === 1 ? '冠军！' : (r.rank <= 3 ? '很棒！' : '再接再厉'));
      titleColor = r.dropped ? '#E8552F' : (r.rank === 1 ? '#C47F17' : (r.rank <= 3 ? '#4A8C3F' : cfg.INK));
    }
    var ty = y + padV + Math.min(50, titleH * 0.52); // 标题基线随 titleH 收缩（极端矮屏）
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // 皇冠：个人第 1 名（非团队）或团队夺冠时显示
    var showCrown = (r.team && r.teamResult) ? (r.teamResult.outcome === 'win') : (r.rank === 1);
    if (showCrown) {
      drawCrown(ctx, cx, y + padV + 14, 46, 24);
      starPath(ctx, cx - 76, ty, 12, 0.4);
      ctx.fillStyle = '#FFD94A';
      ctx.fill();
      ctx.strokeStyle = cfg.INK;
      ctx.lineWidth = 1.6;
      ctx.stroke();
      starPath(ctx, cx + 76, ty, 12, -0.3);
      ctx.fillStyle = '#FFD94A';
      ctx.fill();
      ctx.stroke();
    }
    // 标题字体：圆体优先（Yuanti SC 字面圆润、字腔开口大，「惜败/全队阵亡」这类
    // 稠密字不粘连；无圆体的平台回退系统中黑）。字号 34→32，给粗体笔画留出间隙。
    ctx.font = 'bold 32px "Yuanti SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
    ctx.lineJoin = 'round';
    // 描边仅用于彩色标题（蜡笔勾边效果）；深色标题（惜败/全队阵亡/再接再厉）
    // 墨色描边 + 墨色填充会糊成一团不可读（v3.1 用户实测「惜败」变墨团），直接纯净填充。
    if (titleColor !== cfg.INK) {
      ctx.lineWidth = 5;
      ctx.strokeStyle = cfg.INK;
      ctx.strokeText(title, cx, ty);
    }
    ctx.fillStyle = titleColor;
    ctx.fillText(title, cx, ty);
    ctx.font = '12px sans-serif';
    ctx.globalAlpha = aCard * 0.65;
    ctx.fillStyle = cfg.INK;
    ctx.fillText(r.dropped ? '连接中断，不支持重连' : (r.team ? '在线团队赛 · 2v2v2v2v2' : (r.online ? '在线对战 · 真人匹配' : 'AI对战 · 7 蛇同场')), cx, ty + 30);
    ctx.globalAlpha = aCard;

    // ---- 统计行（依次延迟 ~80ms 从左侧滑入；两列时左右并排）----
    var y0 = y + padV + titleH;
    var colW = twoCol ? cw / 2 : cw;
    for (var ri = 0; ri < rows.length; ri++) {
      var p = u.clamp((t - 260 - ri * 80) / 160, 0, 1);
      if (p <= 0) continue;
      var inRight = twoCol && ri >= perCol;
      var idxInCol = inRight ? ri - perCol : ri;
      var colX = x + (inRight ? colW : 0);        // 该列左边界
      var ry = y0 + idxInCol * rowH + rowH / 2;
      var slide = (1 - p) * 22;
      ctx.save();
      ctx.globalAlpha = p * aCard;
      ctx.strokeStyle = 'rgba(58,50,56,0.18)'; // 行上手绘虚线分隔
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 5]);
      ctx.beginPath();
      ctx.moveTo(colX + (inRight ? 10 : 22), y0 + idxInCol * rowH);
      ctx.lineTo(colX + colW - (inRight ? 22 : 10), y0 + idxInCol * rowH);
      ctx.stroke();
      ctx.setLineDash([]);
      drawStatIcon(ctx, rows[ri].icon, colX + (twoCol ? 26 : 44) - slide, ry, twoCol ? 17 : 20);
      ctx.textAlign = 'left';
      ctx.font = (twoCol ? '12px' : '14px') + ' sans-serif';
      ctx.fillStyle = cfg.INK;
      ctx.fillText(rows[ri].label, colX + (twoCol ? 42 : 68) - slide, ry);
      ctx.textAlign = 'right';
      ctx.font = 'bold ' + (twoCol ? '14px' : '16px') + ' sans-serif';
      ctx.fillStyle = rows[ri].color;
      ctx.fillText(rows[ri].value, colX + colW - (twoCol ? 16 : 30) - slide, ry);
      ctx.restore();
    }
    // 两列时中间加一道竖向虚线分隔（手绘感，区分左右两组）
    if (twoCol) {
      ctx.save();
      ctx.globalAlpha = aCard * 0.18;
      ctx.strokeStyle = cfg.INK;
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 5]);
      ctx.beginPath();
      ctx.moveTo(x + colW, y0 + 4);
      ctx.lineTo(x + colW, y0 + perCol * rowH - 4);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    // ---- 卡片脚注：历史最佳（+ 新纪录标签）----
    var aFoot = u.clamp((t - 260 - rows.length * 80) / 200, 0, 1);
    if (aFoot > 0) {
      var fy = y + ch - padV - 8;
      ctx.save();
      ctx.globalAlpha = aFoot * aCard * 0.7;
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = cfg.INK;
      ctx.fillText('历史最佳 ' + r.bestLen + ' 节 · ' + r.bestScore + ' 分', cx, fy);
      ctx.restore();
      if (r.newBest) {
        ctx.save();
        ctx.globalAlpha = aFoot * aCard;
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'left';
        ctx.lineJoin = 'round';
        var nb = '新纪录！';
        var bw3 = ctx.measureText('历史最佳 ' + r.bestLen + ' 节 · ' + r.bestScore + ' 分').width;
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#FFFDF5';
        ctx.strokeText(nb, cx + bw3 / 2 + 10, fy);
        ctx.fillStyle = '#E8552F';
        ctx.fillText(nb, cx + bw3 / 2 + 10, fy);
        ctx.restore();
      }
    }
    ctx.restore();

    // ---- 按钮（最后淡入；主按钮更醒目）----
    var aBtn = u.clamp((t - 300 - rows.length * 80) / 220, 0, 1);
    for (bi = 0; bi < game.uiButtons.length; bi++) {
      this.drawDoodleButton(game.uiButtons[bi], game.uiButtons[bi].id === 'retry', aBtn);
    }
  };

  // ---------------- 解锁提示横幅 ----------------

  /**
   * 手绘风「新颜色解锁！」提示（需求 3：无底板）。
   * 只有文字 + 新颜色小色块图标，直接浮在画面上，不遮挡地图：
   * 文字带深色描边保证可读性，无任何矩形底色/面板；
   * 位置在视口上方 1/4 处，停留 1.5 秒（200ms 淡入 / 300ms 淡出，时长不变）。
   */
  Renderer.prototype.drawUnlockBanner = function (game) {
    var b = game.unlockBanner;
    if (!b || !b.keys || !b.keys.length) return;
    var ctx = this.ctx, l = game.layout();
    var life = cfg.UNLOCK_BANNER_MS;
    var remain = b.until - game.timeMs;     // 剩余毫秒
    var since = life - remain;              // 已显示毫秒
    var a = 1;
    if (since < 200) a = since / 200;       // 前 200ms 淡入
    else if (remain < 300) a = Math.max(0, remain / 300); // 末尾 300ms 淡出
    a = Math.max(0, Math.min(1, a));
    if (a <= 0) return;

    var cx = l.viewX + l.viewW / 2;
    var ty = l.viewY + l.viewH * 0.25; // 视口上方 1/4 处（竖屏时自动落在顶部面板之下）

    ctx.save();
    ctx.globalAlpha = a;
    // 手绘风文字：深色粗描边 + 纸色填充（无底板也可读）
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 26px sans-serif';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 5;
    ctx.strokeStyle = cfg.INK;
    ctx.strokeText(b.text, cx, ty);
    ctx.fillStyle = '#FFFDF5';
    ctx.fillText(b.text, cx, ty);

    // 新颜色小色块图标（文字下方一排，无任何底色衬板）
    var keys = b.keys;
    var sw = 22, gap = 10;
    var totalW = keys.length * sw + (keys.length - 1) * gap;
    var sx = cx - totalW / 2;
    for (var i = 0; i < keys.length; i++) {
      drawCrayonBlock(ctx, sx + i * (sw + gap), ty + 18, sw, cfg.COLORS[keys[i]], 50 + i, 9, {
        rot: (u.hash2(i, 7, 3) - 0.5) * 0.4, wobble: 1.0
      });
    }
    ctx.restore();
  };

  // ---------------- 特殊道具效果提示（HUD，屏幕空间，不遮挡地图） ----------------

  /**
   * 吃到特殊道具时弹出的效果说明文字（game.itemToast）。
   * 屏幕顶部居中、手绘描边 + 纸色填充（无底板，与解锁横幅同风格），约 1.6s 后淡出。
   * 停留在视口区上方，不侵入右侧 HUD 面板与小地图。
   */
  Renderer.prototype.drawItemToast = function (game) {
    var b = game.itemToast;
    if (!b || !b.text) return;
    var ctx = this.ctx, l = game.layout();
    var life = cfg.ITEM_TOAST_MS;
    var remain = b.until - game.timeMs;
    var since = life - remain;
    var a = 1;
    if (since < 180) a = since / 180;                  // 前 180ms 淡入
    else if (remain < 320) a = Math.max(0, remain / 320); // 末尾 320ms 淡出
    a = Math.max(0, Math.min(1, a));
    if (a <= 0) return;

    var cx = l.viewX + l.viewW / 2;
    var ty = l.viewY + 64; // 视口区顶部（竖屏时落在顶部面板之下）

    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 19px sans-serif';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 4;
    ctx.strokeStyle = cfg.INK;
    ctx.strokeText(b.text, cx, ty);
    ctx.fillStyle = '#FFFDF5';
    ctx.fillText(b.text, cx, ty);
    // 下方一道短装饰线（纯手绘感，无底板）
    ctx.lineWidth = 2;
    ctx.globalAlpha = a * 0.6;
    var dw = Math.min(l.viewW * 0.5, ctx.measureText(b.text).width + 24);
    ctx.beginPath();
    ctx.moveTo(cx - dw / 2, ty + 16);
    ctx.lineTo(cx + dw / 2, ty + 16);
    ctx.stroke();
    ctx.restore();
  };

  /**
   * 团队模式观战横幅：本人阵亡但队友存活（om.spectating）时，屏幕顶部常驻
   * 「你已阵亡 · 观战队友中」呼吸提示，直到整队结算出卡。
   * 背景：v3.1 服务端修复观战提前终结后，观战首次真正可达——若无任何屏幕提示，
   * 玩家会以为"自己死了却还在玩"或"游戏卡死"。
   * 位置避让：彩色星播报占 viewY+30、道具 toast 占 viewY+64，观战横幅落 viewY+96。
   */
  Renderer.prototype.drawSpectateBanner = function (game) {
    var om = game.online;
    if (!om || !om.spectating) return;
    var ctx = this.ctx, l = game.layout();
    var a = 0.75 + 0.25 * Math.sin(game.timeMs / 1000 * 3); // 呼吸闪烁
    var cx = l.viewX + l.viewW / 2;
    var ty = l.viewY + 96;
    var txt = '你已阵亡 · 观战队友中';
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 17px sans-serif';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 4;
    ctx.strokeStyle = cfg.INK;
    ctx.strokeText(txt, cx, ty);
    ctx.fillStyle = '#FFFDF5';
    ctx.fillText(txt, cx, ty);
    ctx.restore();
  };

  /**
   * 多人专属「彩色星」常驻播报：只要场上还存在那颗彩色星，屏幕上方就一直显示
   * 「彩色星出现！快去抢夺 +20% 分」（带图标 + 呼吸闪烁），引诱全场蛇去抢。
   * 不占用底板，纯描边文字 + 内嵌小图标；自适应窄屏缩放。
   */
  Renderer.prototype.drawGrabBroadcast = function (game) {
    if (game.mode !== 'multi') return;
    var gb = game.spawner && game.spawner.grabBlock;
    if (!gb) return;
    var ctx = this.ctx, l = game.layout();
    var t = game.timeMs / 1000;
    var alpha = 0.78 + 0.22 * Math.sin(t * 4); // 呼吸闪烁（不至于太低看不清）
    var cx = l.viewX + l.viewW / 2;
    var ty = l.viewY + 30; // 竖屏时落在顶部面板之下
    var txt = '彩色星出现！快去抢夺 +20% 分';
    var fs = 18;
    ctx.font = 'bold ' + fs + 'px sans-serif';
    var maxW = l.viewW * 0.94;
    while (ctx.measureText(txt).width + 64 > maxW && fs > 11) { fs--; ctx.font = 'bold ' + fs + 'px sans-serif'; }
    var tw = ctx.measureText(txt).width;
    var iconW = Math.min(30, fs + 12);
    var total = iconW + 8 + tw;
    var startX = cx - total / 2;

    ctx.save();
    ctx.globalAlpha = alpha;
    // 内嵌彩色星小图标（与游戏内同款渲染）
    drawItemBlock(ctx, { kind: 'grab', rarity: 'colorful' }, startX + iconW / 2, ty, iconW, 3, 7, 0, 1 + 0.06 * Math.sin(t * 3));
    // 文字（描边 + 填充，浅色场景可读）
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + fs + 'px sans-serif';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 4;
    ctx.strokeStyle = cfg.INK;
    ctx.strokeText(txt, startX + iconW + 8, ty);
    ctx.fillStyle = '#FFFDF5';
    ctx.fillText(txt, startX + iconW + 8, ty);
    ctx.restore();
  };

  // ---------------- 道具图鉴页面 ----------------

  /**
   * 图鉴页：分页展示所有道具，每页 5 张卡片。
   * 图标使用与游戏内完全相同的 drawItemBlock（离屏 canvas 渲染后贴图）。
   * 支持翻页（点击左右区域或按钮）+ 底部页码指示器 + 返回按钮。
   */
  // ==================== 图鉴页面（完整重设计）====================
  //
  // 布局结构（紧凑居中式，信息集中在页面中间）：
  //   ┌─ 顶栏：标题居中 + 居中页签（道具 / 颜色）───────────────┐
  //   ├─ 主体：内容区（居中，无侧边栏）──────────────────────────┤
  //   └─ 底栏：翻页提示 + 页码 + 居中返回按钮 ──────────────────┘

  /** 统一计算图鉴页面的布局网格（供 drawGuide / drawGuideColors 共用）。 */
  function guideLayout(game) {
    var W = game.screenW, H = game.screenH;
    var hdrH = 100;            // 顶栏高度（标题 + 间距 + 页签）
    var ftrH = 56;             // 底栏高度
    var hdrY = 0;
    var ftrY = H - ftrH;
    var bodyTop = hdrY + hdrH;
    var bodyBtm = ftrY;
    var bodyH = bodyBtm - bodyTop;

    // 内容区：左右留边距，居中
    var pad = Math.min(28, W * 0.05);
    var cx = pad;              // 内容区左边界
    var cW = W - pad * 2;     // 内容区宽度

    // 页签（标题下方居中，与标题拉开距离）
    var tw = 80, th = 32, tg = 10;
    var tabTotalW = tw * 2 + tg;
    var tabStartX = (W - tabTotalW) / 2;
    var tabY = hdrY + 60;     // 标题(26px) + 34px 间距

    return {
      W: W, H: H,
      hdrY: hdrY, hdrH: hdrH,
      ftrY: ftrY, ftrH: ftrH,
      bodyTop: bodyTop, bodyBtm: bodyBtm, bodyH: bodyH,
      cx: cx, cW: cW,
      // 页签热区（仅一组，居中）
      tabItems: { x: tabStartX,           y: tabY, w: tw, h: th },
      tabColors:{ x: tabStartX + tw + tg, y: tabY, w: tw, h: th }
    };
  }

  /**
   * 图鉴入口：统一调度道具页/颜色页。
   * 不再调用 drawButtons（返回按钮由本函数自绘，保证对齐）。
   */
  Renderer.prototype.drawGuide = function (game) {
    var ctx = this.ctx, L = guideLayout(game);

    // ════════════════ 1. 顶栏（标题 + 居中页签）════════════════
    this.drawGuideHeader(game, L);

    // ════════════════ 2. 内容区（按页签分发，居中无侧边栏）════════════════
    if (game.guideTab === 'colors') {
      this.drawGuideColorsContent(game, L);
    } else {
      this.drawGuideItemsContent(game, L);
    }

    // ════════════════ 3. 底栏（翻页 + 页码 + 居中返回按钮）════════════════
    this.drawGuideFooter(game, L);
  };

  // ---- 1. 顶栏：标题居中 + 居中页签（道具 / 颜色）----
  Renderer.prototype.drawGuideHeader = function (game, L) {
    var ctx = this.ctx;
    // 标题（屏幕居中）
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 26px sans-serif';
    ctx.fillStyle = cfg.INK;
    var title = game.guideTab === 'colors' ? '颜色解锁顺序' : '道具图鉴';
    ctx.fillText(title, L.W / 2, L.hdrY + 26);
    ctx.restore();

    // 页签胶囊（标题下方居中，与 guideLayout.tabItems/tabColors 对齐）
    var pairs = [['items', '道具'], ['colors', '颜色']];
    pairs.forEach(function (pair) {
      var key = pair[0], label = pair[1];
      var active = game.guideTab === key;
      var r = key === 'items' ? L.tabItems : L.tabColors;
      ctx.save();
      wobblyRoundRect(ctx, r.x, r.y, r.w, r.h, 10, r.x * 3, r.y * 7, 1.2);
      ctx.fillStyle = active ? cfg.INK : '#FFFDF5';
      ctx.fill();
      if (!active) { ctx.strokeStyle = cfg.INK; ctx.lineWidth = 1.6; ctx.stroke(); }
      else { ctx.lineWidth = 2.2; ctx.stroke(); }
      ctx.fillStyle = active ? '#FFFDF5' : cfg.INK;
      ctx.font = active ? 'bold 14px sans-serif' : '14px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2);
      ctx.restore();
    });
  };

  // ---- 3a. 道具页内容区（无侧边栏，卡片居中）----
  Renderer.prototype.drawGuideItemsContent = function (game, L) {
    var ctx = this.ctx;
    var items = cfg.ITEM_GUIDE.slice().sort(function (a, b) {
      var oa = a.rarity ? cfg.RARITY_ORDER.indexOf(a.rarity) : 99;
      var ob = b.rarity ? cfg.RARITY_ORDER.indexOf(b.rarity) : 99;
      return oa - ob;
    });
    if (!items || !items.length) return;

    var PER_PAGE = 5;
    var totalPages = Math.ceil(items.length / PER_PAGE);
    if (!game.guidePage || game.guidePage < 0) game.guidePage = 0;
    if (game.guidePage >= totalPages) game.guidePage = totalPages - 1;
    var pg = game.guidePage;
    var startIdx = pg * PER_PAGE;
    var endIdx = Math.min(startIdx + PER_PAGE, items.length);
    var pageItems = [];
    for (var k = startIdx; k < endIdx; k++) pageItems.push(items[k]);

    // 卡片列表（内容区居中，无品质图例）
    var cardW = Math.min(540, L.cW - 8);
    var cardX = L.cx + (L.cW - cardW) / 2;
    var startY = L.bodyTop + 16;          // 紧贴顶栏下方
    var cardH = 78, gap = 7, iconSize = 46;

    for (var i = 0; i < pageItems.length; i++) {
      var it = pageItems[i];
      var cy = startY + i * (cardH + gap);

      // 卡片底板
      ctx.save();
      wobblyRoundRect(ctx, cardX, cy, cardW, cardH, 8, (startIdx + i) * 7, (startIdx + i) * 11, 1.4);
      ctx.fillStyle = '#FFFDF5';
      ctx.fill();
      ctx.strokeStyle = cfg.INK; ctx.lineWidth = 2.0; ctx.stroke();
      ctx.restore();

      // 图标
      var ix = cardX + 18 + iconSize / 2, iy = cy + cardH / 2;
      var tmpC = document.createElement('canvas');
      tmpC.width = iconSize * 2 + 4; tmpC.height = iconSize * 2 + 4;
      var tx = tmpC.getContext('2d');
      tx.translate(iconSize + 2, iconSize + 2);
      drawItemBlock(tx, { kind: it.kind, color: it.colorKey || 'red' }, 0, 0, iconSize, (startIdx + i) * 13, (startIdx + i) * 17, 0, 1.0);
      ctx.drawImage(tmpC, ix - iconSize - 2, iy - iconSize - 2);

      // 名称 + 描述
      ctx.save();
      ctx.font = 'bold 14.5px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillStyle = cfg.INK;
      ctx.fillText(it.name, cardX + iconSize + 34, cy + 11);
      if (it.rarity && cfg.RARITY_COLORS[it.rarity]) {
        var bw = 68, bh = 17, bx = cardX + cardW - bw - 9, by = cy + 9;
        ctx.fillStyle = cfg.RARITY_COLORS[it.rarity]; ctx.fillRect(bx, by, bw, bh);
        ctx.strokeStyle = cfg.INK; ctx.lineWidth = 1.3; ctx.strokeRect(bx, by, bw, bh);
        ctx.fillStyle = '#FFFDF5';
        ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(cfg.RARITY_NAME[it.rarity], bx + bw / 2, by + bh / 2 + 0.5);
        ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.font = 'bold 14.5px sans-serif';
      }
      ctx.font = '12px sans-serif'; ctx.fillStyle = '#555';
      var descX = cardX + iconSize + 34, descY = cy + 33, maxW = cardW - iconSize - 48;
      var words = it.desc.split(''), line = '', lineY = descY, lh = 16;
      for (var c = 0; c < words.length; c++) {
        var test = line + words[c];
        if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, descX, lineY); line = ''; lineY += lh; }
        line += words[c];
      }
      if (line) ctx.fillText(line, descX, lineY);
      ctx.restore();
    }

    // 存储分页信息供 footer 使用
    game._guideTotalPages = totalPages;
    game._guidePage = pg;

    // 翻页箭头按钮（紧贴卡片区域左右两侧，仅多页时显示）
    if (totalPages > 1) {
      var arrW = 44, arrH = 44, arrGap = 20;
      var arrY = startY + (cardH + gap) * Math.min(pageItems.length - 1, 2) + cardH / 2 - arrH / 2; // 垂直居中于卡片区域
      if (arrY < L.bodyTop + 10) arrY = L.bodyTop + 10;
      var arrLx = cardX - arrW - arrGap;     // 紧贴卡片左侧
      var arrRx = cardX + cardW + arrGap;    // 紧贴卡片右侧
      // 钳制到屏幕可见区域内
      if (arrLx < L.cx) arrLx = L.cx;
      if (arrRx + arrW > L.cx + L.cW) arrRx = L.cx + L.cW - arrW;

      // 左箭头 ◀
      ctx.save();
      wobblyRoundRect(ctx, arrLx, arrY, arrW, arrH, 10, arrLx * 3, arrY * 7, 1.4);
      ctx.fillStyle = pg > 0 ? cfg.PANEL : '#F0EDE6';
      ctx.fill();
      ctx.strokeStyle = pg > 0 ? cfg.INK : 'rgba(58,50,56,0.2)';
      ctx.lineWidth = pg > 0 ? 2.0 : 1.4;
      ctx.stroke();
      if (pg > 0) { ctx.fillStyle = cfg.INK; ctx.font = 'bold 20px sans-serif'; }
      else { ctx.fillStyle = 'rgba(58,50,56,0.25)'; ctx.font = '20px sans-serif'; }
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('◀', arrLx + arrW / 2, arrY + arrH / 2);
      ctx.restore();

      // 右箭头 ▶
      ctx.save();
      wobblyRoundRect(ctx, arrRx, arrY, arrW, arrH, 10, arrRx * 3, arrY * 7, 1.4);
      ctx.fillStyle = pg < totalPages - 1 ? cfg.PANEL : '#F0EDE6';
      ctx.fill();
      ctx.strokeStyle = pg < totalPages - 1 ? cfg.INK : 'rgba(58,50,56,0.2)';
      ctx.lineWidth = pg < totalPages - 1 ? 2.0 : 1.4;
      ctx.stroke();
      if (pg < totalPages - 1) { ctx.fillStyle = cfg.INK; ctx.font = 'bold 20px sans-serif'; }
      else { ctx.fillStyle = 'rgba(58,50,56,0.25)'; ctx.font = '20px sans-serif'; }
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('▶', arrRx + arrW / 2, arrY + arrH / 2);
      ctx.restore();

      // 存储热区供 onTouchStart 使用
      game._guideArrowLeft  = { x: arrLx, y: arrY, w: arrW, h: arrH };
      game._guideArrowRight = { x: arrRx, y: arrY, w: arrW, h: arrH };
    } else {
      game._guideArrowLeft = null;
      game._guideArrowRight = null;
    }
  };

  // ---- 3b. 颜色解锁顺序内容区 ----
  Renderer.prototype.drawGuideColorsContent = function (game, L) {
    var ctx = this.ctx;
    var plan = cfg.colorUnlockPlan();

    var top = L.bodyTop + 16;          // 紧贴顶栏下方（无副标题）
    var bottomLimit = L.ftrY - 8;
    var rows = 4, gap = 10;
    var cellH = Math.floor((bottomLimit - top - (rows - 1) * gap) / rows);
    if (cellH < 68) cellH = 68;
    var cellW = Math.min(300, (L.cW - gap) / 2);
    var gridW = cellW * 2 + gap;
    var gx0 = L.cx + (L.cW - gridW) / 2;

    for (var i = 0; i < plan.length; i++) {
      var p = plan[i], col = i % 2, row = Math.floor(i / 2);
      var cx = gx0 + col * (cellW + gap), cy = top + row * (cellH + gap);

      ctx.save();
      wobblyRoundRect(ctx, cx, cy, cellW, cellH, 8, i * 7, i * 11, 1.4);
      ctx.fillStyle = '#FFFDF5'; ctx.fill();
      ctx.strokeStyle = cfg.INK; ctx.lineWidth = 2.0; ctx.stroke();
      ctx.restore();

      // 角标
      var br = 11;
      ctx.save();
      ctx.beginPath(); ctx.arc(cx + br + 5, cy + br + 5, br, 0, Math.PI * 2);
      ctx.fillStyle = cfg.INK; ctx.fill();
      ctx.fillStyle = '#FFFDF5';
      ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(p.order), cx + br + 5, cy + br + 5 + 0.5);
      ctx.restore();

      // 色块
      var bs = Math.min(42, cellH - 28);
      ctx.save();
      ctx.translate(cx + 16 + bs / 2, cy + cellH / 2);
      drawCrayonBlock(ctx, -bs / 2, -bs / 2, bs, p.hex, 30 + i, 9, { rot: (i % 2 ? 0.12 : -0.12), wobble: 1.0 });
      ctx.restore();

      // 文字
      var tx = cx + 16 + bs + 12;
      ctx.save();
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = cfg.INK; ctx.font = 'bold 18px sans-serif';
      ctx.fillText(p.name, tx, cy + cellH * 0.30);
      ctx.font = '12px sans-serif';
      ctx.fillStyle = p.initial ? '#C2185B' : '#555';
      ctx.fillText(p.endlessText, tx, cy + cellH * 0.62);
      ctx.restore();
    }

    game._guideTotalPages = 1;
    game._guidePage = 0;
  };

  // ---- 3. 底栏（页码 + 居中返回按钮）----
  Renderer.prototype.drawGuideFooter = function (game, L) {
    var ctx = this.ctx;
    var tp = game._guideTotalPages || 1, pg = game._guidePage || 0;
    var fy = L.ftrY + L.ftrH / 2;

    // 页码（左侧）
    if (tp > 1) {
      ctx.save();
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = '12px sans-serif'; ctx.fillStyle = '#AAA';
      ctx.fillText('第 ' + (pg + 1) + ' / ' + tp + ' 页', 24, fy);
      ctx.restore();
    }

    // 返回按钮（底部居中）
    var btnW = 120, btnH = 38;
    var btnX = (L.W - btnW) / 2;       // 居中
    var btnY = fy - btnH / 2;
    ctx.save();
    wobblyRoundRect(ctx, btnX, btnY, btnW, btnH, 12, btnX * 3, btnY * 7, 1.5);
    ctx.fillStyle = cfg.PANEL; ctx.fill();
    ctx.strokeStyle = cfg.INK; ctx.lineWidth = 2.0; ctx.stroke();
    ctx.fillStyle = cfg.INK;
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('← 返回', btnX + btnW / 2, fy);
    ctx.restore();
  };

  // ---------------- 总入口 ----------------

  Renderer.prototype.draw = function (game) {
    this.drawBackground();
    if (game.state === 'menu') { this.drawMenu(game); return; }
    if (game.state === 'guide') { this.drawGuide(game); return; }
    if (game.state === 'team_lobby') { this.drawTeamLobby(game); return; }
    if (game.state === 'matching') { this.drawMatching(game); return; }
    // play / over 都先画对局场景（世界 + 相机）
    this.drawPlay(game);
    this.drawPanel(game);
    if (game.state === 'play') {
      this.drawSpectateBanner(game); // 团队观战常驻横幅（本人阵亡、队友存活）
      this.drawUnlockBanner(game); // 解锁提示横幅（在摇杆之上）
      this.drawItemToast(game);    // 特殊道具效果提示（屏幕空间，不遮挡地图）
      this.drawGrabBroadcast(game); // 多人专属彩色星常驻播报（仅场上存在时显示）
      this.drawJoystick(game);
    } else if (game.state === 'over') {
      // 多人对战：卡片式逐行结算（含咬断/累计消除等新统计）；无尽沿用简单结算
      if (game.mode === 'multi' && game.mpResult) this.drawMultiResult(game);
      else this.drawResult(game);
    }
  };

  CS.Renderer = Renderer;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== 内联自 js/game.js（勿手改，源文件为准） ===== */
'use strict';
/**
 * game.js — 游戏主控：状态机 + 主循环逻辑（v2：自由方向 + 大地图 + 跟随镜头，横版布局）
 * 状态：menu（主菜单）→ play（对局）→ over（结束）
 * 模式：endless（无尽）/ multi（多人对战：玩家 + AI 蛇，见 multiplayer.js；联机局 online 非空）
 * （闯关模式已于 v3.1 移除：无 levels/clear 状态与关卡数据。）
 *
 * 横版布局：左/中为视口区（相机跟随蛇头、钳制在世界内），右侧竖向 HUD 面板
 * （分数/最高/已解锁颜色预览 + 小地图；多人模式另有实时排行榜）。
 * 除 resize/触摸入口外不含 DOM 依赖，可在 node 中加载做逻辑验证。
 */
(function (root) {
  var CS = root.CS = root.CS || {};
  var cfg = CS.config;
  var u = CS.utils;
  var store = CS.storage;
  var Walls = CS.Walls;
  var Snake = CS.Snake;
  var Spawner = CS.Spawner;
  var Particles = CS.Particles;
  var Joystick = CS.Joystick;
  var Audio = CS.audio;         // 音效系统（Web Audio API 振荡器合成）

  // 颜色中文名（道具效果提示用）
  var COLOR_NAMES = { red: '红', blue: '蓝', green: '绿', orange: '橙', purple: '紫', yellow: '黄', teal: '青', pink: '粉' };

  function Game(screenW, screenH) {
    this.screenW = screenW;
    this.screenH = screenH;
    this.state = 'menu';
    this.timeMs = 0;

    // 持久化进度
    this.best = store.get(cfg.STORAGE_BEST, 0) | 0;
    var mpb = store.get(cfg.STORAGE_MP_BEST, null); // 多人最佳 {len, score}
    this.mpBest = (mpb && typeof mpb === 'object') ? { len: mpb.len | 0, score: mpb.score | 0 } : { len: 0, score: 0 };

    // 对局数据（startRun 时初始化）
    this.mode = 'endless';
    this.levelCfg = null;
    this.walls = null;
    this.snake = null;
    this.spawner = null;
    this.particles = new Particles();
    this.joystick = new Joystick(); // 浮动摇杆：接管触点即移到触点，松手回默认位（视口左下角）
    this.cursorX = null;            // PC 光标位置（CSS 像素，main.js mousemove 始终跟踪；null=未知）
    this.cursorY = null;            //   play 态无键盘/摇杆输入时蛇朝光标方向转（鼠标跟随，§3.7）
    this.camera = { x: 0, y: 0 };   // 相机左上角世界坐标
    this.elapsed = 0;
    this.score = 0;
    this.survivalScore = 0;
    this.elimScore = 0;
    this.mpBonusScore = 0;      // 多人专属「彩色星」加成（吃掉即 +20% 当前总分，可累计叠加）
    this.elimCombo = 0;     // 连击层数（v2.9）：窗口内连续触发消除 +1，分数 ×combo
    this.elimComboTimer = 0; // 连击剩余窗口（ms），每帧衰减
    this.mp = null;       // 多人对战编排器（mode==='multi' 时非空）
    this.online = null;   // 在线对战控制器（CS.OnlineMatch，在线对局时非空，帧更新委托给它）
    this.mpResult = null; // 多人结算数据 {surviveSec, score, survivalScore, elimScore, elimTotal,
                        //   rank, kills, finalLen, maxLen, bestLen, bestScore, newBest}
    this.overAt = 0;      // 进入结算界面的时刻（timeMs，结算卡片/逐行动画计时起点）
    this.slowUntil = 0;   // 减速道具到期时刻（timeMs），0 表示未生效
    this.wallSpawnTimer = 0; // 动态墙体生成倒计时（ms），startRun/startMulti 时重置

    // ---- 颜色解锁系统（本局状态）----
    this.unlockedCount = 0;     // 当前已解锁颜色数
    this.unlockedKeys = [];     // 已解锁颜色的 key 数组（刷新色块 / 蛇身颜色都用它）
    this.unlockBanner = null;   // 解锁提示横幅 {text, until, keys}
    this.itemToast = null;      // 特殊道具效果提示 {text, until}（屏幕空间，HUD 层）
    this.guidePage = 0;         // 图鉴当前页码（0-based）
    this.guideTab = 'items';    // 图鉴页签：'items'=道具 / 'colors'=颜色解锁顺序

    // ---- 团队赛大厅（team_lobby）状态 ----
    this.teamCodeDraft = '';    // 好友房号输入草稿（开黑用；空=单人匹配）
    this.lobbyField = null;     // 当前聚焦的输入字段：'code' | null（由 main.js 据此挂载 DOM 输入框）
    this._lobbyCodeRect = null; // 大厅"好友房号"输入框的屏幕矩形（renderer 写入，main.js 定位 DOM 用）
    this.pendingTeamCode = null; // 邀请链接带入的房号（main.js 解析 ?team= 写入；进大厅时消费）
    this.inviteRequested = false; // 「邀请好友」点击标志：main.js（DOM 层）据此复制邀请链接
    this.inviteNotice = null;   // 邀请操作结果提示 {text, until}（main.js 写入，renderer 绘制）
    this.menuNotice = null;     // 主菜单错误提示 {text, until}（如匹配阶段连接失败回菜单时由 OnlineMatch 写入）

    this.uiButtons = [];
    this.buildButtons();
    this.syncJoystick();
  }

  // ---------------- 布局（横屏右侧面板 / 竖屏顶部面板） ----------------

  /**
   * 自适应布局：横屏 = 右侧竖向 HUD 面板；竖屏 = 顶部横向 HUD 条。
   *
   * 竖屏（手机竖持）若沿用右侧竖条，面板会吃掉近半个屏幕宽度，可玩区变成窄条；
   * 改为顶部横条后可玩区占满宽度，观感与操作都正常（docs/design §3.8）。
   *
   * 返回值同时提供：
   *   - 视口矩形 viewX/viewY/viewW/viewH（世界渲染与相机的唯一权威来源）
   *   - 面板矩形 panelX/panelY/panelW/panelH
   *   - portrait 标记，供渲染层选择 HUD 排布
   *   - areaW（= viewW）：兼容旧调用点的别名
   * @returns {{portrait:boolean, viewX:number, viewY:number, viewW:number, viewH:number,
   *            panelX:number, panelY:number, panelW:number, panelH:number, areaW:number}}
   */
  Game.prototype.layout = function () {
    // 缓存：layout() 每帧被渲染层调用多次（世界/面板/摇杆/结算各一次）。
    // 缓存键包含屏幕尺寸，尺寸一变自然失效；layoutBus 的 relayout 也会显式清空。
    var W = this.screenW, H = this.screenH;
    var c = this._layoutCache;
    if (c && c.W === W && c.H === H) return c.val;
    var val = this._computeLayout(W, H);
    this._layoutCache = { W: W, H: H, val: val };
    return val;
  };

  /** 清空布局缓存（layoutBus relayout 时调用） */
  Game.prototype.invalidateLayout = function () {
    this._layoutCache = null;
  };

  /** @private 实际的布局计算（不带缓存） */
  Game.prototype._computeLayout = function (W, H) {
    // 竖屏判定：高明显大于宽。用 1.05 而非 1.0 留一点余量，避免接近正方时反复抖动。
    var portrait = H > W * 1.05;
    var short = H < (CS.LAYOUT_SHORT_H || 460);   // 矮屏（手机横屏）

    if (portrait) {
      // 顶部横条：占屏高的一小部分，夹在 [132, 200]，保证可玩区仍是主体
      var panelH = Math.round(u.clamp(H * 0.20, 132, 200));
      if (panelH > H * 0.34) panelH = Math.round(H * 0.34); // 极端矮屏兜底
      return {
        portrait: true, short: short,
        viewX: 0, viewY: panelH, viewW: W, viewH: Math.max(120, H - panelH),
        panelX: 0, panelY: 0, panelW: W, panelH: panelH,
        areaW: W
      };
    }

    var panelW = Math.round(u.clamp(W * 0.19, 148, 230));
    if (W < 560) panelW = Math.round(u.clamp(W * 0.24, 110, 148)); // 窄屏压缩面板
    var areaW = Math.max(120, W - panelW);
    return {
      portrait: false, short: short,
      viewX: 0, viewY: 0, viewW: areaW, viewH: H,
      panelX: areaW, panelY: 0, panelW: panelW, panelH: H,
      areaW: areaW
    };
  };

  /**
   * 摇杆底座：视口区左下角（浮于画面之上，半透明）。
   * 竖屏时底部可用空间更大 → 底座上移、半径加大，便于拇指操作；
   * 同时读取安全区内边距（iOS 刘海 / 小白条），避免被系统 UI 遮挡。
   */
  Game.prototype.syncJoystick = function () {
    var l = this.layout();
    var inset = this.safeInsets();
    var r = l.portrait ? 62 : 52;
    var margin = l.portrait ? 42 : 30;
    var x = l.viewX + r + margin + inset.left;
    var y = l.viewY + l.viewH - r - margin - inset.bottom;
    this.joystick.setViewport(this.screenW, this.screenH); // 浮动底座钳制范围（屏幕内）
    this.joystick.setBase(x, y, r);
  };

  /**
   * 安全区内边距（px）。浏览器只在 CSS 侧暴露 env(safe-area-inset-*)，
   * 这里读取 body 上预置的 CSS 变量计算值（见 index.html），拿不到时回退 0。
   * 供摇杆与 HUD 避让刘海 / 圆角 / 底部小白条。
   */
  Game.prototype.safeInsets = function () {
    var z = { top: 0, right: 0, bottom: 0, left: 0 };
    if (typeof document === 'undefined' || !document.body ||
        typeof getComputedStyle !== 'function') return z;
    try {
      var cs = getComputedStyle(document.body);
      ['top', 'right', 'bottom', 'left'].forEach(function (k) {
        var v = parseFloat(cs.getPropertyValue('--safe-' + k));
        if (isFinite(v)) z[k] = v;
      });
    } catch (e) { /* 非浏览器环境或读取失败：全 0 */ }
    return z;
  };

  /** 窗口尺寸变化（main.js 在 resize 时调用） */
  Game.prototype.resize = function (w, h) {
    this.screenW = w;
    this.screenH = h;
    // 走统一的重排入口：清缓存 → 重建按钮 → 重设摇杆 → 重新钳制相机。
    // 之前这里只 buildButtons + syncJoystick，既没清 layout 缓存也没重新钳制相机，
    // 旋转后相机可能停在旧视口的合法位置、新视口下却越界（docs/design §3.8.3-D）。
    this.applyRelayout();
    // 同时向总线广播，让 Renderer 等其它订阅者一起失效缓存
    if (CS.layoutBus) CS.layoutBus.relayout(w, h);
  };

  /**
   * 响应重排：清空所有与尺寸相关的缓存并重算。
   * 幂等 —— 可安全重复调用（旋转时会连续触发多次）。
   */
  Game.prototype.applyRelayout = function () {
    this.invalidateLayout();
    this.buildButtons();
    this.syncJoystick();
    // 相机重新钳制：旧位置在新视口下可能越界（例如横→竖时视口变窄变高）
    if (this.snake && this.walls) {
      var l = this.layout();
      this.camera.x = clampCam(this.camera.x, this.walls.W, l.viewW);
      this.camera.y = clampCam(this.camera.y, this.walls.H, l.viewH);
    }
  };

  // ---------------- 相机 ----------------

  /**
   * 单轴相机钳制：世界小于视口时居中，否则夹在 [0, world-view]。
   * 注意：两侧各放行 WALL_THICK 余量，让"世界四周边界墙带"能进入视口——
   * 边界墙带画在世界坐标 [-T,0]/[W,W+T] 等外侧，若相机严格夹在 [0,W-view] 内，
   * 这些带永远在视口之外被裁剪，导致"地图边缘看不到墙"（历史 bug）。
   */
  function clampCam(v, world, view) {
    var T = cfg.WALL_THICK;
    if (world <= view) return (world - view) / 2;
    return u.clamp(v, -T, world - view + T);
  }

  /**
   * 相机跟随目标：团队模式观战（本人阵亡、队友存活）时跟随存活队友，
   * 其余情况跟随本机蛇。渲染/小地图只读这个返回值，无需关心观战状态。
   * @returns {object} 带 x/y 的蛇视图或本机蛇
   */
  Game.prototype.cameraTarget = function () {
    if (this.mode === 'multi' && this.online && this.online.spectating &&
        this.online.myTeam >= 0 && this.mp) {
      var es = this.mp.allEntries();
      for (var i = 0; i < es.length; i++) {
        var e = es[i];
        if (e.alive && e.teamId === this.online.myTeam && e.id !== this.online.playerId) {
          return e.snake;
        }
      }
    }
    return this.snake;
  };

  /** 相机平滑跟随蛇头（帧率无关指数趋近）并钳制在世界边界内 */
  Game.prototype.updateCamera = function (dt) {
    if (!this.snake || !this.walls) return;
    var l = this.layout();
    var vw = l.viewW, vh = l.viewH;
    var f = this.cameraTarget();
    if (!f) return;
    var tx = clampCam(f.x - vw / 2, this.walls.W, vw);
    var ty = clampCam(f.y - vh / 2, this.walls.H, vh);
    var k = 1 - Math.exp(-cfg.CAMERA_LERP * dt / 1000); // lerp 系数
    this.camera.x = clampCam(this.camera.x + (tx - this.camera.x) * k, this.walls.W, vw);
    this.camera.y = clampCam(this.camera.y + (ty - this.camera.y) * k, this.walls.H, vh);
  };

  /** 相机立即就位（开局调用，避免从原点飞入） */
  Game.prototype.snapCamera = function () {
    var l = this.layout();
    var f = this.cameraTarget();
    if (!f) return;
    this.camera.x = clampCam(f.x - l.viewW / 2, this.walls.W, l.viewW);
    this.camera.y = clampCam(f.y - l.viewH / 2, this.walls.H, l.viewH);
  };

  // ---------------- 对局生命周期 ----------------

  Game.prototype.startRun = function (mode, levelCfg) {
    this.mode = mode;
    this.levelCfg = levelCfg;
    var W = levelCfg.W, H = levelCfg.H;
    var spawn = { x: W / 2, y: H / 2 }; // 出生在世界中心
    this.walls = new Walls(W, H, spawn);
    this.walls.generateWalls(levelCfg.wallSegments);
    // 本局初始解锁颜色数（所有模式统一按存活时间，开局 = 0 秒）
    this.unlockedCount = cfg.unlockedCountForEndless(0);
    this.unlockedKeys = cfg.unlockedColorKeys(this.unlockedCount);
    // 先清零计时/计分，再算开局速度（动态速度含时间加成，必须在 elapsed=0 时初始化）
    this.elapsed = 0;
    this.score = 0;
    this.survivalScore = 0;
    this.elimScore = 0;
    this.mpBonusScore = 0;      // 多人专属「彩色星」加成（吃掉即 +20% 当前总分，可累计叠加）
    this.elimCombo = 0;
    this.elimComboTimer = 0;
    this.mp = null;
    this.mpResult = null;
    this.slowUntil = 0;
    this.snake = new Snake(spawn.x, spawn.y, cfg.START_LENGTH, 0, this.unlockedKeys);
    this.snake.speed = this.currentSpeed();
    this.spawner = new Spawner(this.walls, this.snake);
    this.spawner.unlockedKeys = this.unlockedKeys; // 色块只从已解锁颜色刷新
    this.spawner.fillNow();
    this.particles.clear();
    this.joystick.reset(); // 重置摇杆（含在屏触点集合）；setState(play) 随后会 latch 仍按住的手指
    this.wallSpawnTimer = Math.round(cfg.WALL_SPAWN_INTERVAL_MS * 0.5); // 开局延迟约半周期再生成首段
    this.snapCamera();
    this.syncJoystick();
    if (Audio) Audio.startBgm();  // 对局开始 → 启动背景音乐
    this.setState('play');
  };

  Game.prototype.startEndless = function () {
    var e = cfg.ENDLESS;
    this.startRun('endless', { level: 0, W: e.W, H: e.H, wallSegments: e.wallSegments, targetScore: 0, speed: cfg.SNAKE_SPEED });
  };

  /**
   * 多人对战：共享大地图（cfg.MULTI），玩家出生在世界中心，AI 出生在边缘安全位。
   * 颜色解锁规则同无尽（按玩家存活时间）；色块目标密度比单人略高（7 条蛇在吃）。
   * 玩家蛇仍是 this.snake（相机/摇杆/渲染主路径不变），AI 蛇由 this.mp 管理。
   */
  Game.prototype.startMulti = function () {
    this.mode = 'multi';
    var m = cfg.MULTI;
    this.levelCfg = { level: 0, W: m.W, H: m.H, wallSegments: m.wallSegments, targetScore: 0, speed: cfg.SNAKE_SPEED };
    var spawn = { x: m.W / 2, y: m.H / 2 };
    this.walls = new Walls(m.W, m.H, spawn);
    this.walls.generateWalls(m.wallSegments);
    this.unlockedCount = cfg.unlockedCountForEndless(0);
    this.unlockedKeys = cfg.unlockedColorKeys(this.unlockedCount);
    this.elapsed = 0;
    this.score = 0;
    this.survivalScore = 0;
    this.elimScore = 0;
    this.mpBonusScore = 0;      // 多人专属「彩色星」加成（吃掉即 +20% 当前总分，可累计叠加）
    this.elimCombo = 0;
    this.elimComboTimer = 0;
    this.mpResult = null;
    this.snake = new Snake(spawn.x, spawn.y, cfg.START_LENGTH, 0, this.unlockedKeys);
    this.snake.speed = cfg.SNAKE_SPEED;
    this.spawner = new Spawner(this.walls, this.snake);
    this.spawner.unlockedKeys = this.unlockedKeys;
    this.spawner.grabEnabled = true; // 多人对战：启用「彩色星」专属抢夺道具
    // 多人色块目标密度：世界面积 / MP_BLOCK_AREA_DIV，夹取 [MP_BLOCKS_MIN, MP_BLOCKS_MAX]
    this.spawner.target = u.clamp(Math.round(m.W * m.H / cfg.MP_BLOCK_AREA_DIV), cfg.MP_BLOCKS_MIN, cfg.MP_BLOCKS_MAX);
    this.particles.clear();
    this.mp = new CS.Multiplayer(this);
    this.mp.setup(); // 玩家 Entry + 补足 AI 编制（同时挂 spawner.others 活引用）
    this.spawner.fillNow();
    this.joystick.reset(); // 重置摇杆（含在屏触点集合）；setState(play) 随后会 latch 仍按住的手指
    this.wallSpawnTimer = Math.round(cfg.WALL_SPAWN_INTERVAL_MS * 0.5); // 开局延迟约半周期再生成首段
    this.snapCamera();
    this.syncJoystick();
    if (Audio) Audio.startBgm();  // 多人对局开始 → 启动背景音乐
    this.setState('play');
  };

  /** 多人对战帧更新：输入 → mp 编排（AI/碰撞/淘汰/补充/吃色/消除）→ 相机 → 结算判定 */
  Game.prototype.updateMulti = function (dt) {
    this.elapsed += dt;
    this.survivalScore = Math.floor(this.elapsed / 1000) * cfg.SURVIVE_SCORE_PER_SEC;

    // 输入：键盘/摇杆/鼠标跟随给出目标角（与 AI 同规则：只设目标角，转向速率由 Snake 钳制）
    var ang = this.steeringAngle();
    if (ang !== null && this.mp.playerEntry.alive) this.snake.setTargetAngle(ang);

    this.mp.update(dt);

    // 玩家自碰重组（v2.9）：与单人同规则；触发后走 mp.resolveElim 计分（含连击倍率 + 特效）
    if (this.mp.playerEntry.alive && this.snake.selfPullCd <= 0) {
      var pulledM = this.snake.trySelfPull();
      if (pulledM) {
        this.snake.selfPullCd = cfg.SELF_PULL_CD;
        var scolM = cfg.COLORS[pulledM.color] || '#FFD94A';
        // 明显动效：身体接触点咬合环 + 牵引线拉到头部 + 头部迸裂 + 「自吃 +1」飘字
        this.particles.ring(pulledM.x, pulledM.y, scolM, 1.4);
        this.particles.burst(pulledM.x, pulledM.y, scolM, 8, 1.4);
        this.particles.streak(pulledM.x, pulledM.y, this.snake.x, this.snake.y, scolM);
        this.particles.burst(this.snake.x, this.snake.y, '#FFD94A', 6, 1.1);
        this.particles.chainText(this.snake.x, this.snake.y - 26, '自吃 +1', 16);
        if (CS.audio) CS.audio.playEat();
        this.mp.resolveElim(this.mp.playerEntry);
      }
    }

    // 玩家得分 = 存活分 + 消除分 + 彩色星加成（消除分/加成在 mp 内按连锁 + 连击倍率累计到 Entry，每帧同步回 game）
    this.elimScore = this.mp.playerEntry.elimScore;
    this.mpBonusScore = this.mp.playerEntry.mpBonusScore || 0;
    this.score = this.survivalScore + this.elimScore + (this.mpBonusScore || 0);

    this.updateCamera(dt);

    if (!this.mp.playerEntry.alive) this.gameOverMulti();
  };

  /** 多人结算：排名 / 存活时间 / 总分（时间分+消除分）/ 累计消除方块 / 击杀数 / 最终节数
   *  + 本地最佳（最长节数 / 最高分）；overAt 供结算卡片逐行动画计时 */
  Game.prototype.gameOverMulti = function () {
    if (Audio) { Audio.stopBgm(); Audio.playWall(); }  // 多人结束音效
    var e = this.mp.playerEntry;
    var rank = this.mp.rankOf(e);
    var bestLen = Math.max(this.mpBest.len, e.maxLen);
    var bestScore = Math.max(this.mpBest.score, this.score);
    var newBest = e.maxLen > this.mpBest.len || this.score > this.mpBest.score;
    this.mpBest = { len: bestLen, score: bestScore };
    store.set(cfg.STORAGE_MP_BEST, this.mpBest);
    this.mpResult = {
      surviveSec: Math.floor(this.elapsed / 1000),
      score: this.score,
      survivalScore: this.survivalScore,
      elimScore: this.elimScore,
      elimTotal: e.elimTotal,       // 累计消除方块（含连锁、含被咬触发的消除）
      rank: rank,
      kills: e.kills,
      finalLen: e.snake.length(),   // 淘汰瞬间节数
      maxLen: e.maxLen,
      bestLen: bestLen,
      bestScore: bestScore,
      newBest: newBest
    };
    this.overAt = this.timeMs;
    this.setState('over');
  };

  /**
   * 把已解锁颜色数提升到 count（仅在增大时更新刷新池并弹横幅）。
   * @param {number} count 目标解锁数
   */
  Game.prototype.unlockTo = function (count) {
    count = Math.min(cfg.MAX_COLORS, Math.max(0, count | 0));
    if (count <= this.unlockedCount) return; // 不加反、不重复弹
    var prev = this.unlockedCount;
    this.unlockedCount = count;
    this.unlockedKeys = cfg.unlockedColorKeys(count);
    if (this.spawner) this.spawner.unlockedKeys = this.unlockedKeys; // 新颜色立即进入刷新池
    this.unlockBanner = {
      text: '新颜色解锁！',
      until: this.timeMs + cfg.UNLOCK_BANNER_MS,
      keys: cfg.COLOR_KEYS.slice(prev, count) // 本次新增的颜色
    };
    if (Audio) Audio.playUnlock();  // 解锁新颜色音效
  };

  /**
   * 当前蛇速（px/s）——局内动态加速，每帧按公式重算（平滑，无跳变）：
   *   无尽：min(SPEED_MAX, SNAKE_SPEED + ENDLESS_SPEEDUP_PER_SEC×存活秒 + SPEED_LEN_COEF×当前节数)
   *   多人：min(基础 + SPEED_CAP_ADD, 基础 + SPEED_LEN_COEF×当前节数 + SPEED_TIME_COEF×存活秒)
   * 只改速度数值；节间距、消除/收集/撞墙判定等几何参数不受影响。
   */
  Game.prototype.currentSpeed = function () {
    var len = this.snake ? this.snake.length() : cfg.START_LENGTH;
    var sec = this.elapsed / 1000;
    var sp, base;
    if (this.mode === 'endless') {
      sp = cfg.SNAKE_SPEED + sec * cfg.ENDLESS_SPEEDUP_PER_SEC + len * cfg.SPEED_LEN_COEF;
      sp = Math.min(cfg.SPEED_MAX, sp);
    } else {
      base = this.levelCfg.speed;
      sp = base + len * cfg.SPEED_LEN_COEF + sec * cfg.SPEED_TIME_COEF;
      sp = Math.min(base + cfg.SPEED_CAP_ADD, sp);
    }
    if (this.slowUntil && this.timeMs < this.slowUntil) sp *= cfg.SLOW_FACTOR; // 减速道具
    return sp;
  };

  /**
   * 连击（v2.9）：窗口内连续触发消除时 combo 逐次 +1，分数按 combo 倍率成倍增加。
   * 与连锁 chain 叠乘：单节得分 = ELIM_SCORE × chain × combo。
   */
  Game.prototype.bumpCombo = function () {
    this.elimCombo = (this.elimComboTimer > 0) ? this.elimCombo + 1 : 1;
    this.elimComboTimer = cfg.ELIM_COMBO_WINDOW;
  };
  /** 每帧衰减连击窗口；超窗口则归零 */
  Game.prototype.tickCombo = function (dt) {
    if (this.elimComboTimer > 0) {
      this.elimComboTimer -= dt;
      if (this.elimComboTimer <= 0) { this.elimComboTimer = 0; this.elimCombo = 0; }
    }
  };

  /**
   * 统一的消除计分 + 特效（连锁倍率 × 连击倍率、逐级放大粒子/星闪、N 连锁文字）。
   * @param {Array} removed 被移除节 [{color,x,y,chain}]
   * @param {number} fxBoost 特效放大（炸弹更强）
   * @param {number} perSegBonus 每节额外得分（炸弹道具）
   */
  Game.prototype.applyElim = function (removed, fxBoost, perSegBonus) {
    if (!removed || !removed.length) return;
    if (Audio) Audio.playElim();  // 消除基础音效
    this.bumpCombo();            // 本次消除计入连击（窗口内连续消除 → combo 递增 → 分数成倍）
    var combo = Math.min(cfg.ELIM_COMBO_MAX, this.elimCombo);
    var waves = {};
    for (var i = 0; i < removed.length; i++) {
      var ch = removed[i].chain || 1;
      (waves[ch] = waves[ch] || []).push(removed[i]);
    }
    var chainLv = Object.keys(waves).map(Number).sort(function (a, b) { return a - b; });
    for (var w = 0; w < chainLv.length; w++) {
      var chain = chainLv[w], segs = waves[chain];
      var fxScale = (1 + (chain - 1) * cfg.CHAIN_FX_STEP) * (fxBoost || 1);
      this.elimScore += segs.length * (cfg.ELIM_SCORE * chain * combo + (perSegBonus || 0));
      var sx = 0, sy = 0;
      for (i = 0; i < segs.length; i++) {
        var col = segs[i].color === 'wild' ? '#FFD94A' : cfg.COLORS[segs[i].color];
        this.particles.burst(segs[i].x, segs[i].y, col, Math.round(5 * fxScale), fxScale);
        this.particles.ring(segs[i].x, segs[i].y, col, fxScale); // 消除高亮：扩张环 + ✕，标出被消除节（非连续也可见）
        sx += segs[i].x; sy += segs[i].y;
      }
      var ccx = sx / segs.length, ccy = sy / segs.length;
      this.particles.flash(ccx, ccy, '#FFD94A', fxScale, Math.min(4, chain));
      if (chain >= cfg.CHAIN_TEXT_MIN) {
        this.particles.chainText(ccx, ccy - 24, chain + '连锁！', 20 + (chain - 1) * 6);
      }
      if (combo >= 2) { // 连击提示：在连锁文字上方再弹一行「N连击 ×倍率」
        this.particles.chainText(ccx, ccy - 46, combo + '连击 ×' + combo, 18 + combo);
      }
      if (Audio && chain >= 2) Audio.playChain(chain);  // 连锁额外音效（越高越响）
    }
  };

  // ---------------- 主循环 ----------------

  /**
   * 动态墙体生成：按固定间隔在地图上新增一段障碍墙（避开玩家与 AI 蛇身）。
   * 渲染（drawWallRect）与碰撞（hitsCircle）都自动复用内部墙系统，无需额外接线。
   */
  Game.prototype.updateWallSpawn = function (dt) {
    this.wallSpawnTimer -= dt;
    if (this.wallSpawnTimer > 0) return;
    this.wallSpawnTimer = cfg.WALL_SPAWN_INTERVAL_MS;
    if (!this.walls) return;
    // 收集所有蛇身节点作为避让点（玩家优先，多人再补 AI）
    var pts = [];
    if (this.snake && this.snake.segPos) {
      for (var i = 0; i < this.snake.segPos.length; i++) pts.push(this.snake.segPos[i]);
    }
    if (this.mode === 'multi' && this.mp && this.mp.bots) {
      for (var b = 0; b < this.mp.bots.length; b++) {
        var bot = this.mp.bots[b];
        if (bot.alive && bot.snake && bot.snake.segPos) {
          for (var k = 0; k < bot.snake.segPos.length; k++) pts.push(bot.snake.segPos[k]);
        }
      }
    }
    this.walls.addRandomWall(pts, cfg.WALL_SPAWN_MAX);
  };

  Game.prototype.update = function (dt) {
    this.timeMs += dt;
    this.particles.update(dt);
    if (this.state !== 'play') return;
    this.tickCombo(dt); // 连击窗口每帧衰减（超窗口归零）

    // 解锁提示横幅到期自动清除
    if (this.unlockBanner && this.timeMs >= this.unlockBanner.until) this.unlockBanner = null;
    // 特殊道具效果提示到期自动清除
    if (this.itemToast && this.timeMs >= this.itemToast.until) this.itemToast = null;

    // 无尽/多人模式：随存活时间解锁新颜色（每 ENDLESS_UNLOCK_INTERVAL_SEC 秒 +1，封顶 MAX_COLORS）
    if (this.mode === 'endless' || this.mode === 'multi') {
      this.unlockTo(cfg.unlockedCountForEndless(Math.floor(this.elapsed / 1000)));
    }

    // 多人对战：蛇群推进/淘汰/补充全部由 mp 编排（含吃色与消除）
    if (this.mode === 'multi') {
      if (this.online) { this.online.update(dt); return; } // 在线：预测+插值+快照同步
      this.updateWallSpawn(dt);
      this.updateMulti(dt);
      return;
    }

    this.updateWallSpawn(dt);
    this.elapsed += dt;
    this.survivalScore = Math.floor(this.elapsed / 1000) * cfg.SURVIVE_SCORE_PER_SEC;
    this.score = this.survivalScore + this.elimScore;

    // 输入：键盘/摇杆/鼠标跟随给出目标角（无输入则保持上一目标角，蛇继续沿原方向）
    var ang = this.steeringAngle();
    if (ang !== null) this.snake.setTargetAngle(ang);

    // 推进蛇（转向速率钳制 + 恒速前进 + 轨迹跟随在 snake 内完成）
    this.snake.speed = this.currentSpeed();
    this.snake.update(dt);

    // 相机跟随
    this.updateCamera(dt);

    // 撞墙判定：蛇头圆与世界边界 / 内部墙相交 → 结束
    if (this.walls.hitsCircle(this.snake.x, this.snake.y, cfg.HEAD_HIT_RADIUS)) {
      this.gameOver();
      return;
    }

    // 收集：蛇头或任一身体节压到的色块都收集；按类型触发不同效果
    var got = this.spawner.collectAt(this.snake);
    for (var i = 0; i < got.length; i++) {
      var b = got[i];
      // 特殊道具：弹出效果说明文字（普通色块不弹）
      if (b.kind && b.kind !== 'color') this.setItemToast(b.kind, b.color);
      if (b.kind === 'wild') {
        this.snake.growWild();
        if (Audio) Audio.playSpecial();
        this.particles.burst(b.x, b.y, '#FFD94A', 7);
      } else if (b.kind === 'bomb') {
        if (Audio) Audio.playSpecial();
        this.particles.burst(b.x, b.y, '#E8552F', 12, 1.5);
        var remB = this.snake.eliminate(2, 2);      // 炸弹：清掉所有 ≥2 连同色段
        this.applyElim(remB, 1.4, cfg.BOMB_SCORE);
      } else if (b.kind === 'slow') {
        if (Audio) Audio.playSpecial();
        this.slowUntil = this.timeMs + cfg.SLOW_MS;
        this.particles.burst(b.x, b.y, '#2EC4B6', 9);
      } else if (b.kind === 'clear') {
        if (Audio) Audio.playSpecial();
        // 消色：消除全体现该颜色节
        var remC = this.snake.removeByColor(b.color);
        this.applyElim(remC, 1.3, cfg.CLEAR_SCORE);
        var remC2 = this.snake.eliminate(cfg.MIN_LENGTH, cfg.ELIM_RUN);
        this.applyElim(remC2, 1, 0);
        this.particles.burst(b.x, b.y, cfg.COLORS[b.color], 12, 1.5);
      } else if (b.kind === 'clear3') {
        if (Audio) Audio.playSpecial();
        // 后 3 消色：消除该颜色最靠尾的至多 3 节
        var rem3 = this.snake.removeRearByColor(b.color, 3);
        this.applyElim(rem3, 1.2, cfg.CLEAR3_SCORE);
        var rem32 = this.snake.eliminate(cfg.MIN_LENGTH, cfg.ELIM_RUN);
        this.applyElim(rem32, 1, 0);
        this.particles.burst(b.x, b.y, cfg.COLORS[b.color], 9, 1.3);
      } else if (b.kind === 'rand1' || b.kind === 'rand2' || b.kind === 'rand3') {
        if (Audio) Audio.playSpecial();
        // 随机消除 1/2/3 节
        var rn = b.kind === 'rand1' ? 1 : (b.kind === 'rand2' ? 2 : 3);
        var remR = this.snake.removeRandom(rn);
        this.applyElim(remR, 1.2, cfg.RAND_SCORE);
        var remR2 = this.snake.eliminate(cfg.MIN_LENGTH, cfg.ELIM_RUN);
        this.applyElim(remR2, 1, 0);
        this.particles.burst(b.x, b.y, '#FFD94A', 9, 1.3);
      } else {
        if (Audio) Audio.playEat();
        this.snake.grow(b.color);
        this.particles.burst(b.x, b.y, cfg.COLORS[b.color], 4);
      }
    }

    // 流星砖块：移动 + 碰撞注入（命中身体即把该色注入中段，衔接消除连锁）
    var mev = this.spawner.updateMeteors(dt, this.snake);
    for (var mi = 0; mi < mev.length; mi++) {
      var ev = mev[mi];
      this.snake.insertAt(ev.idx, ev.color);
      this.particles.burst(ev.x, ev.y, cfg.COLORS[ev.color], 7, 1.3);
      this.elimScore += cfg.METEOR_SCORE;
      this.setItemToast('meteor', ev.color); // 流星注入飘字
      var remM = this.snake.eliminate(cfg.MIN_LENGTH, cfg.ELIM_RUN);
      this.applyElim(remM, 1, 0);
    }

    // 消除：相邻连续 ≥4 节同色立即消除（含连锁），保底 3 节。
    var removed = this.snake.eliminate(cfg.MIN_LENGTH, cfg.ELIM_RUN);
    this.applyElim(removed, 1, 0);

    // 自碰重组（v2.9）：蛇头触到自身身体 → 把一个砖块吃到头部（总长不变），多为消除制造新机会
    if (this.snake.selfPullCd <= 0) {
      var pulled = this.snake.trySelfPull();
      if (pulled) {
        this.snake.selfPullCd = cfg.SELF_PULL_CD;
        var scol = cfg.COLORS[pulled.color] || '#FFD94A';
        // 明显动效：身体接触点咬合环 + 牵引线拉到头部 + 头部迸裂 + 「自吃 +1」飘字，一眼看出触发了"吃"
        this.particles.ring(pulled.x, pulled.y, scol, 1.4);
        this.particles.burst(pulled.x, pulled.y, scol, 8, 1.4);
        this.particles.streak(pulled.x, pulled.y, this.snake.x, this.snake.y, scol);
        this.particles.burst(this.snake.x, this.snake.y, '#FFD94A', 6, 1.1);
        this.particles.chainText(this.snake.x, this.snake.y - 26, '自吃 +1', 16);
        if (CS.audio) CS.audio.playEat();
        var remSP = this.snake.eliminate(cfg.MIN_LENGTH, cfg.ELIM_RUN);
        this.applyElim(remSP, 1.1, 0);
      }
    }

    this.spawner.specialChance = cfg.specialChanceForElapsed(this.elapsed); // 越后期特殊道具越多
    this.spawner.update(dt);
  };

  Game.prototype.gameOver = function () {
    if (Audio) { Audio.stopBgm(); Audio.playWall(); }  // 结束音效
    if (this.mode === 'endless' && this.score > this.best) {
      this.best = this.score;
      store.set(cfg.STORAGE_BEST, this.best);
    }
    this.overAt = this.timeMs;
    this.setState('over');
  };

  // ---------------- UI 状态与按钮 ----------------

  Game.prototype.setState = function (s) {
    var was = this.state;
    this.state = s;
    this.buildButtons();
    // 进入对局：若手指此刻仍按在屏上（倒计时期间按住、或 touchstart 走了按钮分支），
    // 立即用该触点接管摇杆，避免「手指在屏却整局无响应」（docs/design §3.7）。
    if (s === 'play' && was !== 'play') this.joystick.latchExisting();
  };

  Game.prototype.addButton = function (id, cx, cy, w, h, label, enabled) {
    this.uiButtons.push({ id: id, x: cx - w / 2, y: cy - h / 2, w: w, h: h, label: label, enabled: enabled !== false });
  };

  /**
   * 主菜单布局求解（v3.0.5，方案 A）——**渲染层与按钮布局的唯一权威源**。
   *
   * 之前标题/副标题/统计文字的坐标写在 renderer 里，按钮坐标写在 game 里，
   * 两处各自按 H 的比例硬算，于是横屏时按钮压住蛇动画与副标题。
   * 现在统一由本函数产出所有分区，renderer 只负责往给定矩形里画。
   *
   * 横屏矮屏（`short && !portrait`）走**左右分栏**：
   *   左半区 = 品牌区（标题 / 蛇动画 / 副标题 / 底部统计），右半区 = 按钮单列。
   *   两区不共享纵向空间 ⇒ 结构上不可能重叠。
   * 竖屏 / 桌面保持原纵向流（标题在上、按钮居中、统计在底）。
   *
   * @returns {{split:boolean, brandX:number, brandW:number, brandCx:number,
   *            titleY:number, titleSize:number, animY:number, subY:number,
   *            statY:number, statLine:number, statCx:number,
   *            btnCx:number, btnW:number, btnTop:number, btnBottom:number}}
   */
  Game.prototype.menuLayout = function () {
    var W = this.screenW, H = this.screenH;
    var l = this.layout();
    var inset = this.safeInsets();
    var split = l.short && !l.portrait;        // 只有横屏矮屏才分栏

    if (split) {
      var splitX = Math.round(W * 0.46);
      var padL = 16 + inset.left, padR = 16 + inset.right;
      var brandW = splitX - padL;
      var brandCx = padL + brandW / 2;
      // 品牌区纵向：标题 → 蛇动画轨道 → 副标题 → 统计两行，整体在左半区垂直居中。
      // 轨道实际占用比色块尺寸大：色块 24px(±12) + 波浪摆动 ±2.6 ⇒ laneY±15，
      // 且「4连消除！」飘字在 laneY-26 会向上顶标题 → 上下都要留够。
      var titleSize = Math.round(u.clamp(H * 0.10, 24, 40));
      var LANE_UP = 30, LANE_DN = 17;                    // 轨道上/下实际占用
      var SUB_H = 9, STAT_H = 9;                         // 半高
      var blockH = titleSize + LANE_UP + LANE_DN + 10 + SUB_H * 2 + 10 + STAT_H * 2 + 16;
      var bTop = Math.max(inset.top + 6, (H - blockH) / 2);
      var titleY = bTop + titleSize * 0.55;
      var animY = titleY + titleSize * 0.5 + LANE_UP;    // 标题底边下方再留出飘字空间
      var subY = animY + LANE_DN + 10 + SUB_H;
      var statY = subY + SUB_H + 12 + STAT_H;
      var statLine = 16;
      // 整组超出屏幕时整体上移（极端矮屏）
      var overflow = (statY + statLine + STAT_H + 8 + inset.bottom) - H;
      if (overflow > 0) { titleY -= overflow; animY -= overflow; subY -= overflow; statY -= overflow; }
      // 按钮区：右半区整体垂直居中，与品牌区完全分离
      var btnW = Math.min(240, W - splitX - padR - 16);
      return {
        split: true, showStat: true, showSub: true, showAnim: true,
        brandX: padL, brandW: brandW, brandCx: brandCx,
        titleY: titleY, titleSize: titleSize, animY: animY, subY: subY,
        statY: statY, statLine: statLine, statCx: brandCx,
        btnCx: splitX + (W - splitX - padR) / 2, btnW: btnW,
        btnTop: inset.top + 12, btnBottom: H - 12 - inset.bottom
      };
    }

    // 纵向流（竖屏 / 桌面）：沿用原比例，但坐标集中在此处产出
    var tSize = Math.round(u.clamp(H * 0.075, 30, 52));
    var tY = H * 0.22;
    var top = Math.max(H * 0.35 + 16, tY + tSize * 0.95 + 20);  // 让开副标题与蛇动画
    var bottom = H * 0.89 - 14 - inset.bottom;                  // 让开底部两行信息
    var showStat = true, showSub = true, showAnim = true;
    var minNeed = 5 * 34 + 4 * 6;   // 菜单 5 个按钮（无尽/AI对战/在线对战/在线团队赛/图鉴）
    if (bottom - top < minNeed) {                               // 极端小屏兜底
      // 空间不足时逐级让位。优先级：**按钮可点 > 蛇动画 > 副标题 > 历史成绩**
      //（点不到的按钮比看不到的装饰严重得多）。
      showStat = false;
      bottom = H - 8 - inset.bottom;
      if (bottom - top < minNeed) {
        showSub = false;                                        // 副标题让位
        top = Math.max(inset.top + 6, tY + tSize * 0.62 + 8);
      }
      if (bottom - top < minNeed) {
        showAnim = false;                                       // 蛇动画（纯装饰）让位
        top = Math.max(inset.top + 4, tY + tSize * 0.55 + 6);
      }
      if (bottom - top < minNeed) {
        // 最后兜底：抬顶腾空间，但**不许压到标题**（标题是唯一不让位的品牌层）。
        // 剩余缺口交给 solveButtonStack 的二次压缩（间距→0、高度→20px 绝对下限）消化。
        var titleBot = tY + tSize * 0.5 + 4;
        top = Math.max(inset.top + 4, titleBot, bottom - minNeed);
      }
    }
    // 蛇动画是纯装饰：只要它的轨道会被按钮区压到，就直接不画（而不是硬挤）。
    // 判据用**实际占用**（轨道下沿 animY+17）与按钮区顶 top 比较 ——
    // 不能只看"前面几级让位是否触发"，因为 top 上移后动画照样会被压。
    var animYv = tY + tSize * 0.95;
    if (animYv + 17 > top) showAnim = false;
    return {
      split: false, showStat: showStat, showSub: showSub, showAnim: showAnim,
      brandX: 0, brandW: W, brandCx: W / 2,
      titleY: tY, titleSize: tSize, animY: animYv, subY: H * 0.35,
      statY: H * 0.89, statLine: 22, statCx: W / 2,
      btnCx: W / 2, btnW: Math.min(220, W * 0.3),
      btnTop: top, btnBottom: bottom
    };
  };

  /**
   * 纵向按钮组布局求解（矮屏自适应，见 docs/design §3.8.1）。
   *
   * 手机横屏可视高度只有 ~360~390px，原来「从 H*0.40 起、每个按钮占 54+16px」的固定堆叠
   * 会溢出屏幕底部 70~90px，而 canvas 没有滚动条、拖也拖不动 → 下面几个按钮永远点不到。
   * 这里改为按「可用高度」反推：先尝试理想尺寸，放不下就等比压缩，并整组垂直居中。
   *
   * @param {number} n 按钮个数
   * @param {number} top 可用区顶部 y（需为标题等内容预留）
   * @param {number} bottom 可用区底部 y
   * @param {object} [opt] { bh:理想高=54, gap:理想间距=16, minBh:下限=34, minGap:下限=6 }
   * @returns {{bh:number, gap:number, firstCy:number, step:number}}
   *   firstCy = 第 1 个按钮的中心 y；step = 相邻按钮中心距
   */
  Game.prototype.solveButtonStack = function (n, top, bottom, opt) {
    opt = opt || {};
    var bh = opt.bh || 54, gap = opt.gap != null ? opt.gap : 16;
    var minBh = opt.minBh || 34, minGap = opt.minGap != null ? opt.minGap : 6;
    var avail = Math.max(1, bottom - top);
    if (n <= 0) return { bh: bh, gap: gap, firstCy: top, step: bh + gap };

    var need = n * bh + (n - 1) * gap;
    if (need > avail) {
      // 等比压缩到可用高度；仍放不下就取下限（极端矮屏，允许贴边但不再溢出屏幕）
      var k = avail / need;
      bh = Math.max(minBh, Math.floor(bh * k));
      gap = Math.max(minGap, Math.floor(gap * k));
      need = n * bh + (n - 1) * gap;
    }
    // 取下限后仍超出可用区（极端小屏，如 240x320）→ 再压间距、最后压高度，
    // 硬保证 need <= avail。没有这一步会出现「按钮组整体溢出 2~3px、最后一个点不到」。
    if (need > avail && n > 1) {
      gap = Math.max(0, Math.floor((avail - n * bh) / (n - 1)));
      need = n * bh + (n - 1) * gap;
    }
    if (need > avail) {
      bh = Math.max(20, Math.floor((avail - (n - 1) * gap) / n));  // 20px 是绝对下限
      need = n * bh + (n - 1) * gap;
    }
    // 整组垂直居中于可用区（比从固定比例起步更稳，矮屏高屏都好看）
    var startTop = top + Math.max(0, (avail - need) / 2);
    return { bh: bh, gap: gap, firstCy: startTop + bh / 2, step: bh + gap };
  };

  Game.prototype.buildButtons = function () {
    this.uiButtons = [];
    var W = this.screenW, H = this.screenH, cx = W / 2;
    var inset = this.safeInsets();
    var bw = Math.min(220, W * 0.3), bh = 54;
    var i;
    if (this.state === 'menu') {
      var ids = ['endless', 'multi', 'online', 'team', 'guide'];
      var labels = ['无尽模式', 'AI对战', '在线对战', '在线团队赛', '图鉴'];
      var ml = this.menuLayout();

      if (ml.split) {
        // 方案 A：横屏左右分栏 —— 品牌区在左、按钮单列在右。
        // 两者不再共享纵向空间，重叠在结构上不可能发生（docs/design §3.8.3-A）。
        // 上一版的「两列」方案仍与标题带争夺纵向空间，才导致按钮盖住蛇动画/副标题。
        var stS = this.solveButtonStack(ids.length, ml.btnTop, ml.btnBottom,
          { bh: bh, gap: 12, minBh: 34, minGap: 5 });
        for (i = 0; i < ids.length; i++) {
          this.addButton(ids[i], ml.btnCx, stS.firstCy + i * stS.step,
            ml.btnW, stS.bh, labels[i]);
        }
      } else {
        var st = this.solveButtonStack(ids.length, ml.btnTop, ml.btnBottom);
        for (i = 0; i < ids.length; i++) {
          this.addButton(ids[i], ml.btnCx, st.firstCy + i * st.step, ml.btnW, st.bh, labels[i]);
        }
      }
    } else if (this.state === 'matching') {
      this.addButton('online_cancel', cx, Math.min(H * 0.72, H - 40 - inset.bottom), bw, bh, '取消匹配');
    } else if (this.state === 'team_lobby') {
      // 团队赛开房间界面：昵称 + 好友房号输入框（team_code，供 main.js 挂载 DOM 输入框）
      // + 邀请好友（生成房号并复制邀请链接）+ 开始/返回
      var fw = Math.min(360, W * 0.82);
      this.addButton('team_code', cx, H * 0.42, fw, 48, ''); // 空 label：由 renderer 画"好友房号"提示与输入内容
      this.addButton('team_invite', cx, H * 0.53, Math.min(240, W * 0.5), 40, '邀请好友（复制链接）');
      var sBtnW = Math.min(170, W * 0.4);
      var sY = H * 0.66;
      this.addButton('team_start', cx - sBtnW / 2 - 10, sY, sBtnW, 54, '开始匹配');
      this.addButton('team_back', cx + sBtnW / 2 + 10, sY, sBtnW, 54, '返回');
    } else if (this.state === 'guide') {
      // 返回按钮与 drawGuideFooter 居中位置对齐：底部居中 120×38
      this.addButton('back', W / 2, H - 28 - inset.bottom, 120, 38, '← 返回');
    } else if (this.state === 'over') {
      if (this.mode === 'multi') {
        // 多人结算：按钮并排贴底，把上方空间尽量让给记分牌卡片
        // （renderer.drawMultiResult 按 btnTop 反推卡片高度；矮屏靠这里贴底才够放两列卡片）
        // v3.0.5：与卡片一致，水平中心取**视口中心**而非屏幕中心，否则横屏时
        // 按钮会跑到 HUD 面板下方（卡片已避让，按钮不避让就对不齐了）。
        var lo = this.layout();
        var ocx = lo.viewX + lo.viewW / 2;
        var bh2 = lo.short ? 42 : 50;                      // 矮屏按钮略矮，多让 8px 给卡片
        var bw2 = Math.min(170, lo.viewW * 0.3);
        var by2 = lo.viewY + lo.viewH - bh2 / 2 - 10 - inset.bottom;  // 贴视口底
        this.addButton('retry', ocx - bw2 / 2 - 14, by2, bw2, bh2, '再来一局');
        this.addButton('menu', ocx + bw2 / 2 + 14, by2, bw2, bh2, '返回菜单');
      } else {
        var os = this.solveButtonStack(2, H * 0.50, H - 14 - inset.bottom);
        this.addButton('retry', cx, os.firstCy, bw, os.bh, '重来');
        this.addButton('menu', cx, os.firstCy + os.step, bw, os.bh, '返回菜单');
      }
    }
  };

  Game.prototype.onButton = function (id) {
    if (Audio) Audio.playClick();  // 按钮点击音效
    if (id === 'endless') this.startEndless();
    else if (id === 'multi') this.startMulti();
    else if (id === 'online') this.startOnline();
    else if (id === 'online_cancel') this.cancelOnline();
    else if (id === 'team') this.enterTeamLobby();
    else if (id === 'team_start') this.startOnline({ mode: 'team', teamCode: (this.teamCodeDraft && this.teamCodeDraft.trim()) || null });
    else if (id === 'team_back') { this.lobbyField = null; this.setState('menu'); }
    else if (id === 'team_code') { this.lobbyField = (this.lobbyField === 'code' ? null : 'code'); }
    else if (id === 'team_invite') {
      // 邀请好友（§5.1）：没房号就先自动生成一个，再置标志让 main.js（DOM 层）复制邀请链接。
      // 已有房号（手填或链接带入）直接复用——重复点邀请不会换号，避免好友拿到不同链接。
      if (!this.teamCodeDraft || !this.teamCodeDraft.trim()) {
        this.teamCodeDraft = CS.utils.makeTeamCode();
      }
      this.inviteRequested = true;
    }
    else if (id === 'guide') { this.guidePage = 0; this.guideTab = 'items'; this.setState('guide'); }
    else if (id === 'back') this.setState('menu');
    else if (id === 'menu') { this._teardownOnline(); this.setState('menu'); }
    else if (id === 'retry') {
      if (this.online) this.startOnline(); // 在线结算「再来一局」→ 重新匹配
      else if (this.mode === 'multi') this.startMulti();
      else this.startEndless();
    }
  };

  // ---------------- 在线对战（v3.0：匹配 → 联机对局，见 js/net/onlineMatch.js） ----------------

  /** 进入在线团队赛开房间界面（team_lobby）：选填好友房号后开始匹配 */
  Game.prototype.enterTeamLobby = function () {
    this.lobbyField = null;
    this.inviteNotice = null;
    // 邀请链接带入的房号：进大厅时消费一次（好友点开 ?team=CODE 链接直达大厅，房号已填好）
    if (this.pendingTeamCode) {
      this.teamCodeDraft = this.pendingTeamCode;
      this.pendingTeamCode = null;
    }
    this.setState('team_lobby');
  };

  /** 进入在线匹配：mode 置 multi（渲染分支复用），状态切 matching，控制器接管后续
   *  @param {object} [opts] 透传给 OnlineMatch：{ mode:'ffa'|'team', teamCode } */
  Game.prototype.startOnline = function (opts) {
    this._teardownOnline();
    if (!CS.OnlineMatch) return; // 联机模块未加载（极端：script 缺失）→ 静默忽略
    this.mode = 'multi';
    this.online = new CS.OnlineMatch(this, opts || {});
    this.setState('matching');
    this.online.begin();
  };

  /** 取消匹配（matching 界面按钮）：释放连接回菜单 */
  Game.prototype.cancelOnline = function () {
    this._teardownOnline();
    this.setState('menu');
  };

  /** 释放在线控制器（如有）；对局结束后 online 保留供 retry 判断，这里统一清理 */
  Game.prototype._teardownOnline = function () {
    if (this.online) { this.online.dispose(); this.online = null; }
  };

  // ---------------- 触摸/鼠标入口（main.js 转发，坐标为 CSS 逻辑像素） ----------------

  /**
   * 本帧期望目标角（§3.7 输入优先级）：
   *   键盘（8 方向）> 触屏/拖拽摇杆（joystick.active 期间，死区内保持上一角）> 鼠标跟随（PC）。
   * 鼠标跟随：方向 = 蛇头屏幕坐标 → 光标的 atan2；光标未知或几乎压在蛇头上时返回 null
   * （保持最后方向，不乱转）。无输入返回 null（调用方保持蛇的上一目标角）。
   */
  Game.prototype.steeringAngle = function () {
    var kv = this.joystick.keyVector();
    if (kv) return Math.atan2(kv.y, kv.x);
    if (this.joystick.active) return this.joystick.angle;
    if (this.cursorX === null || this.cursorY === null || !this.snake) return null;
    // 世界坐标 → 屏幕坐标：减去相机原点，加上视口偏移（与 renderer 同一换算；事件坐标是 CSS 像素）
    var l = this.layout();
    var hx = l.viewX + (this.snake.x - this.camera.x);
    var hy = l.viewY + (this.snake.y - this.camera.y);
    var dx = this.cursorX - hx, dy = this.cursorY - hy;
    if (dx * dx + dy * dy < 9) return null; // 光标几乎在蛇头上（<3px）：方向保持，避免原地乱转
    return Math.atan2(dy, dx);
  };

  /** PC 光标跟踪（main.js mousemove 无条件转发）：play 态立即应用鼠标跟随转向 */
  Game.prototype.onCursorMove = function (x, y) {
    this.cursorX = x; this.cursorY = y;
    this._applySteeringNow();
  };

  /**
   * 即帧生效（§3.7）：touch/mouse 事件路径更新输入后立即 setTargetAngle，不等下一帧 update。
   * 键盘优先语义由 steeringAngle 内部保证。在线局跳过：输入走 onlineMatch.update
   * 节流上行 + 预测体每帧取 steeringAngle，事件路径不直接改预测蛇。
   */
  Game.prototype._applySteeringNow = function () {
    if (this.state !== 'play' || !this.snake || this.online) return;
    if (this.mode === 'multi' && this.mp && this.mp.playerEntry && !this.mp.playerEntry.alive) return;
    var ang = this.steeringAngle();
    if (ang !== null) this.snake.setTargetAngle(ang);
  };

  Game.prototype.onTouchStart = function (x, y, id) {
    if (this.state === 'play') { this.joystick.onTouchStart(x, y, id); this._applySteeringNow(); return; }
    // 非 play 态也要登记触点：否则「倒计时按住手指 → 开局」时摇杆不知道手指还在屏上，
    // 后续只有 touchmove 在流，原实现会整局锁死（见 docs/design §3.7）。
    this.joystick.touches[id] = { x: x, y: y };
    // 图鉴页：页签切换 / 翻页（按钮优先）
    if (this.state === 'guide') {
      // 1) 按钮（返回）优先
      for (var bi = 0; bi < this.uiButtons.length; bi++) {
        var b = this.uiButtons[bi];
        if (b.enabled && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { this.onButton(b.id); return; }
      }
      // 2) 页签切换（标题下方居中，唯一一组）
      var tr = cfg.guideTabRects(this);
      var tk = null;
      function inRect(r, px, py) { return r && px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h; }
      if (inRect(tr.tabItems, x, y)) tk = 'items';
      else if (inRect(tr.tabColors, x, y)) tk = 'colors';
      if (tk) {
        if (this.guideTab !== tk) { this.guideTab = tk; this.guidePage = 0; }
        return;
      }
      // 3) 道具页：点击左右箭头按钮翻页（颜色页无分页）
      if (this.guideTab === 'items') {
        function inRect(r, px, py) { return r && px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h; }
        if (inRect(this._guideArrowLeft, x, y)) { if (this.guidePage > 0) this.guidePage--; return; }
        if (inRect(this._guideArrowRight, x, y)) { var totalPg = Math.ceil(cfg.ITEM_GUIDE.length / 5); if (this.guidePage < totalPg - 1) this.guidePage++; return; }
      }
      return;
    }
    for (var i = 0; i < this.uiButtons.length; i++) {
      var b = this.uiButtons[i];
      if (b.enabled && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
        this.onButton(b.id);
        return;
      }
    }
  };

  Game.prototype.onTouchMove = function (x, y, id) {
    if (this.state === 'play') { this.joystick.onTouchMove(x, y, id); this._applySteeringNow(); return; }
    // 非 play 态同样跟踪触点位置，保证进入 play 时 latchExisting 能拿到最新坐标
    if (this.joystick.touches[id]) { this.joystick.touches[id].x = x; this.joystick.touches[id].y = y; }
  };

  Game.prototype.onTouchEnd = function (id) {
    this.joystick.onTouchEnd(id);
  };

  /**
   * 特殊道具效果文字提示：吃到 wild/bomb/slow/clear/clear3/rand1-3 时弹出，
   * 屏幕顶部居中、手绘描边文字、约 1.6s 后淡出（渲染见 renderer.drawItemToast）。
   * @param {string} kind 道具类型
   * @param {string} [colorKey] 消色类道具的对应颜色 key
   */
  Game.prototype.setItemToast = function (kind, colorKey) {
    var cn = COLOR_NAMES[colorKey] || '';
    var txt;
    if (kind === 'wild') txt = '万能色！可匹配任意相邻颜色';
    else if (kind === 'bomb') txt = '炸弹！清除所有≥2连同色段';
    else if (kind === 'slow') txt = '减速！短暂放慢移动速度';
    else if (kind === 'clear') txt = '消色！消除全部' + cn + '色节';
    else if (kind === 'clear3') txt = '后三消色！消除该色最末 3 节';
    else if (kind === 'rand1') txt = '随机消除 1 节！';
    else if (kind === 'rand2') txt = '随机消除 2 节！';
    else if (kind === 'rand3') txt = '随机消除 3 节！';
    else if (kind === 'meteor') txt = '流星注入！对应颜色已注入身体';
    else return;
    this.itemToast = { text: txt, until: this.timeMs + cfg.ITEM_TOAST_MS };
  };

  CS.Game = Game;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== 内联自 js/main.js（勿手改，源文件为准） ===== */
'use strict';
/**
 * main.js — 启动引导（浏览器版）：画布初始化、屏幕适配、输入转发、主循环
 *  - 画布按设备像素比（devicePixelRatio）缩放，逻辑坐标 = CSS 像素；
 *  - window resize 时重设画布尺寸并通知 game/renderer 重新布局；
 *  - 输入：touchstart/move/end + mousedown/move/up 统一转发给 game
 *    （鼠标 id 固定为 'mouse'，方便电脑上用鼠标拖动摇杆试玩）；
 *  - 主循环用 requestAnimationFrame，蛇的连续移动/转向由 game.update(dt) 每帧驱动。
 */
(function (root) {
  var CS = root.CS;

  function boot() {
    var canvas = document.getElementById('game');
    var ctx = canvas.getContext('2d');

    var game = new CS.Game(window.innerWidth, window.innerHeight);
    var renderer = new CS.Renderer(ctx, window.innerWidth, window.innerHeight);
    root.__game = game; // 调试钩子：控制台/WebBridge 可读取对局状态（无功能影响）

    /**
     * 传输通道诊断入口：控制台敲 `__net()` 即可看当前走 TCP 还是 UDP/WebTransport。
     *
     * 这不是调试残留，是**必要的可观测性**：加速通道设计成静默降级
     * （打不通就走 wss，玩家无感），代价是「有没有吃到 UDP 收益」不可观测。
     * 网页版曾整个阶段都在走 wss+JSON 而无人察觉，就是因为缺这个。
     */
    root.__net = function () {
      var om = game && game.online;
      if (!om) return '未在联机对局中（先点「在线对战」）';
      return om.netInfo();
    };

    // 全局重排订阅（docs/design §3.8.3-D）：各界面各自失效缓存并重算。
    // game.resize() 内部会 emit，这里订阅的是"除 game 之外"的参与者。
    if (CS.layoutBus) {
      CS.layoutBus.on('relayout', function (m) {
        renderer.resize(m.W, m.H);
      });
    }

    function resize() {
      // 移动端优先用 visualViewport：地址栏收起/展开时 innerHeight 未必及时更新
      var vv = window.visualViewport;
      var w = Math.round(vv && vv.width ? vv.width : window.innerWidth);
      var h = Math.round(vv && vv.height ? vv.height : window.innerHeight);
      var dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // 之后全部用逻辑像素绘制
      // game.resize 内部会 emit relayout，renderer 通过订阅收到，无需在此重复调用。
      // 若 layoutBus 不可用（极老浏览器/裁剪构建），退回直接调用。
      game.resize(w, h);
      if (!CS.layoutBus) renderer.resize(w, h);
    }
    window.addEventListener('resize', resize);
    // 横竖屏切换：orientationchange 触发时尺寸常还没更新，延迟再量一次
    window.addEventListener('orientationchange', function () {
      setTimeout(resize, 80);
      setTimeout(resize, 300); // 二次校正（部分机型旋转动画结束后尺寸才稳定）
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resize);
    }
    resize();

    // ---------- 团队赛邀请链接（docs/design/02-team-mode.md §5.1）----------
    // 好友点开 ?team=CODE 链接：进大厅并把房号填好（发起人那边点「邀请好友」复制的正是这个链接）。
    var inviteCode = CS.utils.parseTeamInvite(location.search);
    if (inviteCode) {
      game.pendingTeamCode = inviteCode;
      game.enterTeamLobby();
    }

    // 「邀请好友」按钮只置 game.inviteRequested 标志（逻辑层不碰 DOM）；
    // 这里消费标志：拼出邀请链接并写剪贴板，结果写回 game.inviteNotice 给 renderer 画提示。
    function syncInviteRequest() {
      if (!game.inviteRequested) return;
      game.inviteRequested = false;
      var code = (game.teamCodeDraft || '').trim();
      var url = location.origin + location.pathname + '?team=' + encodeURIComponent(code);
      function done(ok, msg) {
        game.inviteNotice = {
          text: ok ? '邀请链接已复制，粘贴到微信发给好友（房号 ' + code + '）'
                   : (msg || '复制失败，请手动把房号 ' + code + ' 发给好友'),
          until: Date.now() + 3000
        };
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { done(true); }, function () { fallbackCopy(url, done); });
      } else {
        fallbackCopy(url, done);
      }
    }
    // 旧浏览器/非安全上下文兜底：隐藏 textarea + execCommand('copy')
    function fallbackCopy(text, done) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        done(!!ok);
      } catch (e) { done(false); }
    }

    // ---------- 触摸输入 ----------
    canvas.addEventListener('touchstart', function (e) {
      e.preventDefault();
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        game.onTouchStart(t.clientX, t.clientY, t.identifier);
      }
    }, { passive: false });
    canvas.addEventListener('touchmove', function (e) {
      e.preventDefault();
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        game.onTouchMove(t.clientX, t.clientY, t.identifier);
      }
    }, { passive: false });
    function onTouchEnd(e) {
      e.preventDefault();
      for (var i = 0; i < e.changedTouches.length; i++) {
        game.onTouchEnd(e.changedTouches[i].identifier);
      }
    }
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });

    // ---------- 鼠标输入（桌面端：鼠标跟随转向 + 点按钮） ----------
    // v3.2（docs/design §3.7）：play 态蛇朝光标方向转（slither.io 式，免拖拽），
    // mousedown 不再驱动摇杆拖拽；非 play 态的按钮点击路径完全不受影响。
    // 触屏设备无持续 mousemove，天然不受影响。
    var mouseDown = false;
    canvas.addEventListener('mousedown', function (e) {
      if (game.state === 'play') return; // play 态：鼠标跟随取代拖拽，按下不驱动摇杆
      mouseDown = true;
      game.onTouchStart(e.clientX, e.clientY, 'mouse');
    });
    window.addEventListener('mousemove', function (e) {
      game.onCursorMove(e.clientX, e.clientY); // 不按按键也跟踪光标（鼠标跟随转向用）
      if (mouseDown) game.onTouchMove(e.clientX, e.clientY, 'mouse');
    });
    window.addEventListener('mouseup', function (e) {
      if (mouseDown) {
        mouseDown = false;
        game.onTouchEnd('mouse');
      }
    });

    // ---------- 团队赛大厅「好友房号」输入：canvas 收不到键盘，用 DOM <input> 覆盖 ----------
    // 仅在 team_lobby 且聚焦 team_code 字段时显示，位置/尺寸对齐 renderer 写入的 game._lobbyCodeRect。
    var lobbyInput = null, lobbyInputActive = false;
    function ensureLobbyInput() {
      if (lobbyInput) return lobbyInput;
      lobbyInput = document.createElement('input');
      lobbyInput.type = 'text';
      lobbyInput.maxLength = 24;
      lobbyInput.placeholder = '点此输入房号';
      lobbyInput.setAttribute('autocomplete', 'off');
      lobbyInput.setAttribute('autocorrect', 'off');
      lobbyInput.setAttribute('autocapitalize', 'off');
      lobbyInput.setAttribute('spellcheck', 'false');
      lobbyInput.style.position = 'fixed';
      lobbyInput.style.display = 'none';
      lobbyInput.style.zIndex = '10';
      lobbyInput.style.boxSizing = 'border-box';
      lobbyInput.style.font = '18px sans-serif';
      lobbyInput.style.textAlign = 'center';
      lobbyInput.style.border = 'none';
      lobbyInput.style.outline = 'none';
      lobbyInput.style.background = 'transparent';
      lobbyInput.style.color = '#3A3238';
      lobbyInput.addEventListener('input', function () { game.teamCodeDraft = lobbyInput.value; });
      lobbyInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); lobbyInput.blur(); game.onButton('team_start'); }
        else if (e.key === 'Escape') { e.preventDefault(); lobbyInput.blur(); }
      });
      lobbyInput.addEventListener('blur', function () { game.lobbyField = null; });
      document.body.appendChild(lobbyInput);
      return lobbyInput;
    }
    function syncLobbyInput() {
      var active = game.state === 'team_lobby' && game.lobbyField === 'code' && game._lobbyCodeRect;
      if (active) {
        var inp = ensureLobbyInput();
        var rect = game._lobbyCodeRect;
        inp.style.display = 'block';
        inp.style.left = rect.x + 'px';
        inp.style.top = rect.y + 'px';
        inp.style.width = rect.w + 'px';
        inp.style.height = rect.h + 'px';
        if (!lobbyInputActive) {
          inp.value = game.teamCodeDraft || '';
          setTimeout(function () { try { inp.focus(); } catch (e) {} }, 0);
        }
        lobbyInputActive = true;
      } else if (lobbyInputActive && lobbyInput) {
        lobbyInput.style.display = 'none';
        lobbyInputActive = false;
      }
    }

    // ---------- 主循环 ----------
    var last = 0;
    function loop(ts) {
      var now = (typeof ts === 'number' && ts > 0) ? ts : Date.now();
      if (!last) last = now;
      var dt = now - last;
      last = now;
      if (dt > 100) dt = 100; // 切后台回来防跳帧
      game.update(dt);
      renderer.draw(game);
      syncLobbyInput();
      syncInviteRequest();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
