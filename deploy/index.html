'use strict';
/**
 * utils.js — 工具函数：确定性伪随机、数学助手、角度助手（DOM 无关）
 */
(function (root) {
  var CS = root.CS = root.CS || {};

  /**
   * 确定性二维哈希 → [0,1)
   * 用于手绘抖动的"固定伪随机"：同一种子每帧结果一致，避免闪烁。
   */
  function hash2(x, y, k) {
    var h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul((k | 0) + 1, 974634211)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177) | 0;
    h = h ^ (h >>> 16);
    return (h >>> 0) / 4294967296;
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function manhattan(ax, ay, bx, by) { return Math.abs(ax - bx) + Math.abs(ay - by); }

  function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

  /** 角度归一化到 (-PI, PI]（用于取最短转向方向） */
  function normAngle(a) {
    while (a <= -Math.PI) a += Math.PI * 2;
    while (a > Math.PI) a -= Math.PI * 2;
    return a;
  }

   * 当前角向目标角逼近，单步最大变化 maxDelta（弧度）。
   * 返回新角度；|差值| ≤ maxDelta 时直接到达目标角。
   */
  function turnToward(angle, target, maxDelta) {
    var diff = normAngle(target - angle);
    if (Math.abs(diff) <= maxDelta) return target;
    return angle + (diff > 0 ? maxDelta : -maxDelta);
  }

   * 确定性伪随机序列生成器（mulberry32）。
   * 联机自动测试用：测试前 `Math.random = makeRng(seed)` 即可让整局对局确定性复现
   * （服务器/游戏逻辑全部走 Math.random，无需改业务代码）。
   * @param {number} seed 任意整数种子
   * @returns {function(): number} 返回 [0,1) 的伪随机函数
   */

    var s = (seed | 0) >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

   * 字符集/长度读 config（TEAM_CODE_CHARS / TEAM_CODE_LEN），缺省有兜底，保证 utils 独立可加载。
   * @param {function(): number} [rng] 默认 Math.random；测试可传 makeRng(seed) 保证确定性
   * @returns {string} 如 'K7Q2'
   */
  function makeTeamCode(rng) {
    var rnd = rng || Math.random;
    var chars = (CS.config && CS.config.TEAM_CODE_CHARS) || '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
    var len = (CS.config && CS.config.TEAM_CODE_LEN) || 4;
    var s = '';
    for (var i = 0; i < len; i++) s += chars[Math.floor(rnd() * chars.length) % chars.length];
    return s;

   * 解析邀请链接里的房号：`?team=K7Q2` / `?x=1&team=k7q2` → 'K7Q2'；无/非法 → null。
   * 只保留字母数字并转大写，最长 24（与 matchmaker 的 teamCode 透传长度对齐）。

      }

/**
 * storage.js — localStorage 封装（替代 wx.setStorageSync / wx.getStorageSync）
 *  - 值以 JSON 序列化存储；读取时 JSON 解析失败 / 键不存在 → 返回默认值；
 *  - localStorage 不可用（隐私模式 / node 环境）→ 降级到内存对象。
 */

  var CS = root.CS = root.CS || {};

  function hasLocalStorage() {
    try {
      return typeof root.localStorage !== 'undefined' && root.localStorage !== null;
    } catch (e) {
      return false; // 隐私模式等场景访问 localStorage 会抛异常
    }
  }

  /**
   * 读取持久化值。
   * @param {string} key
   * @param {*} def 读不到 / 解析失败时返回的默认值
   */
  function get(key, def) {
    try {
      if (hasLocalStorage()) {
        var raw = root.localStorage.getItem(key);
        if (raw === null || raw === undefined || raw === '') return def;
        try {
          var v = JSON.parse(raw);
          return (v === null || v === undefined) ? def : v;
        } catch (e) {
          return def; // 容错：脏数据不炸游戏
        }
      }
    } catch (e) { /* 忽略，走降级 */ }
    return mem[key] !== undefined ? mem[key] : def;
  }

  /** 写入持久化值（JSON 序列化） */
  function set(key, val) {
    try {
      if (hasLocalStorage()) {
        root.localStorage.setItem(key, JSON.stringify(val));
        return;
      }
    } catch (e) { /* 忽略，走降级 */ }
    mem[key] = val;
  }

  function remove(key) {
    try {
      if (hasLocalStorage()) { root.localStorage.removeItem(key); return; }
    } catch (e) { /* 忽略 */ }

      ay = m + Math.random() * Math.max(1, H - 2 * m - (horiz ? U : len * U));
      rects.push(horiz ? { x: ax, y: ay, w: len * U, h: U } : { x: ax, y: ay, w: U, h: len * U });
    } else if (shape === 1) {   // L 形
      var a1 = 2 + Math.floor(Math.random() * 3);
      var a2 = 2 + Math.floor(Math.random() * 3);
      var dx = Math.random() < 0.5 ? 1 : -1;
      var dy = Math.random() < 0.5 ? 1 : -1;
      ax = m + Math.random() * Math.max(1, W - 2 * m - a1 * U);
      ay = m + Math.random() * Math.max(1, H - 2 * m - a2 * U);
      if (dx < 0) ax += (a1 - 1) * U; // 方向归一：矩形坐标始终为包围盒左上
      if (dy < 0) ay += (a2 - 1) * U;
      rects.push({ x: ax, y: ay, w: a1 * U, h: U });  // 横臂
      rects.push({ x: ax, y: ay, w: U, h: a2 * U });  // 竖臂（与横臂共拐角）
    } else {                    // 2x2 方块
      ax = m + Math.random() * Math.max(1, W - 2 * m - 2 * U);
      ay = m + Math.random() * Math.max(1, H - 2 * m - 2 * U);
      rects.push({ x: ax, y: ay, w: 2 * U, h: 2 * U });
    }
    return rects;
  }

  /** 矩形是否越出"边界内缩 WALL_EDGE_MARGIN"的可放置区 */
  Walls.prototype.rectInBounds = function (r) {
    var m = cfg.WALL_EDGE_MARGIN;
    return r.x >= m && r.y >= m && r.x + r.w <= this.W - m && r.y + r.h <= this.H - m;
  };

  /**
   * 生成内部墙壁。
   * @param {number} segmentCount 目标墙段数
   * @returns {number} 实际放置的段数
   */
  Walls.prototype.generateWalls = function (segmentCount) {
    var maxArea = this.W * this.H * cfg.WALL_MAX_RATIO;
    var placed = 0;
    for (var s = 0; s < segmentCount; s++) {
      var done = false;
      for (var tries = 0; tries < 40 && !done; tries++) {
        var rects = makeSegment(this.W, this.H);
        if (!rects.length) continue;
        var area = 0, ok = true, i, j;
        for (i = 0; i < rects.length; i++) area += rects[i].w * rects[i].h;
        if (this.area + area > maxArea) break; // 预算耗尽
        for (i = 0; i < rects.length && ok; i++) {
          var r = rects[i];
          if (!this.rectInBounds(r) || this.rectHitsSafeZone(r)) { ok = false; break; }
          for (j = 0; j < this.rects.length; j++) {
            if (rectsOverlap(r, this.rects[j], cfg.WALL_GAP)) { ok = false; break; }
          }
        }
        if (!ok) continue;
        for (i = 0; i < rects.length; i++) this.rects.push(rects[i]);
        this.area += area;
        placed++;
        done = true;
      }
    }
    return placed;
  };

  /**
   * 动态新增一段障碍墙（随时间生成，让地图越来越复杂）。

   * 总面积预算（WALL_MAX_RATIO）、所有蛇身节点（snakePoints）。
   * 与 generateWalls 不同：只尝试放 1 段，且必须避开当前蛇身（避免凭空生成在蛇身上致死）。
   * @param {Array<{x:number,y:number}>} snakePoints 需避让的蛇身节点（玩家 + AI），可为空
   * @param {number} [maxRects] 矩形总数上限（含初始段），超出则跳过
   * @returns {boolean} 是否成功放置
   */
  Walls.prototype.addRandomWall = function (snakePoints, maxRects) {
    if (maxRects != null && this.rects.length >= maxRects) return false;
    var maxArea = this.W * this.H * cfg.WALL_MAX_RATIO;
    for (var tries = 0; tries < 40; tries++) {
      var rects = makeSegment(this.W, this.H);
      var area = 0, ok = true, i, j, r;
      for (i = 0; i < rects.length; i++) area += rects[i].w * rects[i].h;
      if (this.area + area > maxArea) return false; // 面积预算耗尽
      for (i = 0; i < rects.length && ok; i++) {
        r = rects[i];
        if (!this.rectInBounds(r) || this.rectHitsSafeZone(r)) { ok = false; break; }
        for (j = 0; j < this.rects.length; j++) {
          if (rectsOverlap(r, this.rects[j], cfg.WALL_GAP)) { ok = false; break; }
        }
        if (ok && snakePoints) {
          for (var p = 0; p < snakePoints.length; p++) {
            if (circleRect(snakePoints[p].x, snakePoints[p].y, cfg.SEG_RADIUS + cfg.WALL_SPAWN_SNAKE_PAD, r)) { ok = false; break; }
          }
        }
      }
      if (!ok) continue;
      for (i = 0; i < rects.length; i++) this.rects.push(rects[i]);
      this.area += area;

<script>
/* ===== 内联自 js/snake.js（勿手改，源文件为准） ===== */
'use strict';
/**
 * snake.js — 蛇模型（v2：自由方向连续移动，DOM 无关）
 *  - 蛇头有连续位置 (x,y) 与朝向角 angle；输入给出目标角 targetAngle，
 *    蛇头以最大转向速率 TURN_RATE 平滑逼近目标角，前进速度 speed 恒定（px/s）；
 *  - 身体跟随：维护蛇头轨迹 trail（trail[0] 最新），各节沿轨迹按固定弧长
 *    SEG_SPACING 排布（经典 trail-following）；
 *  - 尾巴节（v2.3）：colors 保持纯颜色节，身体几何总长 = colors.length + 1，
 *    segPos 末尾恒多 1 节「尾巴节」（下标 = colors.length）。它不参与消除判定、
 *    不会被消除/咬断移除、不占 MIN_LENGTH 保底计数；但它是身体的一部分——
 *    收集/碰撞/撞身判定对它正常生效。渲染为深色蜡笔小尾鳍（renderer.drawTail）。
 *  - 颜色序列 colors[0] = 头；吃到色块 colors.unshift(新色)：头立即变为新颜色、
 *    原头变第 1 节身体、总长 +1（祖玛式从一端推入）；
 *  - 消除：颜色序列中相邻连续 ≥ELIM_RUN 同色立即移除，支持连锁，长度保底
 *    MIN_LENGTH（从末尾保留）。身体位置由轨迹派生，消除后自然伸缩。
 *  - 不做蛇身自碰（沿用原设计）。
 */
(function (root) {
  var CS = root.CS = root.CS || {};
  var cfg = CS.config;
  var u = CS.utils;

  /**
   * @param {number} x 出生点世界坐标
   * @param {number} y
   * @param {number} len 初始节数
   * @param {number} angle 初始朝向（弧度，0 = 向右）
   * @param {string[]} colorKeys 可用颜色池（已解锁色）
   */
  function Snake(x, y, len, angle, colorKeys) {
    this.x = x;
    this.y = y;
    this.angle = angle;
    this.targetAngle = angle;
    this.speed = cfg.SNAKE_SPEED;
    this.colors = [];                 // colors[0] = 头
    this.trail = [{ x: x, y: y }];    // 头部轨迹，trail[0] 最新
    this.selfPullCd = 0;             // 自碰重组冷却（ms），>0 时不可触发（防刷屏）
    this.segPos = [];                 // 每节中心（含头），computeBody 派生
    this.colorKeys = colorKeys;       // 保存可用颜色池（已解锁色），供保底补砖时随机取色
    // 出生时颜色随机但避免直接凑成 4 连（tries 防御：可选颜色不足时接受现状，不死循环）
    for (var i = 0; i < len; i++) {
      var color = colorKeys[0], tries = 0;
      do {
        color = colorKeys[Math.floor(Math.random() * colorKeys.length)];
      } while (++tries < 16 && i >= 3 &&
               this.colors[i - 1] === color &&
               this.colors[i - 2] === color &&
               this.colors[i - 3] === color);
      this.colors.push(color);
    }
    this.computeBody();
  }

  /** 颜色节数（消除/咬断/保底/计分/速度加成都按此计数，不含尾巴节） */
  Snake.prototype.length = function () { return this.colors.length; };

  /** 身体总节数（含恒在的尾巴节）= 颜色节数 + 1 */
  Snake.prototype.totalLength = function () { return this.colors.length + 1; };

  Snake.prototype.headColor = function () { return this.colors[0]; };

  /** 头部朝向单位向量（渲染眼睛 / 粒子方向用） */
  Snake.prototype.headDir = function () {
    return { x: Math.cos(this.angle), y: Math.sin(this.angle) };
  };

  /** 设置目标朝向角（弧度）；蛇头按 TURN_RATE 平滑逼近 */
  Snake.prototype.setTargetAngle = function (a) {
    this.targetAngle = u.normAngle(a);
  };

  /**
   * 每帧推进：转向（速率钳制）→ 前进 → 记录轨迹 → 重算身体 → 裁剪轨迹。
   * @param {number} dtMs 帧间隔（毫秒）
   */
  Snake.prototype.update = function (dtMs) {
    var dt = dtMs / 1000;
    // 转向：目标角突变时按 maxTurn 逐步逼近（走最短弧）
    this.angle = u.turnToward(this.angle, this.targetAngle, cfg.TURN_RATE * dt);
    // 前进（恒定速度）
    this.x += Math.cos(this.angle) * this.speed * dt;
    this.y += Math.sin(this.angle) * this.speed * dt;
    // 轨迹：头距最近记录点 ≥ TRAIL_STEP 才新增记录点（trail[0] 不随身移动，
    // 否则单帧位移 < TRAIL_STEP 时永远不累积，轨迹会塌缩成 1 个点）
    var t0 = this.trail[0];
    var dx = this.x - t0.x, dy = this.y - t0.y;
    if (dx * dx + dy * dy >= cfg.TRAIL_STEP * cfg.TRAIL_STEP) {
      this.trail.unshift({ x: this.x, y: this.y });
    }
    this.computeBody();
    this.trimTrail();
    if (this.selfPullCd > 0) this.selfPullCd = Math.max(0, this.selfPullCd - dtMs); // 自碰重组冷却衰减
  };

  /**
   * 自碰重组（v2.9 新机制）：当蛇头重叠到自身某一节身体（k≥1，不含恒在的尾巴节）时，
   * 把该节颜色移出并 unshift 到头部——总长度不变，但头部颜色改变、身体沿轨迹自然收拢，
   * 可能凑出新的同色段触发消除，增加消除的变化性（且不吃不长，节奏不膨胀）。
   * 仅当 selfPullCd<=0 时调用方才应触发；触发后由调用方重新设置冷却。
   * @returns {{color:string,x:number,y:number,idx:number}|null} 被拉到头部的节信息；无重叠返回 null
   */
  Snake.prototype.trySelfPull = function () {
    if (this.colors.length < cfg.MIN_LENGTH + 1) return null; // 至少 4 节才值得重组
    var tol = cfg.HEAD_HIT_RADIUS + cfg.SEG_RADIUS;
    var tol2 = tol * tol;
    // 从离头最近的一节开始找（k=1 是脖子，越往后越深）；命中第一个重叠的身体节
    for (var k = 1; k < this.segPos.length - 1; k++) {
      var sp = this.segPos[k];
      var dx = sp.x - this.x, dy = sp.y - this.y;
      if (dx * dx + dy * dy < tol2) {
        var color = this.colors[k];
        // 移出第 k 节、unshift 到头部（总长不变）；身体由轨迹重新派生自然收拢
        this.colors.splice(k, 1);
        this.colors.unshift(color);
        this.computeBody();
        return { color: color, x: sp.x, y: sp.y, idx: k };
      }
    }
    return null;
  };

  /**
   * 沿轨迹按弧长间距排布身体各节（segPos[0] = 头）。
   * 从头的实时位置出发，依次走向 trail[0]、trail[1]…，相邻节间距 = SEG_SPACING。
   * 节数 = colors.length + 1：末尾恒追加 1 节尾巴节（segPos[colors.length]）。
   * 轨迹不足时（开局）节堆叠在轨迹尾点，随移动自然拉开。
   */
  Snake.prototype.computeBody = function () {
    var n = this.colors.length + 1; // +1 = 不可消除的尾巴节
    var sp = cfg.SEG_SPACING;
    var trail = this.trail;
    var pos = this.segPos;
    pos.length = 0;
    pos.push({ x: this.x, y: this.y });
    var acc = 0;                 // 已沿轨迹走的弧长
    var px = this.x, py = this.y;
    var ti = 0;                  // 下一个要走向的轨迹点下标
    for (var i = 1; i < n; i++) {
      var target = i * sp;
      while (acc < target && ti < trail.length) {
        var nx = trail[ti].x, ny = trail[ti].y;
        var d = u.dist(px, py, nx, ny);
        if (acc + d >= target) { // 在本段轨迹内插值
          var k = (target - acc) / (d || 1e-6);
          px = px + (nx - px) * k;
          py = py + (ny - py) * k;
          acc = target;
          break;
        }
        acc += d;
        px = nx; py = ny;
        ti++;
      }
      pos.push({ x: px, y: py }); // 轨迹耗尽时 px,py 即轨迹尾点
    }
  };

  /** 裁剪轨迹：只保留身体所需弧长 + 余量，防止无限增长 */
  Snake.prototype.trimTrail = function () {
    var maxNeed = (this.colors.length + 1) * cfg.SEG_SPACING + 60; // +1：尾巴节弧长
    var acc = 0, keep = this.trail.length;
    var px = this.x, py = this.y;
    for (var i = 0; i < this.trail.length; i++) {
      acc += u.dist(px, py, this.trail[i].x, this.trail[i].y);
      if (acc > maxNeed) { keep = Math.max(1, i + 1); break; }
      px = this.trail[i].x; py = this.trail[i].y;
    }
    if (this.trail.length > keep) this.trail.length = keep;
  };

  /**
   * 吃到色块：新颜色进头部（祖玛式从一端推入）。
   * 头立即变为该颜色，原头变成第 1 节身体，总长 +1。
   */
  Snake.prototype.grow = function (color) {
    this.colors.unshift(color);
    this.computeBody(); // 立即对齐身体渲染（新节位于头后 SEG_SPACING 处）
  };

  /** 吃到万能色块：头部插入一个 'wild' 节（消除时可匹配任意相邻同色，见 findRuns） */
  Snake.prototype.growWild = function () {
    this.colors.unshift('wild');
    this.computeBody();
  };

  /**
   * 收集判定辅助：蛇头或任一身体节中心距 (x,y) 是否 < r + SEG_RADIUS
   * （「身体穿过也算」的圆形重叠判定）。
   */
  Snake.prototype.overlaps = function (x, y, r) {
    var rr = r + cfg.SEG_RADIUS;
    var rr2 = rr * rr;
    for (var i = 0; i < this.segPos.length; i++) {
      var dx = this.segPos[i].x - x, dy = this.segPos[i].y - y;
      if (dx * dx + dy * dy < rr2) return true;
    }
    return false;
  };

  /** 蛇身（含头）到 (x,y) 的最小距离（spawner 避让用） */
  Snake.prototype.distTo = function (x, y) {
    var best = Infinity;
    for (var i = 0; i < this.segPos.length; i++) {
      var d = u.dist(this.segPos[i].x, this.segPos[i].y, x, y);
      if (d < best) best = d;
    }
    return best;
  };

  /**
   * 咬断：移除颜色序列第 idx 节（多人对战「头撞身」附加效果，idx ≥ 1，不咬头）。
   * 与消除同一处理路径：只改颜色序列，身体几何由轨迹重新派生，缺口自然收拢。
   * 尾巴节（下标 = colors.length）不在颜色序列内，下标越界天然返回 null，不可被咬。
   * @param {number} idx 被咬节下标（segPos[1..colors.length-1] 中离撞者头心最近者，由调用方选定）
   * @returns {{color:string,x:number,y:number}|null} 被移除节信息（粒子/判定用）；下标非法返回 null
   */
  Snake.prototype.removeSegAt = function (idx) {
    if (idx < 1 || idx >= this.colors.length) return null;
    var p = this.segPos[idx] || { x: this.x, y: this.y };
    var color = this.colors.splice(idx, 1)[0];
    this.computeBody(); // 身体从缺口处自然收拢
    return { color: color, x: p.x, y: p.y };
  };

  /**
   * 流星注入：在身体第 idx 节前插入一个颜色节（中段注入，idx 越界自动夹紧）。
   * 与 grow（头部插入）共用身体几何派生，缺口自然收拢。用于「流星砖块」可靠的中段注入。
   */
  Snake.prototype.insertAt = function (idx, color) {
    idx = Math.max(0, Math.min(this.colors.length, idx | 0));
    this.colors.splice(idx, 0, color);
    this.computeBody();
  };

  /**
   * 命中检测：返回第一个与 (x,y) 距离 < r + SEG_RADIUS 的身体节下标（含尾巴节 colors.length），无则 -1。
   * 供流星砖块碰撞用（命中即在该节注入）。
   */
  Snake.prototype.segIndexAt = function (x, y, r) {
    var rr2 = (r + cfg.SEG_RADIUS) * (r + cfg.SEG_RADIUS);
    for (var i = 0; i < this.segPos.length; i++) {
      var dx = this.segPos[i].x - x, dy = this.segPos[i].y - y;
      if (dx * dx + dy * dy < rr2) return i;
    }
    return -1;
  };

  /** 内部：按下标数组批量移除，返回 [{color,x,y,chain:1}]（移除前捕获世界坐标供特效） */
  Snake.prototype._removeAt = function (idxs) {
    if (!idxs || !idxs.length) return [];
    idxs = idxs.slice().sort(function (a, b) { return a - b; });
    var removed = [];
    for (var k = idxs.length - 1; k >= 0; k--) { // 降序 splice，避免位移
      var idx = idxs[k];
      if (idx < 0 || idx >= this.colors.length) continue;
      var p = this.segPos[idx] || { x: this.x, y: this.y };
      removed.push({ color: this.colors[idx], x: p.x, y: p.y, chain: 1 });
      this.colors.splice(idx, 1);
    }
    this.computeBody();
    return removed;
  };

  /** 消色道具：移除所有该颜色的节（尾巴节恒在非颜色序列，天然排除） */
  Snake.prototype.removeByColor = function (color) {
    var idxs = [];
    for (var i = 0; i < this.colors.length; i++) if (this.colors[i] === color) idxs.push(i);
    return this._removeAt(idxs);
  };

  /** 后 N 消色：移除该颜色中最靠尾（下标最大）的至多 n 节 */
  Snake.prototype.removeRearByColor = function (color, n) {
    var idxs = [];
    for (var i = 0; i < this.colors.length; i++) if (this.colors[i] === color) idxs.push(i);
    if (idxs.length > n) idxs = idxs.slice(idxs.length - n);
    return this._removeAt(idxs);
  };

  /** 随机消：随机移除 n 节（互异下标），不足 n 则移除全部 */
  Snake.prototype.removeRandom = function (n) {
    var pool = [];
    for (var i = 0; i < this.colors.length; i++) pool.push(i);
    var idxs = [];
    for (var k = 0; k < n && pool.length; k++) {
      var j = Math.floor(Math.random() * pool.length);
      idxs.push(pool[j]); pool.splice(j, 1);
    }
    return this._removeAt(idxs);
  };

  /**
   * 找出所有长度 ≥ runLen 的同色连续段（返回下标段数组）。
   * 支持万能色 'wild'：一段连续节中，非 wild 节必须同色、wild 可充当中介/两端；
   * 该段整体视作该颜色（wild 节也计入长度并参与消除）——「万能色」即由此实现。
   */
  Snake.prototype.findRuns = function (runLen) {
    var runs = [], i = 0, n = this.colors.length;
    while (i < n) {
      var j = i;
      var runColor = this.colors[i] === 'wild' ? null : this.colors[i];
      while (j + 1 < n) {
        var c = this.colors[j + 1];
        if (c === 'wild') { j++; continue; }
        if (runColor === null) { runColor = c; j++; continue; }
        if (c === runColor) { j++; continue; }
        break;
      }
      if (runColor !== null && j - i + 1 >= runLen) {
        var r = [];
        for (var k = i; k <= j; k++) r.push(k);
        runs.push(r);

      i = j + 1;

  /**
   * 执行消除（含连锁）。

   * @param {number} minLen 消除后保底长度（不足时从末尾保留）

      runs.forEach(function (r) { r.forEach(function (idx) { mark[idx] = true; }); });
      var idxs = Object.keys(mark).map(Number).sort(function (a, b) { return b - a; });

        floorHit = true;
      } else if (floorCandidate) {
        // 其它情形（如炸弹 2 连消除）保持原保底：从尾部取消标记、保留 minLen 节旧块
        while (this.colors.length - removeCount < minLen && removeCount > 0) {

    if (runLen === cfg.ELIM_RUN && this.colors.length < minLen) floorHit = true;

    return removed;

'use strict';
/**
 * spawner.js — 色块刷新器（v2：世界像素坐标，DOM 无关）
 *  - 每隔 SPAWN_INTERVAL_MS 检查一次：未被吃掉的色块保留，只在空位补足到目标数量；
 *  - 目标数量 ≈ 世界面积 / BLOCK_AREA_DIV（90000），并夹在 [BLOCKS_MIN, BLOCKS_MAX]；
 *  - 生成采用拒绝采样 + 最小间距约束（简化版 Poisson disk）：
 *      与已有色块距离 ≥ BLOCK_MIN_DIST(140px)、与蛇身距离 ≥ BLOCK_SNAKE_DIST(80px)、
 *      不压墙（含边界内缩 BLOCK_EDGE_MARGIN）；最多尝试 SPAWN_TRIES(50) 次，失败则本轮跳过；
 *  - 只从已解锁颜色（unlockedKeys）中刷新。

(function (root) {
  var CS = root.CS = root.CS || {};
  var cfg = CS.config;
  var u = CS.utils;

  function Spawner(walls, snake) {
    this.walls = walls;
    this.snake = snake;
    this.blocks = []; // {x, y, color, phase, kind}（世界坐标）
    this.timer = 0;
    this.meteors = [];   // 流星砖块：{mid,x,y,vx,vy,color,ttl,trail,phase}（移动实体）
    this.meteorTimer = 0;
    this._nextMeteorId = 1; // 联机客户端按它做跨快照轨迹关联；单机无需展示但保持同构
    this.others = []; // 其他活蛇数组（多人模式由 multiplayer 挂活引用，刷新时同样避让）
    this.unlockedKeys = cfg.COLOR_KEYS.slice(); // 默认全部；game 会按本局解锁数覆盖
    this.specialChance = cfg.ITEM_SPECIAL_CHANCE; // 每帧由 game/mp 按存活时间更新（越后期越高）
    // 多人专属「彩色」抢夺道具：整局恒定最多存在 1 颗；由 updateGrab 周期投放 / 计时消失
    this.grabEnabled = false;   // 仅多人对战置 true（startMulti 设置），单/无尽不出现
    this.grabBlock = null;      // 当前场上那颗彩色星 {x,y,kind,rarity,phase,ttl,r}；null = 暂不存在
    this.grabTimer = cfg.GRAB_SPAWN_DELAY_MS; // 距离下次出现的倒计时（ms）
    var area = walls.W * walls.H;
    this.target = u.clamp(Math.round(area / cfg.BLOCK_AREA_DIV), cfg.BLOCKS_MIN, cfg.BLOCKS_MAX);
  }

  /** 按权重抽取一个特殊道具 kind（wild/bomb/slow/clear/clear3/rand1-3）；供刷新与阵亡掉落共用 */
  Spawner.prototype.randomSpecialKind = function () {
    var w = cfg.ITEM_WEIGHTS, total = 0, k;
    for (k in w) total += w[k];
    var r = Math.random() * total;
    for (k in w) { r -= w[k]; if (r <= 0) return k; }
    return 'wild';
  };

  /** 每帧调用；到达刷新间隔时补足色块；多人模式另行维护彩色抢夺道具 */
  Spawner.prototype.update = function (dt) {
    this.timer += dt;
    if (this.timer >= cfg.SPAWN_INTERVAL_MS) {
      this.timer = 0;
      var guard = 0;
      while (this.blocks.length < this.target && guard++ < this.target) {
        if (!this.spawnOne()) break; // 拒绝采样失败，本轮跳过
      }

    if (this.grabEnabled) this.updateGrab(dt);
  };

  /**
   * 在世界内找一个「不压墙、不压内部障碍、离蛇/其他蛇/已有色块足够远」的安全点。
   * 供普通色块刷新与彩色抢夺道具投放共用；找不到返回 null（调用方跳过本轮）。
   * @param {number} minBlockDist 与已有色块最小距离（普通色块 140；抢夺道具可放宽）
   * @returns {{x:number,y:number}|null}
   */
  Spawner.prototype.findSpot = function (minBlockDist) {
    var w = this.walls, s = this.snake, m = cfg.BLOCK_EDGE_MARGIN;
    var edgePad = cfg.WALL_THICK + cfg.BLOCK_RADIUS + 10;
    for (var tries = 0; tries < cfg.SPAWN_TRIES; tries++) {
      var x = m + Math.random() * (w.W - 2 * m);
      var y = m + Math.random() * (w.H - 2 * m);
      if (x < edgePad || x > w.W - edgePad || y < edgePad || y > w.H - edgePad) continue;
      if (w.pointInWall(x, y, cfg.BLOCK_RADIUS + 22)) continue;       // 不压内部墙（加大余量）
      if (s && s.distTo(x, y) < cfg.BLOCK_SNAKE_DIST) continue;       // 离主蛇 ≥80px（联机服务器无主蛇，靠 others 避让）
      var nearOther = false;
      for (var oi = 0; oi < this.others.length; oi++) {               // 多人：其他活蛇同样避让
        if (this.others[oi].distTo(x, y) < cfg.BLOCK_SNAKE_DIST) { nearOther = true; break; }
      }
      if (nearOther) continue;
      var ok = true;
      for (var i = 0; i < this.blocks.length; i++) {
        var d = u.dist(x, y, this.blocks[i].x, this.blocks[i].y);
        if (d < minBlockDist) { ok = false; break; }
      }
      if (!ok) continue;
      return { x: x, y: y };
    }
    return null;
  };

  /**
   * 彩色抢夺道具的周期维护（仅 grabEnabled 时调用）：

   *  - 场上没有 → 倒计时归零则在本局安全点投放一颗（带较长 ttl，全场上演抢夺）。
   */
  Spawner.prototype.updateGrab = function (dt) {
    if (!this.grabEnabled) return; // 仅多人对战启用；单/无尽无论如何都不投放彩色星

      this.grabBlock.ttl -= dt;
      this.grabBlock.phase += dt * 0.004;
      if (this.grabBlock.ttl <= 0) {
        var rest = [];
        for (var i = 0; i < this.blocks.length; i++) {
          if (this.blocks[i] !== this.grabBlock) rest.push(this.blocks[i]);
        }
        this.blocks = rest;
        this.grabBlock = null;
        this.grabTimer = cfg.GRAB_RESPAWN_MS;
      }
      return;
    }
    this.grabTimer -= dt;
    if (this.grabTimer <= 0) this.spawnGrab();
  };

  /** 投放一颗彩色抢夺道具到安全点（找不到安全点则顺延到下一帧再试） */
  Spawner.prototype.spawnGrab = function () {
    var spot = this.findSpot(cfg.BLOCK_MIN_DIST * 0.6); // 允许略靠近其他色块，但必须安全
    if (!spot) { this.grabTimer = 1200; return; }       // 暂无安全点，短暂后重试
    var block = {
      x: spot.x, y: spot.y,
      kind: cfg.GRAB_KIND,
      rarity: cfg.GRAB_RARITY,
      color: null,
      phase: Math.random() * Math.PI * 2,
      ttl: cfg.GRAB_TTL_MS,
      r: cfg.GRAB_RADIUS // 收集判定半径（略大于普通色块，更好抢）
    };
    this.blocks.push(block);
    this.grabBlock = block;
  };

  /** 立即补足（开局调用一次） */
  Spawner.prototype.fillNow = function () {
    var guard = 0;
    while (this.blocks.length < this.target && guard++ < this.target * 2) {
      if (!this.spawnOne()) break;
    }
  };

  /** 尝试生成一个色块，成功返回 true */
  Spawner.prototype.spawnOne = function () {
    var spot = this.findSpot(cfg.BLOCK_MIN_DIST); // 与已有色块 ≥140px 的安全点
    if (!spot) return false;
    var x = spot.x, y = spot.y;
    // 决定类型：默认普通色块；按当前 specialChance 改为特殊道具（按权重抽取，越后期概率越高）
    var kind = 'color';
    if (Math.random() < this.specialChance) kind = this.randomSpecialKind();
    // clear / clear3 携带目标颜色（消除该色）；其余特殊道具 color=null
    var color = null;
    if (kind === 'color' || kind === 'clear' || kind === 'clear3') {
      color = this.unlockedKeys[Math.floor(Math.random() * this.unlockedKeys.length)];
    }
    this.blocks.push({
      x: x, y: y,
      kind: kind,
      color: color,
      rarity: cfg.ITEM_RARITY[kind] || null, // 稀有度边框用（普通色块为 null）
      phase: Math.random() * Math.PI * 2 // 脉动相位
    });
    return true;
  };

  /**
   * 收集被蛇压到的色块（蛇头与身体节圆形重叠都算）。
   * @returns {Array} 被收集的色块
   */
  Spawner.prototype.collectAt = function (snake) {
    var got = [];
    var rest = [];
    for (var i = 0; i < this.blocks.length; i++) {
      var b = this.blocks[i];
      if (snake.overlaps(b.x, b.y, b.r || cfg.BLOCK_RADIUS)) got.push(b);
      else rest.push(b);
    }
    this.blocks = rest;
    return got;
  };

  /**
   * 阵亡掉落：在 (x,y) 处直接放入一个随机特殊道具（带稀有度边框）。
   * clear / clear3 随机一个已解锁颜色作为目标色。
   * @param {number} x,y 世界坐标
   * @param {string} kind 道具类型（来自 randomSpecialKind）
   */
  Spawner.prototype.addDroppedItem = function (x, y, kind) {
    var color = null;
    if (kind === 'clear' || kind === 'clear3') {
      color = this.unlockedKeys[Math.floor(Math.random() * this.unlockedKeys.length)];
    }
    this.blocks.push({
      x: x, y: y,
      kind: kind,
      color: color,
      rarity: cfg.ITEM_RARITY[kind] || null,
      phase: Math.random() * Math.PI * 2
    });
  };

  /**
   * 生成一颗流星砖块：只从上下左右四个正方向之一，平行于地图边、从一侧直飞到对侧。
   * 出生在对应边缘（屏幕外一点），沿该正方向匀速直线飞向对侧边缘；
   * 出生位置在目标蛇附近 ±band 的带内，保证流星会经过玩家区域、有机会命中身体注入中段。
   * @param {object} snake 目标蛇（updateMeteors 从目标列表中随机选定；联机多真人时每颗目标独立）
   */

    if (!snake) return; // 无存活真人目标：本周期不投放

    var d = dirs[Math.floor(Math.random() * 4)];
    var band = 420; // 在蛇附近 ±band 进入，保证流星经过玩家区域
    var spd = cfg.METEOR_SPEED * (0.5 + Math.random() * 0.8); // 每颗流星速度随机（有的快有的慢）
    var mx, my, vx, vy;
    if (d.x !== 0) { // 水平：从左/右边缘进入，朝对侧飞，y 取蛇附近
      mx = d.x > 0 ? -40 : W + 40;
      my = u.clamp(snake.y + (Math.random() * 2 - 1) * band, 40, H - 40);
      vx = d.x * spd; vy = 0;
    } else { // 垂直：从上/下边缘进入，朝对侧飞，x 取蛇附近
      mx = u.clamp(snake.x + (Math.random() * 2 - 1) * band, 40, W - 40);
      my = d.y > 0 ? -40 : H + 40;
      vx = 0; vy = d.y * spd;
    }
    var mid = this._nextMeteorId;
    this._nextMeteorId = this._nextMeteorId >= 65535 ? 1 : this._nextMeteorId + 1;
    this.meteors.push({
      mid: mid,
      x: mx, y: my, vx: vx, vy: vy,
      color: this.unlockedKeys[Math.floor(Math.random() * this.unlockedKeys.length)],
      ttl: cfg.METEOR_TTL_MS,
      trail: [],
      phase: Math.random() * Math.PI * 2
    });
  };

  /**
   * 每帧更新流星：直线匀速移动（无归向）+ 碰撞检测。
   * 命中任意目标蛇身体节 → 返回注入事件 [{snake, idx, x, y, color}]（snake 为被命中的目标），
   * 由调用方对该 snake 调用 insertAt 注入中段。未命中且出界/超时则消失。
   * @param {object|object[]} snakes 目标蛇或目标蛇数组（单人传单蛇；联机传全部存活真人蛇）

   */

      this.meteorTimer = cfg.METEOR_INTERVAL_MS;
      // 随机选一个目标投放（联机多真人：每颗流星的目标独立随机，雨露均沾）
      this.spawnMeteor(list.length ? list[Math.floor(Math.random() * list.length)] : null);

      var m = this.meteors[i];

      if (m.trail.length > 6) m.trail.shift();
      m.x += m.vx * dt; m.y += m.vy * dt;
      m.ttl -= dtMs;
      var hitSnake = null, hitIdx = -1;
      for (var si = 0; si < list.length; si++) {
        var h = list[si].segIndexAt(m.x, m.y, cfg.METEOR_HIT_R);
        if (h >= 0) { hitSnake = list[si]; hitIdx = h; break; }
      }
      if (hitSnake) {
        events.push({ snake: hitSnake, idx: hitIdx, x: m.x, y: m.y, color: m.color });
        this.meteors.splice(i, 1);
        continue;
      }
      if (m.ttl <= 0 || m.x < -80 || m.y < -80 || m.x > this.walls.W + 80 || m.y > this.walls.H + 80) {
        this.meteors.splice(i, 1);
      }
    }
    return events;
  };

  CS.Spawner = Spawner;

      var sp = (60 + Math.random() * 140) * scale; // px/s

        type: 'crumb',

        size: (2.5 + Math.random() * 3.5) * scale,

      var life = 0.4 + i * 0.07; // 多颗时依次晚灭，层次分明

        type: 'star',
        x: x + Math.cos(a) * d,
        y: y + Math.sin(a) * d,

 * 由各订阅者各自清缓存、各自重算。
 *
 * 本模块 **DOM 无关**（不引用 window / document / 任何浏览器 API），
 * 因此 node 测试里可以直接 emit 来验证订阅者的反应。
 * 事件源的接线（resize / orientationchange / visualViewport）放在 main.js。

    this.emitCount = 0;   // 派发计数（监控/测试用）
  }

   * 订阅事件。
   * @param {string} ev 事件名（目前只有 'relayout'）
   * @param {Function} fn 回调，收到 metrics 对象
   * @returns {Function} 取消订阅的函数
   */

<script>
/* ===== 内联自 js/ai.js（勿手改，源文件为准） ===== */
'use strict';
/**
 * ai.js — 多人对战 AI 决策（加权转向，DOM 无关）
 * 每帧为一条 AI 蛇产出目标角（弧度）：
 *  在 AI_DIRS 个候选方向（绕当前朝向均匀采样一整圈）上打分，取最高分：
 *   ① 寻食：感知范围内色块按「方向对齐度 × 距离衰减」加分，与头部同色 ×AI_SAME_COLOR_BONUS
 *      （凑 4 连的动机），整体权重按贪食性格 greed 伸缩；
 *   ② 避墙：沿候选方向取近（≈1 身位）/ 远（≈2 身位）两个前景点，撞边界/内部墙则罚分
 *      （近点重罚 ≈ 否决，远点轻罚 = 提前避让），探测距离按谨慎性格 caution 伸缩；
 *   ③ 避蛇：近前景点附近出现其他蛇（含玩家）身体节则按接近程度罚分；
 *   ④ 惯性 + 游走：保持当前朝向有小幅加分（防抖动），叠加小随机噪声（无威胁时漂移）。
 * 公平性：AI 只输出目标角，转向速率与玩家一样由 Snake.update 的 TURN_RATE 钳制。
 * 输出保证为有限角度（所有打分项有限，候选方向有限），不会出现 NaN。
 */
(function (root) {
  var CS = root.CS = root.CS || {};
  var cfg = CS.config;
  var u = CS.utils;

  /**
   * @param {Snake} snake 决策对象（本人蛇）
   * @param {object} env { walls, blocks, snakes } 环境快照引用（snakes 含自己与所有活蛇）
   * @param {object} persona 性格参数 { greed: 0.6~1.4 贪食, caution: 0.6~1.4 谨慎 }
   * @returns {number} 目标角（弧度，(-PI, PI] 内的有限值）
   */
  function decide(snake, env, persona) {
    persona = persona || {};
    var greed = persona.greed || 1;
    var caution = persona.caution || 1;
    var walls = env.walls;
    var blocks = env.blocks || [];
    var snakes = env.snakes || [];
    var headColor = snake.headColor();
    var colors = snake.colors;

    var probeN = cfg.AI_PROBE_NEAR * (0.8 + 0.4 * caution); // 谨慎者近景看得更远
    var probeF = cfg.AI_PROBE_FAR * caution;                 // 远景观测（提前避让 + 自卷检测）
    var bodyR = cfg.AI_SNAKE_AVOID * (0.7 + 0.5 * caution);  // 避其他蛇身半径
    var bodyR2 = bodyR * bodyR;
    var selfR = cfg.AI_SELF_AVOID * (0.7 + 0.4 * caution);   // 避自身蛇身半径
    var selfR2 = selfR * selfR;
    var range = cfg.AI_FOOD_RANGE * (0.7 + 0.5 * greed);     // 贪食者感知更大
    var foodW = cfg.AI_FOOD_WEIGHT * greed;

    var best = snake.angle, bestScore = -Infinity;
    for (var k = 0; k < cfg.AI_DIRS; k++) {
      var cand = snake.angle + (k / cfg.AI_DIRS) * Math.PI * 2;
      var dx = Math.cos(cand), dy = Math.sin(cand);

      // 惯性（k=0 即当前朝向，得分最高）+ 游走噪声
      var score = cfg.AI_INERTIA * Math.cos(u.normAngle(cand - snake.angle));
      score += (Math.random() - 0.5) * cfg.AI_WANDER;

      // ① 寻食：对齐度 × 距离衰减；同色加成；「差 1~2 节即凑成 4 连消除」额外加权（更会规划消除）
      for (var i = 0; i < blocks.length; i++) {
        var b = blocks[i];
        // 彩色星（多人专属抢夺道具）：超强吸引力，远超普通寻食，远处也来抢（仍受墙/蛇身惩罚制衡）
        if (b.kind === cfg.GRAB_KIND) {
          var gx = b.x - snake.x, gy = b.y - snake.y;
          var gd = Math.sqrt(gx * gx + gy * gy);
          if (gd > 1e-6) {
            var galign = (gx / gd) * dx + (gy / gd) * dy;
            if (galign > 0) {
              var gfall = 1 - Math.min(1, gd / cfg.AI_GRAB_RANGE);
              score += cfg.AI_GRAB_WEIGHT * galign * gfall;
            }
          }
          continue;
        }
        var bx = b.x - snake.x, by = b.y - snake.y;
        var d = Math.sqrt(bx * bx + by * by);
        if (d > range || d < 1e-6) continue;
        var align = (bx / d) * dx + (by / d) * dy; // cos(候选方向, 指向色块方向)
        if (align <= 0) continue;
        var fall = 1 - d / range;
        var w = foodW * align * fall;
        if (b.color === headColor) w *= cfg.AI_SAME_COLOR_BONUS;
        // 头段同色连续长度（含 wild）：吃到该色后能凑成 ≥3 连 → 离 4 连消除仅差 1 节，强烈偏好
        var run = 0;
        for (var r = 0; r < colors.length; r++) {
          var c = colors[r];
          if (c === b.color || c === 'wild') run++; else break;
        }
        if (run >= 2) w += foodW * cfg.AI_RUN_BONUS * align * fall * (run >= 3 ? 1.6 : 1);
        score += w;
      }

      // ② 避墙：近点重罚（几乎否决），近点安全才看远点（提前避让）
      var pnx = snake.x + dx * probeN, pny = snake.y + dy * probeN;
      var pfx = snake.x + dx * probeF, pfy = snake.y + dy * probeF; // 远点（自卷检测用）
      if (walls.hitsCircle(pnx, pny, cfg.HEAD_HIT_RADIUS + 4)) {
        score -= cfg.AI_WALL_PENALTY;
      } else if (walls.hitsCircle(pfx, pfy, cfg.HEAD_HIT_RADIUS + 4)) {
        score -= cfg.AI_WALL_PENALTY_FAR;
      }

      // ③ 避蛇身 / ④ 头对头规避 / ⑤ 自卷规避（统一累加惩罚，超阈值提前退出省性能）
      var pen = 0;
      for (i = 0; i < snakes.length; i++) {
        var o = snakes[i];
        var isSelf = (o === snake);
        var sp = o.segPos;
        for (var j = 0; j < sp.length; j++) {
          var sx = sp[j].x, sy = sp[j].y;
          if (isSelf) {
            if (j < 3) continue; // 头/脖子/次节恒在身后，跳过避免误判
            var ddx2 = sx - pfx, ddy2 = sy - pfy; // 自卷用远点：前方路径撞上自身远处身体才危险
            var dd2s = ddx2 * ddx2 + ddy2 * ddy2;
            if (dd2s < selfR2) {
              pen += cfg.AI_SELF_PENALTY * (1 - Math.sqrt(dd2s) / selfR) * 0.6;
            }
          } else {
            var ddx = sx - pnx, ddy = sy - pny;
            var dd2 = ddx * ddx + ddy * ddy;
            if (dd2 < bodyR2) {
              var nd = Math.sqrt(dd2);
              pen += cfg.AI_SNAKE_PENALTY * (1 - nd / bodyR);
              if (j === 0 && nd < bodyR) pen += cfg.AI_HEADON_PENALTY * (1 - nd / bodyR); // 头对头最危险
            }
          }
        }
        if (pen > 300) break; // 已经足够危险，提前退出省性能
      }
      if (pen > 0) score -= Math.min(600, pen);

      if (score > bestScore) { bestScore = score; best = cand; }
    }
    return u.normAngle(best);
  }

  CS.AI = { decide: decide };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

'use strict';
/**
 * multiplayer.js — 多人对战模式编排（N 名真人玩家 + AI 蛇，DOM 无关）
 * 职责：
 *  - 蛇管理：真人玩家 N 名（v3.0 起支持多真人，见 addPlayer；本地单机对局为 1 名）+ AI 蛇

 *  - 淘汰：头撞墙/边界 → 淘汰；头撞其他蛇身体节 → 淘汰（身体主人记 1 击杀）；

 *    低于 MP_BITE_MIN_LENGTH → B 直接淘汰（尸体掉落、计入 A 的击杀）；被咬移除后
 *    立即按正常规则检查消除（凑成 ≥4 连同色照常连锁/倍率计分，分数记 B）；
 *    被咬处迸小粒子 + B 短暂闪白/抖动（MP_BITE_FLASH_MS），AI 与玩家一视同仁；
 *  - 尸体掉落：被淘汰蛇的颜色序列按节在原地散落成色块（每隔 MP_CORPSE_STRIDE 节掉 1 个，
 *    起点随机 → ≈50% 的节变成可吃色块），多人模式的主要资源循环；
 *  - 补充：AI 淘汰后延迟 MP_RESPAWN_MIN_MS~MP_RESPAWN_MAX_MS 在世界边缘、远离其他蛇的
 *    安全位置重生（初始 MP_START_LENGTH 节），维持编制；真人不重生（由 game/room 结算）；
 *  - 吃色/消除：所有蛇共用同一套 grow / 4 连消除连锁逻辑（Snake 类原样复用）；
 *    连锁倍率计分与特效与单人模式一致（消除分计入各真人 Entry，AI 的 elimScore 仅供调试）；
 *  - 速度：所有蛇按 基础速度 + SPEED_LEN_COEF×节数 + ENDLESS_SPEEDUP_PER_SEC×存活秒 动态加速，

  /** 初始化：真人 Entry（未 addPlayer 时回退包裹 game.snake，本地兼容）+ 补足 AI 编制 */
  Multiplayer.prototype.setup = function () {
    if (!this.players.length) this.addPlayer(this.game.snake, '我'); // 本地单真人（原行为）
    // 开局只生成初始数量的 AI（后续随时间增长）
    var startCount = cfg.MP_AI_START_COUNT || cfg.MP_AI_COUNT;
    for (var i = 0; i < startCount; i++) this.spawnBot(0); // 早期 AI，智力普通
    this.spawner.others = this.liveSnakes; // 活引用：重生/淘汰自动反映到刷新避让（含全部真人）
  };

  /**
   * 团队模式初始化（2v2v2v2v2）：由调用方先通过 addPlayer/spawnBot 把所有 5×2=10 条蛇
   * 按队伍建好（addPlayer/spawnBot 已接收 teamId），本方法只负责收尾：
   *   - 标记 teamMode（禁止 AI 重生、计分按队伍聚合）
   *   - spawner.others 指向全部活蛇（刷新避让）
   * 不自动补 AI（编制由调用方一次性凑满 10 槽）。
   * @param {Array<Array<Entry>>} teamEntries 二维数组：teams[teamId][slot] = Entry
   */
  Multiplayer.prototype.setupTeamMode = function (teamEntries) {
    this.teamMode = true;
    this.teamEntries = teamEntries || null;
    this.spawner.others = this.liveSnakes;
  };

  /** 存活队伍数（团队模式）：含 ≥1 名存活成员的队伍计数 */
  Multiplayer.prototype.aliveTeamCount = function () {
    var set = {};
    var es = this.allEntries();
    for (var i = 0; i < es.length; i++) {
      if (es[i].teamId >= 0 && es[i].alive) set[es[i].teamId] = true;
    }
    return Object.keys(set).length;
  };

  /** 队伍总分：该队所有成员（含已阵亡）的（生存分 + 消除分 + 彩色星加成）之和 */
  Multiplayer.prototype.teamScore = function (teamId) {
    var s = 0, es = this.allEntries();
    for (var i = 0; i < es.length; i++) {
      if (es[i].teamId === teamId) {
        s += (es[i].survivalScore || 0) + (es[i].elimScore || 0) + (es[i].mpBonusScore || 0);
      }
    }
    return s;
  };

  /** 某队的存活成员 Entry（用于观战镜头跟随）；无则 null */
  Multiplayer.prototype.aliveMemberOfTeam = function (teamId) {
    var es = this.allEntries();
    for (var i = 0; i < es.length; i++) {
      if (es[i].teamId === teamId && es[i].alive) return es[i];
    }
    return null;
  };

  /** 队友 Entry（排除自身）；无则 null */
  Multiplayer.prototype.teammateOf = function (e) {
    if (e.teamId < 0) return null;
    var es = this.allEntries();
    for (var i = 0; i < es.length; i++) {
      if (es[i] !== e && es[i].teamId === e.teamId) return es[i];
    }
    return null;
  };

  /** 全部 Entry（真人在前，含已淘汰） */
  Multiplayer.prototype.allEntries = function () {
    return this.players.concat(this.bots);
  };

  /** 全部活蛇的 Snake 实例（AI 决策 / 出生避让用） */
  Multiplayer.prototype.aliveSnakes = function () {
    var es = this.allEntries(), arr = [];
    for (var i = 0; i < es.length; i++) if (es[i].alive) arr.push(es[i].snake);
    return arr;
  };

  /** 存活真人数量（联机房间结算判定用） */
  Multiplayer.prototype.alivePlayerCount = function () {
    var n = 0;
    for (var i = 0; i < this.players.length; i++) if (this.players[i].alive) n++;
    return n;
  };

  Multiplayer.prototype.aliveBotCount = function () {
    var n = 0;
    for (var i = 0; i < this.bots.length; i++) if (this.bots[i].alive) n++;
    return n;
  };

  /**
   * 根据存活时间计算当前应有的 AI 数量（线性增长：从 MP_AI_START_COUNT 到 MP_AI_MAX_COUNT）。
   * @param {number} surviveSec 存活秒数
   * @returns {number} 当前目标 AI 数量
   */
  Multiplayer.prototype.targetAiCount = function (surviveSec) {
    var start = cfg.MP_AI_START_COUNT || 3;
    var max = cfg.MP_AI_MAX_COUNT || 14;
    var interval = cfg.MP_AI_GROW_INTERVAL_SEC || 25;
    // 每过 interval 秒 +1，封顶 max
    var count = start + Math.floor(surviveSec / interval);
    return Math.min(max, Math.max(start, count));
  };

  /** 当前智力等级（0~1，随时间从 0 渐变到 1） */
  Multiplayer.prototype.currentSmartness = function () {
    var sec = this.timeMs / 1000;
    var start = cfg.MP_AI_START_COUNT || 3;
    var max = cfg.MP_AI_MAX_COUNT || 14;
    var interval = cfg.MP_AI_GROW_INTERVAL_SEC || 25;
    // 智力等级 = 已增长的步数 / 总增长步数
    var totalSteps = max - start;
    if (totalSteps <= 0) return 1;
    var grown = Math.min(totalSteps, Math.floor(sec / interval));
    return grown / totalSteps; // 0 → 1
  };

  /**
   * 在世界边缘带（距边界 MP_SPAWN_EDGE_MIN~MAX px）找一个远离其他蛇的出生点。
   * 拒绝采样最多 60 次，取「与其他蛇最小距离」最大的候选；达到期望净距提前收工。
   */
  Multiplayer.prototype.findSpawn = function () {
    var w = this.walls;
    var best = null, bestD = -1;
    var snakes = this.aliveSnakes();
    for (var t = 0; t < 60; t++) {
      var inset = cfg.MP_SPAWN_EDGE_MIN + Math.random() * (cfg.MP_SPAWN_EDGE_MAX - cfg.MP_SPAWN_EDGE_MIN);
      var side = Math.floor(Math.random() * 4);
      var x, y;
      if (side === 0) { x = inset; y = inset + Math.random() * Math.max(1, w.H - 2 * inset); }
      else if (side === 1) { x = w.W - inset; y = inset + Math.random() * Math.max(1, w.H - 2 * inset); }
      else if (side === 2) { y = inset; x = inset + Math.random() * Math.max(1, w.W - 2 * inset); }
      else { y = w.H - inset; x = inset + Math.random() * Math.max(1, w.W - 2 * inset); }
      if (w.pointInWall(x, y, cfg.SEG_RADIUS + 30)) continue; // 不压墙（含安全余量）
      var dmin = Infinity;
      for (var i = 0; i < snakes.length; i++) {
        var d = snakes[i].distTo(x, y);
        if (d < dmin) dmin = d;
      }
      if (snakes.length === 0) dmin = Infinity;
      if (dmin > bestD) { bestD = dmin; best = { x: x, y: y }; }
      if (dmin >= cfg.MP_SPAWN_CLEAR + 200) break; // 足够安全，提前收工
    }
    // 兜底：世界中心（出生安全区保证无墙）
    return best || { x: w.W / 2, y: w.H / 2 };
  };

  /**
   * 生成一条 AI 蛇（边缘安全位、朝向场心、随机昵称/速度档位/性格）。
   * @param {number} smartness 智力等级 0~1（0=开局普通AI，1=后期聪明AI；越高越谨慎、速度越快）
   */
  Multiplayer.prototype.spawnBot = function (smartness, teamId) {
    var pos = this.findSpawn();
    var angle = Math.atan2(this.walls.H / 2 - pos.y, this.walls.W / 2 - pos.x);
    var snake = new Snake(pos.x, pos.y, cfg.MP_START_LENGTH, angle, this.game.unlockedKeys);
    var e = new Entry(snake, this.pickName(), false, teamId);

    // 基础速度：后期 AI 略快（给玩家更大压力）
    var speedRange = cfg.MP_AI_SPEED_MAX - cfg.MP_AI_SPEED_MIN;
    e.base = cfg.MP_AI_SPEED_MIN + Math.random() * speedRange * (0.7 + smartness * 0.5);

    // 性格参数：早期 AI 随机性大（可能很贪或很怂），后期 AI 更均衡聪明
    if (smartness < 0.3) {
      // 早期：极端随机（有的很莽有的很胆小）
      e.greed = 0.4 + Math.random() * 1.2;    // 0.4~1.6
      e.caution = 0.4 + Math.random() * 1.2;   // 0.4~1.6
    } else {
      // 后期：更聪明（适中偏高贪食 + 高谨慎 = 会吃但不容易送死）
      e.greed = 0.8 + Math.random() * 0.5;     // 0.8~1.3
      e.caution = 0.9 + Math.random() * 0.5;   // 0.9~1.4
    }

    this.bots.push(e);
    this.botSnakes.push(snake);
    this.liveSnakes.push(snake);
    return e;
  };

  // ---------------- 淘汰与尸体 ----------------

  /**
   * 尸体掉落：颜色序列每隔 MP_CORPSE_STRIDE 节掉 1 个色块（起点随机 0/1 → ≈50% 节）。
   * 掉落的色块直接进入 spawner.blocks（资源循环），不受稀疏刷新间距约束。
   * @returns {number} 实际掉落的色块数
   */
  Multiplayer.prototype.dropCorpse = function (e) {
    var s = e.snake;
    var stride = Math.max(1, cfg.MP_CORPSE_STRIDE);
    var offset = Math.floor(Math.random() * stride);
    var added = 0;
    for (var i = offset; i < s.colors.length; i += stride) {
      var p = s.segPos[i] || { x: s.x, y: s.y };
      this.spawner.blocks.push({
        x: p.x, y: p.y,
        color: s.colors[i],
        phase: Math.random() * Math.PI * 2
      });
      added++;
    }
    return added;
  };

  /** 淘汰一条蛇：掉落尸体 + 粒子闪光；AI 进入重生队列，真人由 game/room 结算 */
  Multiplayer.prototype.kill = function (e) {
    if (!e.alive) return;
    e.alive = false;
    e.diedAt = this.timeMs;
    var dropped = this.dropCorpse(e);
    this.dropDeathItems(e); // 必然掉 1 个随机道具 + 每 10 节额外掉 1 个
    this.particles.flash(e.snake.x, e.snake.y, '#FFD94A', 1.4, 3);
    var li = this.liveSnakes.indexOf(e.snake);
    if (li >= 0) this.liveSnakes.splice(li, 1);
    if (!e.isPlayer) {
      delete this.usedNames[e.name];
      var idx = this.botSnakes.indexOf(e.snake);
      if (idx >= 0) this.botSnakes.splice(idx, 1);
      var delay = cfg.MP_RESPAWN_MIN_MS + Math.random() * (cfg.MP_RESPAWN_MAX_MS - cfg.MP_RESPAWN_MIN_MS);
      this.respawnQueue.push({ at: this.timeMs + delay });
    }
    this.emitEv('death', { id: e.id, isPlayer: e.isPlayer, x: e.snake.x, y: e.snake.y, drop: dropped });
  };

  /**
   * 碰撞判定（每帧一次，批量结算）：
   *  1. 头撞墙/边界 → 淘汰；
   *  2. 头对头（头心距 < 2×HEAD_HIT_RADIUS）→ 两条都淘汰；
   *  3. 头撞其他蛇身体节（segPos[1..]，头除外）→ 淘汰，身体主人记 1 击杀；
   *     同时触发咬断：被撞者 B 被移除「离 A 头心最近」的那一节（见 applyBite）。
   */
  Multiplayer.prototype.collide = function () {
    var es = this.allEntries();
    var alive = [];
    var i, j;
    for (i = 0; i < es.length; i++) if (es[i].alive) alive.push(es[i]);
    var dead = {}; // entry.id -> {by: Entry|null}
    var bites = []; // [{A, B, seg}] 本帧发生的咬断（A 撞 B 第 seg 节）

    // 1. 撞墙/边界
    for (i = 0; i < alive.length; i++) {
      var s = alive[i].snake;
      if (this.walls.hitsCircle(s.x, s.y, cfg.HEAD_HIT_RADIUS)) dead[alive[i].id] = { by: null };
    }

    // 2. 头对头
    var hh = cfg.HEAD_HIT_RADIUS * 2;
    for (i = 0; i < alive.length; i++) {
      for (j = i + 1; j < alive.length; j++) {
        var a = alive[i], b = alive[j];
        if (dead[a.id] && dead[b.id]) continue;
        // 同队头对头免死（团队模式）：两者都存活、可反弹/穿过（FFA 全部 teamId=-1，此分支不触发）
        if (a.teamId >= 0 && a.teamId === b.teamId) continue;
        if (u.dist(a.snake.x, a.snake.y, b.snake.x, b.snake.y) < hh) {
          if (!dead[a.id]) dead[a.id] = { by: null };
          if (!dead[b.id]) dead[b.id] = { by: null };
        }
      }
    }

    // 3. 头撞身体（k 从 1 起：跳过对方头部，头对头已在上面判过）
    //    碰撞：尾巴节也算身体（撞上照样淘汰撞者）；
    //    咬断：被咬节 = 判定半径内离 A 头心最近的「颜色节」（排除末尾尾巴节，它不可被咬掉）
    //    同队头撞身体免死：不写死亡、不计咬断（团队模式专属；FFA teamId=-1 不受影响）
    var hb = cfg.HEAD_HIT_RADIUS + cfg.SEG_RADIUS;
    for (i = 0; i < alive.length; i++) {
      var A = alive[i];
      if (dead[A.id]) continue;
      for (j = 0; j < alive.length; j++) {
        if (i === j) continue;
        var B = alive[j];
        if (A.teamId >= 0 && A.teamId === B.teamId) continue; // 同队：头撞身体免死（不咬断）
        var sp = B.snake.segPos;
        var colorN = B.snake.colors.length; // segPos[colorN] 即尾巴节
        var hitK = -1, bestD = hb;          // 碰撞最近节（含尾巴节）
        var biteK = -1, biteD = hb;         // 咬断最近节（仅颜色节）
        for (var k = 1; k < sp.length; k++) {
          var d = u.dist(A.snake.x, A.snake.y, sp[k].x, sp[k].y);
          if (d < bestD) { bestD = d; hitK = k; }
          if (k < colorN && d < biteD) { biteD = d; biteK = k; }
        }
        if (hitK >= 0) {
          dead[A.id] = { by: B };
          if (biteK >= 0) bites.push({ A: A, B: B, seg: biteK }); // 只撞上尾巴：淘汰但不咬断
          break;
        }
      }
    }

    // 咬断结算（在统一淘汰前处理；同一被撞者按节下标从大到小移除，避免下标位移咬错节）
    bites.sort(function (p, q) { return q.seg - p.seg; });
    for (i = 0; i < bites.length; i++) {
      var bt = bites[i];
      if (dead[bt.B.id]) continue; // B 已因其他原因淘汰（墙/头对头/此前的咬断保底）：整尸掉落，不再咬断
      this.applyBite(bt.A, bt.B, bt.seg, dead);
    }

    // 结算（统一在判定完之后处理，避免遍历中改状态）
    for (i = 0; i < alive.length; i++) {
      var E = alive[i];
      if (dead[E.id]) {
        if (dead[E.id].by) dead[E.id].by.kills++;
        this.kill(E);
      }
    }
  };

  /**
   * 咬断：A 撞 B 身体，B 移除第 segIdx 节（颜色序列去掉该项，身体由轨迹自然收拢）。
   *  - 尾巴节保护：segIdx 越界（= 尾巴节下标）时 removeSegAt 返回 null，不咬断不保底；
   *  - 保底：移除后 B 节数 < MP_BITE_MIN_LENGTH → B 直接淘汰（dead[B] = {by: A}，计入 A 击杀）；
   *  - 消除联动：B 存活则立即检查颜色序列，凑成 ≥ELIM_RUN 连同色正常触发消除
   *    （连锁/倍率计分照常，分数与累计消除方块都记 B）；
   *  - 视觉反馈：被咬处迸小粒子 + B 短暂闪白/抖动（bittenUntil，渲染层表现）。
   */
  Multiplayer.prototype.applyBite = function (A, B, segIdx, dead) {
    var removed = B.snake.removeSegAt(segIdx);
    if (!removed) return;
    this.particles.burst(removed.x, removed.y, cfg.COLORS[removed.color], 5, 0.8);
    B.bittenUntil = this.timeMs + cfg.MP_BITE_FLASH_MS;
    this.emitEv('bite', { id: B.id, by: A.id, seg: segIdx, x: removed.x, y: removed.y, color: removed.color });
    if (B.snake.length() < cfg.MP_BITE_MIN_LENGTH) {
      dead[B.id] = { by: A }; // 保底淘汰：正常淘汰流程（尸体掉落）+ 计入 A 的击杀
      return;
    }
    this.resolveElim(B); // 被咬后颜色接拢，可能凑成 4 连 → 正常消除（计分给 B）
  };

  // ---------------- 帧更新 ----------------

  /** 消除结算：4 连消除 + 连锁倍率计分 + 逐级放大特效（与单人模式同一套表现）；
   *  同时累计「累计消除方块」elimTotal（含连锁与被咬触发的消除） */
  Multiplayer.prototype.resolveElim = function (e) {
    var removed = e.snake.eliminate(cfg.MIN_LENGTH, cfg.ELIM_RUN);
    this.scoreChain(e, removed, 1, 0);
  };

  /**
   * 统一计分 + 特效（供 resolveElim 与 applyItem 共用）。
   * 连击 combo 为 Entry 级状态（v3.0 下沉，多真人各自独立；窗口规则与单机一致）。
   * @param {Entry} e 被消除的蛇档案
   * @param {Array} removed 被移除节 [{color,x,y,chain}]
   * @param {number} fxBoost 特效放大（炸弹更强）
   * @param {number} perSegBonus 每节额外得分（炸弹/消色/随机消除等道具）
   */
  Multiplayer.prototype.scoreChain = function (e, removed, fxBoost, perSegBonus) {
    if (!removed || !removed.length) return;
    if (CS.audio) CS.audio.playElim();
    e.elimTotal += removed.length;
    // 连击（仅真人计分，AI 的 elimScore 仅供调试）：窗口内连续消除 → combo 递增 → 分数成倍
    var combo = 1;
    if (e.isPlayer) {
      e.combo = (e.comboTimer > 0) ? e.combo + 1 : 1;
      e.comboTimer = cfg.ELIM_COMBO_WINDOW;
      combo = Math.min(cfg.ELIM_COMBO_MAX, e.combo);
    }
    var waves = {};
    var i;
    for (i = 0; i < removed.length; i++) {
      var ch = removed[i].chain || 1;
      (waves[ch] = waves[ch] || []).push(removed[i]);
    }
    var chainLv = Object.keys(waves).map(Number).sort(function (a, b) { return a - b; });
    for (var w = 0; w < chainLv.length; w++) {
      var chain = chainLv[w], segs = waves[chain];
      var fxScale = (1 + (chain - 1) * cfg.CHAIN_FX_STEP) * (fxBoost || 1);
      e.elimScore += segs.length * cfg.ELIM_SCORE * chain * combo + (perSegBonus || 0);
      var sx = 0, sy = 0;
      for (i = 0; i < segs.length; i++) {
        this.particles.burst(segs[i].x, segs[i].y, cfg.COLORS[segs[i].color],
          Math.round(5 * fxScale), fxScale);
        sx += segs[i].x; sy += segs[i].y;
      }
      var ccx = sx / segs.length, ccy = sy / segs.length;
      this.particles.flash(ccx, ccy, '#FFD94A', fxScale, Math.min(4, chain));
      if (chain >= cfg.CHAIN_TEXT_MIN) {
        this.particles.chainText(ccx, ccy - 24, chain + '连锁！', 20 + (chain - 1) * 6);
      }
      if (e.isPlayer && combo >= 2) {
        this.particles.chainText(ccx, ccy - 46, combo + '连击 ×' + combo, 18 + combo);
      }
    }
    this.emitEv('elim', { id: e.id, segs: removed, combo: combo, score: e.elimScore });
  };

  /**
   * 拾取道具的统一处理（真人与 AI 共用）：按 kind 触发对应效果 + 计分 + 特效。
   * 特殊道具（wild/bomb/slow/clear/clear3/rand1-3）都会真正生效；
   * 真人拾取时弹出效果飘字（setItemToast，本地模式仅本机玩家可见；联机按 Entry 路由）。
   * @param {Entry} e 拾取者
   * @param {object} b 色块 {kind,color,x,y,rarity}
   */
  Multiplayer.prototype.applyItem = function (e, b) {
    var px = b.x, py = b.y;
    var isPlayer = e.isPlayer;
    if (b.kind && b.kind !== 'color' && isPlayer) this.game.setItemToast(b.kind, b.color, e);
    if (b.kind === 'wild') {
      e.snake.growWild();
      if (CS.audio) CS.audio.playSpecial();
      this.particles.burst(px, py, '#FFD94A', 7);
      this.resolveElim(e);
    } else if (b.kind === 'bomb') {
      if (CS.audio) CS.audio.playSpecial();
      this.particles.burst(px, py, '#E8552F', 12, 1.5);
      var rem = e.snake.eliminate(2, 2);
      this.scoreChain(e, rem, 1.4, cfg.BOMB_SCORE);
      // 炸弹自己的 2 连规则允许暂时降到 2 节；多人路径不像单人 Game.update
      // 那样在本帧末尾统一再跑标准消除，所以必须在这里执行长度保底。
      var rem2 = e.snake.eliminate(cfg.MIN_LENGTH, cfg.ELIM_RUN);
      this.scoreChain(e, rem2, 1, 0);
    } else if (b.kind === 'slow') {
      if (CS.audio) CS.audio.playSpecial();
      e.slowUntil = this.timeMs + cfg.SLOW_MS;
      this.particles.burst(px, py, '#2EC4B6', 9);
      this.resolveElim(e);
    } else if (b.kind === 'clear') {
      if (CS.audio) CS.audio.playSpecial();
      var rem = e.snake.removeByColor(b.color);
      this.scoreChain(e, rem, 1.3, cfg.CLEAR_SCORE);
      var rem2 = e.snake.eliminate(cfg.MIN_LENGTH, cfg.ELIM_RUN);
      this.scoreChain(e, rem2, 1, 0);
      this.particles.burst(px, py, cfg.COLORS[b.color], 12, 1.5);
    } else if (b.kind === 'clear3') {
      if (CS.audio) CS.audio.playSpecial();
      var rem = e.snake.removeRearByColor(b.color, 3);
      this.scoreChain(e, rem, 1.2, cfg.CLEAR3_SCORE);
      var rem2 = e.snake.eliminate(cfg.MIN_LENGTH, cfg.ELIM_RUN);
      this.scoreChain(e, rem2, 1, 0);
      this.particles.burst(px, py, cfg.COLORS[b.color], 9, 1.3);
    } else if (b.kind === 'rand1' || b.kind === 'rand2' || b.kind === 'rand3') {
      if (CS.audio) CS.audio.playSpecial();
      var rn = b.kind === 'rand1' ? 1 : (b.kind === 'rand2' ? 2 : 3);
      var rem = e.snake.removeRandom(rn);
      this.scoreChain(e, rem, 1.2, cfg.RAND_SCORE);
      var rem2 = e.snake.eliminate(cfg.MIN_LENGTH, cfg.ELIM_RUN);
      this.scoreChain(e, rem2, 1, 0);
      this.particles.burst(px, py, '#FFD94A', 9, 1.3);
    } else if (b.kind === 'grab') {
      // 多人专属「彩色星」：真人吃到 → 自己当前总分立即 +20%（一次性加成，可叠加）；
      // AI 吃到则只是把道具消耗掉（真人失去抢夺机会）。无论谁吃，都清掉场上这颗并安排下一颗。
      if (CS.audio) CS.audio.playSpecial();
      this.particles.burst(px, py, '#FFD94A', 16, 1.9);
      this.particles.ring(px, py, '#FFC83D', 1.8);
      var bonus = 0;
      if (isPlayer) {
        var cur = (e.survivalScore || 0) + (e.elimScore || 0) + (e.mpBonusScore || 0);
        bonus = Math.max(1, Math.round(cur * cfg.GRAB_SCORE_MUL));
        e.mpBonusScore = (e.mpBonusScore || 0) + bonus;
        this.particles.chainText(px, py - 32, '分数 +20%！+' + bonus, 24);
      }
      this.emitEv('grab', { id: e.id, isPlayer: isPlayer, bonus: bonus, x: px, y: py });
      // 消费场上这颗彩色星（collectAt 已将其移出 blocks，这里只清引用 + 排下一颗）
      this.spawner.grabBlock = null;
      this.spawner.grabTimer = cfg.GRAB_RESPAWN_MS;
    } else {
      if (CS.audio) CS.audio.playEat();
      e.snake.grow(b.color);
      this.particles.burst(px, py, cfg.COLORS[b.color], 4);
      this.resolveElim(e);
    }
    if (b.kind && b.kind !== 'color') {
      this.emitEv('item', { id: e.id, kind: b.kind, color: b.color || null, x: px, y: py });
    }
  };

  /**
   * 阵亡掉落道具：除身体散落色块（dropCorpse）外，必然额外掉落一个随机道具，
   * 且真人/任意蛇每有 10 个颜色节（不含尾巴节）再额外掉一个随机道具（长度越长奖励越多）。
   * @param {Entry} e 被淘汰的蛇
   */
  Multiplayer.prototype.dropDeathItems = function (e) {
    var s = e.snake;
    var colorLen = s.colors.length; // 颜色节数（尾巴节不在 colors[] 内，天然排除）
    var count = 1 + Math.floor(colorLen / 10);
    for (var i = 0; i < count; i++) {
      var kind = this.spawner.randomSpecialKind();
      var p = s.segPos[Math.floor(Math.random() * s.segPos.length)] || { x: s.x, y: s.y };
      var jx = (Math.random() * 2 - 1) * 26, jy = (Math.random() * 2 - 1) * 26;
      this.spawner.addDroppedItem(p.x + jx, p.y + jy, kind);
    }
  };

  /**
   * 处理 AI 重生 + 动态增长（v2.8.7：AI 数量随时间从 MP_AI_START_COUNT 增长到 MP_AI_MAX_COUNT）。
   * 逻辑：
   *  1) 到期的淘汰 AI 按原延迟重生（维持基本编制）；
   *  2) 计算当前存活时间对应的目标 AI 数量，若当前活 AI 少于目标，额外补招新 AI；
   *  3) 新补招的 AI 使用 currentSmartness() 智力参数（后期 AI 更聪明）。
   */
  Multiplayer.prototype.processRespawns = function () {
    // 团队模式：AI 不重生（否则会破坏 10 人固定编制与队伍淘汰逻辑；空位即该队减员）
    if (this.teamMode) return;
    var now = this.timeMs;
    var sec = this.timeMs / 1000;
    var smartness = this.currentSmartness();

    // 1) 到期重生（淘汰的 AI 回来）
    var due = 0;
    var keep = [];
    for (var i = 0; i < this.respawnQueue.length; i++) {
      if (this.respawnQueue[i].at <= now) due++;
      else keep.push(this.respawnQueue[i]);
    }
    this.respawnQueue = keep;
    for (i = 0; i < due; i++) {
      this.spawnBot(smartness);  // 重生的 AI 也带当前智力水平
      this.respawned++;
    }

    // 2) 动态增长：若「活 AI + 重生队列」< 目标数量，补招新 AI（队列中的待重生蛇也算编制，
    //    避免「刚被淘汰→队列里还躺着一条→又补一条」导致数量瞬间越界）。
    //    节流仅作为「增长补招」的速率限制（每隔 >=800ms 才允许补一条），绝不越过目标数量硬上限。
    var alive = this.aliveBotCount() + this.respawnQueue.length;
    var target = this.targetAiCount(sec);
    var canGrow = !this._lastGrowSpawn || now - this._lastGrowSpawn >= 800;
    if (alive < target && canGrow) {
      this.spawnBot(smartness);
      this.respawned++;
      this._lastGrowthSpawn = now; // 注意：故意用不同变量名避免与重生混淆
      this._lastGrowSpawn = now;
    }
  };

  /**
   * 每帧推进（由 game.updateMulti / room.tick 调用；真人输入已写入各 snake.targetAngle）：
   *  AI 决策 → 动态速度 → 推进所有蛇 → 碰撞淘汰 → 吃色/消除 → 重生补充 → 色块刷新。
   */
  Multiplayer.prototype.update = function (dt) {
    this.timeMs += dt;
    var entries = this.allEntries();
    var snakes = this.aliveSnakes();
    var env = { walls: this.walls, blocks: this.spawner.blocks, snakes: snakes };
    var sec = this.timeMs / 1000;
    var i, e;

    // 随时间提升特殊道具刷新概率（越后期道具越密集）
    this.spawner.specialChance = cfg.specialChanceForElapsed(this.game.elapsed);

    // AI 决策（与真人同规则：只设目标角，转向速率由 Snake.update 钳制）
    for (i = 0; i < this.bots.length; i++) {
      e = this.bots[i];
      if (!e.alive) continue;
      e.snake.setTargetAngle(CS.AI.decide(e.snake, env, e));
    }

    // 真人计分状态推进：生存分（死亡冻结）+ 连击窗口衰减
    for (i = 0; i < this.players.length; i++) {
      e = this.players[i];
      if (e.alive) e.survivalScore = Math.floor(this.timeMs / 1000) * cfg.SURVIVE_SCORE_PER_SEC;
      if (e.comboTimer > 0) {
        e.comboTimer -= dt;
        if (e.comboTimer <= 0) { e.comboTimer = 0; e.combo = 0; }
      }
    }

    // 动态速度（长度/时间加成，封顶 SPEED_MAX；减速道具期间 ×SLOW_FACTOR）+ 推进
    for (i = 0; i < entries.length; i++) {
      e = entries[i];
      if (!e.alive) continue;
      var sp = e.base + e.snake.length() * cfg.SPEED_LEN_COEF + sec * cfg.ENDLESS_SPEEDUP_PER_SEC;
      if (e.slowUntil && this.timeMs < e.slowUntil) sp *= cfg.SLOW_FACTOR;
      e.snake.speed = Math.min(cfg.SPEED_MAX, sp);
      e.snake.update(dt);
      if (e.snake.length() > e.maxLen) e.maxLen = e.snake.length();
    }

    // 碰撞淘汰（墙 / 头头 / 头身）
    this.collide();

    // 吃色块 + 消除（真人优先，其后 AI；特殊道具走 applyItem 真正生效 + 真人飘字）
    for (i = 0; i < entries.length; i++) {
      e = entries[i];
      if (!e.alive) continue;
      var got = this.spawner.collectAt(e.snake);
      for (var g = 0; g < got.length; g++) this.applyItem(e, got[g]);
    }

    // 流星砖块：直线飞行 + 命中真人蛇身注入中段（目标 = 全部存活真人；单人时行为不变）
    var targets = [];
    for (i = 0; i < this.players.length; i++) {
      if (this.players[i].alive) targets.push(this.players[i]);
    }
    var targetSnakes = [];
    for (i = 0; i < targets.length; i++) targetSnakes.push(targets[i].snake);
    var mev = this.spawner.updateMeteors(dt, targetSnakes);
    for (var mi = 0; mi < mev.length; mi++) {
      var ev = mev[mi];
      var owner = null;
      for (i = 0; i < targets.length; i++) {
        if (targets[i].snake === ev.snake) { owner = targets[i]; break; }
      }
      if (!owner) continue;
      owner.snake.insertAt(ev.idx, ev.color);
      this.particles.burst(ev.x, ev.y, cfg.COLORS[ev.color], 7, 1.3);
      if (CS.audio) CS.audio.playSpecial();
      owner.elimScore += cfg.METEOR_SCORE; // 记到被注入的真人 Entry
      this.game.setItemToast('meteor', ev.color, owner); // 流星注入飘字（按 Entry 路由）
      this.emitEv('meteor', { id: owner.id, idx: ev.idx, color: ev.color, x: ev.x, y: ev.y });
      this.resolveElim(owner);
    }

    // AI 补充 + 稀疏刷新
    this.processRespawns();
    this.spawner.update(dt);
  };

  // ---------------- 排行榜与名次 ----------------

  /** 实时排行榜：活蛇按当前节数降序（同节数真人优先），[{name, length, isPlayer}] */
  Multiplayer.prototype.leaderboard = function () {
    var es = this.allEntries();
    var arr = [];
    for (var i = 0; i < es.length; i++) {
      if (es[i].alive) arr.push({ name: es[i].name, length: es[i].snake.length(), isPlayer: es[i].isPlayer });
    }
    arr.sort(function (a, b) {
      if (b.length !== a.length) return b.length - a.length;
      return (a.isPlayer ? 0 : 1) - (b.isPlayer ? 0 : 1);
    });
    return arr;
  };

  /** 某 Entry 在当前场上的名次（1 起）：1 + 节数严格更多的活蛇数 */
  Multiplayer.prototype.rankOf = function (e) {
    var len = e.snake.length();
    var rank = 1;
    var es = this.allEntries();
    for (var i = 0; i < es.length; i++) {
      if (es[i] !== e && es[i].alive && es[i].snake.length() > len) rank++;
    }
    return rank;
  };

  CS.Multiplayer = Multiplayer;
  CS.MultiplayerEntry = Entry;
  CS.resetMultiplayerIds = resetIds;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

<script>
/* ===== 内联自 js/net/protocol.js（勿手改，源文件为准） ===== */
'use strict';
/**
 * protocol.js — 联机对战协议（v3.0，两端共享：浏览器挂 CS.protocol，Node 可 require）
 *
 * 设计见 docs/architecture/01-online-multiplayer.md §5.1。
 * 消息一律 JSON 文本帧，带 t（type）字段。v1 为全量快照 + 坐标/角度量化（1px / 0.001rad）
 * + 扁平数组 + 1 字符颜色短码，传输层叠加 permessage-deflate（见 server/index.js），
 * 后续升级二进制/增量时只改本文件。
 *
 * 快照键名采用短键以控制 JSON 体积：
 *   snap:  { t, tk(tick), ack, tm(timeMs), sn[snakes], bl[blocks], mt[meteors] }
 *   snake: { id, nm, pl(isPlayer), al(alive), x, y, a(angle), sp(speed),
 *            co[colors], sg[[x,y]节心含尾巴节], kl(kills), es(elimScore), et(elimTotal),
 *            ml(maxLen), bt(bittenUntil), sl(slowUntil) }
 *   block: { x, y, c(color|null), k(kind), r(rarity|null), ph(phase), ttl, rr(收集半径) }
 *   meteor:{ id(mid), x, y, vx, vy, c, ph, tr[[x,y]轨迹] }
 */
(function (root) {
  var CS = root.CS = root.CS || {};

  // v3：流星补稳定实体 id（mid），客户端才能跨快照做连续轨迹；不允许新旧两端混跑。
  var PROTO_VER = 3;

  // ---------------- 消息类型 ----------------
  // 客户端 → 服务器
  var C2S = {
    JOIN: 'join',       // { t, ver, name }
    CANCEL: 'cancel',   // { t }
    INPUT: 'input',     // { t, seq, a(angle), bo(boost 0/1) }
    PING: 'ping',       // { t, ts }
    ACCEL: 'accel'      // { t, on(0/1/2) } TCP / 加速 / 双发探测
  };
  // 服务器 → 客户端
  var S2C = {
    QUEUED: 'queued',   // { t, pos, need }
    MATCHED: 'matched', // { t, roomId, playerId, players:[{id,name}], countdownMs, W, H }
    START: 'start',     // { t, tick }
    SNAP: 'snap',       // { t, tk, ack, tm, sn, bl, mt }
    EVENT: 'event',     // { t, k(event kind), ... }（见 EVENT_KIND）
    OVER: 'over',       // { t, reason, ranks:[{id,name,score,rank,alive,team?}], teams?:[{id,score,aliveCount,rank,members}] }
    PONG: 'pong',       // { t, ts }
    ERROR: 'error'      // { t, code, msg }
  };
  // event.kind 离散事件（驱动粒子/音效/播报，客户端不自行判定）
  var EVENT_KIND = {
    DEATH: 'death',       // { k, id, by(击杀者id|null), x, y, drop(尸体掉色块数) }
    ELIM: 'elim',         // { k, id, segs:[{x,y,c,chain}], combo }
    ITEM: 'item',         // { k, id, kind, color, x, y }（吃到特殊道具）
    TOAST: 'toast',       // { k, id, kind, color }（等价于单机 setItemToast，仅 id=接收者本人时展示）
    GRAB: 'grab',         // { k, id, bonus }（彩色星被吃；bonus>0 表示真人加分）
    GRAB_SPAWN: 'grab_spawn', // { k, x, y }（彩色星出现，播报表+小地图涟漪）
    METEOR: 'meteor',     // { k, id, idx, color, x, y }（流星注入）
    BITE: 'bite',         // { k, id(被咬者), seg, x, y, color }
    SELF_PULL: 'self_pull',// { k, id, x, y, color }
    WALL: 'wall',          // { k, x, y, w, h }（动态墙体新增，客户端补画）
    YOU_DIED: 'you_died'   // { k, team }（团队模式：本人死而队友活 → 客户端转观战）
  };
  // over.reason
  var OVER_REASON = {
    DEAD: 'dead',             // 你死了（按名次结算）
    WIN: 'win',               // 你是最后存活者
    TIMEOUT: 'timeout',       // 对局到时，按总分
    OPPONENT_LEFT: 'op_left', // 对手全部掉线
    DROPPED: 'dropped',       // 你掉线被判负（连接中断时本地合成，非服务器下发）
    LOSE: 'lose'              // 团队模式：本队未夺冠（被淘汰或超时未列第一）
  };

  // ---------------- 量化 ----------------
  /** 坐标量化到 1px（远程渲染足够；配合 permessage-deflate 控制带宽） */
  function qCoord(v) { return Math.round(v); }
  /** 角度量化到 0.001rad（≈0.057°） */
  function qAngle(v) { return Math.round(v * 1000) / 1000; }

  // ---------------- 颜色短码（1 字符，快照体积优化） ----------------
  var COLOR_SHORT = { red: 'r', blue: 'b', green: 'g', orange: 'o', purple: 'u', yellow: 'y', teal: 't', pink: 'k', wild: 'w' };
  var COLOR_LONG = {};
  (function () { for (var k in COLOR_SHORT) COLOR_LONG[COLOR_SHORT[k]] = k; })();
  function cShort(c) { return COLOR_SHORT[c] || 'r'; }
  function cLong(s) { return COLOR_LONG[s] || 'red'; }
  function packColors(colors) {
    var s = '';
    for (var i = 0; i < colors.length; i++) s += cShort(colors[i]);
    return s;

  function unpackColors(s) {
    var arr = [];
    for (var i = 0; i < s.length; i++) arr.push(cLong(s[i]));

  // ---------------- 编解码 ----------------
  function encode(msg) { return JSON.stringify(msg); }
  /** 解析失败返回 null（调用方对畸形消息做丢弃/踢出处理） */
  function decode(text) {

  // ---------------- 客户端消息构造 ----------------
  // opts: { mode: 'ffa'|'team', teamCode: string|null }（团队模式用；FFA 不传保持向后兼容）
  function join(name, opts) {
    var m = { t: C2S.JOIN, ver: PROTO_VER, name: String(name || '玩家').slice(0, 12) };
    if (opts) {
      if (opts.mode) m.mode = opts.mode;               // 'ffa'（缺省）| 'team'
      if (opts.teamCode != null && opts.teamCode !== '') m.teamCode = String(opts.teamCode);
    }
    return m;
  }
  function cancel() { return { t: C2S.CANCEL }; }
  function input(seq, angle, boost) { return { t: C2S.INPUT, seq: seq | 0, a: qAngle(angle), bo: boost ? 1 : 0 }; }
  function ping(ts) { return { t: C2S.PING, ts: ts }; }
  // on: 0=TCP only, 1=accelerated only, 2=probe (send both until a full datagram proves the path)
  function accel(mode) { return { t: C2S.ACCEL, on: mode === 2 ? 2 : (mode ? 1 : 0) }; }

  // ---------------- 快照序列化（服务器/LocalTransport 产出） ----------------

  /**
   * 序列化一条参赛蛇（Entry 或 RemoteEntry）。
   * sg 为扁平整数数组 [x0,y0,x1,y1,...]（含尾巴节），co 为 1 字符颜色短码串。
   * @param e Entry（见 multiplayer.js）：{ id, name, isPlayer, alive, kills, elimScore,
   *          elimTotal, maxLen, bittenUntil, slowUntil, snake, teamId }
   */
  function serSnake(e) {
    var s = e.snake;
    var sg = [];
    for (var i = 0; i < s.segPos.length; i++) {
      sg.push(qCoord(s.segPos[i].x), qCoord(s.segPos[i].y));
    }
    return {
      id: e.id, nm: e.name, pl: e.isPlayer ? 1 : 0, al: e.alive ? 1 : 0,
      x: qCoord(s.x), y: qCoord(s.y), a: qAngle(s.angle), sp: qCoord(s.speed),
      co: packColors(s.colors), sg: sg,
      kl: e.kills | 0, es: e.elimScore | 0, et: e.elimTotal | 0, ml: e.maxLen | 0,
      sv: e.survivalScore | 0, mb: e.mpBonusScore | 0, // 生存分/彩色星加成（HUD 计分显示）
      bt: e.bittenUntil | 0, sl: e.slowUntil | 0,
      tm: (e.teamId != null ? e.teamId : -1) // 队伍号（-1 = 无队伍，FFA 不影响）
    };

      ph: Math.round((b.phase || 0) * 100) / 100, ttl: b.ttl | 0, rr: b.rr || b.r || 0
    };

    for (var i = 0; i < (m.trail || []).length; i++) tr.push(qCoord(m.trail[i].x), qCoord(m.trail[i].y));

  }

  function snap(tick, ack, timeMs, entries, blocks, meteors) {
    var sn = [];
    for (var i = 0; i < entries.length; i++) sn.push(serSnake(entries[i]));

    for (i = 0; i < blocks.length; i++) bl.push(serBlock(blocks[i]));

 * udpTransport.js — UDP 加速层（v3.1 M1b，客户端）

    // 但 latestClamps 仍按原始耗尽统计，不能把问题粉饰掉。
    this.stats = { samples: 0, interpolated: 0, latestClamps: 0, oldestClamps: 0, extrapolated: 0 };
    this.lastLeadMs = 0;     // 最新快照相对 renderT 还领先多少；负数 = 缓冲已耗尽

  /**
   * 按服务器下发的快照间隔（matched.snapIntervalMs）重算延迟与缓冲窗口。

  /**
   * 把服务器 tick 映射到本地渲染时钟。
   *
   * 不能用「每帧实际到达时刻」直接排列：TCP 队头阻塞解除后，多个快照会同一毫秒
   * 批量到达，按收包时刻回放就会把等待期间的运动压缩成一帧，远端蛇看起来瞬移。
   * tick 是服务器固定模拟步长，天然等间隔；这里只估计网络偏移，把权威时间线
   * 平移到本地时钟。时延下降立即前锚；时延上升必须持续一段时间才后锚，避免一次
   * TCP 突发把整条时间线打乱。

  InterpBuffer.prototype._snapTime = function (tick, nowMs) {

    var base = nowMs - tickAbs;

      this._timeBaseMs = base;
      return tickAbs + this._timeBaseMs;
    }
    if (base < this._timeBaseMs && Math.abs(this._timeBaseMs - base) < 10000) {
      this._shiftTimeBase(base);
      this._highBaseMs = 0;
      this._highBaseSince = 0;
      return tickAbs + this._timeBaseMs;
    }

    var shiftThreshold = (CS.config && CS.config.REMOTE_CLOCK_SHIFT_MS) || 120;
    var reanchorMs = (CS.config && CS.config.REMOTE_REANCHOR_MS) || 1000;
    if (base > this._timeBaseMs + shiftThreshold) {
      if (!this._highBaseSince || base > this._highBaseMs) {
        if (!this._highBaseSince) this._highBaseSince = nowMs;
        this._highBaseMs = Math.max(this._highBaseMs || 0, base);
      }
      if (nowMs - this._highBaseSince >= reanchorMs) {
        this._shiftTimeBase(this._highBaseMs);
        this._highBaseMs = 0;
        this._highBaseSince = 0;
      }
    } else {
      this._highBaseMs = 0;
      this._highBaseSince = 0;
    }
    return tickAbs + this._timeBaseMs;
  };

  /**
   * 收到一帧快照（snap 为协议结构；反序列化在 push 内完成，后续零解析成本）。
   * @param {object} snap protocol.snap 消息
   * @param {number} nowMs 本地接收时刻（Date.now 风格）
   * @param {function} deSnake protocol.deSnake
   * @param {function} [deMeteor] protocol.deMeteor；提供后移动流星进入同一时间线
   */
  InterpBuffer.prototype.push = function (snap, nowMs, deSnake, deMeteor) {
    var normTick = this._normalizeTick(snap.tk);
    var last = this.snaps[this.snaps.length - 1];
    if (last && normTick < last.tick) return false; // 跨通道迟到的旧帧，先判序再付解析成本
    var byId = {};
    for (var i = 0; i < snap.sn.length; i++) {
      var d = deSnake(snap.sn[i]);
      byId[d.id] = d;
    }
    var meteors = [];
    if (deMeteor && snap.mt) {
      for (i = 0; i < snap.mt.length; i++) {
        var m = deMeteor(snap.mt[i]);
        // 协议 v3 起服务端保证稳定 mid；缺省键仅为旧测试/旧 JSON 数据兜底。
        m._key = m.mid != null ? String(m.mid) : ('legacy-' + i);
        meteors.push(m);
      }
    }
    var item = { time: this._snapTime(normTick, nowMs), recvTime: nowMs, byId: byId, meteors: meteors, tick: normTick };
    if (last && last.tick === item.tick) {
      // TCP/加速探测期可能同 tick 双通道到达；同帧替换，不能把时间线插出两个并列点。
      this.snaps[this.snaps.length - 1] = item;
    } else {
      this.snaps.push(item);
    }
    // 保留最近约 2 秒历史（帧数由 cap 折算，见 deriveCap）。
    // **不能写死帧数**：30 帧在 15Hz 是 2 秒，在 30Hz 只剩 1 秒，
    // 提频等于悄悄砍掉一半历史窗口。
    while (this.snaps.length > this.cap) this.snaps.shift();
    return true;
  };

  /** 取渲染时刻的前后两帧快照（不足两帧时返回 [最新, 最新]） */
  InterpBuffer.prototype._bracket = function (renderT) {
    var ss = this.snaps;
    if (!ss.length) { this._lastBracketKind = 'none'; return null; }
    this.lastLeadMs = ss[ss.length - 1].time - renderT;
    if (ss.length === 1 || renderT >= ss[ss.length - 1].time) {
      this._lastBracketKind = 'latest';
      return [ss[ss.length - 1], ss[ss.length - 1], 0];
    }
    for (var i = ss.length - 1; i >= 1; i--) {
      if (ss[i - 1].time <= renderT) {
        var span = ss[i].time - ss[i - 1].time;
        this._lastBracketKind = 'interpolate';
        return [ss[i - 1], ss[i], span > 0 ? (renderT - ss[i - 1].time) / span : 0];
      }
    }
    this._lastBracketKind = 'oldest';
    return [ss[0], ss[0], 0];
  };

  /** 整体平移点列（短外推时身体/拖尾必须跟随，不允许只移动头部或本体） */
  function shiftPoints(points, dx, dy) {
    var out = [];
    for (var i = 0; i < (points || []).length; i++) {
      out.push({ x: points[i].x + dx, y: points[i].y + dy });
    }
    return out;
  }

  /** 流星显示态：普通括号插值；越过最新帧时按速度短外推 */
  function sampleMeteor(a, b, t, overMs) {
    var x, y, angleDx, angleDy;
    if (overMs > 0) {
      x = b.x + b.vx * overMs / 1000;
      y = b.y + b.vy * overMs / 1000;
    } else if (a && a !== b) {
      x = a.x + (b.x - a.x) * t;
      y = a.y + (b.y - a.y) * t;
    } else {
      x = b.x; y = b.y;
    }
    angleDx = x - b.x; angleDy = y - b.y;
    return {
      mid: b.mid, x: x, y: y, vx: b.vx, vy: b.vy,
      color: b.color, phase: b.phase, trail: shiftPoints(b.trail, angleDx, angleDy)
    };
  }

  /**
   * 采样一帧插值结果：{ snakes: {id: ...}, meteors: [...] }
   * 兼容旧调用方：返回值本身仍可直接按 snake id 索引（snakes 字段是同一对象）。
   * 节心插值要求两帧节数一致（变长/消除瞬间取较新帧，一跳可接受）。
   */
  InterpBuffer.prototype.sample = function (nowMs) {
    var renderT = nowMs - this.delay;
    var br = this._bracket(renderT);
    if (!br) return null;
    this.stats.samples++;
    if (this._lastBracketKind === 'latest') this.stats.latestClamps++;
    else if (this._lastBracketKind === 'oldest') this.stats.oldestClamps++;
    else if (this._lastBracketKind === 'interpolate') this.stats.interpolated++;
    var s0 = br[0], s1 = br[1], t = Math.max(0, Math.min(1, br[2]));
    var maxExtra = (CS.config && CS.config.REMOTE_EXTRAPOLATE_MS) || 260;
    var overMs = this._lastBracketKind === 'latest'
      ? Math.min(maxExtra, Math.max(0, renderT - s1.time)) : 0;
    if (overMs > 0) this.stats.extrapolated++;

    var out = {};
    for (var id in s1.byId) {
      var b = s1.byId[id], a = s0.byId[id];
      if (!a || a === b) {
        if (overMs > 0) {
          var dx = Math.cos(b.angle) * (b.speed || 0) * overMs / 1000;
          var dy = Math.sin(b.angle) * (b.speed || 0) * overMs / 1000;
          out[id] = {
            id: b.id, name: b.name, isPlayer: b.isPlayer, alive: b.alive,
            x: b.x + dx, y: b.y + dy, angle: b.angle, speed: b.speed,
            colors: b.colors, segPos: shiftPoints(b.segPos, dx, dy),
            kills: b.kills, elimScore: b.elimScore, elimTotal: b.elimTotal, maxLen: b.maxLen,
            bittenUntil: b.bittenUntil, slowUntil: b.slowUntil,
            extrapolated: overMs
          };
        } else {
          out[id] = b;
        }
        continue;
      }
      var segPos = b.segPos;
      if (a.segPos.length === b.segPos.length) {
        segPos = [];
        for (var i = 0; i < b.segPos.length; i++) {
          segPos.push({
            x: a.segPos[i].x + (b.segPos[i].x - a.segPos[i].x) * t,
            y: a.segPos[i].y + (b.segPos[i].y - a.segPos[i].y) * t
          });
        }
      }
      out[id] = {
        id: b.id, name: b.name, isPlayer: b.isPlayer, alive: b.alive,
        x: a.x + (b.x - a.x) * t,
        y: a.y + (b.y - a.y) * t,
        angle: lerpAngle(a.angle, b.angle, t),
        speed: b.speed,
        colors: b.colors, segPos: segPos,
        kills: b.kills, elimScore: b.elimScore, elimTotal: b.elimTotal, maxLen: b.maxLen,
        bittenUntil: b.bittenUntil, slowUntil: b.slowUntil,
        extrapolated: 0
      };
    }

    var meteors = [];
    var aByKey = {}, i;
    for (i = 0; i < (s0.meteors || []).length; i++) aByKey[s0.meteors[i]._key] = s0.meteors[i];
    for (i = 0; i < (s1.meteors || []).length; i++) {
      var mb = s1.meteors[i];
      meteors.push(sampleMeteor(aByKey[mb._key], mb, t, overMs));
    }

    // 旧测试与旧调用方期望 sample(...)[id] 直接取蛇；附加字段不可枚举，
    // 避免 RemoteMatch 的 for..in 把 meteors/snakes 当成蛇 id。
    Object.defineProperty(out, 'snakes', { value: out, enumerable: false });
    Object.defineProperty(out, 'meteors', { value: meteors, enumerable: false });
    return out;
  };

  CS.lerpAngle = lerpAngle;

<script>
/* ===== 内联自 js/net/prediction.js（勿手改，源文件为准） ===== */
'use strict';
/**
 * prediction.js — 本机玩家蛇预测 + 软校正（v3.0 M4；v3.0.2 修复轨迹重建）
 *
 * 设计见 docs/architecture/01-online-multiplayer.md §5.4：
 * 玩家输入立刻在本地生效（零操作延迟），服务器快照带回权威状态后软校正：
 *  - 偏差 < HARD_SNAP_PX（默认 80px）：按 CORRECT_RATE（默认 10%/帧）收敛，绝不瞬移；
 *  - 偏差 ≥ HARD_SNAP_PX（极少见：丢包爆发/被咬瞬间）：直接对齐权威状态；
 *  - 颜色序列/速度以服务器为准（吃块/消除/咬断都是服务器裁决）。
 *
 * 预测体是一个真正的 CS.Snake 实例（与服务器同一套运动模型）。
 *
 * **轨迹重建（§5.4.1，v3.0.2 修复「头抛弃身体」）**：
 * 快照只带节心（间距 SEG_SPACING=30px），而 trail 采样步长是 TRAIL_STEP=3px。
 * 早期实现直接把 segPos 当 trail，弧长恰好等于身体长度、余量为零 —— colors 一变长
 * （吃块/流星注入/尸体色块）轨迹立刻不够，computeBody 沿轨迹排布时尾部全部节堆在
 * 轨迹末点，表现为「头带着几节移动，身体留在原地」。
 * 修复：细分插值 + 尾部外推补足弧长，并在 colors 变长时重新校验（不能只在 attach 做）。
 */
(function (root) {
  var CS = root.CS = root.CS || {};
  var cfg = CS.config;
  var u = CS.utils;

  var HARD_SNAP_PX = 80;   // 偏差超过该值直接对齐（防长时间错误漂移）
  var CORRECT_RATE = 0.1;  // 每帧收敛剩余偏差的 10%
  var TRAIL_MARGIN = 90;   // 轨迹弧长安全余量（px）：> trimTrail 的 60px，留一档安全垫

  /**
   * 整体平移预测蛇，而不是只挪头。
   *
   * `Snake.computeBody()` 从实时头坐标走向 trail[0] 再沿历史轨迹排身体。
   * 若软校正只改 x/y，trail 仍留在旧世界坐标，校正量就会变成一段人为的
   * 「头 → 旧轨迹」折线；连续快照再把误差累加时，视觉上就是蛇头回拉、
   * 身体滞后甚至像断开。平移整条轨迹才能在修正世界坐标的同时保持蛇形。
   */
  function translateSnake(s, dx, dy) {
    s.x += dx; s.y += dy;
    for (var i = 0; i < s.trail.length; i++) {
      s.trail[i].x += dx;
      s.trail[i].y += dy;
    }
  }

  /** 身体所需弧长（含恒在的尾巴节） */
  function needArcFor(colorCount) {
    return (colorCount + 1) * cfg.SEG_SPACING;
  }

  /** 轨迹弧长（从头部算起，沿 trail 累加） */
  function trailArc(s) {
    var acc = 0, px = s.x, py = s.y;
    for (var i = 0; i < s.trail.length; i++) {
      acc += u.dist(px, py, s.trail[i].x, s.trail[i].y);
      px = s.trail[i].x; py = s.trail[i].y;
    }
    return acc;
  }

  /**
   * 由权威节心序列重建一条「密度与弧长都够用」的轨迹（§5.4.1）。
   *
   * 为什么不能直接用 segPos：节心间距 30px ≫ TRAIL_STEP 3px，且首尾弧长恰好 = 身体长度，
   * 余量为零；computeBody 沿轨迹排布，轨迹一耗尽剩余节全部堆在末点。
   *
   * **起点一致性**：正常快照里 segPos[0] 就是头部坐标。但若调用方给出的 head 与
   * segPos[0] 不一致（异常快照/测试构造），从 head 走向 segPos[0] 的那段位移是「假轨迹」，
   * 会污染轨迹前段、破坏头与第 1 节的弦长关系，且每次 attach 累积一次退化。
   * 因此这里显式丢弃与 head 明显偏离的首个节心，以 head 为唯一权威起点。
   *
   * @param {{x:number,y:number}[]} segPos 权威节心（含头，头在前）
   * @param {number} headX 轨迹起点 = 头部世界坐标
   * @param {number} headY
   * @param {number} angle 头部朝向（节心不足时沿其反方向外推）
   * @param {number} needArc 身体所需弧长（不含余量）
   * @returns {{x:number,y:number}[]} trail（trail[0] 最新、靠近头部）
   */
  function buildTrail(segPos, headX, headY, angle, needArc) {
    var target = needArc + TRAIL_MARGIN;
    var step = cfg.TRAIL_STEP;
    var pts = [];
    var acc = 0;
    var px = headX, py = headY;

    // 起点一致性：segPos[0] 应等于头部。偏离超过一个节距说明 head 与 segPos 不同源
    // （head 已被校正/瞬移而 segPos 仍是旧序列），此时跳过它，避免注入假位移。
    var start = 0;
    if (segPos && segPos.length &&
        u.dist(headX, headY, segPos[0].x, segPos[0].y) > cfg.SEG_SPACING) {
      start = 1;
    }

    // 1) 沿节心序列细分插值，把密度对齐到 TRAIL_STEP
    for (var i = start; segPos && i < segPos.length && acc < target; i++) {
      var nx = segPos[i].x, ny = segPos[i].y;
      var d = u.dist(px, py, nx, ny);
      if (d < 1e-6) continue;               // 重合点（刚出生时节心全堆叠）跳过
      var n = Math.max(1, Math.ceil(d / step));
      for (var k = 1; k <= n && acc < target; k++) {
        var t = k / n;
        pts.push({ x: px + (nx - px) * t, y: py + (ny - py) * t });
        acc += d / n;
      }
      px = nx; py = ny;
    }

    // 2) 弧长仍不足 → 沿尾部方向外推（节心不足 2 点时用 angle 的反方向）
    if (acc < target) {
      var dx, dy;
      if (pts.length >= 2) {
        var a = pts[pts.length - 2], b = pts[pts.length - 1];
        dx = b.x - a.x; dy = b.y - a.y;
      } else {
        dx = -Math.cos(angle); dy = -Math.sin(angle); // 头朝 angle，身体在反方向
      }
      var len = Math.sqrt(dx * dx + dy * dy);
      if (len < 1e-6) { dx = -Math.cos(angle); dy = -Math.sin(angle); len = 1; }
      dx /= len; dy /= len;
      var lx = pts.length ? pts[pts.length - 1].x : headX;
      var ly = pts.length ? pts[pts.length - 1].y : headY;
      var guard = 0;
      while (acc < target && guard++ < 5000) { // guard：防御 step 异常导致死循环
        lx += dx * step; ly += dy * step;
        pts.push({ x: lx, y: ly });
        acc += step;
      }
    }

    if (!pts.length) pts.push({ x: headX, y: headY }); // 极端兜底：至少 1 点
    return pts;
  }

  function SelfPredictor() {
    this.snake = null;       // 本地预测蛇（CS.Snake 实例）
    this._corr = { x: 0, y: 0 };  // 待收敛的位置偏差
    this._corrAngle = 0;     // 待收敛的角度偏差
    this.lastErr = 0;        // 最近一次 reconcile 的偏差（监控/测试用）
    this.hardSnaps = 0;      // 硬对齐次数（应极少；监控用）
    this.trailRebuilds = 0;  // 轨迹补足次数（监控：频繁触发说明预测与权威长期不同步）
    this.softCorrections = 0;// 实际应用过的软校正帧数
    this.maxCorrectionPx = 0;// 单帧最大平移量（明显尖峰说明网络/预测失配）
    this.maxNeckGap = 0;     // 头到首节最大间距（应约等于 SEG_SPACING）
    this._colorKeys = null;  // 记住色池：hardSnap 内部走 attach 时不丢
  }

  /**
   * 用权威快照（deSnake 结果）初始化/重建预测体。
   * @param {object} d protocol.deSnake 的本机玩家蛇
   * @param {string[]} [colorKeys] 已解锁颜色池（保底补砖用；省略则沿用上次）
   */
  SelfPredictor.prototype.attach = function (d, colorKeys) {
    var s = Object.create(CS.Snake.prototype);
    s.x = d.x; s.y = d.y;
    s.angle = d.angle; s.targetAngle = d.angle;
    s.speed = d.speed;
    s.colors = d.colors.slice();
    s.colorKeys = colorKeys || this._colorKeys || cfg.COLOR_KEYS;
    this._colorKeys = s.colorKeys;
    // 轨迹重建：细分插值 + 尾部外推，保证密度与弧长都够用（§5.4.1）
    s.trail = buildTrail(d.segPos, d.x, d.y, d.angle, needArcFor(s.colors.length));
    s.segPos = [];
    s.selfPullCd = 0;
    s.computeBody();
    s.trimTrail();
    this.snake = s;
    this._corr = { x: 0, y: 0 };
    this._corrAngle = 0;
  };

  /** 每帧本地推进：写入最新输入 → 运动学积分 → 应用一份软校正 */
  SelfPredictor.prototype.update = function (dtMs, angle) {

      this._blocksById = {};

'use strict';

 * onlineMatch.js — 在线对战客户端控制器（v3.0 M5，仅浏览器）
 *
 * 串起整条联机管线：WsTransport（或注入的测试/本地传输）→ RemoteMatch（快照视图+插值）
 * → SelfPredictor（本机预测+软校正）→ Game 多人渲染分支（零改动复用）。
 *
 * 对 Game 的约定（game.online = 本实例时，game.update 把帧更新委托给 update(dt)）：
 *   mode='multi' / mp=RemoteMatch / snake=预测蛇 / spawner=快照哑对象 / walls=服务器下发
 *   得分字段（survivalScore/elimScore/mpBonusScore/score/elapsed）每帧从权威快照同步。
 *
 * 生命周期：begin() → matching（queued/matched）→ 首帧 snap 进 play → over/drop → finish()
 * 不支持断线重连：drop 即判负进结算（架构文档 §1）。
 *
 * 服务器地址：opts.url > localStorage 'crayon_snake_web_server' > 同域 /ws（见 wsTransport）。
 * 昵称：localStorage 'crayon_snake_web_nick'，缺省「我xxxx」（随机 4 位）。
 */

  var INPUT_INTERVAL_MS = 33;   // 上行输入节流（≈30Hz）

                                // 12 字节/包成本极低，没有理由跟着下行降频 ——
                                // 降上行只会让转向响应变钝。三层频率各管各的：
                                // 上行 30Hz / 下行 SNAP_EVERY 可配 / 渲染 rAF 不锁帧。
  var NICK_KEY = 'crayon_snake_web_nick';
  var SERVER_KEY = 'crayon_snake_web_server';
  var ONLINE_BEST_KEY = 'crayon_snake_web_online_best';

  function defNick() {
    var n = store.get(NICK_KEY, null);
    if (n && typeof n === 'string') return n.slice(0, 12);

  /**

    this.players = [];         // matched 下发的真人名单 [{id,name}]
    this.status = '正在连接服务器…'; // matching 界面状态行

    this.over = false;

      start: function () { self.status = '开局！等待首帧同步…'; },
      snap: function (m) { self._onSnap(m); },

      // 加速通道状态变化。静默降级是对的产品行为，但必须**可观测** ——
      // 否则「网页版其实一直在走 wss」这种事没人会发现。
