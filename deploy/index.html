        var kind = m.active ? (m.kind === 'wt' ? 'wt' : 'udp') : 'tcp';
        if (kind !== ch.kind) ch.switches++;
        ch.kind = kind;
        ch.label = kind === 'wt' ? 'WebTransport（UDP + 二进制）'
          : kind === 'udp' ? '裸 UDP（二进制）'
            : 'TCP（wss + JSON）';
        ch.snapIntervalMs = kind === 'tcp' ? ch.tcpIntervalMs : ch.accelIntervalMs;
        // 通道间隔由服务器 matched 下发并随通道切换（v3.1.1 起两通道同为 30Hz/70ms，
        // 服务器若降配 TCP_SNAP_EVERY=2 则 wss 自动回到 119ms）。
        // 若只改 HUD 不改插值层，就会出现「显示已降级，但仍拿 70ms 缓冲扛 TCP
        // 队头阻塞」的假修复。这里必须让真实渲染参数同步切换。
        if (self.remote) self.remote.setSnapInterval(ch.snapIntervalMs);

      drop: function () { self._finish(P.OVER_REASON.DROPPED, null, true); },
      error: function (m) {
        self.status = '服务器错误：' + (m.msg || m.code || 'unknown');
      }
    });
    try {
      if (typeof this.transport.startAuto === 'function') {
        // 本地传输（开发/测试用）：无连接概念，直接入队并自动泵模拟循环
        this.transport.joinMatch(this.nick);
        this.transport.startAuto(33);
      } else {
        this.transport.connect();
      }
    } catch (e) {
      this.status = '连接失败：' + (e && e.message || e);
    }
  };

  /** matched：建地图/视图/哑 spawner，进入开局倒计时（matching 界面继续） */
  OnlineMatch.prototype._onMatched = function (m) {
    var g = this.game;
    this.playerId = m.playerId;
    this.players = m.players || [];
    this.status = '匹配成功！' + this.players.length + ' 名玩家同场';
    this.detail = '开局倒计时 ' + Math.ceil((m.countdownMs || 0) / 1000) + ' 秒…';

    // 记下服务器下发了哪些加速接入方式。
    // 这个和「当前实际走哪条」要分开看 —— 两者组合才能定位问题：
    //   offered 全 0        ⇒ 服务器侧没开（UDP_ENABLED / WT_ENABLED）
    //   offered 有值但走 tcp ⇒ 客户端没用上（浏览器不支持 / 握手失败 / 端口被封）
    this.channel.offered = { udpPort: m.udpPort || 0, wtPort: m.wtPort || 0 };
    this.channel.tcpIntervalMs = m.tcpSnapIntervalMs || m.snapIntervalMs || 66;
    this.channel.accelIntervalMs = m.accelSnapIntervalMs || m.snapIntervalMs || 33;
    this.channel.snapIntervalMs = this.channel.kind === 'tcp'
      ? this.channel.tcpIntervalMs : this.channel.accelIntervalMs;
    // 诊断 HUD 显隐由服务器按环境下发（dev 开 / official 关），客户端不猜域名。
    // 字段缺失（旧服务器）按 false 处理 —— 与 official 的目标行为一致。
    this.debugHud = m.debugHud === true;

    g.mode = 'multi';
    g.levelCfg = { level: 0, W: m.W, H: m.H, wallSegments: 0, targetScore: 0, speed: cfg.SNAKE_SPEED };
    g.walls = new CS.Walls(m.W, m.H, { x: m.W / 2, y: m.H / 2 });
    if (m.walls) {
      for (var i = 0; i < m.walls.length; i++) {
        var r = m.walls[i];
        g.walls.rects.push({ x: r[0], y: r[1], w: r[2], h: r[3] });
      }
    }
    // 联机不设本地解锁上限：服务器蛇可带任意颜色（渲染按快照 colors 直出）
    g.unlockedCount = cfg.MAX_COLORS;
    g.unlockedKeys = cfg.COLOR_KEYS.slice();
    g.elapsed = 0; g.score = 0; g.survivalScore = 0; g.elimScore = 0;
    g.mpBonusScore = 0; g.elimCombo = 0; g.elimComboTimer = 0;
    g.mpResult = null; g.slowUntil = 0;
    g.particles.clear();
    // 只释放摇杆的「激活态/角度」，**保留在屏触点集合**：
    // 玩家常在倒计时期间就按住屏幕，若把触点一并清掉，进入 play 后只有 touchmove 在流，
    // 摇杆永远不会激活 → 整局锁死（这正是 v3.0.2 修复的断点 3，见 docs/design §3.7）。
    // setState('play') 会调 latchExisting()，把仍按住的手指重新接管。
    g.joystick.release();

    this.remote = new CS.RemoteMatch(this.playerId, {
      snapIntervalMs: this.channel.snapIntervalMs,
      tickMs: m.tickMs || cfg.SERVER_TICK_MS,
      mode: m.mode, teams: m.teams, myTeam: m.myTeam
    });
    // 团队字段透传给 game（渲染名牌/结算用）
    this.matchMode = m.mode || 'ffa';
    this.teams = m.teams || null;
    this.myTeam = (typeof m.myTeam === 'number') ? m.myTeam : -1;
    g.myTeam = this.myTeam;
    g.matchTeams = this.teams;
    g.matchMode = this.matchMode;
    g.mp = this.remote;
    // 哑 spawner：blocks/meteors 每帧从快照刷新；grabBlock 供彩色星播报/小地图涟漪
    g.spawner = { blocks: [], meteors: [], grabBlock: null, others: [] };
  };

  /**
   * 传输通道诊断快照（HUD 与控制台共用一个来源）。
   *
   * 统计**不自己再记一份**，直接读 `UdpAccel.stats` —— 那是真实收发计数。
   * 测试里吃过复刻公式导致脱钩的亏（实现改了、复刻的那份还在，两套逻辑），
   * 这里同理：重复计数迟早会和真值分叉。
   */
  OnlineMatch.prototype.netInfo = function () {
    var ch = this.channel;
    var udp = this.transport && this.transport.udp;
    var s = udp && udp.stats;
    var ad = udp && udp.diag || this.transport && this.transport.accelDiag || {};
    var d = this.transport && typeof this.transport.diagnostics === 'function'
      ? this.transport.diagnostics(ch.kind) : {};
    var interp = this.remote && this.remote._interp;
    var is = interp && interp.stats;
    var pred = this.predictor;
    var frameTotal = s ? s.recv + s.missingFrames : 0;
    var expectedCopies = s ? frameTotal * (udp.expectedDup || 1) : 0;
    function pct(n, total) { return total > 0 ? Math.round(n * 1000 / total) / 10 : 0; }

    // 流量速率：1 秒采样窗口，HUD 每秒跳变一次而不是每帧抖动。
    // 字节数直接读传输层的真实收发计数（ws.bytes / udp.stats.rxBytes|txBytes），
    // 不在这里另记一份 —— 复刻计数迟早与真值分叉。
    // JSON 按 string.length 近似字节（协议载荷几乎全 ASCII，误差可忽略）。
    var nowMs = Date.now();
    var rp = this._ratePrev;
    if (!rp) rp = this._ratePrev = { at: 0, wsRx: 0, wsTx: 0, acRx: 0, acTx: 0, down: 0, up: 0 };
    if (nowMs - rp.at >= 1000) {
      var wsB = this.transport && this.transport.bytes || { rx: 0, tx: 0 };
      var acRx = s ? (s.rxBytes || 0) : 0, acTx = s ? (s.txBytes || 0) : 0;
      if (rp.at > 0) {
        var dtS = (nowMs - rp.at) / 1000;
        rp.down = Math.round(((wsB.rx - rp.wsRx) + (acRx - rp.acRx)) / dtS / 102.4) / 10;
        rp.up = Math.round(((wsB.tx - rp.wsTx) + (acTx - rp.acTx)) / dtS / 102.4) / 10;
      }
      rp.at = nowMs; rp.wsRx = wsB.rx; rp.wsTx = wsB.tx; rp.acRx = acRx; rp.acTx = acTx;
    }
    return {
      通道: ch.label,
      kind: ch.kind,
      服务器下发: ch.offered,
      当前快照间隔ms: ch.snapIntervalMs,
      TCP快照间隔ms: ch.tcpIntervalMs,
      加速快照间隔ms: ch.accelIntervalMs,
      通道切换次数: ch.switches,
      WebTransport支持: !!ad.webTransportSupported,
      安全上下文: ad.secureContext !== false,
      加速状态: ad.state || 'not_attempted',
      加速失败阶段: ad.phase || '',
      加速失败原因: ad.reason || '',
      加速目标: ad.target || '',
      加速错误摘要: ad.lastError || '',
      加速Hello次数: ad.helloSent || 0,
      加速ACK时间: ad.ackedAt || 0,
      加速首帧时间: ad.firstSnapAt || 0,
      Socket错误: s ? s.socketErrors : 0,
      WSS延迟ms: d.rttMs || 0,
      WSS延迟P50ms: d.rttP50Ms || 0,
      WSS延迟P95ms: d.rttP95Ms || 0,
      WSS抖动ms: Math.round((d.rttJitterMs || 0) * 10) / 10,
      加速通道延迟ms: s ? s.pathRttMs : 0,
      加速通道抖动ms: s ? Math.round(s.pathRttJitterMs * 10) / 10 : 0,
      快照到达P50ms: d.arrivalP50Ms || 0,
      快照到达P95ms: d.arrivalP95Ms || 0,
      快照最大间隔ms: d.arrivalMaxMs || 0,
      快照到达抖动ms: Math.round((d.arrivalJitterMs || 0) * 10) / 10,
      // TCP 可靠传输不称「网络丢包」：这里是应用层快照序号是否缺失。
      快照缺失率: Math.round((d.frameLossPct || 0) * 10) / 10,
      快照迟到率: Math.round((d.latePct || 0) * 10) / 10,
      长卡顿次数: d.stalls || 0,
      WSS待发送字节: d.wsBufferedBytes || 0,
      下行KBs: rp.down,
      上行KBs: rp.up,
      // recv 是去重后的二进制逻辑帧；rawSnaps 含冗余副本。
      二进制帧: s ? s.recv : 0,
      逻辑帧丢失: s ? s.missingFrames : 0,
      逻辑帧丢失率: s ? pct(s.missingFrames, frameTotal) : 0,
      冗余副本包: s ? s.rawSnaps : 0,
      副本丢失率估算: s ? pct(Math.max(0, expectedCopies - s.rawSnaps), expectedCopies) : 0,
      冗余去重: s ? s.dupDropped : 0,
      乱序包: s ? s.outOfOrder : 0,
      解码失败: s ? s.decodeFail : 0,
      降级次数: s ? s.fallbacks : 0,
      插值延迟ms: interp ? interp.delay : 0,
      插值缓冲领先ms: interp ? Math.round(interp.lastLeadMs) : 0,
      插值缓冲耗尽率: is ? pct(is.latestClamps, is.samples) : 0,
      远端短外推率: is ? pct(is.extrapolated || 0, is.samples) : 0,
      预测误差px: Math.round((pred.lastErr || 0) * 10) / 10,
      预测硬校正: pred.hardSnaps || 0,
      预测最大软校正px: Math.round((pred.maxCorrectionPx || 0) * 10) / 10,
      头颈最大间距px: Math.round((pred.maxNeckGap || 0) * 10) / 10
    };
  };

  /**
   * HUD 专用的节流视图：同一秒内返回缓存的 netInfo。
   * 诊断面板按 rAF 每帧重绘，若数值也每帧变化（RTT 抖动、速率瞬时跳变），
   * 文字会闪烁不可读；产品要求 HUD 数据 1 秒刷新一次。
   * __net() 控制台诊断仍走 netInfo() 实时值，不受节流影响。
   */
  OnlineMatch.prototype.netInfoHud = function () {
    var now = Date.now();
    if (!this._hudCache || now - this._hudCache.at >= 1000) {
      this._hudCache = { at: now, info: this.netInfo() };
    }
    return this._hudCache.info;
  };

  /** 手机/桌面 HUD 共用的单行摘要；完整明细仍由 __net() 提供。 */
  OnlineMatch.prototype.netSummary = function () {
    var n = this.netInfoHud();
    var tag = this.channel.kind === 'wt' ? 'WebTransport'
      : this.channel.kind === 'udp' ? '裸UDP' : 'WSS';
    var rtt = this.channel.kind === 'tcp' ? n.WSS延迟ms : n.加速通道延迟ms;
    var quality = this.channel.kind === 'tcp'
      ? ('卡 ' + n.快照迟到率 + '%')
      : ('丢 ' + n.逻辑帧丢失率 + '%');
    if (this.channel.kind === 'tcp' && n.加速失败原因) {
      var reasonText = {
        webtransport_unsupported: '不支持WT', offer_missing: '无WT入口',
        invalid_offer: 'WT入口异常', factory_unavailable: 'WT不可用',
        constructor_throw: 'WT创建失败', wt_ready_rejected: 'WT握手失败',
        datagram_api_error: 'WT接口异常', hello_ack_timeout: 'WT超时',
        write_rejected: 'WT发送失败', read_rejected: 'WT接收失败',
        session_closed: 'WT已断开', downlink_stall: 'WT停滞',
        send_failed: 'WT发送失败', socket_error: 'WT连接错误'
      };
      quality = reasonText[n.加速失败原因] || 'WT回落';
    }
    return tag + ' · ' + (rtt ? rtt + 'ms' : '--ms') + ' · ' + quality +
      ' · ↓' + n.下行KBs + 'K';
  };

  /** 快照：应用视图 + 本机 reconcile；首帧挂接预测体并切入 play */
  OnlineMatch.prototype._onSnap = function (m) {
    if (!this.remote || this._finished) return;
    var now = Date.now();
    this.remote.applySnap(m, now);
    var selfData = null;
    for (var i = 0; i < m.sn.length; i++) {
      if (m.sn[i].id === this.playerId) { selfData = P.deSnake(m.sn[i]); break; }
    }
    if (!selfData) return; // 本机 Entry 不在快照里（异常），等下一帧

    var g = this.game;
    if (!this._attached) {
      this._attached = true;
      this.predictor.attach(selfData, g.unlockedKeys);
      g.snake = this.predictor.snake;
      g.snapCamera();
      if (CS.audio) CS.audio.startBgm();
      g.setState('play');
    } else {
      this.predictor.reconcile(selfData);
    }
    this._syncSpawner();
  };

  /** 哑 spawner 与最新快照对齐（渲染/播报只读这三个字段） */
  OnlineMatch.prototype._syncSpawner = function () {
    var g = this.game, r = this.remote;
    if (!g.spawner || !r) return;
    var blocks = r.blocks || [], meteors = r.meteors || [];
    g.spawner.blocks = blocks;
    g.spawner.meteors = meteors;
    var grab = null;
    for (var i = 0; i < blocks.length; i++) {
      if (blocks[i].kind === cfg.GRAB_KIND) { grab = blocks[i]; break; }
    }
    g.spawner.grabBlock = grab;
  };

  /** 离散事件 → 粒子/音效/飘字/墙体（本人相关事件才弹 toast） */
  OnlineMatch.prototype._onEvent = function (m) {
    var g = this.game, A = CS.audio;
    var mine = m.id === this.playerId;
    var col = (m.color && cfg.COLORS[m.color]) || '#FFD94A';
    switch (m.k) {
      case 'wall':
        if (g.walls) g.walls.rects.push({ x: m.x, y: m.y, w: m.w, h: m.h });
        break;
      case 'death':
        g.particles.flash(m.x, m.y, '#FFFFFF', mine ? 2.2 : 1.2);
        g.particles.burst(m.x, m.y, '#E8552F', mine ? 16 : 8, 1.3);
        if (mine && A) A.playWall();
        break;
      case 'elim': {
        var segs = m.segs || [];
        var sx = 0, sy = 0, maxChain = 1;
        for (var i = 0; i < segs.length; i++) {
          var c = segs[i].color === 'wild' ? '#FFD94A' : (cfg.COLORS[segs[i].color] || '#FFD94A');
          var fx = 1 + ((segs[i].chain || 1) - 1) * cfg.CHAIN_FX_STEP;
          g.particles.burst(segs[i].x, segs[i].y, c, Math.round(5 * fx), fx);
          g.particles.ring(segs[i].x, segs[i].y, c, fx);
          sx += segs[i].x; sy += segs[i].y;
          if ((segs[i].chain || 1) > maxChain) maxChain = segs[i].chain;
        }
        if (segs.length) {
          var cx = sx / segs.length, cy = sy / segs.length;
          g.particles.flash(cx, cy, '#FFD94A', 1, Math.min(4, maxChain));
          if (maxChain >= cfg.CHAIN_TEXT_MIN) {
            g.particles.chainText(cx, cy - 24, maxChain + '连锁！', 20 + (maxChain - 1) * 6);
          }
        }
        if (mine && A) { A.playElim(); if (maxChain >= 2) A.playChain(maxChain); }
        break;
      }
      case 'bite':
        g.particles.burst(m.x, m.y, col, 7, 1.2);
        if (mine && A) A.playWall();
        break;
      case 'item':
        g.particles.burst(m.x, m.y, col, mine ? 9 : 4, 1.2);
        if (mine) { g.setItemToast(m.kind, m.color); if (A) A.playSpecial(); }
        break;
      case 'grab':
        g.particles.burst(m.x, m.y, '#FFD94A', mine ? 14 : 6, 1.6);
        if (mine) {
          g.itemToast = { text: '彩色星！总分 +' + (m.bonus || 0) + ' 分', until: g.timeMs + cfg.ITEM_TOAST_MS };
          if (A) A.playSpecial();
        }
        break;
      case 'grab_spawn':
        g.particles.chainText(m.x, m.y - 20, '彩色星出现！', 18);
        break;
      case 'meteor':
        g.particles.burst(m.x, m.y, col, mine ? 7 : 3, 1.3);
        if (mine) { g.setItemToast('meteor', m.color); if (A) A.playSpecial(); }
        break;
      case 'self_pull':
        if (mine) {
          g.particles.ring(m.x, m.y, col, 1.4);
          g.particles.burst(m.x, m.y, col, 8, 1.4);
          if (g.snake) g.particles.streak(m.x, m.y, g.snake.x, g.snake.y, col);
          g.particles.chainText(m.x, m.y - 26, '自吃 +1', 16);
          if (A) A.playEat();
        }
        break;
      case 'toast':
        if (mine) g.setItemToast(m.kind, m.color);
        break;
      case P.EVENT_KIND.YOU_DIED:
        // 团队模式：本人死而队友存活 → 转观战（相机跟随存活队友）
        if (!self.spectating) {
          self.spectating = true;
          self.spectateTeam = (typeof m.team === 'number') ? m.team : self.myTeam;
          self.status = '你已阵亡，正在观战队友…';
        }
        break;
    }
  };

  /**
   * 帧更新（game.update 在 online 时委托到这里）：
   * 输入节流上行 → 本机预测推进 → 他机插值采样 → HUD 字段同步 → 相机。
   */
  OnlineMatch.prototype.update = function (dt) {
    var g = this.game, r = this.remote;
    if (!r || this._finished) return;

    // 输入优先级 键盘 > 摇杆 > 鼠标跟随 由 game.steeringAngle 统一裁决（§3.7）
    var ang = g.steeringAngle();
    var selfAlive = !!(r.playerEntry && r.playerEntry.alive);

    // 上行输入（节流 30Hz；只在有方向输入且存活时发）
    this._inputTimer -= dt;
    if (this._inputTimer <= 0) {
      this._inputTimer = INPUT_INTERVAL_MS;
      if (ang !== null && selfAlive) this.transport.sendInput(ang, 0);
    }

    // 本机预测 + 他机插值
    if (this._attached) this.predictor.update(dt, ang === null ? undefined : ang);
    r.renderSample(Date.now());
    this._syncSpawner(); // renderSample 会推进流星显示态；spawner 必须每帧跟随

    // 本机 Entry 视图与预测体对齐（名牌/排行榜/小地图读它）
    // colors/segPos 必须拷贝：早期按引用赋值会让视图与预测体共享同一数组，
    // 任一侧被快照覆写都会污染另一侧（见架构文档 §5.4.1「引用隔离」）。
    var e = r.playerEntry;
    if (e && this.predictor.snake) {
      var ps = this.predictor.snake, vs = e.snake;
      vs.x = ps.x; vs.y = ps.y; vs.angle = ps.angle; vs.speed = ps.speed;
      vs.colors = ps.colors.slice();
      vs.segPos = ps.segPos.map(function (p) { return { x: p.x, y: p.y }; });
    }

    // HUD 计分同步（权威在服务器 Entry 上）
    if (e) {
      g.elapsed = r.timeMs;
      g.survivalScore = e.survivalScore || 0;
      g.elimScore = e.elimScore || 0;
      g.mpBonusScore = e.mpBonusScore || 0;
      g.score = g.survivalScore + g.elimScore + g.mpBonusScore;
      // 减速显示：mp.timeMs 域 → game.timeMs 域
      var slowRemain = (e.slowUntil || 0) - r.timeMs;
      g.slowUntil = slowRemain > 0 ? g.timeMs + slowRemain : 0;
    }

    g.updateCamera(dt);
  };

  /**
   * 结算：reason ∈ win/dead/timeout/lose/dropped；掉线判负不重连。
   * 合成 mpResult（renderer.drawMultiResult 直接复用；dropped 额外提示）。
   * teams：团队模式服务器下发的队伍总排行（[{id,rank,score,aliveCount,members}]）。
   */
  OnlineMatch.prototype._finish = function (reason, ranks, dropped, teams) {
    if (this._finished) return;
    this._finished = true;
    var g = this.game, A = CS.audio;
    if (A) { A.stopBgm(); if (!dropped) A.playWall(); }

    // 还在匹配阶段就掉线/出错：回菜单（无对局可结算）。
    // 必须留一条可见提示——静默回菜单会让玩家以为按钮坏了
    //（v3.1 反馈：服务器没开时点「开始匹配」直接弹回主界面、无任何说明）。
    if (g.state === 'matching') {
      var note = (this.status && this.status.indexOf('服务器错误') === 0) ? this.status
        : (dropped ? '无法连接服务器或连接已断开，请稍后重试'
                   : '匹配未完成，请重试（' + (reason || 'unknown') + '）');
      g.menuNotice = { text: note, until: Date.now() + 4000 };
      this.dispose();
      g.online = null;
      g.setState('menu');
      return;
    }

    var e = this.remote && this.remote.playerEntry;
    var myRank = null;
    if (ranks) {
      for (var i = 0; i < ranks.length; i++) {
        if (ranks[i].id === this.playerId) { myRank = ranks[i]; break; }
      }
    }
    var surviveSec = Math.floor((this.remote ? this.remote.timeMs : 0) / 1000);
    var score = g.score;

 *    蛇头表情眼睛朝向移动方向；
 *  - 右侧 HUD 面板：分数/最高/已解锁颜色预览 + 小地图（世界缩略 + 蛇头亮点）；

(function (root) {

  /** 手绘风圆角矩形路径：四角按 (seedX,seedY) 做确定性抖动 */

    ctx.lineTo(x + r + ox(7), y + h + oy(8));

  /**

      { x: -T, y: 0, w: T, h: walls.H },           // 左

    ctx.stroke();

  /**

   */
  /**

   * 统一：先 translate 到块中心 + 脉动缩放，再按 kind 画；白底块一律加粗黑灰描边（浅色场景可见）。

      drawCrayonBlock(ctx, -size / 2, -size / 2, size, '#FFFDF5', seedX, seedY, { rot: rot, wobble: 1.0 });

      drawCrayonBlock(ctx, -size / 2, -size / 2, size, '#FFFDF5', seedX, seedY, { rot: rot, wobble: 1.0 });

      for (var mt = 3; mt >= 1; mt--) {

        ctx.arc(-size * 0.20 * mt, -size * 0.12 * mt, size * (0.30 - 0.05 * mt), 0, Math.PI * 2);
        ctx.fillStyle = mc;

      // 本体：彩色蜡笔砖块
      drawCrayonBlock(ctx, -size / 2, -size / 2, size, mc, seedX, seedY, { rot: 0.2, wobble: 1.0, stroke: cfg.SEG_STROKE });

    } else if (b.kind === 'grab') {
      // 彩色星（多人专属抢夺道具）：金底五角星 + 一圈彩色圆点，最醒目
      starPath(ctx, 0, 0, size * 0.46, 0.3);
      ctx.fillStyle = '#FFD94A'; ctx.fill();
      ctx.strokeStyle = cfg.INK; ctx.lineWidth = Math.max(2, size * 0.12); ctx.stroke();
      var gcols = ['#E8552F', '#F5A623', '#6FBF4A', '#4A7FD4', '#9B5DE5'];
      for (var gi = 0; gi < 5; gi++) {
        var ga = -Math.PI / 2 + gi * (Math.PI * 2 / 5);
        ctx.beginPath();
        ctx.arc(Math.cos(ga) * size * 0.30, Math.sin(ga) * size * 0.30, size * 0.085, 0, Math.PI * 2);
        ctx.fillStyle = gcols[gi]; ctx.fill();
        ctx.strokeStyle = cfg.INK; ctx.lineWidth = 1; ctx.stroke();
      }

    } else {
      // 普通色块（默认）：纯色蜡笔砖块（带描边），即游戏内最常见的色块
      drawCrayonBlock(ctx, -size / 2, -size / 2, size, cfg.COLORS[b.color], seedX, seedY, { rot: rot, wobble: 1.0 });
    }

    // 稀有度边框：在方块外侧加一道明显加粗的彩色描边（强→弱：蓝/紫/橙），一眼可辨道具强度
    var rar = b.rarity || (b.kind && cfg.ITEM_RARITY ? cfg.ITEM_RARITY[b.kind] : null);
    if (rar === 'colorful') {
      // 彩色(抢夺)品质：彩虹环（多圈叠加，最醒目）
      var rainbow = ['#E8552F', '#F5A623', '#6FBF4A', '#4A7FD4', '#9B5DE5'];
      for (var ri = 0; ri < rainbow.length; ri++) {
        wobblyRoundRect(ctx, -size / 2 - 2 - ri * 2.1, -size / 2 - 2 - ri * 2.1,
          size + 4 + ri * 4.2, size + 4 + ri * 4.2, size * 0.40, seedX + ri * 3, seedY + ri * 3, 1.15);
        ctx.strokeStyle = rainbow[ri];
        ctx.lineWidth = Math.max(2.2, size * 0.11);
        ctx.stroke();
      }
    } else if (rar && cfg.RARITY_COLORS && cfg.RARITY_COLORS[rar]) {
      wobblyRoundRect(ctx, -size / 2 - 3, -size / 2 - 3, size + 6, size + 6, size * 0.34, seedX, seedY, 1.1);
      ctx.strokeStyle = cfg.RARITY_COLORS[rar];
      ctx.lineWidth = Math.max(3, size * 0.17);
      ctx.stroke();
    }

    ctx.restore();
  }

  /**
   * 流星砖块：带拖尾的彩色光球（在 drawPlay 已做相机平移的世界坐标系内绘制）。
   * @param {object} m {x,y,color,trail}
   */
  function drawMeteor(ctx, m) {
    // 拖尾：淡淡的运动残影，指示来向
    for (var t = 0; t < m.trail.length; t++) {
      var p = m.trail[t];
      var a = (t + 1) / m.trail.length;
      ctx.beginPath();
      ctx.arc(p.x, p.y, cfg.METEOR_RADIUS * (0.4 + 0.4 * t / m.trail.length), 0, Math.PI * 2);
      ctx.fillStyle = cfg.COLORS[m.color];
      ctx.globalAlpha = a * 0.25;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // 本体：会移动的彩色蜡笔砖块（不是流星光球，就是移动中的砖）
    var size = cfg.METEOR_RADIUS * 2;
    drawCrayonBlock(ctx, m.x - size / 2, m.y - size / 2, size, cfg.COLORS[m.color],
      Math.round(m.x / 10), Math.round(m.y / 10), { rot: 0.2, wobble: 1.0, stroke: cfg.SEG_STROKE });
  }

  /**
   * 尾巴节（v2.3+）：不可消除的尾巴节，一眼可辨「消不掉」。
   * 重做版：主体为深色圆润圆角蜡笔块（与颜色节统一风格，不突兀），
   * 朝外方向再叠一个小小的圆润尾尖（深色小半圆），整体可爱、不像尖三角。
   * @param {number} dx,dy 尾巴朝向单位向量（指向蛇尾外侧）
   */
  function drawTail(ctx, cx, cy, dx, dy, size, seedX, seedY) {
    var jx = (u.hash2(seedX, seedY, 60) - 0.5) * 2.0;
    var jy = (u.hash2(seedY, seedX, 70) - 0.5) * 2.0;
    // 主体：深色圆润圆角块（与颜色节同风格）
    drawCrayonBlock(ctx, cx - size / 2 + jx, cy - size / 2 + jy, size, cfg.TAIL_COLOR, seedX, seedY, {
      rot: (u.hash2(seedX, seedY, 3) - 0.5) * 0.4, wobble: 1.0
    });
    // 朝外小圆润尾尖（短、圆，不突兀）
    var tipX = cx + dx * size * 0.5, tipY = cy + dy * size * 0.5;
    ctx.beginPath();
    ctx.arc(tipX, tipY, size * 0.24, 0, Math.PI * 2);
    ctx.fillStyle = cfg.TAIL_COLOR;
    ctx.fill();
    ctx.strokeStyle = cfg.INK;
    ctx.lineWidth = 1.6;
    ctx.stroke();
  }

  /** 蛇头眼睛（朝向跟随移动方向 dir 单位向量） */
  function drawEyes(ctx, cx, cy, size, dir) {
    var fx = dir.x * size * 0.16, fy = dir.y * size * 0.16;  // 整体朝前移
    var pxp = -dir.y, pyp = dir.x;                            // 垂直方向
    var sep = size * 0.2, r = size * 0.13;
    for (var s = -1; s <= 1; s += 2) {
      var ex = cx + fx + pxp * sep * s;
      var ey = cy + fy + pyp * sep * s;
      ctx.beginPath();
      ctx.arc(ex, ey, r, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFDF5';
      ctx.fill();
      ctx.strokeStyle = cfg.INK;
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(ex + dir.x * r * 0.45, ey + dir.y * r * 0.45, r * 0.45, 0, Math.PI * 2);
      ctx.fillStyle = cfg.INK;
      ctx.fill();
    }
  }

  /** 五角星路径 */
  function starPath(ctx, cx, cy, r, rot) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var rr = i % 2 === 0 ? r : r * 0.45;
      var a = rot + i * Math.PI / 5 - Math.PI / 2;
      var x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  /** 冠军皇冠涂鸦（多人结算第 1 名标题用）：三折尖顶 + 尖顶圆珠 */
  function drawCrown(ctx, cx, cy, w, h) {
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, cy + h / 2);
    ctx.lineTo(cx - w / 2, cy - h * 0.15);
    ctx.lineTo(cx - w * 0.22, cy + h * 0.12);
    ctx.lineTo(cx, cy - h / 2);
    ctx.lineTo(cx + w * 0.22, cy + h * 0.12);
    ctx.lineTo(cx + w / 2, cy - h * 0.15);
    ctx.lineTo(cx + w / 2, cy + h / 2);
    ctx.closePath();
    ctx.fillStyle = '#FFD94A';
    ctx.fill();
    ctx.strokeStyle = cfg.INK;
    ctx.lineWidth = 2.2;
    ctx.stroke();
    var tips = [[cx - w / 2, cy - h * 0.15], [cx, cy - h / 2], [cx + w / 2, cy - h * 0.15]];
    for (var i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(tips[i][0], tips[i][1] - 3, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFDF5';
      ctx.fill();
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
    ctx.restore();
  }

  /**
   * 多人结算统计行的手绘小图标（纯 canvas 涂鸦，不用外部图）。
   * @param {string} kind medal/clock/star/spark/block/burst/snake
   * @param {number} s 图标外接尺寸（px）
   */
  function drawStatIcon(ctx, kind, cx, cy, s) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 2;
    ctx.strokeStyle = cfg.INK;
    if (kind === 'medal') {            // 排名：绶带 + 圆牌奖章
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.26, cy - s * 0.5);
      ctx.lineTo(cx, cy - s * 0.08);
      ctx.lineTo(cx + s * 0.26, cy - s * 0.5);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy + s * 0.16, s * 0.36, 0, Math.PI * 2);
      ctx.fillStyle = '#FFD94A';
      ctx.fill();
      ctx.stroke();
      starPath(ctx, cx, cy + s * 0.16, s * 0.16, 0.3);
      ctx.fillStyle = '#C47F17';
      ctx.fill();
    } else if (kind === 'clock') {     // 存活时间 / 时间分：小闹钟
      ctx.beginPath();
      ctx.arc(cx, cy, s * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFDF5';
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx, cy - s * 0.24);
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + s * 0.18, cy + s * 0.08);
      ctx.stroke();
    } else if (kind === 'star') {      // 总分：大星星
      starPath(ctx, cx, cy, s * 0.48, 0.2);
      ctx.fillStyle = '#FFD94A';
      ctx.fill();
      ctx.stroke();
    } else if (kind === 'spark') {     // 消除分：四角闪光
      ctx.beginPath();
      ctx.moveTo(cx, cy - s * 0.5);
      ctx.quadraticCurveTo(cx, cy, cx + s * 0.5, cy);
      ctx.quadraticCurveTo(cx, cy, cx, cy + s * 0.5);
      ctx.quadraticCurveTo(cx, cy, cx - s * 0.5, cy);
      ctx.quadraticCurveTo(cx, cy, cx, cy - s * 0.5);
      ctx.fillStyle = cfg.COLORS.purple;
      ctx.fill();
      ctx.stroke();
    } else if (kind === 'block') {     // 累计消除方块：蜡笔小方块
      drawCrayonBlock(ctx, cx - s * 0.4, cy - s * 0.4, s * 0.8, cfg.COLORS.teal, 61, 13, { wobble: 0.8 });
    } else if (kind === 'burst') {     // 击杀数：爆炸尖角
      ctx.beginPath();
      for (var i = 0; i < 8; i++) {
        var a = i * Math.PI / 4 - Math.PI / 2;
        var rr = i % 2 === 0 ? s * 0.5 : s * 0.22;
        var px2 = cx + Math.cos(a) * rr, py2 = cy + Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
      }
      ctx.closePath();
      ctx.fillStyle = cfg.COLORS.red;
      ctx.fill();
      ctx.stroke();
    } else if (kind === 'snake') {     // 最终节数：小蛇波浪线 + 头点
      ctx.strokeStyle = cfg.COLORS.green;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.45, cy + s * 0.15);
      ctx.quadraticCurveTo(cx - s * 0.2, cy - s * 0.35, cx + s * 0.05, cy + s * 0.1);
      ctx.quadraticCurveTo(cx + s * 0.25, cy + s * 0.4, cx + s * 0.4, cy - s * 0.05);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx + s * 0.42, cy - s * 0.08, s * 0.15, 0, Math.PI * 2);
      ctx.fillStyle = cfg.COLORS.green;
      ctx.fill();
      ctx.strokeStyle = cfg.INK;
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
    ctx.restore();
  }

  function Renderer(ctx, screenW, screenH) {
    this.ctx = ctx;
    this.W = screenW;
    this.H = screenH;
  }

  Renderer.prototype.resize = function (w, h) {
    this.W = w;
    this.H = h;
    this.applyRelayout();
  };

  /**
   * 响应重排：清空与尺寸/朝向相关的缓存（layoutBus relayout 的订阅入口）。
   * 标题动效状态里存着轨道坐标与蛇身位置，旋转后必须重建，
   * 否则蛇会从旧朝向的位置"飘"到新位置（docs/design §3.8.3-D）。
   */
  Renderer.prototype.applyRelayout = function () {
    this.titleFx = null;
  };

  Renderer.prototype.drawBackground = function () {
    var ctx = this.ctx;
    ctx.fillStyle = cfg.PAPER;
    ctx.fillRect(0, 0, this.W, this.H);
    var tile = getNoiseTile();
    if (tile) {
      for (var x = 0; x < this.W; x += 160) {
        for (var y = 0; y < this.H; y += 160) ctx.drawImage(tile, x, y);
      }
    }
  };

  // ---------------- 对局场景（相机视口区） ----------------

  Renderer.prototype.drawPlay = function (game) {
    var ctx = this.ctx, l = game.layout();
    var walls = game.walls, snake = game.snake, spawner = game.spawner;
    var cam = game.camera;
    var vw = l.viewW, vh = l.viewH;

    ctx.save();
    ctx.beginPath();
    ctx.rect(l.viewX, l.viewY, vw, vh);
    ctx.clip();                              // 世界内容裁剪在视口区
    ctx.translate(l.viewX - cam.x, l.viewY - cam.y); // 视口原点偏移 + 相机变换

    // 世界外区域压暗（衬托可玩范围）
    var M = Math.max(vw, vh) + 80;
    ctx.fillStyle = 'rgba(58,50,56,0.10)';
    ctx.fillRect(-M, -M, walls.W + 2 * M, M);
    ctx.fillRect(-M, walls.H, walls.W + 2 * M, M);
    ctx.fillRect(-M, 0, M, walls.H);
    ctx.fillRect(walls.W, 0, M, walls.H);

    // 视口内的淡墨点阵（运动参照物，帮助感知移动）
    ctx.fillStyle = 'rgba(58,50,56,0.10)';
    var step = 140;
    var x0 = Math.max(0, Math.floor(cam.x / step) * step);
    var y0 = Math.max(0, Math.floor(cam.y / step) * step);
    var x1 = Math.min(walls.W, cam.x + vw);
    var y1 = Math.min(walls.H, cam.y + vh);
    for (var gx = x0; gx <= x1; gx += step) {
      for (var gy = y0; gy <= y1; gy += step) {
        ctx.beginPath();
        ctx.arc(gx, gy, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 边界墙 + 内部墙
    drawBoundary(ctx, walls, cam, vw, vh);
    for (var i = 0; i < walls.rects.length; i++) {
      var r = walls.rects[i];
      if (r.x + r.w < cam.x - 20 || r.x > cam.x + vw + 20 ||
          r.y + r.h < cam.y - 20 || r.y > cam.y + vh + 20) continue; // 视口裁剪
      drawWallRect(ctx, r, i + 11);
    }

    // 道具：普通色块 + 特殊道具（万能色/炸弹/减速/彩色星）；略小、旋转 + 脉动
    var bs = cfg.BLOCK_RADIUS * 2;
    for (i = 0; i < spawner.blocks.length; i++) {
      var b = spawner.blocks[i];
      if (b.x < cam.x - 40 || b.x > cam.x + vw + 40 || b.y < cam.y - 40 || b.y > cam.y + vh + 40) continue;
      // 彩色星（多人专属）比普通色块明显更大，一眼可见
      var bsz = (b.kind === cfg.GRAB_KIND) ? cfg.GRAB_SIZE : bs;
      var pulse = 1 + 0.09 * Math.sin(game.timeMs / 280 + b.phase);
      var seedX = Math.round(b.x / 10), seedY = Math.round(b.y / 10);
      if (b.kind && b.kind !== 'color') {
        drawItemBlock(ctx, b, b.x, b.y, bsz, seedX, seedY, (u.hash2(seedX, seedY, 7) - 0.5) * 0.55, pulse);
      } else {
        drawCrayonBlock(ctx, b.x - bsz / 2, b.y - bsz / 2, bsz, cfg.COLORS[b.color], seedX, seedY, {
          rot: (u.hash2(seedX, seedY, 7) - 0.5) * 0.55,
          scale: pulse,
          wobble: 1.0
        });
      }
    }

    // 流星砖块：带拖尾的彩色光球，从四周飞入命中身体
    for (i = 0; i < spawner.meteors.length; i++) {
      var m = spawner.meteors[i];
      if (m.x < cam.x - 60 || m.x > cam.x + vw + 60 || m.y < cam.y - 60 || m.y > cam.y + vh + 60) continue;
      drawMeteor(ctx, m);
    }

    // 蛇：从尾画到头，头在最上层；节为圆形蜡笔块沿轨迹排布
    // 节间距 SEG_SPACING ≥ 直径+间隙，描边 SEG_STROKE 加粗加深——相邻节一眼可辨、可逐个数清
    // 多人对战：被咬的蛇附带 MP_BITE_FLASH_MS 毫秒的闪白 + 抖动反馈
    var playerFlash = 0;
    if (game.mode === 'multi' && game.mp && game.mp.playerEntry) {
      playerFlash = Math.max(0, game.mp.playerEntry.bittenUntil - game.mp.timeMs);
    }
    // 团队模式：按队伍号给蛇头描队伍色环（便于分辨敌我）
    var teamMode = game.mode === 'multi' && game.mp && game.mp.mode === 'team';
    var myTeamColor = teamMode ? cfg.teamColor(game.myTeam) : null;
    this.drawSnakeBody(snake, cam, vw, vh, 200, playerFlash, myTeamColor);
    // 多人对战：AI 蛇（同一套蜡笔渲染）+ 头顶昵称标签
    if (game.mode === 'multi' && game.mp) {
      var bots = game.mp.bots;
      for (i = 0; i < bots.length; i++) {
        if (!bots[i].alive) continue;
        var botFlash = Math.max(0, bots[i].bittenUntil - game.mp.timeMs);
        var botTeamColor = teamMode ? cfg.teamColor(bots[i].teamId >= 0 ? bots[i].teamId : -1) : null;
        this.drawSnakeBody(bots[i].snake, cam, vw, vh, 200 + bots[i].id * 131, botFlash, botTeamColor);
      }
      this.drawNameLabels(game, cam, vw, vh);
    }

    // 粒子（世界坐标，随相机）
    this.drawParticles(game);

    ctx.restore();
  };

  /**
   * 画一条蛇的身体（玩家/AI 共用）：seedBase 区分不同蛇的手绘抖动种子。
   * segPos 比 colors 多 1 节：末尾恒为尾巴节（v2.3），画成深色蜡笔小尾鳍，
   * 一眼可辨"这节消不掉"；尾巴节不做闪白覆盖（不可被咬），但随全蛇一起抖动。
   * @param {number} flashMs 被咬反馈剩余毫秒（>0 时全节闪白 + 抖动，幅度随剩余时间衰减）
   */
  Renderer.prototype.drawSnakeBody = function (snake, cam, vw, vh, seedBase, flashMs, teamColor) {
    var ctx = this.ctx;
    var ss = cfg.SEG_RADIUS * 2;
    var n = snake.segPos.length; // = colors.length + 1（末尾为尾巴节）
    var shake = flashMs > 0 ? Math.min(1, flashMs / cfg.MP_BITE_FLASH_MS) : 0;
    var tb = Math.floor((flashMs || 0) / 45); // 抖动时间桶：每 45ms 换一组确定性偏移
    for (var i = n - 1; i >= 0; i--) {
      var p = snake.segPos[i];
      var ox2 = 0, oy2 = 0;
      if (shake > 0) { // 被咬抖动（种子含时间桶，画面抖动但不随机闪烁）
        ox2 = (u.hash2(i + seedBase, tb, 91) - 0.5) * 7 * shake;
        oy2 = (u.hash2(tb, i + seedBase, 92) - 0.5) * 7 * shake;
      }
      var px = p.x + ox2, py = p.y + oy2;
      if (px < cam.x - 60 || px > cam.x + vw + 60 || py < cam.y - 60 || py > cam.y + vh + 60) continue;
      if (snake.colors[i] === 'wild') { // 万能色节：白底星标块（消除时通配任意相邻同色）
        ctx.save();
        ctx.translate(px - ss / 2, py - ss / 2);
        drawWildSeg(ctx, 0, 0, ss, seedBase + i, 41);
        ctx.restore();
        if (shake > 0) {
          ctx.save();
          ctx.globalAlpha = 0.6 * shake;
          ctx.save();
          ctx.translate(px - ss / 2, py - ss / 2);
          drawWildSeg(ctx, 0, 0, ss, seedBase + i, 41);
          ctx.restore();
          ctx.restore();
        }
        if (i === 0) drawEyes(ctx, px, py, ss, snake.headDir());
        if (teamColor && i === 0) { // 团队模式：蛇头描一圈队伍色环，便于分辨敌我
          ctx.save();
          ctx.strokeStyle = teamColor;
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.arc(px, py, ss * 0.62, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
        continue;
      }
      // 正常情况下 colors 至少有 MIN_LENGTH 节；若异常/降级快照只剩 segPos[0]，
      // i=0 仍必须按“头”画，不能因为 0 >= colors.length 就误画成无眼睛的尾巴。
      if (i > 0 && i >= snake.colors.length) { // 尾巴节：深色圆润圆块 + 小尾尖，朝向 = 前一节 → 尾巴节
        var prev = snake.segPos[i - 1] ||
          { x: p.x - Math.cos(snake.angle) * cfg.SEG_SPACING, y: p.y - Math.sin(snake.angle) * cfg.SEG_SPACING };
        var tdx = p.x - prev.x, tdy = p.y - prev.y;
        var tl = Math.sqrt(tdx * tdx + tdy * tdy) || 1;
        drawTail(ctx, px, py, tdx / tl, tdy / tl, ss, seedBase + i, 43);
        continue;
      }
      var rot = (u.hash2(i, 77, 3) - 0.5) * 0.5;
      var wob = i === 0 ? 0.8 : 1.2;
      var color = cfg.COLORS[snake.colors[i]] || cfg.COLORS[cfg.COLOR_KEYS[0]] || '#E8552F';
      drawCrayonBlock(ctx, px - ss / 2, py - ss / 2, ss, color, seedBase + i, 41, {
        rot: rot, wobble: wob, stroke: cfg.SEG_STROKE
      });
      if (shake > 0) { // 闪白覆盖（纸白蜡笔块，透明度随剩余时间衰减）
        ctx.save();
        ctx.globalAlpha = 0.6 * shake;
        drawCrayonBlock(ctx, px - ss / 2, py - ss / 2, ss, '#FFFDF5', seedBase + i, 41, {
          rot: rot, wobble: wob, stroke: cfg.SEG_STROKE
        });
        ctx.restore();
      }
      if (i === 0) drawEyes(ctx, px, py, ss, snake.headDir());
      if (teamColor && i === 0) { // 团队模式：蛇头描一圈队伍色环，便于分辨敌我
        ctx.save();
        ctx.strokeStyle = teamColor;
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(px, py, ss * 0.62, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }
  };

  /** 多人对战：头顶昵称小手绘标签（深色描边文字，无底板；玩家标签为「我」，蜡笔黄） */
  Renderer.prototype.drawNameLabels = function (game, cam, vw, vh) {
    var ctx = this.ctx;
    var es = game.mp.allEntries();
    var teamMode = game.mp.mode === 'team';
    var myTeam = game.myTeam;
    ctx.save();
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.lineJoin = 'round';
    for (var i = 0; i < es.length; i++) {
      var e = es[i];
      if (!e.alive) continue;
      var hx = e.snake.x, hy = e.snake.y - cfg.SEG_RADIUS - 8;
      if (hx < cam.x - 40 || hx > cam.x + vw + 40 || hy < cam.y - 40 || hy > cam.y + vh + 40) continue;
      // 团队模式：名牌用队伍色；同队非本人追加「(队友)」标识
      var label = e.name;
      if (teamMode && e.teamId >= 0 && e.teamId === myTeam && !e.isPlayer) label = e.name + '(队友)';
      var fill;
      if (e.isPlayer) fill = '#FFD94A';
      else if (teamMode && e.teamId >= 0) fill = cfg.teamColor(e.teamId);
      else fill = '#FFFDF5';
      ctx.lineWidth = 3;
      ctx.strokeStyle = cfg.INK;
      ctx.strokeText(label, hx, hy);
      ctx.fillStyle = fill;
      ctx.fillText(label, hx, hy);
    }
    ctx.restore();
  };

  // ---------------- 粒子 ----------------

  Renderer.prototype.drawParticles = function (game) {
    var ctx = this.ctx;
    for (var i = 0; i < game.particles.list.length; i++) {
      var p = game.particles.list[i];
      var t = p.life / p.maxLife; // 1 → 0
      if (p.type === 'crumb') {
        ctx.save();
        ctx.globalAlpha = Math.min(1, t * 1.6);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
        ctx.strokeStyle = cfg.INK;
        ctx.lineWidth = 0.8;
        ctx.strokeRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
        ctx.restore();
      } else if (p.type === 'star') {
        var prog = 1 - t;
        var sc = p.scale || 1; // 连锁逐级放大
        ctx.save();
        ctx.globalAlpha = t;
        starPath(ctx, p.x, p.y, (8 + prog * 34) * sc, prog * 0.6);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.strokeStyle = cfg.INK;
        ctx.lineWidth = 1.6 * Math.min(sc, 1.6);
        ctx.stroke();
        ctx.restore();
      } else if (p.type === 'text') {
        // 连锁文字：手绘风「N连锁！」，深色描边 + 蜡笔黄填充，上飘淡出
        ctx.save();
        ctx.globalAlpha = Math.min(1, t * 2.2); // 短暂停留，末尾淡出
        ctx.font = 'bold ' + Math.round(p.size) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.lineWidth = Math.max(3, p.size * 0.16);
        ctx.strokeStyle = cfg.INK;
        ctx.strokeText(p.text, p.x, p.y);
        ctx.fillStyle = '#FFD94A';
        ctx.fillText(p.text, p.x, p.y);
        ctx.restore();
      } else if (p.type === 'ring') {
        // 消除高亮：扩张圆环 + 中心 ✕，标出被消除节位置（非连续消除也清楚可见）
        var prog = 1 - t; // 0 → 1
        ctx.save();
        ctx.globalAlpha = Math.min(1, t * 1.5);
        var sc = p.scale || 1;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(2, 3 * (1 - prog) + 1.5);
        ctx.beginPath();
        ctx.arc(p.x, p.y, (5 + prog * 30) * sc, 0, Math.PI * 2);
        ctx.stroke();
        var s = 6 * sc;
        ctx.lineWidth = Math.max(1.5, 2 * sc);
        ctx.beginPath();
        ctx.moveTo(p.x - s, p.y - s); ctx.lineTo(p.x + s, p.y + s);
        ctx.moveTo(p.x + s, p.y - s); ctx.lineTo(p.x - s, p.y + s);
        ctx.stroke();
        ctx.restore();
      } else if (p.type === 'streak') {
        // 自吃牵引线：从身体接触点拉向蛇头，表达「砖块被吸到头部」
        ctx.save();
        ctx.globalAlpha = Math.min(1, t * 1.8);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(2.5, 4 * t + 1);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.x1, p.y1);
        ctx.lineTo(p.x2, p.y2);
        ctx.stroke();
        // 头部端的箭头小三角（指示被拉过去的方向）
        var ang = Math.atan2(p.y2 - p.y1, p.x2 - p.x1);
        var ah = 7;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(p.x2, p.y2);
        ctx.lineTo(p.x2 - Math.cos(ang - 0.4) * ah, p.y2 - Math.sin(ang - 0.4) * ah);
        ctx.lineTo(p.x2 - Math.cos(ang + 0.4) * ah, p.y2 - Math.sin(ang + 0.4) * ah);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }
  };

  // ---------------- 小地图 ----------------

  /** HUD 内小地图：世界边界、墙、色块、视口框、蛇头亮点 */
  Renderer.prototype.drawMinimap = function (game, mx, my, mw) {
    var ctx = this.ctx, walls = game.walls;
    var scale = mw / walls.W;
    var mh = walls.H * scale;

    // 底
    wobblyRoundRect(ctx, mx, my, mw, mh, 4, 17, 29, 1.0);
    ctx.fillStyle = '#F3ECDD';
    ctx.fill();
    ctx.save();
    ctx.clip();

    // 边界墙带（与世界内一致的排线墙样式：灰底 + 斜线排线 + 细描边）
    var bt = Math.max(2.5, cfg.WALL_THICK * scale);
    var strips = [
      { x: mx, y: my, w: mw, h: bt },            // 上
      { x: mx, y: my + mh - bt, w: mw, h: bt },  // 下
      { x: mx, y: my, w: bt, h: mh },            // 左
      { x: mx + mw - bt, y: my, w: bt, h: mh }   // 右
    ];
    for (i = 0; i < 4; i++) {
      var st = strips[i];
      ctx.fillStyle = cfg.WALL_FILL;
      ctx.fillRect(st.x, st.y, st.w, st.h);
      ctx.save();
      ctx.beginPath();
      ctx.rect(st.x, st.y, st.w, st.h);
      ctx.clip();
      ctx.strokeStyle = 'rgba(58,50,56,0.45)';
      ctx.lineWidth = 0.7;
      for (var d = -st.h; d < st.w + st.h; d += 4) {
        ctx.beginPath();
        ctx.moveTo(st.x + d, st.y + st.h + 1);
        ctx.lineTo(st.x + d + st.h + 2, st.y - 1);
        ctx.stroke();
      }
      ctx.restore();
      ctx.strokeStyle = cfg.INK;
      ctx.lineWidth = 0.8;
      ctx.strokeRect(st.x, st.y, st.w, st.h);
    }

    // 内部墙
    ctx.fillStyle = 'rgba(58,50,56,0.5)';
    for (var i = 0; i < walls.rects.length; i++) {
      var r = walls.rects[i];
      ctx.fillRect(mx + r.x * scale, my + r.y * scale, Math.max(1.5, r.w * scale), Math.max(1.5, r.h * scale));
    }
    // 色块（彩色星用金色大点，普通色块用本色小点）
    for (i = 0; i < game.spawner.blocks.length; i++) {
      var b = game.spawner.blocks[i];
      if (b.kind === cfg.GRAB_KIND) continue; // 彩色星单独画（带一圈圈涟漪强调）
      ctx.fillStyle = cfg.COLORS[b.color] || '#8A8278';
      ctx.fillRect(mx + b.x * scale - 1, my + b.y * scale - 1, 2.5, 2.5);
    }
    // 视口框
    var l = game.layout();
    ctx.strokeStyle = 'rgba(58,50,56,0.45)';
    ctx.lineWidth = 1;
    ctx.strokeRect(mx + game.camera.x * scale, my + game.camera.y * scale,
      l.viewW * scale, l.viewH * scale);
    // 多人对战：AI 蛇亮点（各自头部颜色小点），画在玩家亮点下层
    if (game.mode === 'multi' && game.mp) {
      var bots = game.mp.bots;
      for (var bi = 0; bi < bots.length; bi++) {
        if (!bots[bi].alive) continue;
        var bsn = bots[bi].snake;
        ctx.beginPath();
        ctx.arc(mx + bsn.x * scale, my + bsn.y * scale, 2.2, 0, Math.PI * 2);
        ctx.fillStyle = cfg.COLORS[bsn.headColor()] || '#8A8278';
        ctx.fill();
      }
    }
    // 蛇头亮点（描边高光点，大地图里一眼定位）
    var hx = mx + game.snake.x * scale, hy = my + game.snake.y * scale;
    ctx.beginPath();
    ctx.arc(hx, hy, 3.2, 0, Math.PI * 2);
    ctx.fillStyle = '#FFD94A';
    ctx.fill();
    ctx.strokeStyle = cfg.INK;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    // 彩色星（多人专属抢夺道具）：金色大点 + 一圈圈扩散涟漪，强调位置引诱全场抢夺
    if (game.spawner && game.spawner.grabBlock) {
      var gb = game.spawner.grabBlock;
      var gx = mx + gb.x * scale, gy = my + gb.y * scale;
      var gcols = ['#E8552F', '#F5A623', '#6FBF4A', '#4A7FD4', '#9B5DE5'];
      var gt = game.timeMs / 1000;
      for (var gri = 0; gri < 3; gri++) {
        var gph = (gt * 0.9 + gri / 3) % 1;          // 0→1 循环扩散
        ctx.beginPath();
        ctx.arc(gx, gy, 3 + gph * 24, 0, Math.PI * 2);
        ctx.strokeStyle = gcols[gri % gcols.length];
        ctx.globalAlpha = (1 - gph) * 0.9;
        ctx.lineWidth = 1.7;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(gx, gy, 3.6, 0, Math.PI * 2);
      ctx.fillStyle = '#FFD94A'; ctx.fill();
      ctx.strokeStyle = cfg.INK; ctx.lineWidth = 1.1; ctx.stroke();
    }
    ctx.restore();

    // 外框
    wobblyRoundRect(ctx, mx, my, mw, mh, 4, 17, 29, 1.0);
    ctx.strokeStyle = cfg.INK;
    ctx.lineWidth = 1.6;
    ctx.stroke();
    return mh;
  };

  // ---------------- HUD 面板（横屏右侧竖条 / 竖屏顶部横条） ----------------

  /**
   * 横屏 HUD：右侧竖条。
   *
   * **纵向流式布局（v3.0.3）**：原实现是固定像素堆叠（标题 y=24、分数 y=100、
   * 小地图 y=372…），到小地图之前就已占用 372px，而手机横屏可视高度只有 360~390px
   * → 小地图被切掉一截（用户报告）。现改为「按可用高度算紧凑系数 k」的流式布局：
   * 先累计所有区块的理想高度，超出可用高度就整体压缩行距/字号，并按优先级
   * 丢弃低价值区块（操作提示 → 分数构成 → 已解锁颜色标题），保证
   * **小地图这类关键信息永远完整可见**（docs/design §3.8.1）。
   */
  Renderer.prototype.drawPanel = function (game) {
    var l = game.layout();
    if (l.portrait) { this.drawPanelPortrait(game, l); return; }
    var ctx = this.ctx;
    var px = l.panelX, pw = l.panelW, H = this.H;
    var cx = px + pw / 2;
    var inset = game.safeInsets ? game.safeInsets() : { top: 0, right: 0, bottom: 0, left: 0 };

    var isMulti = (game.mode === 'multi' && game.mp);
    var lb = isMulti ? game.mp.leaderboard() : null;
    var lbRows = lb ? Math.min(lb.length, 6) : 0;
    var ratio = game.walls.H / game.walls.W;

    // ---- 纵向预算：先按理想尺寸估总高，再算紧凑系数 ----
    var top = 16 + inset.top;
    var bottomLimit = H - 10 - inset.bottom;
    var availH = bottomLimit - top;

    // 各区块理想高度（与下方绘制顺序一一对应）
    var idealMapW = pw - 28;
    var blocks = {
      header: 46,                       // 标题 + 模式
      // 传输通道诊断：三行 = 协议 + RTT/丢帧（或 TCP 迟到率）+ 上下行流量。
      // 只在服务器下发 debugHud 的环境显示（dev）；official 为 0，不占预算。
      channel: (game.mode === 'multi' && game.online && game.online.debugHud) ? 42 : 0,
      score: 54,                        // 「分数」标签 + 大号分数
      target: 26,                       // 最高/最佳成绩行
      detail: 34,                       // 分数构成 + 速度
      board: lbRows ? (18 + lbRows * 16) : 0,
      colors: 18 + 2 * 27,              // 「已解锁颜色」标题 + 4x2 色格
      map: 16 + idealMapW * ratio,      // 「小地图」标题 + 本体
      hint: 38                          // 底部操作提示
    };
    var order = ['header', 'channel', 'score', 'target', 'detail', 'board', 'colors', 'map', 'hint'];
    function total(bs) {
      var s = 0;
      for (var i = 0; i < order.length; i++) s += bs[order[i]] || 0;
      return s;
    }
    // 优先级从低到高丢弃（小地图、分数、通道诊断永不丢）。
    // 用户反馈手机端完全看不到协议，根因就是曾把 channel 放进此列表。
    var droppable = ['hint', 'detail', 'colors'];
    var dropped = {};
    var need = total(blocks);
    for (var di = 0; di < droppable.length && need > availH; di++) {
      dropped[droppable[di]] = true;
      blocks[droppable[di]] = 0;
      need = total(blocks);
    }
    // 仍超出 → 压缩：先缩小地图（它占比最大），再整体缩行距
    if (need > availH) {
      var others = need - blocks.map;
      var mapRoom = Math.max(40, availH - others - 16);
      idealMapW = Math.max(48, Math.min(idealMapW, Math.floor(mapRoom / ratio)));
      blocks.map = 16 + idealMapW * ratio;
      need = total(blocks);
    }
    var k = need > availH ? Math.max(0.6, availH / need) : 1; // 行距压缩系数
    var showMap = idealMapW >= 48;

    ctx.save();
    // 面板底：略亮纸色 + 左侧手绘分隔线
    ctx.fillStyle = 'rgba(255,253,245,0.72)';
    ctx.fillRect(px, 0, pw, H);
    ctx.strokeStyle = 'rgba(58,50,56,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    var seg = 10;
    for (var i = 0; i <= seg; i++) {
      var ly = H * i / seg;
      var lx = px + (u.hash2(i, 7, 3) - 0.5) * 5;
      if (i === 0) ctx.moveTo(lx, ly); else ctx.lineTo(lx, ly);
    }
    ctx.stroke();

    ctx.fillStyle = cfg.INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    var y = top;                                    // 流式游标
    function adv(px2) { y += px2 * k; }             // 按紧凑系数推进

    // ---- 标题 + 模式 ----
    ctx.font = 'bold ' + Math.round(15 * Math.min(1, k + 0.15)) + 'px sans-serif';
    ctx.fillText('消食蛇', cx, y + 8);
    adv(24);
    ctx.font = Math.round(12 * Math.min(1, k + 0.2)) + 'px sans-serif';
    ctx.globalAlpha = 0.75;
    var modeText = game.mode === 'multi' ? (game.online ? '在线对战 · 真人匹配' : 'AI对战 · 7 蛇同场') : '无尽模式';
    ctx.fillText(modeText, cx, y + 6);
    ctx.globalAlpha = 1;
    adv(22);

    // ---- 传输通道（仅在线对战）----
    //
    // 加速通道是静默降级的：打不通就走 wss，玩家无感。产品行为是对的，
    // 但代价是「有没有吃到 UDP 收益」完全不可观测 —— 网页版曾整个阶段
    // 都在走 wss+JSON 而无人察觉。所以这行必须在正常界面上就能看到，
    // 不能只藏在控制台里。
    //
    // 配色按「实际生效的传输质量」区分，不按「有没有报错」：
    // 走加速通道 = 墨绿，回落 TCP = 赭红（不是错误，但确实没吃到收益）。
    // 取深色调是因为面板底是米白纸色（rgba(255,253,245,.72)），
    // 亮色荧光调在这上面几乎看不见。
    // 诊断行只在服务器允许的环境显示（dev 开 / official 关，matched.debugHud 下发）。
    // official 面向真实玩家：协议/RTT/流量是工程诊断信息，不应出现在正式界面。
    if (game.mode === 'multi' && game.online && game.online.channel && game.online.debugHud) {
      var ch = game.online.channel;
      var accel = (ch.kind !== 'tcp');
      var ni = typeof game.online.netInfoHud === 'function' ? game.online.netInfoHud()
        : (typeof game.online.netInfo === 'function' ? game.online.netInfo() : null);
      ctx.font = 'bold ' + Math.round(10 * Math.min(1, k + 0.2)) + 'px sans-serif';
      ctx.fillStyle = accel ? '#2e7d6b' : '#a5592b';
      var chText = accel
        ? (ch.kind === 'wt' ? 'WebTransport · UDP' : '裸 UDP')
        : 'TCP · wss';
      // 中途降级过要显式标出来：只看当前状态会漏掉「开局是 UDP、后来掉了」
      if (ch.switches > 1) chText += '（切换 ' + ch.switches + ' 次）';
      ctx.fillText(chText, cx, y + 4);
      adv(14);

      ctx.font = Math.round(9 * Math.min(1, k + 0.2)) + 'px sans-serif';
      ctx.globalAlpha = 0.78;
      var rtt = ni ? (accel ? ni.加速通道延迟ms : ni.WSS延迟ms) : 0;
      var qText = accel
        ? ('RTT ' + (rtt || '--') + 'ms · 丢 ' + (ni ? ni.逻辑帧丢失率 : 0) + '%')
        : ('RTT ' + (rtt || '--') + 'ms · 迟到 ' + (ni ? ni.快照迟到率 : 0) + '%');
      ctx.fillText(qText, cx, y + 3);
      adv(12);
      // 流量速率：netInfo 内部按 1 秒窗口采样，这里读到的就是每秒跳变一次的值
      ctx.fillText('↓' + (ni ? ni.下行KBs : 0) + ' ↑' + (ni ? ni.上行KBs : 0) + ' KB/s', cx, y + 2);
      ctx.globalAlpha = 1;
      ctx.fillStyle = cfg.INK;   // 必须还原成墨色：面板是浅底，白字会看不见
      adv(16);
    }

    // ---- 分数 ----
    ctx.font = '11px sans-serif';
    ctx.globalAlpha = 0.6;
    ctx.fillText('分数', cx, y + 6);
    ctx.globalAlpha = 1;
    adv(18);
    ctx.font = 'bold ' + Math.round(28 * Math.min(1, k + 0.1)) + 'px sans-serif';
    ctx.fillText(String(game.score), cx, y + 12);
    adv(36);

    // ---- 最高 / 最佳成绩 ----
    ctx.font = 'bold 13px sans-serif';
    if (game.mode === 'multi') {
      ctx.fillText('最佳 ' + Math.max(game.mpBest.len, game.snake.length()) + '节 · ' +
        Math.max(game.mpBest.score, game.score) + '分', cx, y + 6);
      adv(26);
    } else {
      ctx.fillText('最高 ' + Math.max(game.best, game.score), cx, y + 6);
      adv(26);
    }

    // ---- 分数构成 + 速度（矮屏可丢）----
    if (!dropped.detail) {
      ctx.font = '10px sans-serif';
      ctx.globalAlpha = 0.6;
      ctx.fillText('存活 ' + game.survivalScore + ' · 消除 ' + game.elimScore, cx, y + 5);
      adv(16);
      var spd = Math.round(game.currentSpeed());
      var slow = (game.slowUntil && game.timeMs < game.slowUntil);
      ctx.fillStyle = slow ? '#2EC4B6' : cfg.INK;
      ctx.fillText('速度 ' + spd + (slow ? ' (减速)' : '') + ' px/s', cx, y + 5);
      ctx.fillStyle = cfg.INK;
      ctx.globalAlpha = 1;
      adv(18);
    }

    // ---- 排行榜（多人；行高随紧凑系数收缩）----
    if (lbRows) {
      ctx.font = '11px sans-serif';
      ctx.globalAlpha = 0.6;
      ctx.fillText('排行榜', cx, y + 5);
      ctx.globalAlpha = 1;
      adv(16);
      var rowH = Math.max(12, Math.round(16 * k));
      for (var li = 0; li < lbRows; li++) {
        var row = lb[li];
        var rowY = y + rowH * li + rowH / 2;
        ctx.globalAlpha = row.isPlayer ? 1 : 0.8;
        ctx.fillStyle = row.isPlayer ? '#C47F17' : cfg.INK;
        ctx.font = (row.isPlayer ? 'bold ' : '') + '11px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText((li + 1) + '. ' + row.name, px + 14, rowY);
        ctx.textAlign = 'right';
        ctx.fillText(row.length + '节', px + pw - 14, rowY);
        ctx.textAlign = 'center';
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = cfg.INK;
      y += rowH * lbRows + 4 * k;
    }

    // ---- 已解锁颜色（4x2；矮屏可丢）----
    if (!dropped.colors) {
      ctx.font = '11px sans-serif';
      ctx.globalAlpha = 0.6;
      ctx.fillText('已解锁颜色', cx, y + 5);
      ctx.globalAlpha = 1;
      adv(16);
      var sw = 20, gap = 7, cols = 4;
      var gridW = cols * sw + (cols - 1) * gap;
      var sx = cx - gridW / 2;
      for (i = 0; i < cfg.MAX_COLORS; i++) {
        var col = i % cols, row2 = Math.floor(i / cols);
        var bx2 = sx + col * (sw + gap), by2 = y + row2 * (sw + gap);
        if (i < game.unlockedCount) {
          drawCrayonBlock(ctx, bx2, by2, sw, cfg.COLORS[cfg.COLOR_KEYS[i]], 30 + i, 4, {
            rot: (u.hash2(i, 5, 2) - 0.5) * 0.3, wobble: 0.9
          });
        } else {
          ctx.save();
          ctx.globalAlpha = 0.45;
          wobblyRoundRect(ctx, bx2, by2, sw, sw, sw * 0.28, 30 + i, 4, 0.9);
          ctx.fillStyle = '#CFC8BC';
          ctx.fill();
          ctx.strokeStyle = cfg.INK;
          ctx.lineWidth = 1.2;
          ctx.stroke();
          ctx.beginPath(); // 锁定叉号
          ctx.moveTo(bx2 + sw * 0.3, by2 + sw * 0.3);
          ctx.lineTo(bx2 + sw * 0.7, by2 + sw * 0.7);
          ctx.moveTo(bx2 + sw * 0.7, by2 + sw * 0.3);
          ctx.lineTo(bx2 + sw * 0.3, by2 + sw * 0.7);
          ctx.stroke();
          ctx.restore();
        }
      }
      y += 2 * (sw + gap) + 12 * k;
    }

    // ---- 小地图（关键信息：优先保证完整可见，必要时缩小）----
    if (showMap) {
      // 若剩余高度不够，就地再缩一次（例如排行榜行数多于预估）
      var room = bottomLimit - y - 16;
      var mw = idealMapW;
      if (mw * ratio > room) mw = Math.max(48, Math.floor(room / ratio));
      if (mw >= 48) {
        ctx.font = '11px sans-serif';
        ctx.globalAlpha = 0.6;
        ctx.fillText('小地图', cx, y + 5);
        ctx.globalAlpha = 1;
        y += 14;
        this.drawMinimap(game, cx - mw / 2, y, mw); // 居中（缩窄后不再左贴边）
        y += mw * ratio;
      }
    }

    // ---- 底部操作提示（矮屏可丢；仅在确实还有空间时画）----
    if (!dropped.hint && y < H - 46 - inset.bottom) {
      ctx.font = '11px sans-serif';
      ctx.globalAlpha = 0.55;
      ctx.fillText('方向键 / WASD 转向', cx, H - 44 - inset.bottom);
      ctx.fillText('或按住左下摇杆拖动', cx, H - 26 - inset.bottom);
    }
    ctx.restore();
  };

  /**
   * 竖屏 HUD：顶部横条（v3.0.5 三行流式，见 docs/design §3.8.3-C）。
   *
   * 旧实现是**固定三栏**（左 132px + 中 + 右 96px）：390px 宽下中栏只剩 122px，
   * 而「已解锁颜色」单行 8 格需 168px → 溢出并与排行榜叠在一起。
   * 现改为三行，每行的 x 起点都由**剩余可用宽度**推导，并按优先级丢弃低价值内容。
   *
   * 行 1：模式 + 大号分数 + 目标/最佳（右端固定正方形小地图，跨全部行）
   * 行 2：已解锁颜色格 + 速度
   * 行 3：排行榜（横排，放不下则换行，最多 2 行）
   */
  Renderer.prototype.drawPanelPortrait = function (game, l) {
    var ctx = this.ctx;
    var pw = l.panelW, ph = l.panelH;
    var inset = game.safeInsets ? game.safeInsets() : { top: 0, left: 0, right: 0, bottom: 0 };
    // 三行按面板实际高度铺开（不是从顶部堆到 76px 就不管了 —— 那会让下方一大片空着，
    // 且第 1 行贴顶被裁）。上下各留 pad，行距由剩余高度均分。
    var padT = 10 + inset.top, padB = 10;
    var top = padT;
    // 右边距要给 wobblyRoundRect 的手绘抖动留余量（它会向外溢出 2~3px），否则边框被裁
    var padL = 12 + inset.left, padR = 16 + inset.right;
    var bodyH = Math.max(40, ph - padT - padB);
    var i;

    ctx.save();
    // 面板底 + 底部手绘分隔线（横屏是左侧竖线，这里改成下边横线）
    ctx.fillStyle = 'rgba(255,253,245,0.72)';
    ctx.fillRect(0, 0, pw, ph);
    ctx.strokeStyle = 'rgba(58,50,56,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    var seg = 12;
    for (i = 0; i <= seg; i++) {
      var lx = pw * i / seg;
      var ly = ph + (u.hash2(i, 7, 3) - 0.5) * 5;
      if (i === 0) ctx.moveTo(lx, ly); else ctx.lineTo(lx, ly);
    }
    ctx.stroke();

    ctx.fillStyle = cfg.INK;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';

    // ---- 右端：小地图（drawMinimap 的第 4 参是**宽度**，高度按地图宽高比派生，不是正方形）----
    var mapRatio = game.walls ? (game.walls.H / game.walls.W) : 0.66;
    var mapW = Math.min(pw * 0.30, 120);
    if (mapW * mapRatio > bodyH) mapW = bodyH / mapRatio;   // 高度不够 → 反推宽度
    var mapH = mapW * mapRatio;
    var mapX = pw - padR - mapW;
    var showMap = mapW >= 44 && mapX > pw * 0.45;   // 太窄就不画，让位给文字
    if (showMap) {
      this.drawMinimap(game, mapX, padT + (bodyH - mapH) / 2, mapW);
    } else {
      mapX = pw - padR;                                // 无小地图时正文可用到右边距
    }
    var textR = mapX - 10;                             // 文本区右边界
    var availW = textR - padL;

    // 三行的基线：按内容实际高度分配（行 1 有 24px 大号分数，需要最多空间）。
    // 用固定的"内容高度"而非均分 —— 均分会让行 1 顶边贴到面板上沿。
    var H1 = 26, H2 = 18, H3 = 32;                     // 各行实际占用高度
    var slack = Math.max(0, bodyH - (H1 + H2 + H3)) / 3; // 富余高度均分为行间距
    var y1 = padT + H1 / 2 + slack * 0.4;
    var y2 = y1 + H1 / 2 + slack * 0.8 + H2 / 2;
    var y3base = y2 + H2 / 2 + slack * 0.8 + 6;
    ctx.font = 'bold 12px sans-serif';
    var modeText = game.mode === 'multi' ? (game.online ? '在线对战' : 'AI对战') : '无尽模式';
    ctx.globalAlpha = 0.8;
    ctx.fillText(modeText, padL, y1);
    var xCur = padL + ctx.measureText(modeText).width + 14;
    ctx.globalAlpha = 1;

    // 大号分数紧跟模式之后
    ctx.font = 'bold 24px sans-serif';
    var scoreStr = String(game.score);
    ctx.fillText(scoreStr, xCur, y1 + 2);
    xCur += ctx.measureText(scoreStr).width + 12;

    // 目标 / 最高分：剩余宽度够才画（低优先级）
    ctx.font = 'bold 11px sans-serif';
    var infoText = game.mode === 'multi'
      ? ('最佳 ' + Math.max(game.mpBest.len, game.snake ? game.snake.length() : 0) + '节')
      : ('最高 ' + Math.max(game.best, game.score));
    ctx.globalAlpha = 0.7;
    if (xCur + ctx.measureText(infoText).width <= textR) ctx.fillText(infoText, xCur, y1 + 4);
    ctx.globalAlpha = 1;

    // ---- 行 2：在线时固定显示协议/网络质量；单机时显示颜色格。速度始终保留 ----
    var spd = Math.round(game.currentSpeed());
    var slow = (game.slowUntil && game.timeMs < game.slowUntil);
    var spdText = '速度 ' + spd + (slow ? ' (减速)' : '');
    ctx.font = '10px sans-serif';
    var spdW = ctx.measureText(spdText).width;
    if (game.mode === 'multi' && game.online && game.online.debugHud &&
        typeof game.online.netSummary === 'function') {
      // 竖屏旧实现完全没有通道行；手机上因此看不到协议。网络诊断优先于颜色格，
      // 直接占用行 2 左侧，且不参与「空间不足就丢弃」逻辑。
      // 仅 dev 环境显示（debugHud 由服务器 matched 下发）；official 回落到颜色格。
      var netText = game.online.netSummary();
      var maxNetW = Math.max(60, availW - spdW - 12);
      while (netText.length > 4 && ctx.measureText(netText).width > maxNetW) {
        netText = netText.slice(0, -1);
      }
      ctx.fillStyle = game.online.channel.kind === 'tcp' ? '#a5592b' : '#2e7d6b';
      ctx.font = 'bold 10px sans-serif';
      ctx.fillText(netText, padL, y2);
      ctx.fillStyle = cfg.INK;
    } else {
      var sw = 15, gap = 4;
      // 颜色格能画几个：留出速度文字的位置（速度优先级高于颜色格）
      var gridRoom = availW - spdW - 12;
      var maxCells = Math.max(0, Math.floor((gridRoom + gap) / (sw + gap)));
      var cells = Math.min(cfg.MAX_COLORS, maxCells);
      var gx = padL;
      for (i = 0; i < cells; i++) {
        var bx2 = gx + i * (sw + gap);
        if (i < game.unlockedCount) {
          drawCrayonBlock(ctx, bx2, y2 - sw / 2, sw, cfg.COLORS[cfg.COLOR_KEYS[i]], 30 + i, 4, {
            rot: (u.hash2(i, 5, 2) - 0.5) * 0.3, wobble: 0.9
          });
        } else {
          ctx.save();
          ctx.globalAlpha = 0.45;
          wobblyRoundRect(ctx, bx2, y2 - sw / 2, sw, sw, sw * 0.28, 30 + i, 4, 0.9);
          ctx.fillStyle = '#CFC8BC';
          ctx.fill();
          ctx.strokeStyle = cfg.INK;
          ctx.lineWidth = 1.1;
          ctx.stroke();
          ctx.restore();
        }
      }
    }
    // 速度：贴文本区右侧
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'right';
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = slow ? '#2EC4B6' : cfg.INK;
    ctx.fillText(spdText, textR, y2);
    ctx.fillStyle = cfg.INK;
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';

    // ---- 行 3：排行榜横排（多人模式），空间不足自动少画 ----
    if (game.mode === 'multi' && game.mp) {
      var lb = game.mp.leaderboard().slice(0, 4);
      var y3 = Math.max(y2 + 18, y3base);
      var lineH = 14;
      var col = 0, rowIdx = 0;
      var xr = padL;
      for (var li = 0; li < lb.length; li++) {
        var row = lb[li];
        // 首个二进制帧理论上可能先于低频 meta；即使协议层兜底失效，HUD 也不能崩。
        var rawName = row.name == null ? ('玩家' + row.id) : String(row.name);
        var nm = rawName.length > 4 ? rawName.slice(0, 4) : rawName;
        var txt = (li + 1) + '.' + nm + ' ' + row.length;
        ctx.font = (row.isPlayer ? 'bold ' : '') + '10px sans-serif';
        var tw = ctx.measureText(txt).width;
        if (xr + tw > textR) {                 // 本行放不下 → 换行
          rowIdx++;
          if (y3 + rowIdx * lineH > ph - 6) break;   // 面板放不下更多行 → 丢弃剩余
          xr = padL;
        }
        ctx.globalAlpha = row.isPlayer ? 1 : 0.75;
        ctx.fillStyle = row.isPlayer ? '#C47F17' : cfg.INK;
        ctx.fillText(txt, xr, y3 + rowIdx * lineH);
        xr += tw + 12;
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = cfg.INK;
    }
    ctx.restore();
  };

  // ---------------- 摇杆（固定底座，视口区左下角） ----------------

  Renderer.prototype.drawJoystick = function (game) {
    var j = game.joystick;
    var ctx = this.ctx;
    ctx.save();
    if (!j.active) {
      // 未激活：淡淡的提示圆盘
      ctx.globalAlpha = 0.28;
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = cfg.INK;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(j.baseX, j.baseY, j.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = cfg.INK;
      ctx.fillText('摇杆', j.baseX, j.baseY);
      ctx.restore();
      return;
    }
    ctx.globalAlpha = 0.55;
    // 底盘
    ctx.beginPath();
    ctx.arc(j.baseX, j.baseY, j.radius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,253,245,0.6)';
    ctx.fill();
    ctx.strokeStyle = cfg.INK;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    // 摇杆头
    ctx.beginPath();
    ctx.arc(j.knobX, j.knobY, 20, 0, Math.PI * 2);
    ctx.fillStyle = cfg.PANEL;
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  };

  // ---------------- 界面（菜单 / 选关 / 结算） ----------------

  Renderer.prototype.drawButton = function (b) {
    var ctx = this.ctx;
    ctx.save();
    ctx.globalAlpha = b.enabled ? 1 : 0.35;
    wobblyRoundRect(ctx, b.x, b.y, b.w, b.h, 12, Math.round(b.x), Math.round(b.y), 1.6);
    ctx.fillStyle = cfg.PANEL;
    ctx.fill();
    ctx.strokeStyle = cfg.INK;
    ctx.lineWidth = 2.2;
    ctx.stroke();
    ctx.save();
    ctx.translate(1, -0.8);
    ctx.globalAlpha *= 0.3;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = cfg.INK;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
    ctx.restore();
  };

  Renderer.prototype.drawOverlay = function (alpha) {
    var ctx = this.ctx;
    ctx.fillStyle = 'rgba(251,246,233,' + (alpha === undefined ? 0.94 : alpha) + ')';
    ctx.fillRect(0, 0, this.W, this.H);
  };

  Renderer.prototype.drawMenu = function (game) {
    var ctx = this.ctx;
    this.drawOverlay(0.0); // 主菜单直接用纸面
    // 坐标全部取自 game.menuLayout()：它是菜单布局的唯一权威源。
    // 横屏矮屏返回 split=true（左品牌 / 右按钮），此时 cx 是**品牌区中心**而非屏幕中心，
    // 于是标题与按钮不会争夺同一块空间（docs/design §3.8.3-A）。
    var ml = game.menuLayout();
    var cx = ml.brandCx;
    var ty = ml.titleY; // 标题基线 Y

    // ---- 标题「消食蛇」美术设计 ----
    // 设计意图：每个字用不同颜色（红=消除、绿=吃、蓝=蛇身），
    //   字间穿插小蜡笔色块（体现"蛇由色块组成"），
    //   底部蜡笔波浪下划线 + 少量砖块沿线缓慢往返滑动（手绘感，平滑不跳动）
    ctx.save();
    var titleChars = ['消', '食', '蛇'];
    var titleColors = [cfg.COLORS.red, cfg.COLORS.green, cfg.COLORS.blue]; // 红(消) 绿(食) 蓝(蛇)
    var fontSize = ml.titleSize;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + fontSize + 'px sans-serif';

    // 测量总宽以便居中
    var totalW = 0;
    for (var tc = 0; tc < titleChars.length; tc++) totalW += ctx.measureText(titleChars[tc]).width;
    var charGap = 8; // 字间距
    totalW += charGap * (titleChars.length - 1);
    var startX = cx - totalW / 2;

    // 逐字绘制（每字独立颜色 + 轻微蜡笔描边）
    var curX = startX;
    for (var ci = 0; ci < titleChars.length; ci++) {
      var ch = titleChars[ci];
      var chW = ctx.measureText(ch).width;
      var chCx = curX + chW / 2;

      // 字体颜色（深色描边 + 彩色填充，保证在浅色背景可读）
      ctx.font = 'bold ' + fontSize + 'px sans-serif';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = cfg.INK;
      ctx.strokeText(ch, chCx, ty);
      ctx.fillStyle = titleColors[ci];
      ctx.fillText(ch, chCx, ty);

      curX += chW + charGap;
    }

    // 蜡笔波浪下划线（手绘感，贯穿标题下方）
    ctx.beginPath();
    var ulY = ty + fontSize * 0.48;
    var ulW = totalW + 40;
    var ulX0 = cx - ulW / 2;
    ctx.moveTo(ulX0, ulY);
    for (var wx = 1; wx <= 12; wx++) {
      var px = ulX0 + (wx / 12) * ulW;
      var py = ulY + Math.sin(wx * 1.3 + 0.7) * 3.5;
      ctx.lineTo(px, py);
    }
    ctx.strokeStyle = cfg.COLORS.orange; // 橙色下划线（第 4 色，点缀用）
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.stroke();

    // 标题两侧各飘 1 个稍大的装饰色块（四色各一，表达"四色消除"核心机制）
    var decorBlocks = [
      { x: cx - totalW / 2 - 28, y: ty - 6, color: cfg.COLORS.orange, size: 14, rot: -0.25 },
      { x: cx + totalW / 2 + 26, y: ty + 10, color: cfg.COLORS.purple, size: 12, rot: 0.35 }
    ];
    for (var di = 0; di < decorBlocks.length; di++) {
      var db = decorBlocks[di];
      ctx.save();
      ctx.translate(db.x, db.y);
      ctx.rotate(db.rot);
      drawCrayonBlock(ctx, -db.size / 2, -db.size / 2, db.size, db.color,
        di * 77, di * 43, { rot: db.rot * 0.8, wobble: 1.0 });
      ctx.restore();
    }

    // 标题下方「色块滑动 → 触发消除」循环动效（多色轮播 + 随机效果）
    // 极端小屏（menuLayout.showAnim=false）时跳过：纯装饰，优先保证按钮可点
    if (ml.showAnim !== false) this.drawTitleFx(game);

    ctx.restore();
    // ---- 标题结束 ----

    // 副标题 + 底部统计：宽度受限时自动降级（竖屏 390px 曾把「别撞墙」截掉）
    ctx.save();
    ctx.fillStyle = cfg.INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var maxW = ml.brandW - (ml.split ? 16 : 44);   // 非分栏时是整屏宽，需留左右各 22px 边距
    if (ml.showSub !== false) {                    // 极端小屏副标题让位给按钮
      this._fitText(ctx, ['自由游动 · 吃色补头 · 四连消除 · 别撞墙',
        '自由游动 · 吃色补头 · 四连消除',
        '吃色补头 · 四连消除'], cx, ml.subY, maxW, 15, 11);
    }
    ctx.globalAlpha = 0.7;
    if (ml.showStat !== false) {   // 极端小屏统计让位给按钮（见 game.menuLayout）
      this._fitText(ctx, ['无尽模式最高分：' + game.best,
        '最高分 ' + game.best],
        ml.statCx, ml.statY, maxW, 13, 10);
      this._fitText(ctx, ['AI对战最佳：最长 ' + game.mpBest.len + ' 节 · 最高 ' + game.mpBest.score + ' 分',
        'AI最佳 ' + game.mpBest.len + ' 节 · ' + game.mpBest.score + ' 分'],
        ml.statCx, ml.statY + ml.statLine, maxW, 13, 10);
    }
    ctx.restore();

    // 主菜单错误提示（如匹配阶段连不上服务器被弹回菜单）：屏幕底部居中，4 秒淡出
    if (game.menuNotice && game.menuNotice.until > Date.now()) {
      var na = Math.min(1, (game.menuNotice.until - Date.now()) / 600);
      ctx.save();
      ctx.globalAlpha = na;
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 3;
      var ny = this.H - 34;
      ctx.strokeStyle = '#FFFDF5';
      ctx.strokeText(game.menuNotice.text, this.W / 2, ny);
      ctx.fillStyle = '#D64550';
      ctx.fillText(game.menuNotice.text, this.W / 2, ny);
      ctx.restore();
    }

    this.drawParticles(game); // 标题消除动效的粒子（屏幕坐标，无相机变换）
    this.drawButtons(game);
  };

  /**
   * 在限定宽度内画一行文本：先按候选文案由长到短挑第一个放得下的，
   * 都放不下再缩字号（到 minPx 为止）。避免出现被右边缘裁断的文字。
   * @param {CanvasRenderingContext2D} ctx
   * @param {string[]} candidates 候选文案，按信息量从多到少排列
   * @param {number} cx 居中 x
   * @param {number} y 基线 y
   * @param {number} maxW 可用宽度
   * @param {number} px 理想字号
   * @param {number} minPx 最小字号
   */
  Renderer.prototype._fitText = function (ctx, candidates, cx, y, maxW, px, minPx) {
    for (var i = 0; i < candidates.length; i++) {
      ctx.font = px + 'px sans-serif';
      if (ctx.measureText(candidates[i]).width <= maxW) {
        ctx.fillText(candidates[i], cx, y);
        return;
      }
    }
    // 所有候选都超宽 → 用最短的那条缩字号
    var s = candidates[candidates.length - 1];
    for (var size = px; size >= minPx; size--) {
      ctx.font = size + 'px sans-serif';
      if (ctx.measureText(s).width <= maxW) break;
    }
    ctx.fillText(s, cx, y);
  };

  /**
   * 标题下方装饰动效：小蛇「向左走」一边吃砖块一边凑 4 连消除，循环演示每种颜色各来一次。
   * 蛇头朝左、蛇身向右铺开；砖块从左侧远处流入、被蛇头吃掉补到头部（与游戏内 unshift 一致），
   * 同色节在头侧累积，凑够 4 连即触发消除（蜡笔屑迸裂 + 高亮环 + 星形闪光 + 飘字「4连消除！」），随后循环。
   * 颜色按 COLOR_KEYS 顺序轮播（红→蓝→绿→橙→紫→黄→青→粉→…），保证每种颜色都演示一次再循环。
   * 状态挂在 renderer 实例上（this.titleFx），逐帧更新。
   */
  Renderer.prototype.drawTitleFx = function (game) {
    var ctx = this.ctx;
    var fx = this.titleFx;
    if (!fx) fx = this.titleFx = {
      segs: ['red', 'blue', 'green', 'orange', 'purple'], // 常驻蛇身（多色、无 4 连同色），保证蛇一直有身体在"走"
      feeder: null,      // 正在流入、待"吃"下的砖块 {color, x}
      lastMs: game.timeMs,
      feedTimer: 300,    // 距下一块砖出现的间隔
      colorCursor: 0,    // 当前这一轮要连吃的颜色在 COLOR_KEYS 里的下标
      runLeft: 0,        // 该色还差几块才凑满一轮（一轮=4）
      runColor: cfg.COLOR_KEYS[0],
      bite: 0,           // 蛇头咬合动画剩余时长(ms)
      bob: 0             // 行走摆动相位
    };
    var nowMs = game.timeMs;
    var dt = nowMs - fx.lastMs;
    fx.lastMs = nowMs;
    if (dt < 0) dt = 0;
    if (dt > 80) dt = 80; // 切后台回来防跳帧
    fx.bob += dt;

    // 坐标跟随品牌区（横屏分栏时品牌区在左半边，动画必须一起过去，
    // 否则蛇会画到按钮区上面 —— 这正是之前"副标题与动画糊成一团"的一半原因）
    var ml = game.menuLayout();
    var cx = ml.brandCx;
    var ty = ml.titleY;
    var fontSize = ml.titleSize;
    var laneY = ml.animY;                          // 标题与副标题之间的一条轨道
    var SEG = 24, BLK = 20, MAXLEN = 14;
    var headX = cx - Math.min(ml.brandW * 0.28, 130); // 蛇头在偏左（朝左走），蛇身向右铺开
    var walkSpeed = 175;                           // 砖块从左侧流入、向右被吃（视觉上=蛇向左走）

    // 1) 出块：COLOR_KEYS 顺序轮一遍（红→蓝→绿→…→粉→红…），每色喂 4 块凑 4 连
    fx.feedTimer -= dt;
    if (!fx.feeder && fx.feedTimer <= 0) {
      fx.feedTimer = 360 + Math.random() * 200;    // 0.36~0.56s 出一块（连续走、不断粮）
      if (fx.runLeft <= 0) {                       // 上一轮凑满，切到下一色
        fx.runColor = cfg.COLOR_KEYS[fx.colorCursor % cfg.COLOR_KEYS.length];
        fx.colorCursor++;
        fx.runLeft = 4;
      }
      fx.feeder = { color: fx.runColor, x: headX - 200 }; // 从左侧远处流入
      fx.runLeft--;
    }

    // 2) 推进待吃砖块（向左流入 → 到蛇头被吃下）；补到头部，超长去尾
    if (fx.feeder) {
      fx.feeder.x += walkSpeed * dt / 1000;
      if (fx.feeder.x >= headX) {
        fx.segs.unshift(fx.feeder.color);          // 补头（与游戏一致：吃到→unshift 到头部）
        if (fx.segs.length > MAXLEN) fx.segs.pop(); // 尾部掉落，总长有界
        fx.bite = 160;
        game.particles.ring(headX, laneY, cfg.COLORS[fx.feeder.color], 0.9); // 咬合小高亮
        fx.feeder = null;
        // 头侧 4 连（前 4 个同色）→ 消除
        var L = fx.segs.length;
        if (L >= 4 && fx.segs[0] === fx.segs[1] && fx.segs[1] === fx.segs[2] && fx.segs[2] === fx.segs[3]) {
          var col = cfg.COLORS[fx.segs[0]];
          for (var k = 0; k < 4; k++) {
            var px = headX + k * SEG;
            game.particles.burst(px, laneY, col, 7, 1.3);
            game.particles.ring(px, laneY, col, 1.3);
          }
          game.particles.flash(headX + 1.5 * SEG, laneY, '#FFD94A', 1.4, 3);
          game.particles.chainText(headX + 1.5 * SEG, laneY - 26, '4连消除！', 20);
          fx.segs.splice(0, 4); // 移除头侧 4 节（常驻蛇身保留）
        }
      }
    }
    if (fx.bite > 0) fx.bite -= dt;

    // 3) 绘制：蛇头在左（朝左走、眼睛朝左），常驻蛇身向右铺开；整体波浪式摆动表现"走"
    ctx.save();
    ctx.textBaseline = 'middle';
    for (var i = 0; i < fx.segs.length; i++) {
      var sx = headX + i * SEG;
      var isHead = (i === 0);
      var sz = isHead ? BLK + 2 : BLK;
      var py = laneY + Math.sin(fx.bob / 240 - i * 0.55) * 2.6; // 蛇身波浪式摆动
      if (sx > headX + MAXLEN * SEG + 30) continue;
      drawCrayonBlock(ctx, sx - sz / 2, py - sz / 2, sz, cfg.COLORS[fx.segs[i]], i * 53 + 17, 41,
        { rot: 0.08, wobble: 1.0, stroke: cfg.SEG_STROKE });
      if (isHead) {
        var sc = 1 + Math.max(0, fx.bite) / 160 * 0.18; // 咬合瞬间微微鼓一下
        ctx.save();
        ctx.translate(sx, py);
        ctx.scale(sc, sc);
        drawEyes(ctx, 0, 0, sz, { x: -1, y: 0 }); // 朝左（行进方向=向左走）
        ctx.restore();
      }
    }
    if (fx.feeder) { // 正在流入、待吃的砖块（带轻微脉冲提示"正在靠近"）
      var fsz = BLK * (1 + 0.08 * Math.sin(nowMs / 120));
      ctx.save();
      ctx.globalAlpha = 0.95;
      drawCrayonBlock(ctx, fx.feeder.x - fsz / 2, laneY - fsz / 2, fsz, cfg.COLORS[fx.feeder.color], 7, 41,
        { rot: 0.08, wobble: 1.0, stroke: cfg.SEG_STROKE });
      ctx.restore();
    }
    ctx.restore();
  };


  Renderer.prototype.drawResult = function (game) {
    var ctx = this.ctx;
    this.drawOverlay(0.9);
    ctx.save();
    ctx.fillStyle = cfg.INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 32px sans-serif';
    ctx.fillText('游戏结束', this.W / 2, this.H * 0.30);
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText('得分 ' + game.score, this.W / 2, this.H * 0.39);
    ctx.font = '14px sans-serif';
    ctx.globalAlpha = 0.75;
    ctx.fillText('历史最高 ' + game.best + ' 分', this.W / 2, this.H * 0.45);
    ctx.restore();
    this.drawButtons(game);
  };

  Renderer.prototype.drawButtons = function (game) {
    for (var i = 0; i < game.uiButtons.length; i++) this.drawButton(game.uiButtons[i]);
  };

  // ---------------- 在线对战匹配界面（v3.0） ----------------

  /**
   * 匹配等待页：标题 + 昵称 + 状态行（连接/排队位次/倒计时，省略号动画）+
   * 规则提示（掉线判负不重连）+ 取消按钮。数据全部来自 game.online（CS.OnlineMatch）。
   */
  /**
   * 团队赛开房间界面（team_lobby）：标题 + 昵称 + 好友房号输入框 + 开始/返回。
   * 「好友房号」框即 game.uiButtons 里的 'team_code' 按钮矩形，renderer 把它的屏幕
   * 矩形写入 game._lobbyCodeRect，由 main.js 据此在该位置挂载一个 DOM <input> 接收输入。
   */
  Renderer.prototype.drawTeamLobby = function (game) {
    var ctx = this.ctx, W = this.W, H = this.H, cx = W / 2;
    this.drawOverlay(0.0); // 直接用纸面

    // 记录"好友房号"框矩形（供 main.js 定位 DOM 输入框，坐标为 CSS 逻辑像素）
    var codeBtn = null;
    for (var i = 0; i < game.uiButtons.length; i++) {
      if (game.uiButtons[i].id === 'team_code') { codeBtn = game.uiButtons[i]; break; }
    }
    game._lobbyCodeRect = codeBtn ? { x: codeBtn.x, y: codeBtn.y, w: codeBtn.w, h: codeBtn.h } : null;

    // 标题
    var title = '团队赛 2v2v2v2v2';
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.font = 'bold 36px sans-serif';
    ctx.lineWidth = 6;
    ctx.strokeStyle = cfg.INK;
    ctx.strokeText(title, cx, H * 0.16);
    ctx.fillStyle = '#9B5DE5';
    ctx.fillText(title, cx, H * 0.16);

    // 昵称
    ctx.font = '15px sans-serif';
    ctx.fillStyle = cfg.INK;
    ctx.globalAlpha = 0.8;
    ctx.fillText('昵称：' + (game.online ? game.online.nick : (CS.storage.get('crayon_snake_web_nick', '') || '我')), cx, H * 0.26);
    ctx.globalAlpha = 1;

    // 好友房号标签：宽屏一行；窄屏（手机竖屏）拆两行，避免整句横向溢出屏幕
    var labelFull = '好友房号：点「邀请好友」自动生成并复制链接发微信；也可手填相同房号';
    ctx.font = '14px sans-serif';
    ctx.fillStyle = cfg.INK;
    if (ctx.measureText(labelFull).width <= W - 24) {
      ctx.fillText(labelFull, cx, H * 0.35);
    } else {
      ctx.font = '13px sans-serif';
      ctx.fillText('好友房号：点「邀请好友」自动生成并复制链接发微信', cx, H * 0.335);
      ctx.fillText('也可手填相同房号，与好友进同一队', cx, H * 0.365);
    }

    // 输入框（由 main.js 的 <input> 覆盖；这里画边框与占位/内容预览）
    if (codeBtn) {
      wobblyRoundRect(ctx, codeBtn.x, codeBtn.y, codeBtn.w, codeBtn.h, 12, Math.round(codeBtn.x), Math.round(codeBtn.y), 2.0);
      var focused = game.lobbyField === 'code';
      ctx.fillStyle = focused ? '#FFFDF5' : 'rgba(255,253,245,0.6)';
      ctx.fill();
      ctx.strokeStyle = focused ? '#9B5DE5' : cfg.INK;
      ctx.lineWidth = focused ? 3 : 2;
      ctx.stroke();
      ctx.font = '18px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      var txt = game.teamCodeDraft || '';
      ctx.fillStyle = txt ? cfg.INK : 'rgba(58,50,56,0.45)';
      ctx.fillText(txt || '点此输入房号', codeBtn.x + codeBtn.w / 2, codeBtn.y + codeBtn.h / 2);
    }

    // 规则提示（挪到开始/返回按钮之下，邀请按钮上方另有邀请结果提示）
    ctx.font = '12px sans-serif';
    ctx.fillStyle = cfg.INK;
    ctx.globalAlpha = 0.6;
    ctx.fillText('5 队 × 2 人 · 同队相撞不死可并肩吃砖 · 撞到异队身体立即出局', cx, H * 0.75);
    ctx.fillText('留空房号＝单人随机匹配队友（你 + 1 AI 队友 + 4 个 AI 队兜底）', cx, H * 0.75 + 20);
    ctx.globalAlpha = 1;

    // 邀请结果提示（复制成功/失败），3 秒淡出
    if (game.inviteNotice && game.inviteNotice.until > Date.now()) {
      ctx.font = '13px sans-serif';
      ctx.fillStyle = '#9B5DE5';
      ctx.globalAlpha = Math.min(1, (game.inviteNotice.until - Date.now()) / 600);
      ctx.fillText(game.inviteNotice.text, cx, H * 0.605);
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    // 开始匹配 / 返回 / 邀请好友。「team_code」是伪按钮（输入框），由本函数上方按
    // 聚焦态自行绘制——若走 drawButton 通用样式会再盖一层 PANEL 底色，把草稿文本遮掉。
    for (var bi = 0; bi < game.uiButtons.length; bi++) {
      if (game.uiButtons[bi].id === 'team_code') continue;
      this.drawButton(game.uiButtons[bi]);
    }
  };

  // ---------------- 多人对战结算（手绘风卡片 + 逐行统计，v2.2） ----------------

  /**
   * 手绘风结算按钮：主按钮（再来一局）蜡笔黄填充 + 加粗描边，副按钮纸色。
   * @param {number} alpha 淡入透明度（结算动画用）
   */
  Renderer.prototype.drawDoodleButton = function (b, primary, alpha) {
    var ctx = this.ctx;
    ctx.save();
    ctx.globalAlpha = (b.enabled ? 1 : 0.35) * (alpha === undefined ? 1 : alpha);
    wobblyRoundRect(ctx, b.x, b.y, b.w, b.h, 14, Math.round(b.x), Math.round(b.y), 2.0);
    ctx.fillStyle = primary ? '#FFD94A' : cfg.PANEL;
    ctx.fill();
    ctx.strokeStyle = cfg.INK;
    ctx.lineWidth = primary ? 3.2 : 2.4;
    ctx.stroke();
    ctx.save(); // 第二遍错位描边（手绘"描了两次"感）
    ctx.translate(1.4, -1);
    ctx.globalAlpha *= 0.3;
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = cfg.INK;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
    ctx.restore();
  };

  /**
   * 多人对战结算界面：手绘风卡片底板（抖动描边圆角 + 纸张噪点），
   * 标题按名次变化（第 1 名「冠军！」+ 皇冠/星星涂鸦，2~3 名「很棒！」，其余「再接再厉」），
   * 统计每行一项（左侧涂鸦小图标 + 标签 + 右侧醒目数值），
   * 动画：卡片 280ms 淡入上移，各行依次延迟 ~80ms 从左侧滑入，按钮最后淡入。
   */
  Renderer.prototype.drawMultiResult = function (game) {
    var ctx = this.ctx, r = game.mpResult;
    var W = this.W, H = this.H;
    var t = Math.max(0, game.timeMs - (game.overAt || 0));
    this.drawOverlay(0.6); // 压暗战场，突出卡片

    // 统计行（每行一项：图标 / 标签 / 数值 / 数值颜色）
    var rows = [
      { icon: 'medal', label: '排名',         value: '第 ' + r.rank + ' 名', color: '#C47F17' },
      { icon: 'clock', label: '存活时间',     value: r.surviveSec + ' 秒',   color: cfg.INK },
      { icon: 'star',  label: '总分',         value: String(r.score),        color: '#E8552F' },
      { icon: 'clock', label: '时间分',       value: '+' + r.survivalScore,  color: '#4A7FD4' },
      { icon: 'spark', label: '消除分',       value: '+' + r.elimScore,      color: '#9B5DE5' },
      { icon: 'block', label: '累计消除方块', value: String(r.elimTotal),    color: '#2EC4B6' },
      { icon: 'burst', label: '击杀数',       value: String(r.kills),        color: '#E8552F' },
      { icon: 'snake', label: '最终节数',     value: r.finalLen + ' 节',     color: '#6FBF4A' }
    ];

    // 团队模式：把"队伍总排行"插到个人统计之前（队伍号 + 总分 + 存活人数，本队高亮）
    if (r.team && r.teamResult && r.teamResult.teams) {
      var teamRows = [];
      var trs = r.teamResult.teams;
      for (var tri = 0; tri < trs.length; tri++) {
        var t0 = trs[tri];
        var tName = cfg.teamName(t0.id);
        var tMine = (t0.id === r.teamResult.myTeam);
        teamRows.push({
          icon: null,
          label: (tri + 1) + '. ' + tName + (tMine ? '（你）' : ''),
          value: t0.score + '分 · ' + t0.aliveCount + '存活',
          color: cfg.teamColor(t0.id)
        });
      }
      rows = teamRows.concat(rows);
    }

    // 卡片几何：矮屏（手机横屏）改**两列统计**，卡片变宽变矮；否则单列 8 行。
    // 原实现单列压到 rowH 下限 24px 后卡片仍需 354px，而横屏只有 360~390px → 照样超出
    // （见 docs/design §3.8.2）。正解是利用富余的横向空间。
    //
    // v3.0.5（方案 A）：宽度与水平中心一律取自**视口矩形**，不再用整屏 W/2。
    // 横屏时视口已排除右侧 HUD 面板，竖屏时排除顶部 HUD 高度，
    // 于是卡片结构上不可能压到面板（此前 844×390 压 18px、800×360 压 32px）。
    var lay = game.layout();
    var vX = lay.viewX, vW = lay.viewW, vY = lay.viewY, vH = lay.viewH;
    var padV = 18, titleH = 96, footH = 30;
    var btnTop = vY + vH;
    for (var bi = 0; bi < game.uiButtons.length; bi++) btnTop = Math.min(btnTop, game.uiButtons[bi].y);
    var roomH = btnTop - 20 - 12 - vY;            // 卡片可用高度（视口顶到按钮上方）
    var oneColNeed = padV * 2 + titleH + rows.length * 34 + footH;
    // 团队模式：队伍排行需保持排名顺序，强制单列（其余情况仍按空间两列）
    var twoCol = (!r.team) && (oneColNeed > roomH); // 单列放不下 → 两列
    var perCol = twoCol ? Math.ceil(rows.length / 2) : rows.length;

    var rowH = 34;
    var cw = twoCol ? Math.min(560, vW * 0.94) : Math.min(440, vW * 0.82);
    var ch = padV * 2 + titleH + perCol * rowH + footH;
    if (ch > roomH) {                             // 两列仍不够 → 压行高
      rowH = Math.max(22, (roomH - padV * 2 - titleH - footH) / perCol);
      ch = padV * 2 + titleH + perCol * rowH + footH;
    }
    if (ch > roomH) {                             // 极端矮屏（如 320x240）→ 压缩标题区与内边距
      padV = 8; footH = 18;
      titleH = Math.max(46, roomH - padV * 2 - perCol * rowH - footH);
      ch = padV * 2 + titleH + perCol * rowH + footH;
    }
    var cx = vX + vW / 2;                         // 视口中心，而非屏幕中心
    var x = cx - cw / 2;
    // 垂直居中于「卡片可用区」，并硬性钳制底边不越过按钮上方 12px（极端矮屏兜底）
    var y = Math.max(vY + 6, vY + (btnTop - vY - 20 - ch) / 2);
    if (y + ch > btnTop - 12) y = Math.max(vY + 4, btnTop - 12 - ch);

    // ---- 卡片底板（280ms 淡入 + 轻微上移）----
    var aCard = u.clamp(t / 280, 0, 1);
    ctx.save();
    ctx.globalAlpha = aCard;
    ctx.translate(0, (1 - aCard) * 14);
    wobblyRoundRect(ctx, x, y, cw, ch, 18, 71, 73, 2.4);
    ctx.fillStyle = cfg.PANEL;
    ctx.fill();
    var tile = getNoiseTile(); // 纸张质感：噪点平铺裁剪进卡片
    if (tile) {
