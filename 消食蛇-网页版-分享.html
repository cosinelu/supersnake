 *    SEG_SPACING 排布（经典 trail-following）；
 *  - 尾巴节（v2.3）：colors 保持纯颜色节，身体几何总长 = colors.length + 1，
 *    segPos 末尾恒多 1 节「尾巴节」（下标 = colors.length）。它不参与消除判定、
 *    不会被消除/咬断移除、不占 MIN_LENGTH 保底计数；但它是身体的一部分——
 *    收集/碰撞/撞身判定对它正常生效。渲染为深色蜡笔小尾鳍（renderer.drawTail）。
 *  - 颜色序列 colors[0] = 头；吃到色块 colors.unshift(新色)：头立即变为新颜色、
 *    原头变第 1 节身体、总长 +1（祖玛式从一端推入）；
 *  - 消除：颜色序列中相邻连续 ≥ELIM_RUN 同色立即移除，支持连锁，长度保底
 *    MIN_LENGTH（从末尾保留）。身体位置由轨迹派生，消除后自然伸缩。
 *  - 不做蛇身自碰（沿用原设计）。
 */
(function (root) {
  var CS = root.CS = root.CS || {};
  var cfg = CS.config;
  var u = CS.utils;

  /**
   * @param {number} x 出生点世界坐标
   * @param {number} y
   * @param {number} len 初始节数
   * @param {number} angle 初始朝向（弧度，0 = 向右）
   * @param {string[]} colorKeys 可用颜色池（已解锁色）
   */
  function Snake(x, y, len, angle, colorKeys) {
    this.x = x;
    this.y = y;
    this.angle = angle;
    this.targetAngle = angle;
    this.speed = cfg.SNAKE_SPEED;
    this.colors = [];                 // colors[0] = 头
    this.trail = [{ x: x, y: y }];    // 头部轨迹，trail[0] 最新
    this.selfPullCd = 0;             // 自碰重组冷却（ms），>0 时不可触发（防刷屏）
    this.segPos = [];                 // 每节中心（含头），computeBody 派生
    this.colorKeys = colorKeys;       // 保存可用颜色池（已解锁色），供保底补砖时随机取色
    // 出生时颜色随机但避免直接凑成 4 连（tries 防御：可选颜色不足时接受现状，不死循环）
    for (var i = 0; i < len; i++) {
      var color = colorKeys[0], tries = 0;
      do {
        color = colorKeys[Math.floor(Math.random() * colorKeys.length)];
      } while (++tries < 16 && i >= 3 &&
               this.colors[i - 1] === color &&
               this.colors[i - 2] === color &&
               this.colors[i - 3] === color);
      this.colors.push(color);
    }
    this.computeBody();
  }

  /** 颜色节数（消除/咬断/保底/计分/速度加成都按此计数，不含尾巴节） */
  Snake.prototype.length = function () { return this.colors.length; };

  /** 身体总节数（含恒在的尾巴节）= 颜色节数 + 1 */
  Snake.prototype.totalLength = function () { return this.colors.length + 1; };

  Snake.prototype.headColor = function () { return this.colors[0]; };

  /** 头部朝向单位向量（渲染眼睛 / 粒子方向用） */
  Snake.prototype.headDir = function () {
    return { x: Math.cos(this.angle), y: Math.sin(this.angle) };
  };

  /** 设置目标朝向角（弧度）；蛇头按 TURN_RATE 平滑逼近 */
  Snake.prototype.setTargetAngle = function (a) {
    this.targetAngle = u.normAngle(a);
  };

  /**
   * 每帧推进：转向（速率钳制）→ 前进 → 记录轨迹 → 重算身体 → 裁剪轨迹。
   * @param {number} dtMs 帧间隔（毫秒）
   */
  Snake.prototype.update = function (dtMs) {
    var dt = dtMs / 1000;
    // 转向：目标角突变时按 maxTurn 逐步逼近（走最短弧）
    this.angle = u.turnToward(this.angle, this.targetAngle, cfg.TURN_RATE * dt);
    // 前进（恒定速度）
    this.x += Math.cos(this.angle) * this.speed * dt;
    this.y += Math.sin(this.angle) * this.speed * dt;
    // 轨迹：头距最近记录点 ≥ TRAIL_STEP 才新增记录点（trail[0] 不随身移动，
    // 否则单帧位移 < TRAIL_STEP 时永远不累积，轨迹会塌缩成 1 个点）
    var t0 = this.trail[0];
    var dx = this.x - t0.x, dy = this.y - t0.y;
    if (dx * dx + dy * dy >= cfg.TRAIL_STEP * cfg.TRAIL_STEP) {
      this.trail.unshift({ x: this.x, y: this.y });
    }
    this.computeBody();
    this.trimTrail();
    if (this.selfPullCd > 0) this.selfPullCd = Math.max(0, this.selfPullCd - dtMs); // 自碰重组冷却衰减
  };

  /**
   * 自碰重组（v2.9 新机制）：当蛇头重叠到自身某一节身体（k≥1，不含恒在的尾巴节）时，
   * 把该节颜色移出并 unshift 到头部——总长度不变，但头部颜色改变、身体沿轨迹自然收拢，
   * 可能凑出新的同色段触发消除，增加消除的变化性（且不吃不长，节奏不膨胀）。
   * 仅当 selfPullCd<=0 时调用方才应触发；触发后由调用方重新设置冷却。
   * @returns {{color:string,x:number,y:number,idx:number}|null} 被拉到头部的节信息；无重叠返回 null
   */
  Snake.prototype.trySelfPull = function () {
    if (this.colors.length < cfg.MIN_LENGTH + 1) return null; // 至少 4 节才值得重组
    var tol = cfg.HEAD_HIT_RADIUS + cfg.SEG_RADIUS;
    var tol2 = tol * tol;
    // 从离头最近的一节开始找（k=1 是脖子，越往后越深）；命中第一个重叠的身体节
    for (var k = 1; k < this.segPos.length - 1; k++) {
      var sp = this.segPos[k];
      var dx = sp.x - this.x, dy = sp.y - this.y;
      if (dx * dx + dy * dy < tol2) {
        var color = this.colors[k];
        // 移出第 k 节、unshift 到头部（总长不变）；身体由轨迹重新派生自然收拢
        this.colors.splice(k, 1);
        this.colors.unshift(color);
        this.computeBody();
        return { color: color, x: sp.x, y: sp.y, idx: k };
      }
    }
    return null;
  };

  /**
   * 沿轨迹按弧长间距排布身体各节（segPos[0] = 头）。
   * 从头的实时位置出发，依次走向 trail[0]、trail[1]…，相邻节间距 = SEG_SPACING。
   * 节数 = colors.length + 1：末尾恒追加 1 节尾巴节（segPos[colors.length]）。
   * 轨迹不足时（开局）节堆叠在轨迹尾点，随移动自然拉开。
   */
  Snake.prototype.computeBody = function () {
    var n = this.colors.length + 1; // +1 = 不可消除的尾巴节
    var sp = cfg.SEG_SPACING;
    var trail = this.trail;
    var pos = this.segPos;
    pos.length = 0;
    pos.push({ x: this.x, y: this.y });
    var acc = 0;                 // 已沿轨迹走的弧长
    var px = this.x, py = this.y;
    var ti = 0;                  // 下一个要走向的轨迹点下标
    for (var i = 1; i < n; i++) {
      var target = i * sp;
      while (acc < target && ti < trail.length) {
        var nx = trail[ti].x, ny = trail[ti].y;
        var d = u.dist(px, py, nx, ny);
        if (acc + d >= target) { // 在本段轨迹内插值
          var k = (target - acc) / (d || 1e-6);
          px = px + (nx - px) * k;
          py = py + (ny - py) * k;
          acc = target;
          break;
        }
        acc += d;
        px = nx; py = ny;
        ti++;
      }
      pos.push({ x: px, y: py }); // 轨迹耗尽时 px,py 即轨迹尾点
    }
  };

  /** 裁剪轨迹：只保留身体所需弧长 + 余量，防止无限增长 */
  Snake.prototype.trimTrail = function () {
    var maxNeed = (this.colors.length + 1) * cfg.SEG_SPACING + 60; // +1：尾巴节弧长
    var acc = 0, keep = this.trail.length;
    var px = this.x, py = this.y;
    for (var i = 0; i < this.trail.length; i++) {
      acc += u.dist(px, py, this.trail[i].x, this.trail[i].y);
      if (acc > maxNeed) { keep = Math.max(1, i + 1); break; }
      px = this.trail[i].x; py = this.trail[i].y;
    }
    if (this.trail.length > keep) this.trail.length = keep;
  };

  /**
   * 吃到色块：新颜色进头部（祖玛式从一端推入）。
   * 头立即变为该颜色，原头变成第 1 节身体，总长 +1。
   */
  Snake.prototype.grow = function (color) {
    this.colors.unshift(color);
    this.computeBody(); // 立即对齐身体渲染（新节位于头后 SEG_SPACING 处）
  };

  /** 吃到万能色块：头部插入一个 'wild' 节（消除时可匹配任意相邻同色，见 findRuns） */
  Snake.prototype.growWild = function () {
    this.colors.unshift('wild');
    this.computeBody();
  };

  /**
   * 收集判定辅助：蛇头或任一身体节中心距 (x,y) 是否 < r + SEG_RADIUS
   * （「身体穿过也算」的圆形重叠判定）。
   */
  Snake.prototype.overlaps = function (x, y, r) {
    var rr = r + cfg.SEG_RADIUS;
    var rr2 = rr * rr;
    for (var i = 0; i < this.segPos.length; i++) {
      var dx = this.segPos[i].x - x, dy = this.segPos[i].y - y;
      if (dx * dx + dy * dy < rr2) return true;
    }
    return false;
  };

  /** 蛇身（含头）到 (x,y) 的最小距离（spawner 避让用） */
  Snake.prototype.distTo = function (x, y) {
    var best = Infinity;
    for (var i = 0; i < this.segPos.length; i++) {
      var d = u.dist(this.segPos[i].x, this.segPos[i].y, x, y);
      if (d < best) best = d;
    }
    return best;
  };

  /**
   * 咬断：移除颜色序列第 idx 节（多人对战「头撞身」附加效果，idx ≥ 1，不咬头）。
   * 与消除同一处理路径：只改颜色序列，身体几何由轨迹重新派生，缺口自然收拢。
   * 尾巴节（下标 = colors.length）不在颜色序列内，下标越界天然返回 null，不可被咬。
   * @param {number} idx 被咬节下标（segPos[1..colors.length-1] 中离撞者头心最近者，由调用方选定）
   * @returns {{color:string,x:number,y:number}|null} 被移除节信息（粒子/判定用）；下标非法返回 null
   */
  Snake.prototype.removeSegAt = function (idx) {
    if (idx < 1 || idx >= this.colors.length) return null;
    var p = this.segPos[idx] || { x: this.x, y: this.y };
    var color = this.colors.splice(idx, 1)[0];
    this.computeBody(); // 身体从缺口处自然收拢
    return { color: color, x: p.x, y: p.y };
  };

  /**
   * 流星注入：在身体第 idx 节前插入一个颜色节（中段注入，idx 越界自动夹紧）。
   * 与 grow（头部插入）共用身体几何派生，缺口自然收拢。用于「流星砖块」可靠的中段注入。
   */
  Snake.prototype.insertAt = function (idx, color) {
    idx = Math.max(0, Math.min(this.colors.length, idx | 0));
    this.colors.splice(idx, 0, color);
    this.computeBody();
  };

  /**
   * 命中检测：返回第一个与 (x,y) 距离 < r + SEG_RADIUS 的身体节下标（含尾巴节 colors.length），无则 -1。
   * 供流星砖块碰撞用（命中即在该节注入）。
   */
  Snake.prototype.segIndexAt = function (x, y, r) {
    var rr2 = (r + cfg.SEG_RADIUS) * (r + cfg.SEG_RADIUS);
    for (var i = 0; i < this.segPos.length; i++) {
      var dx = this.segPos[i].x - x, dy = this.segPos[i].y - y;
      if (dx * dx + dy * dy < rr2) return i;
    }
    return -1;
  };

  /** 内部：按下标数组批量移除，返回 [{color,x,y,chain:1}]（移除前捕获世界坐标供特效） */
  Snake.prototype._removeAt = function (idxs) {
    if (!idxs || !idxs.length) return [];
    idxs = idxs.slice().sort(function (a, b) { return a - b; });
    var removed = [];
    for (var k = idxs.length - 1; k >= 0; k--) { // 降序 splice，避免位移
      var idx = idxs[k];
      if (idx < 0 || idx >= this.colors.length) continue;
      var p = this.segPos[idx] || { x: this.x, y: this.y };
      removed.push({ color: this.colors[idx], x: p.x, y: p.y, chain: 1 });
      this.colors.splice(idx, 1);
    }
    this.computeBody();
    return removed;
  };

  /** 消色道具：移除所有该颜色的节（尾巴节恒在非颜色序列，天然排除） */
  Snake.prototype.removeByColor = function (color) {
    var idxs = [];
    for (var i = 0; i < this.colors.length; i++) if (this.colors[i] === color) idxs.push(i);
    return this._removeAt(idxs);
  };

  /** 后 N 消色：移除该颜色中最靠尾（下标最大）的至多 n 节 */
  Snake.prototype.removeRearByColor = function (color, n) {
    var idxs = [];
    for (var i = 0; i < this.colors.length; i++) if (this.colors[i] === color) idxs.push(i);
    if (idxs.length > n) idxs = idxs.slice(idxs.length - n);
    return this._removeAt(idxs);
  };

  /** 随机消：随机移除 n 节（互异下标），不足 n 则移除全部 */
  Snake.prototype.removeRandom = function (n) {
    var pool = [];
    for (var i = 0; i < this.colors.length; i++) pool.push(i);
    var idxs = [];
    for (var k = 0; k < n && pool.length; k++) {
      var j = Math.floor(Math.random() * pool.length);
      idxs.push(pool[j]); pool.splice(j, 1);
    }
    return this._removeAt(idxs);
  };

  /**
   * 找出所有长度 ≥ runLen 的同色连续段（返回下标段数组）。
   * 支持万能色 'wild'：一段连续节中，非 wild 节必须同色、wild 可充当中介/两端；
   * 该段整体视作该颜色（wild 节也计入长度并参与消除）——「万能色」即由此实现。
   */
  Snake.prototype.findRuns = function (runLen) {
    var runs = [], i = 0, n = this.colors.length;
    while (i < n) {
      var j = i;
      var runColor = this.colors[i] === 'wild' ? null : this.colors[i];
      while (j + 1 < n) {
        var c = this.colors[j + 1];
        if (c === 'wild') { j++; continue; }
        if (runColor === null) { runColor = c; j++; continue; }
        if (c === runColor) { j++; continue; }
        break;
      }
      if (runColor !== null && j - i + 1 >= runLen) {
        var r = [];
        for (var k = i; k <= j; k++) r.push(k);
        runs.push(r);
      }
      i = j + 1;
    }
    return runs;
  };

  /**
   * 执行消除（含连锁）。
   * 连锁等级 chain：一轮消除后颜色序列接拢、又凑成 ≥runLen 连再次消除时 chain+1。
   * @param {number} minLen 消除后保底长度（不足时从末尾保留）
   * @param {number} runLen 触发消除的连续同色节数
   * @returns {Array} 被移除的节 [{color,x,y,chain}]（x,y 为消除瞬间的世界坐标；
   *   chain 为该节被消除时的连锁等级，从 1 起，用于连锁倍率计分与逐级放大特效）
   */
  Snake.prototype.eliminate = function (minLen, runLen) {
    var removed = [];
    var guard = 0;
    var chain = 0; // 当前连锁等级（每进入一轮消除 +1）
    var floorHit = false; // 是否触发过「保底」（消除会清空到不足 minLen）
    while (guard++ < 32) { // 防御性上限，正常连锁远小于此
      var runs = this.findRuns(runLen);
      if (!runs.length) break;
      chain++;
      var mark = {};
      runs.forEach(function (r) { r.forEach(function (idx) { mark[idx] = true; }); });
      var idxs = Object.keys(mark).map(Number).sort(function (a, b) { return b - a; });
      var removeCount = idxs.length;
      var floorCandidate = (this.colors.length - removeCount < minLen && removeCount > 0);
      if (floorCandidate && runLen === cfg.ELIM_RUN) {
        // 标准 4 连消除触发保底：不再保留旧块，整段消除后随机补砖让游戏继续（新行为）
        floorHit = true;
      } else if (floorCandidate) {
        // 其它情形（如炸弹 2 连消除）保持原保底：从尾部取消标记、保留 minLen 节旧块
        while (this.colors.length - removeCount < minLen && removeCount > 0) {
          delete mark[idxs[idxs.length - removeCount]];
          removeCount--;
        }
      }
      if (!removeCount) break;
      var next = [];
      for (var i = 0; i < this.colors.length; i++) {
        if (mark[i]) {
          var p = this.segPos[i] || { x: this.x, y: this.y };
          removed.push({ color: this.colors[i], x: p.x, y: p.y, chain: chain });
        } else {
          next.push(this.colors[i]);
        }
      }
      this.colors = next;
      if (floorHit) break; // 已决定重置，无需继续连锁
    }
    if (removed.length) this.computeBody(); // 身体由轨迹派生，消除后自然收缩
    // 保底触发：整段消除后，随机补满 REFILL_ON_FLOOR 块「已解锁颜色」砖（保留残余的非消除节），让游戏继续
    if (floorHit) {
      var pool = (this.colorKeys && this.colorKeys.length) ? this.colorKeys : cfg.COLOR_KEYS;
      var target = cfg.REFILL_ON_FLOOR;
      while (this.colors.length < target) {
        var rc = pool[Math.floor(Math.random() * pool.length)];
        // 避免补出的块直接与前 3 块凑成 4 连同色（否则下一帧立即再消除，视觉反复清空）
        var nn = this.colors.length;
        if (nn >= 3 && this.colors[nn - 1] === rc && this.colors[nn - 2] === rc && this.colors[nn - 3] === rc) {
          var alt = pool[(pool.indexOf(rc) + 1) % pool.length];
          if (alt !== rc) rc = alt;
        }
        this.colors.push(rc);
      }
      this.computeBody();
    }
    return removed;
  };

  CS.Snake = Snake;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== inlined: js/spawner.js ===== */
'use strict';
/**
 * spawner.js — 色块刷新器（v2：世界像素坐标，DOM 无关）
 *  - 每隔 SPAWN_INTERVAL_MS 检查一次：未被吃掉的色块保留，只在空位补足到目标数量；
 *  - 目标数量 ≈ 世界面积 / BLOCK_AREA_DIV（90000），并夹在 [BLOCKS_MIN, BLOCKS_MAX]；
 *  - 生成采用拒绝采样 + 最小间距约束（简化版 Poisson disk）：
 *      与已有色块距离 ≥ BLOCK_MIN_DIST(140px)、与蛇身距离 ≥ BLOCK_SNAKE_DIST(80px)、
 *      不压墙（含边界内缩 BLOCK_EDGE_MARGIN）；最多尝试 SPAWN_TRIES(50) 次，失败则本轮跳过；
 *  - 只从已解锁颜色（unlockedKeys）中刷新。
 */
(function (root) {
  var CS = root.CS = root.CS || {};
  var cfg = CS.config;
  var u = CS.utils;

  function Spawner(walls, snake) {
    this.walls = walls;
    this.snake = snake;
    this.blocks = []; // {x, y, color, phase, kind}（世界坐标）
    this.timer = 0;
    this.meteors = [];   // 流星砖块：{x,y,vx,vy,color,ttl,trail,phase}（移动实体）
    this.meteorTimer = 0;
    this.others = []; // 其他活蛇数组（多人模式由 multiplayer 挂活引用，刷新时同样避让）
    this.unlockedKeys = cfg.COLOR_KEYS.slice(); // 默认全部；game 会按本局解锁数覆盖
    this.specialChance = cfg.ITEM_SPECIAL_CHANCE; // 每帧由 game/mp 按存活时间更新（越后期越高）
    var area = walls.W * walls.H;
    this.target = u.clamp(Math.round(area / cfg.BLOCK_AREA_DIV), cfg.BLOCKS_MIN, cfg.BLOCKS_MAX);
  }

  /** 按权重抽取一个特殊道具 kind（wild/bomb/slow/clear/clear3/rand1-3）；供刷新与阵亡掉落共用 */
  Spawner.prototype.randomSpecialKind = function () {
    var w = cfg.ITEM_WEIGHTS, total = 0, k;
    for (k in w) total += w[k];
    var r = Math.random() * total;
    for (k in w) { r -= w[k]; if (r <= 0) return k; }

 * ai.js — 多人对战 AI 决策（加权转向，DOM 无关）
 * 每帧为一条 AI 蛇产出目标角（弧度）：
 *  在 AI_DIRS 个候选方向（绕当前朝向均匀采样一整圈）上打分，取最高分：
 *   ① 寻食：感知范围内色块按「方向对齐度 × 距离衰减」加分，与头部同色 ×AI_SAME_COLOR_BONUS

 *   ② 避墙：沿候选方向取近（≈1 身位）/ 远（≈2 身位）两个前景点，撞边界/内部墙则罚分
 *      （近点重罚 ≈ 否决，远点轻罚 = 提前避让），探测距离按谨慎性格 caution 伸缩；
 *   ③ 避蛇：近前景点附近出现其他蛇（含玩家）身体节则按接近程度罚分；

   * @param {object} persona 性格参数 { greed: 0.6~1.4 贪食, caution: 0.6~1.4 谨慎 }

    // 基础速度：后期 AI 略快（给玩家更大压力）
    var speedRange = cfg.MP_AI_SPEED_MAX - cfg.MP_AI_SPEED_MIN;
    e.base = cfg.MP_AI_SPEED_MIN + Math.random() * speedRange * (0.7 + smartness * 0.5);

    // 性格参数：早期 AI 随机性大（可能很贪或很怂），后期 AI 更均衡聪明
    if (smartness < 0.3) {
      // 早期：极端随机（有的很莽有的很胆小）
      e.greed = 0.4 + Math.random() * 1.2;    // 0.4~1.6
      e.caution = 0.4 + Math.random() * 1.2;   // 0.4~1.6
    } else {
      // 后期：更聪明（适中偏高贪食 + 高谨慎 = 会吃但不容易送死）
      e.greed = 0.8 + Math.random() * 0.5;     // 0.8~1.3
      e.caution = 0.9 + Math.random() * 0.5;   // 0.9~1.4
    }

    this.bots.push(e);
    this.botSnakes.push(snake);
    return e;
  };

  // ---------------- 淘汰与尸体 ----------------

  /**
   * 尸体掉落：颜色序列每隔 MP_CORPSE_STRIDE 节掉 1 个色块（起点随机 0/1 → ≈50% 节）。
   * 掉落的色块直接进入 spawner.blocks（资源循环），不受稀疏刷新间距约束。
   * @returns {number} 实际掉落的色块数
   */
  Multiplayer.prototype.dropCorpse = function (e) {
    var s = e.snake;
    var stride = Math.max(1, cfg.MP_CORPSE_STRIDE);
    var offset = Math.floor(Math.random() * stride);
    var added = 0;
    for (var i = offset; i < s.colors.length; i += stride) {
      var p = s.segPos[i] || { x: s.x, y: s.y };
      this.spawner.blocks.push({
        x: p.x, y: p.y,
        color: s.colors[i],
        phase: Math.random() * Math.PI * 2
      });
      added++;
    }
    return added;
  };

  /** 淘汰一条蛇：掉落尸体 + 粒子闪光；AI 进入重生队列，玩家由 game 结算 */
  Multiplayer.prototype.kill = function (e) {
    if (!e.alive) return;
    e.alive = false;
    e.diedAt = this.timeMs;
    this.dropCorpse(e);
    this.dropDeathItems(e); // 必然掉 1 个随机道具 + 每 10 节额外掉 1 个
    this.particles.flash(e.snake.x, e.snake.y, '#FFD94A', 1.4, 3);
    if (!e.isPlayer) {
      delete this.usedNames[e.name];
      var idx = this.botSnakes.indexOf(e.snake);
      if (idx >= 0) this.botSnakes.splice(idx, 1);
      var delay = cfg.MP_RESPAWN_MIN_MS + Math.random() * (cfg.MP_RESPAWN_MAX_MS - cfg.MP_RESPAWN_MIN_MS);
      this.respawnQueue.push({ at: this.timeMs + delay });
    }
  };

  /**
   * 碰撞判定（每帧一次，批量结算）：
   *  1. 头撞墙/边界 → 淘汰；
   *  2. 头对头（头心距 < 2×HEAD_HIT_RADIUS）→ 两条都淘汰；
   *  3. 头撞其他蛇身体节（segPos[1..]，头除外）→ 淘汰，身体主人记 1 击杀；
   *     同时触发咬断：被撞者 B 被移除「离 A 头心最近」的那一节（见 applyBite）。
   */
  Multiplayer.prototype.collide = function () {
    var es = this.allEntries();
    var alive = [];
    var i, j;
    for (i = 0; i < es.length; i++) if (es[i].alive) alive.push(es[i]);
    var dead = {}; // entry.id -> {by: Entry|null}
    var bites = []; // [{A, B, seg}] 本帧发生的咬断（A 撞 B 第 seg 节）

    // 1. 撞墙/边界
    for (i = 0; i < alive.length; i++) {
      var s = alive[i].snake;
      if (this.walls.hitsCircle(s.x, s.y, cfg.HEAD_HIT_RADIUS)) dead[alive[i].id] = { by: null };
    }

    // 2. 头对头
    var hh = cfg.HEAD_HIT_RADIUS * 2;
    for (i = 0; i < alive.length; i++) {
      for (j = i + 1; j < alive.length; j++) {
        var a = alive[i], b = alive[j];
        if (dead[a.id] && dead[b.id]) continue;
        if (u.dist(a.snake.x, a.snake.y, b.snake.x, b.snake.y) < hh) {
          if (!dead[a.id]) dead[a.id] = { by: null };
          if (!dead[b.id]) dead[b.id] = { by: null };
        }
      }
    }

    // 3. 头撞身体（k 从 1 起：跳过对方头部，头对头已在上面判过）
    //    碰撞：尾巴节也算身体（撞上照样淘汰撞者）；
    //    咬断：被咬节 = 判定半径内离 A 头心最近的「颜色节」（排除末尾尾巴节，它不可被咬掉）
    var hb = cfg.HEAD_HIT_RADIUS + cfg.SEG_RADIUS;
    for (i = 0; i < alive.length; i++) {
      var A = alive[i];
      if (dead[A.id]) continue;
      for (j = 0; j < alive.length; j++) {
        if (i === j) continue;
        var B = alive[j];
        var sp = B.snake.segPos;
        var colorN = B.snake.colors.length; // segPos[colorN] 即尾巴节
        var hitK = -1, bestD = hb;          // 碰撞最近节（含尾巴节）
        var biteK = -1, biteD = hb;         // 咬断最近节（仅颜色节）
        for (var k = 1; k < sp.length; k++) {
          var d = u.dist(A.snake.x, A.snake.y, sp[k].x, sp[k].y);
          if (d < bestD) { bestD = d; hitK = k; }
          if (k < colorN && d < biteD) { biteD = d; biteK = k; }
        }
        if (hitK >= 0) {
          dead[A.id] = { by: B };
          if (biteK >= 0) bites.push({ A: A, B: B, seg: biteK }); // 只撞上尾巴：淘汰但不咬断
          break;
        }
      }
    }

    // 咬断结算（在统一淘汰前处理；同一被撞者按节下标从大到小移除，避免下标位移咬错节）
    bites.sort(function (p, q) { return q.seg - p.seg; });
    for (i = 0; i < bites.length; i++) {
      var bt = bites[i];
      if (dead[bt.B.id]) continue; // B 已因其他原因淘汰（墙/头对头/此前的咬断保底）：整尸掉落，不再咬断
      this.applyBite(bt.A, bt.B, bt.seg, dead);
    }

    // 结算（统一在判定完之后处理，避免遍历中改状态）
    for (i = 0; i < alive.length; i++) {
      var E = alive[i];
      if (dead[E.id]) {
        if (dead[E.id].by) dead[E.id].by.kills++;
        this.kill(E);
      }
    }
  };

  /**
   * 咬断：A 撞 B 身体，B 移除第 segIdx 节（颜色序列去掉该项，身体由轨迹自然收拢）。
   *  - 尾巴节保护：segIdx 越界（= 尾巴节下标）时 removeSegAt 返回 null，不咬断不保底；
   *  - 保底：移除后 B 节数 < MP_BITE_MIN_LENGTH → B 直接淘汰（dead[B] = {by: A}，计入 A 击杀）；
   *  - 消除联动：B 存活则立即检查颜色序列，凑成 ≥ELIM_RUN 连同色正常触发消除
   *    （连锁/倍率计分照常，分数与累计消除方块都记 B）；
   *  - 视觉反馈：被咬处迸小粒子 + B 短暂闪白/抖动（bittenUntil，渲染层表现）。
   */
  Multiplayer.prototype.applyBite = function (A, B, segIdx, dead) {
    var removed = B.snake.removeSegAt(segIdx);
    if (!removed) return;
    this.particles.burst(removed.x, removed.y, cfg.COLORS[removed.color], 5, 0.8);
    B.bittenUntil = this.timeMs + cfg.MP_BITE_FLASH_MS;
    if (B.snake.length() < cfg.MP_BITE_MIN_LENGTH) {
      dead[B.id] = { by: A }; // 保底淘汰：正常淘汰流程（尸体掉落）+ 计入 A 的击杀
      return;
    }
    this.resolveElim(B); // 被咬后颜色接拢，可能凑成 4 连 → 正常消除（计分给 B）
  };

  // ---------------- 帧更新 ----------------

  /** 消除结算：4 连消除 + 连锁倍率计分 + 逐级放大特效（与单人模式同一套表现）；
   *  同时累计「累计消除方块」elimTotal（含连锁与被咬触发的消除） */
  Multiplayer.prototype.resolveElim = function (e) {
    var removed = e.snake.eliminate(cfg.MIN_LENGTH, cfg.ELIM_RUN);
    this.scoreChain(e, removed, 1, 0);
  };

  /**
   * 统一计分 + 特效（供 resolveElim 与 applyItem 共用）。
   * @param {Entry} e 被消除的蛇档案
   * @param {Array} removed 被移除节 [{color,x,y,chain}]
   * @param {number} fxBoost 特效放大（炸弹更强）
   * @param {number} perSegBonus 每节额外得分（炸弹/消色/随机消除等道具）
   */
  Multiplayer.prototype.scoreChain = function (e, removed, fxBoost, perSegBonus) {
    if (!removed || !removed.length) return;
    if (CS.audio) CS.audio.playElim();
    e.elimTotal += removed.length;
    // 连击（仅玩家计入，AI 的 elimScore 仅供调试）：窗口内连续消除 → combo 递增 → 分数成倍
    var combo = 1;
    if (e.isPlayer) {
      this.game.bumpCombo();
      combo = Math.min(cfg.ELIM_COMBO_MAX, this.game.elimCombo);
    }
    var waves = {};
    var i;
    for (i = 0; i < removed.length; i++) {
      var ch = removed[i].chain || 1;
      (waves[ch] = waves[ch] || []).push(removed[i]);
    }
    var chainLv = Object.keys(waves).map(Number).sort(function (a, b) { return a - b; });
    for (var w = 0; w < chainLv.length; w++) {
      var chain = chainLv[w], segs = waves[chain];
      var fxScale = (1 + (chain - 1) * cfg.CHAIN_FX_STEP) * (fxBoost || 1);
      e.elimScore += segs.length * cfg.ELIM_SCORE * chain * combo + (perSegBonus || 0);
      var sx = 0, sy = 0;
      for (i = 0; i < segs.length; i++) {
        this.particles.burst(segs[i].x, segs[i].y, cfg.COLORS[segs[i].color],
          Math.round(5 * fxScale), fxScale);
        sx += segs[i].x; sy += segs[i].y;
      }
      var ccx = sx / segs.length, ccy = sy / segs.length;
      this.particles.flash(ccx, ccy, '#FFD94A', fxScale, Math.min(4, chain));
      if (chain >= cfg.CHAIN_TEXT_MIN) {
        this.particles.chainText(ccx, ccy - 24, chain + '连锁！', 20 + (chain - 1) * 6);
      }
      if (e.isPlayer && combo >= 2) {
        this.particles.chainText(ccx, ccy - 46, combo + '连击 ×' + combo, 18 + combo);
      }
    }
  };

  /**
   * 拾取道具的统一处理（玩家与 AI 共用）：按 kind 触发对应效果 + 计分 + 特效。
   * 特殊道具（wild/bomb/slow/clear/clear3/rand1-3）都会真正生效；
   * 仅当 e 是玩家时弹出效果飘字（setItemToast），避免 AI 拾取刷屏。
   * @param {Entry} e 拾取者
   * @param {object} b 色块 {kind,color,x,y,rarity}
   */
  Multiplayer.prototype.applyItem = function (e, b) {
    var px = b.x, py = b.y;
    var isPlayer = e.isPlayer;
    if (b.kind && b.kind !== 'color' && isPlayer) this.game.setItemToast(b.kind, b.color);
    if (b.kind === 'wild') {
      e.snake.growWild();
      if (CS.audio) CS.audio.playSpecial();
      this.particles.burst(px, py, '#FFD94A', 7);
      this.resolveElim(e);
    } else if (b.kind === 'bomb') {
      if (CS.audio) CS.audio.playSpecial();
      this.particles.burst(px, py, '#E8552F', 12, 1.5);
      var rem = e.snake.eliminate(2, 2);
      this.scoreChain(e, rem, 1.4, cfg.BOMB_SCORE);
    } else if (b.kind === 'slow') {
      if (CS.audio) CS.audio.playSpecial();
      e.slowUntil = this.timeMs + cfg.SLOW_MS;
      this.particles.burst(px, py, '#2EC4B6', 9);
      this.resolveElim(e);
    } else if (b.kind === 'clear') {
      if (CS.audio) CS.audio.playSpecial();
      var rem = e.snake.removeByColor(b.color);
      this.scoreChain(e, rem, 1.3, cfg.CLEAR_SCORE);
      var rem2 = e.snake.eliminate(cfg.MIN_LENGTH, cfg.ELIM_RUN);
      this.scoreChain(e, rem2, 1, 0);
      this.particles.burst(px, py, cfg.COLORS[b.color], 12, 1.5);
    } else if (b.kind === 'clear3') {
      if (CS.audio) CS.audio.playSpecial();
      var rem = e.snake.removeRearByColor(b.color, 3);
      this.scoreChain(e, rem, 1.2, cfg.CLEAR3_SCORE);
      var rem2 = e.snake.eliminate(cfg.MIN_LENGTH, cfg.ELIM_RUN);
      this.scoreChain(e, rem2, 1, 0);
      this.particles.burst(px, py, cfg.COLORS[b.color], 9, 1.3);
    } else if (b.kind === 'rand1' || b.kind === 'rand2' || b.kind === 'rand3') {
      if (CS.audio) CS.audio.playSpecial();
      var rn = b.kind === 'rand1' ? 1 : (b.kind === 'rand2' ? 2 : 3);
      var rem = e.snake.removeRandom(rn);
      this.scoreChain(e, rem, 1.2, cfg.RAND_SCORE);
      var rem2 = e.snake.eliminate(cfg.MIN_LENGTH, cfg.ELIM_RUN);
      this.scoreChain(e, rem2, 1, 0);
      this.particles.burst(px, py, '#FFD94A', 9, 1.3);
    } else {
      if (CS.audio) CS.audio.playEat();
      e.snake.grow(b.color);
      this.particles.burst(px, py, cfg.COLORS[b.color], 4);
      this.resolveElim(e);
    }
  };

  /**
   * 阵亡掉落道具：除身体散落色块（dropCorpse）外，必然额外掉落一个随机道具，
   * 且玩家/任意蛇每有 10 个颜色节（不含尾巴节）再额外掉一个随机道具（长度越长奖励越多）。
   * @param {Entry} e 被淘汰的蛇
   */
  Multiplayer.prototype.dropDeathItems = function (e) {
    var s = e.snake;
    var colorLen = s.colors.length; // 颜色节数（尾巴节不在 colors[] 内，天然排除）
    var count = 1 + Math.floor(colorLen / 10);
    for (var i = 0; i < count; i++) {
      var kind = this.spawner.randomSpecialKind();
      var p = s.segPos[Math.floor(Math.random() * s.segPos.length)] || { x: s.x, y: s.y };
      var jx = (Math.random() * 2 - 1) * 26, jy = (Math.random() * 2 - 1) * 26;
      this.spawner.addDroppedItem(p.x + jx, p.y + jy, kind);
    }
  };

  /**
   * 处理 AI 重生 + 动态增长（v2.8.7：AI 数量随时间从 MP_AI_START_COUNT 增长到 MP_AI_MAX_COUNT）。
   * 逻辑：
   *  1) 到期的淘汰 AI 按原延迟重生（维持基本编制）；
   *  2) 计算当前存活时间对应的目标 AI 数量，若当前活 AI 少于目标，额外补招新 AI；
   *  3) 新补招的 AI 使用 currentSmartness() 智力参数（后期 AI 更聪明）。
   */
  Multiplayer.prototype.processRespawns = function () {
    var now = this.timeMs;
    var sec = this.timeMs / 1000;
    var smartness = this.currentSmartness();

    // 1) 到期重生（淘汰的 AI 回来）
    var due = 0;
    var keep = [];
    for (var i = 0; i < this.respawnQueue.length; i++) {
      if (this.respawnQueue[i].at <= now) due++;
      else keep.push(this.respawnQueue[i]);
    }
    this.respawnQueue = keep;
    for (i = 0; i < due; i++) {
      this.spawnBot(smartness);  // 重生的 AI 也带当前智力水平
      this.respawned++;
    }

    // 2) 动态增长：若「活 AI + 重生队列」< 目标数量，补招新 AI（队列中的待重生蛇也算编制，
    //    避免「刚被淘汰→队列里还躺着一条→又补一条」导致数量瞬间越界）。
    //    节流仅作为「增长补招」的速率限制（每隔 >=800ms 才允许补一条），绝不越过目标数量硬上限。
    var alive = this.aliveBotCount() + this.respawnQueue.length;
    var target = this.targetAiCount(sec);
    var canGrow = !this._lastGrowSpawn || now - this._lastGrowSpawn >= 800;
    if (alive < target && canGrow) {
      this.spawnBot(smartness);
      this.respawned++;
      this._lastGrowthSpawn = now; // 注意：故意用不同变量名避免与重生混淆
      this._lastGrowSpawn = now;
    }
  };

  /**
   * 每帧推进（由 game.updateMulti 调用，玩家输入已由 game 写入 targetAngle）：
   *  AI 决策 → 动态速度 → 推进所有蛇 → 碰撞淘汰 → 吃色/消除 → 重生补充 → 色块刷新。
   */
  Multiplayer.prototype.update = function (dt) {
    this.timeMs += dt;
    var entries = this.allEntries();
    var snakes = this.aliveSnakes();
    var env = { walls: this.walls, blocks: this.spawner.blocks, snakes: snakes };
    var sec = this.timeMs / 1000;
    var i, e;

    // 随时间提升特殊道具刷新概率（越后期道具越密集）
    this.spawner.specialChance = cfg.specialChanceForElapsed(this.game.elapsed);

    // AI 决策（与玩家同规则：只设目标角，转向速率由 Snake.update 钳制）
    for (i = 0; i < this.bots.length; i++) {
      e = this.bots[i];
      if (!e.alive) continue;
      e.snake.setTargetAngle(CS.AI.decide(e.snake, env, e));
    }

    // 动态速度（长度/时间加成，封顶 SPEED_MAX；减速道具期间 ×SLOW_FACTOR）+ 推进
    for (i = 0; i < entries.length; i++) {
      e = entries[i];
      if (!e.alive) continue;
      var sp = e.base + e.snake.length() * cfg.SPEED_LEN_COEF + sec * cfg.ENDLESS_SPEEDUP_PER_SEC;
      if (e.slowUntil && this.timeMs < e.slowUntil) sp *= cfg.SLOW_FACTOR;
      e.snake.speed = Math.min(cfg.SPEED_MAX, sp);
      e.snake.update(dt);
      if (e.snake.length() > e.maxLen) e.maxLen = e.snake.length();
    }

    // 碰撞淘汰（墙 / 头头 / 头身）
    this.collide();

    // 吃色块 + 消除（玩家优先，其后 AI；特殊道具走 applyItem 真正生效 + 玩家飘字）
    for (i = 0; i < entries.length; i++) {
      e = entries[i];
      if (!e.alive) continue;
      var got = this.spawner.collectAt(e.snake);
      for (var g = 0; g < got.length; g++) this.applyItem(e, got[g]);
    }

    // 流星砖块：直线飞行 + 命中玩家蛇身注入中段（与单人同规则；玩家专属，AI 不受影响）
    var mev = this.spawner.updateMeteors(dt, this.game.snake);
    for (var mi = 0; mi < mev.length; mi++) {
      var ev = mev[mi];
      this.game.snake.insertAt(ev.idx, ev.color);
      this.particles.burst(ev.x, ev.y, cfg.COLORS[ev.color], 7, 1.3);
      if (CS.audio) CS.audio.playSpecial();
      this.playerEntry.elimScore += cfg.METEOR_SCORE; // 记到玩家 Entry（多人对局分以 Entry 为准）
      this.game.setItemToast('meteor', ev.color); // 流星注入飘字（仅玩家可见）
      this.resolveElim(this.playerEntry);
    }

    // AI 补充 + 稀疏刷新
    this.processRespawns();
    this.spawner.update(dt);
  };

  // ---------------- 排行榜与名次 ----------------

  /** 实时排行榜：活蛇按当前节数降序（同节数玩家优先），[{name, length, isPlayer}] */
  Multiplayer.prototype.leaderboard = function () {
    var es = this.allEntries();
    var arr = [];
    for (var i = 0; i < es.length; i++) {
      if (es[i].alive) arr.push({ name: es[i].name, length: es[i].snake.length(), isPlayer: es[i].isPlayer });
    }
    arr.sort(function (a, b) {
      if (b.length !== a.length) return b.length - a.length;
      return (a.isPlayer ? 0 : 1) - (b.isPlayer ? 0 : 1);
    });
    return arr;
  };

  /** 某 Entry 在当前场上的名次（1 起）：1 + 节数严格更多的活蛇数 */
  Multiplayer.prototype.rankOf = function (e) {
    var len = e.snake.length();
    var rank = 1;
    var es = this.allEntries();
    for (var i = 0; i < es.length; i++) {
      if (es[i] !== e && es[i].alive && es[i].snake.length() > len) rank++;
    }
    return rank;
  };

  CS.Multiplayer = Multiplayer;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

/* ===== inlined: js/renderer.js ===== */
'use strict';
/**
 * renderer.js — 全部程序化 Canvas 2D 绘制（蜡笔手绘风，v2：相机视口 + 大地图）
 *  - 背景：浅奶油纸色 + 预生成的噪点平铺（离屏 canvas 只生成一次，document.createElement）；
 *  - 相机：视口区内 translate(-cam.x,-cam.y) 画世界，视口外裁剪；世界外区域压暗；
 *  - 手绘感：描边用 INK 深色，抖动用"固定种子伪随机"（同物每帧一致，不闪烁）；
 *  - 墙壁：边界为灰色排线墙带，内部墙为排线矩形；色块：带蜡笔笔触的圆角色块；
 *    蛇：圆形蜡笔节沿轨迹排布，末尾恒带 1 节深色小尾鳍（不可消除的尾巴节），
 *    蛇头表情眼睛朝向移动方向；
 *  - 右侧 HUD 面板：分数/目标/关卡/已解锁颜色预览 + 小地图（世界缩略 + 蛇头亮点）；
 *  - 摇杆：固定底座浮在视口区左下角，半透明手绘风。
 */
(function (root) {
  var CS = root.CS = root.CS || {};
  var cfg = CS.config;
  var u = CS.utils;

  var noiseTile = null;

  /** 预生成纸张噪点 tile（只做一次） */
  function getNoiseTile() {
    if (noiseTile) return noiseTile;
    if (typeof document === 'undefined' || !document.createElement) return null;
    var c = document.createElement('canvas');
    c.width = 160; c.height = 160;
    var g = c.getContext('2d');
    for (var i = 0; i < 420; i++) { // 纸面斑点
      g.fillStyle = Math.random() < 0.55 ? 'rgba(58,50,56,0.045)' : 'rgba(255,255,255,0.5)';
      g.beginPath();
      g.arc(Math.random() * 160, Math.random() * 160, Math.random() * 1.3 + 0.3, 0, Math.PI * 2);
      g.fill();
    }
    g.strokeStyle = 'rgba(58,50,56,0.035)'; // 少许纸纤维
    g.lineWidth = 0.6;
    for (i = 0; i < 26; i++) {
      var x = Math.random() * 160, y = Math.random() * 160, a = Math.random() * Math.PI;
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x + Math.cos(a) * (6 + Math.random() * 10), y + Math.sin(a) * (6 + Math.random() * 10));
      g.stroke();
    }
    noiseTile = c;
    return c;
  }

  /** 手绘风圆角矩形路径：四角按 (seedX,seedY) 做确定性抖动 */
  function wobblyRoundRect(ctx, x, y, w, h, r, seedX, seedY, wobble) {
    var j = wobble === undefined ? 1.2 : wobble;
    function ox(k) { return (u.hash2(seedX, seedY, k) - 0.5) * 2 * j; }
    function oy(k) { return (u.hash2(seedY, seedX, k + 9) - 0.5) * 2 * j; }
    ctx.beginPath();
    ctx.moveTo(x + r + ox(1), y + oy(1));
    ctx.lineTo(x + w - r + ox(2), y + oy(2));
    ctx.quadraticCurveTo(x + w + ox(3), y + oy(3), x + w + ox(4), y + r + oy(4));
    ctx.lineTo(x + w + ox(5), y + h - r + oy(5));
    ctx.quadraticCurveTo(x + w + ox(6), y + h + oy(6), x + w - r + ox(6), y + h + oy(7));
    ctx.lineTo(x + r + ox(7), y + h + oy(8));
    ctx.quadraticCurveTo(x + ox(8), y + h + oy(9), x + ox(9), y + h - r + oy(10));
    ctx.lineTo(x + ox(10), y + r + oy(11));
    ctx.quadraticCurveTo(x + ox(11), y + oy(12), x + r + ox(12), y + oy(13));
    ctx.closePath();
  }

  /** 在色块上叠加短笔触，模拟蜡笔涂抹纹理 */
  function crayonStrokes(ctx, x, y, w, h, seedX, seedY) {
    ctx.lineWidth = 1.1;
    ctx.lineCap = 'round';
    for (var i = 0; i < 4; i++) {
      var sx = x + 3 + u.hash2(seedX, seedY, 20 + i) * (w - 8);
      var sy = y + 3 + u.hash2(seedX, seedY, 30 + i) * (h - 8);
      var len = 3 + u.hash2(seedX, seedY, 40 + i) * (w * 0.45);
      var ang = (u.hash2(seedX, seedY, 50 + i) - 0.5) * 1.1; // 大致水平的涂抹
      ctx.strokeStyle = i % 2 === 0 ? 'rgba(255,255,255,0.22)' : 'rgba(0,0,0,0.10)';
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + Math.cos(ang) * len, sy + Math.sin(ang) * len);
      ctx.stroke();
    }
  }

  /** 画一颗蜡笔色块（蛇身节 / 道具 / 预览色块共用），(px,py) 为左上 */
  function drawCrayonBlock(ctx, px, py, size, colorHex, seedX, seedY, opts) {
    opts = opts || {};
    var rot = opts.rot || 0;
    var scale = opts.scale || 1;
    ctx.save();
    ctx.translate(px + size / 2, py + size / 2);
    ctx.rotate(rot);
    ctx.scale(scale, scale);
    ctx.translate(-size / 2, -size / 2);
    var r = size * 0.28;
    wobblyRoundRect(ctx, 0, 0, size, size, r, seedX, seedY, opts.wobble);
    ctx.fillStyle = colorHex;
    ctx.fill();
    crayonStrokes(ctx, 0, 0, size, size, seedX, seedY);
    // 手绘描边：两遍微错位，制造"描了两次"的草图感
    // opts.stroke 可覆盖主描边粗细（蛇节用 SEG_STROKE≈3px，相邻节边界一眼可辨）
    var mainStroke = opts.stroke || Math.max(1.4, size * 0.07);
    ctx.strokeStyle = cfg.INK;
    ctx.lineWidth = mainStroke;
    ctx.stroke();
    ctx.save();
    ctx.translate(0.8, -0.6);
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = Math.max(0.8, mainStroke * 0.55);
    ctx.stroke();
    ctx.restore();
    ctx.restore();
  }

  /** 排线填充（裁剪在已建立的路径内），墙壁质感 */
  function hatchClip(ctx, x, y, w, h, spacing) {
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = 'rgba(58,50,56,0.35)';
    ctx.lineWidth = 1;
    var step = spacing || 12;
    for (var d = -h; d < w + h; d += step) {
      ctx.beginPath();
      ctx.moveTo(x + d, y + h + 2);
      ctx.lineTo(x + d + h + 4, y - 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  /** 内部墙矩形：灰色蜡笔底 + 斜线排线 */
  function drawWallRect(ctx, r, seed) {
    wobblyRoundRect(ctx, r.x, r.y, r.w, r.h, 8, seed, seed + 3, 2.2);
    ctx.fillStyle = cfg.WALL_FILL;
    ctx.fill();
    hatchClip(ctx, r.x, r.y, r.w, r.h, 14);
    wobblyRoundRect(ctx, r.x, r.y, r.w, r.h, 8, seed, seed + 3, 2.2);
    ctx.strokeStyle = cfg.INK;
    ctx.lineWidth = 2.2;
    ctx.stroke();
  }

  /**
   * 边界墙：世界四周的墙带（带视口裁剪，只画可见带）。
   * 直接复用内部墙 drawWallRect 的画法（蜡笔灰底 + 斜线排线 + 深色描边），
   * 与里面的墙「同一个效果」，一眼可读"这是墙不能碰"；撞界判定不变（逻辑仍在 walls.hitsCircle）。
   */
  /**
   * 边界墙：世界四周的墙带（带视口裁剪，只画可见带）。
   * 与地图内部墙使用同一套 drawWallRect 画法（蜡笔灰底 + 斜线排线 + 深色描边），
   * 视觉完全统一；撞界判定不变（逻辑仍在 walls.hitsCircle）。
   */
  function drawBoundary(ctx, walls, cam, vw, vh) {
    var T = cfg.WALL_THICK;
    var bands = [
      { x: -T, y: -T, w: walls.W + 2 * T, h: T },  // 上
      { x: -T, y: walls.H, w: walls.W + 2 * T, h: T }, // 下
      { x: -T, y: 0, w: T, h: walls.H },           // 左
      { x: walls.W, y: 0, w: T, h: walls.H }       // 右
    ];
    for (var i = 0; i < 4; i++) {
      var b = bands[i];
      if (b.x + b.w < cam.x || b.x > cam.x + vw || b.y + b.h < cam.y || b.y > cam.y + vh) continue;
      drawWallRect(ctx, b, 91 + i);   // 与地图内部墙同一套蜡笔排线视觉
    }
    // 世界内边缘：一道明显粗黑线，明确「可玩范围界线、碰即死」
    wobblyRoundRect(ctx, 0, 0, walls.W, walls.H, 6, 5, 5, 3.0);
    ctx.strokeStyle = cfg.INK;
    ctx.lineWidth = 3.4;
    ctx.stroke();
  }

  /** 万能色蛇节：白底蜡笔块 + 彩色描边 + 中心手绘星标（一眼可辨「万能、通配任何色」） */
  function drawWildSeg(ctx, px, py, size, seedX, seedY) {
    var r = size * 0.30;
    wobblyRoundRect(ctx, 0, 0, size, size, r, seedX, seedY, 1.1);
    ctx.fillStyle = '#FFFDF5';
    ctx.fill();
    crayonStrokes(ctx, 0, 0, size, size, seedX, seedY);
    ctx.strokeStyle = cfg.INK;
    ctx.lineWidth = cfg.SEG_STROKE;
    ctx.stroke();
    ctx.save();
    ctx.translate(0.8, -0.6);
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = Math.max(0.8, cfg.SEG_STROKE * 0.55);
    ctx.stroke();
    ctx.restore();
    // 四角彩色小点（暗示「可匹配任意颜色」）
    var cols = ['#E8552F', '#4A7FD4', '#6FBF4A', '#F5A623'];
    for (var c = 0; c < 4; c++) {
      ctx.beginPath();
      ctx.arc(size * (0.3 + 0.4 * (c % 2)), size * (0.3 + 0.4 * (c < 2 ? 0 : 1)), size * 0.07, 0, Math.PI * 2);
      ctx.fillStyle = cols[c];
      ctx.fill();
    }
    starPath(ctx, size / 2, size / 2, size * 0.20, 0.3);
    ctx.fillStyle = '#FFD94A';
    ctx.fill();
    ctx.strokeStyle = cfg.INK;
    ctx.lineWidth = 1.1;
    ctx.stroke();
  }

  /**
   * 特殊道具绘制（地图上的万能色/炸弹/减速）。普通色块由 drawCrayonBlock 处理。
   * @param {string} kind 'wild' | 'bomb' | 'slow'
   */
  /**
   * 特殊道具绘制（地图上的万能色/炸弹/减速/消色/后3消色/随机消N）。
   * 统一：先 translate 到块中心 + 脉动缩放，再按 kind 画；白底块一律加粗黑灰描边（浅色场景可见）。
   * @param {string} kind 'wild' | 'bomb' | 'slow' | 'clear' | 'clear3' | 'rand1|2|3'
   */
  function drawItemBlock(ctx, b, cx, cy, size, seedX, seedY, rot, pulse) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(pulse, pulse);

    if (b.kind === 'wild') {
      // 万能色：白底块 + 角上四色点 + 中心星标 + 粗黑描边
      drawCrayonBlock(ctx, -size / 2, -size / 2, size, '#FFFDF5', seedX, seedY, { rot: rot, wobble: 1.0 });
      var cols = ['#E8552F', '#4A7FD4', '#6FBF4A', '#F5A623'];
      for (var c = 0; c < 4; c++) {
        ctx.beginPath();
        ctx.arc(Math.cos(c * Math.PI / 2) * size * 0.34, Math.sin(c * Math.PI / 2) * size * 0.34, size * 0.10, 0, Math.PI * 2);
        ctx.fillStyle = cols[c]; ctx.fill();
        ctx.strokeStyle = cfg.INK; ctx.lineWidth = 1; ctx.stroke();
      }
      starPath(ctx, 0, 0, size * 0.24, 0.3);
      ctx.fillStyle = '#FFD94A'; ctx.fill();
      ctx.strokeStyle = cfg.INK; ctx.lineWidth = 1.2; ctx.stroke();
      // 白底在浅色/白色场景易隐形 → 粗黑灰描边
      wobblyRoundRect(ctx, -size / 2, -size / 2, size, size, size * 0.28, seedX, seedY, 1.0);
      ctx.strokeStyle = cfg.INK; ctx.lineWidth = Math.max(2.5, size * 0.13); ctx.stroke();

    } else if (b.kind === 'bomb') {
      // 炸弹：深灰圆 + 引线火光
      ctx.beginPath(); ctx.arc(0, 0, size * 0.42, 0, Math.PI * 2);
      ctx.fillStyle = '#3A3238'; ctx.fill();
      ctx.strokeStyle = cfg.INK; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -size * 0.42);
      ctx.quadraticCurveTo(size * 0.18, -size * 0.62, size * 0.06, -size * 0.72);
      ctx.strokeStyle = cfg.INK; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.beginPath(); ctx.arc(size * 0.06, -size * 0.72, size * 0.09, 0, Math.PI * 2);
      ctx.fillStyle = '#F5A623'; ctx.fill();
      ctx.strokeStyle = cfg.INK; ctx.lineWidth = 1; ctx.stroke();

    } else if (b.kind === 'slow') {
      // 减速：蓝绿圆 + 时钟指针
      ctx.beginPath(); ctx.arc(0, 0, size * 0.44, 0, Math.PI * 2);
      ctx.fillStyle = '#2EC4B6'; ctx.fill();
      ctx.strokeStyle = cfg.INK; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -size * 0.26);
      ctx.moveTo(0, 0); ctx.lineTo(size * 0.20, size * 0.06);
      ctx.strokeStyle = '#FFFDF5'; ctx.lineWidth = 2; ctx.stroke();

    } else if (b.kind === 'clear') {
      // 消色（全部）：该色块 + 12 道粗放射线 + 外环，表达「整片清掉」
      drawCrayonBlock(ctx, -size / 2, -size / 2, size, cfg.COLORS[b.color], seedX, seedY, { rot: rot, wobble: 1.0 });
      wobblyRoundRect(ctx, -size / 2, -size / 2, size, size, size * 0.28, seedX, seedY, 1.0);
      ctx.strokeStyle = cfg.INK; ctx.lineWidth = Math.max(1.8, size * 0.07); ctx.stroke();
      ctx.strokeStyle = cfg.INK; ctx.lineWidth = Math.max(2, size * 0.10);
      for (var a = 0; a < 12; a++) {
        var an = a * Math.PI / 6;
        ctx.beginPath();
        ctx.moveTo(Math.cos(an) * size * 0.16, Math.sin(an) * size * 0.16);
        ctx.lineTo(Math.cos(an) * size * 0.47, Math.sin(an) * size * 0.47);
        ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0, 0, size * 0.5, 0, Math.PI * 2);
      ctx.strokeStyle = cfg.INK; ctx.lineWidth = Math.max(1.8, size * 0.07); ctx.stroke();

    } else if (b.kind === 'clear3') {
      // 后 3 消色：该色块 + 居中大号「×3」
      drawCrayonBlock(ctx, -size / 2, -size / 2, size, cfg.COLORS[b.color], seedX, seedY, { rot: rot, wobble: 1.0 });
      wobblyRoundRect(ctx, -size / 2, -size / 2, size, size, size * 0.28, seedX, seedY, 1.0);
      ctx.strokeStyle = cfg.INK; ctx.lineWidth = Math.max(1.8, size * 0.07); ctx.stroke();
      ctx.font = 'bold ' + Math.round(size * 0.62) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = Math.max(2, size * 0.10); ctx.strokeStyle = '#FFFDF5';
      ctx.strokeText('×3', 0, 1);
      ctx.fillStyle = cfg.INK; ctx.fillText('×3', 0, 1);

    } else if (b.kind === 'rand1' || b.kind === 'rand2' || b.kind === 'rand3') {
      // 随机消除：白底块 + 粗黑描边 + 居中大号数字 + ? 角标
      drawCrayonBlock(ctx, -size / 2, -size / 2, size, '#FFFDF5', seedX, seedY, { rot: rot, wobble: 1.0 });
      wobblyRoundRect(ctx, -size / 2, -size / 2, size, size, size * 0.28, seedX, seedY, 1.0);
      ctx.strokeStyle = cfg.INK; ctx.lineWidth = Math.max(2.5, size * 0.13); ctx.stroke();
      var n = b.kind === 'rand1' ? 1 : (b.kind === 'rand2' ? 2 : 3);
      ctx.font = 'bold ' + Math.round(size * 0.6) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = Math.max(2, size * 0.10); ctx.strokeStyle = '#FFFDF5';
      ctx.strokeText(String(n), 0, 1);
      ctx.fillStyle = cfg.INK; ctx.fillText(String(n), 0, 1);
      ctx.font = 'bold ' + Math.round(size * 0.28) + 'px sans-serif';
      ctx.fillStyle = cfg.INK; ctx.fillText('?', size * 0.30, -size * 0.30);

    } else if (b.kind === 'meteor') {
      // 流星砖块：会直线飞行的彩色砖块（与游戏内 drawMeteor 一致：彩色蜡笔砖 + 淡拖尾）
      var mc = cfg.COLORS[b.color] || '#E8552F';
      // 身后拖尾：几个依次变淡的残影，指示飞行方向（向右下飞入）
      for (var mt = 3; mt >= 1; mt--) {
        ctx.beginPath();
        ctx.arc(-size * 0.20 * mt, -size * 0.12 * mt, size * (0.30 - 0.05 * mt), 0, Math.PI * 2);
        ctx.fillStyle = mc;
        ctx.globalAlpha = 0.22 * (4 - mt);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      // 本体：彩色蜡笔砖块
      drawCrayonBlock(ctx, -size / 2, -size / 2, size, mc, seedX, seedY, { rot: 0.2, wobble: 1.0, stroke: cfg.SEG_STROKE });

    } else {
      // 普通色块（默认）：纯色蜡笔砖块（带描边），即游戏内最常见的色块
      drawCrayonBlock(ctx, -size / 2, -size / 2, size, cfg.COLORS[b.color], seedX, seedY, { rot: rot, wobble: 1.0 });
    }

    // 稀有度边框：在方块外侧加一道明显加粗的彩色描边（强→弱：蓝/紫/橙），一眼可辨道具强度
    var rar = b.rarity || (b.kind && cfg.ITEM_RARITY ? cfg.ITEM_RARITY[b.kind] : null);
    if (rar && cfg.RARITY_COLORS && cfg.RARITY_COLORS[rar]) {
      wobblyRoundRect(ctx, -size / 2 - 3, -size / 2 - 3, size + 6, size + 6, size * 0.34, seedX, seedY, 1.1);
      ctx.strokeStyle = cfg.RARITY_COLORS[rar];
      ctx.lineWidth = Math.max(3, size * 0.17);
      ctx.stroke();
    }

    ctx.restore();
  }

  /**
   * 流星砖块：带拖尾的彩色光球（在 drawPlay 已做相机平移的世界坐标系内绘制）。
   * @param {object} m {x,y,color,trail}
   */
  function drawMeteor(ctx, m) {
    // 拖尾：淡淡的运动残影，指示来向
    for (var t = 0; t < m.trail.length; t++) {
      var p = m.trail[t];
      var a = (t + 1) / m.trail.length;
      ctx.beginPath();
      ctx.arc(p.x, p.y, cfg.METEOR_RADIUS * (0.4 + 0.4 * t / m.trail.length), 0, Math.PI * 2);
      ctx.fillStyle = cfg.COLORS[m.color];
      ctx.globalAlpha = a * 0.25;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // 本体：会移动的彩色蜡笔砖块（不是流星光球，就是移动中的砖）
    var size = cfg.METEOR_RADIUS * 2;
    drawCrayonBlock(ctx, m.x - size / 2, m.y - size / 2, size, cfg.COLORS[m.color],
      Math.round(m.x / 10), Math.round(m.y / 10), { rot: 0.2, wobble: 1.0, stroke: cfg.SEG_STROKE });
  }

  /**
   * 尾巴节（v2.3+）：不可消除的尾巴节，一眼可辨「消不掉」。
   * 重做版：主体为深色圆润圆角蜡笔块（与颜色节统一风格，不突兀），
   * 朝外方向再叠一个小小的圆润尾尖（深色小半圆），整体可爱、不像尖三角。
   * @param {number} dx,dy 尾巴朝向单位向量（指向蛇尾外侧）
   */
  function drawTail(ctx, cx, cy, dx, dy, size, seedX, seedY) {
    var jx = (u.hash2(seedX, seedY, 60) - 0.5) * 2.0;
    var jy = (u.hash2(seedY, seedX, 70) - 0.5) * 2.0;
    // 主体：深色圆润圆角块（与颜色节同风格）
    drawCrayonBlock(ctx, cx - size / 2 + jx, cy - size / 2 + jy, size, cfg.TAIL_COLOR, seedX, seedY, {
      rot: (u.hash2(seedX, seedY, 3) - 0.5) * 0.4, wobble: 1.0
    });
    // 朝外小圆润尾尖（短、圆，不突兀）
    var tipX = cx + dx * size * 0.5, tipY = cy + dy * size * 0.5;
    ctx.beginPath();
    ctx.arc(tipX, tipY, size * 0.24, 0, Math.PI * 2);
    ctx.fillStyle = cfg.TAIL_COLOR;
    ctx.fill();
    ctx.strokeStyle = cfg.INK;
    ctx.lineWidth = 1.6;
    ctx.stroke();
  }

  /** 蛇头眼睛（朝向跟随移动方向 dir 单位向量） */
  function drawEyes(ctx, cx, cy, size, dir) {
    var fx = dir.x * size * 0.16, fy = dir.y * size * 0.16;  // 整体朝前移
    var pxp = -dir.y, pyp = dir.x;                            // 垂直方向
    var sep = size * 0.2, r = size * 0.13;
    for (var s = -1; s <= 1; s += 2) {
      var ex = cx + fx + pxp * sep * s;
      var ey = cy + fy + pyp * sep * s;
      ctx.beginPath();
      ctx.arc(ex, ey, r, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFDF5';
      ctx.fill();
      ctx.strokeStyle = cfg.INK;
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(ex + dir.x * r * 0.45, ey + dir.y * r * 0.45, r * 0.45, 0, Math.PI * 2);
      ctx.fillStyle = cfg.INK;
      ctx.fill();
    }
  }

  /** 五角星路径 */
  function starPath(ctx, cx, cy, r, rot) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var rr = i % 2 === 0 ? r : r * 0.45;
      var a = rot + i * Math.PI / 5 - Math.PI / 2;
      var x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  /** 冠军皇冠涂鸦（多人结算第 1 名标题用）：三折尖顶 + 尖顶圆珠 */
  function drawCrown(ctx, cx, cy, w, h) {
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, cy + h / 2);
    ctx.lineTo(cx - w / 2, cy - h * 0.15);
    ctx.lineTo(cx - w * 0.22, cy + h * 0.12);
    ctx.lineTo(cx, cy - h / 2);
    ctx.lineTo(cx + w * 0.22, cy + h * 0.12);
    ctx.lineTo(cx + w / 2, cy - h * 0.15);
    ctx.lineTo(cx + w / 2, cy + h / 2);
    ctx.closePath();
    ctx.fillStyle = '#FFD94A';
    ctx.fill();
    ctx.strokeStyle = cfg.INK;
    ctx.lineWidth = 2.2;
    ctx.stroke();
    var tips = [[cx - w / 2, cy - h * 0.15], [cx, cy - h / 2], [cx + w / 2, cy - h * 0.15]];
    for (var i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(tips[i][0], tips[i][1] - 3, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFDF5';
      ctx.fill();
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
    ctx.restore();
  }

  /**
   * 多人结算统计行的手绘小图标（纯 canvas 涂鸦，不用外部图）。
   * @param {string} kind medal/clock/star/spark/block/burst/snake
   * @param {number} s 图标外接尺寸（px）
   */
  function drawStatIcon(ctx, kind, cx, cy, s) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 2;
    ctx.strokeStyle = cfg.INK;
    if (kind === 'medal') {            // 排名：绶带 + 圆牌奖章
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.26, cy - s * 0.5);
      ctx.lineTo(cx, cy - s * 0.08);
      ctx.lineTo(cx + s * 0.26, cy - s * 0.5);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy + s * 0.16, s * 0.36, 0, Math.PI * 2);
      ctx.fillStyle = '#FFD94A';
      ctx.fill();
      ctx.stroke();
      starPath(ctx, cx, cy + s * 0.16, s * 0.16, 0.3);
      ctx.fillStyle = '#C47F17';
      ctx.fill();
    } else if (kind === 'clock') {     // 存活时间 / 时间分：小闹钟
      ctx.beginPath();
      ctx.arc(cx, cy, s * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFDF5';
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx, cy - s * 0.24);
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + s * 0.18, cy + s * 0.08);
      ctx.stroke();
    } else if (kind === 'star') {      // 总分：大星星
      starPath(ctx, cx, cy, s * 0.48, 0.2);
      ctx.fillStyle = '#FFD94A';
      ctx.fill();
      ctx.stroke();
    } else if (kind === 'spark') {     // 消除分：四角闪光
      ctx.beginPath();
      ctx.moveTo(cx, cy - s * 0.5);
      ctx.quadraticCurveTo(cx, cy, cx + s * 0.5, cy);
      ctx.quadraticCurveTo(cx, cy, cx, cy + s * 0.5);
      ctx.quadraticCurveTo(cx, cy, cx - s * 0.5, cy);
      ctx.quadraticCurveTo(cx, cy, cx, cy - s * 0.5);
      ctx.fillStyle = cfg.COLORS.purple;
      ctx.fill();
      ctx.stroke();
    } else if (kind === 'block') {     // 累计消除方块：蜡笔小方块
      drawCrayonBlock(ctx, cx - s * 0.4, cy - s * 0.4, s * 0.8, cfg.COLORS.teal, 61, 13, { wobble: 0.8 });
    } else if (kind === 'burst') {     // 击杀数：爆炸尖角
      ctx.beginPath();
      for (var i = 0; i < 8; i++) {
        var a = i * Math.PI / 4 - Math.PI / 2;
        var rr = i % 2 === 0 ? s * 0.5 : s * 0.22;
        var px2 = cx + Math.cos(a) * rr, py2 = cy + Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
      }
      ctx.closePath();
      ctx.fillStyle = cfg.COLORS.red;
      ctx.fill();
      ctx.stroke();
    } else if (kind === 'snake') {     // 最终节数：小蛇波浪线 + 头点
      ctx.strokeStyle = cfg.COLORS.green;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.45, cy + s * 0.15);
      ctx.quadraticCurveTo(cx - s * 0.2, cy - s * 0.35, cx + s * 0.05, cy + s * 0.1);
      ctx.quadraticCurveTo(cx + s * 0.25, cy + s * 0.4, cx + s * 0.4, cy - s * 0.05);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx + s * 0.42, cy - s * 0.08, s * 0.15, 0, Math.PI * 2);
      ctx.fillStyle = cfg.COLORS.green;
      ctx.fill();
      ctx.strokeStyle = cfg.INK;
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
    ctx.restore();
  }

  function Renderer(ctx, screenW, screenH) {
    this.ctx = ctx;
    this.W = screenW;
    this.H = screenH;
  }

  Renderer.prototype.resize = function (w, h) {
    this.W = w;
    this.H = h;
  };

  Renderer.prototype.drawBackground = function () {
    var ctx = this.ctx;
    ctx.fillStyle = cfg.PAPER;
    ctx.fillRect(0, 0, this.W, this.H);
    var tile = getNoiseTile();
    if (tile) {
      for (var x = 0; x < this.W; x += 160) {
        for (var y = 0; y < this.H; y += 160) ctx.drawImage(tile, x, y);
      }
    }
  };

  // ---------------- 对局场景（相机视口区） ----------------

  Renderer.prototype.drawPlay = function (game) {
    var ctx = this.ctx, l = game.layout();
    var walls = game.walls, snake = game.snake, spawner = game.spawner;
    var cam = game.camera;
    var vw = l.areaW, vh = this.H;

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, vw, vh);
    ctx.clip();                       // 世界内容裁剪在视口区
    ctx.translate(-cam.x, -cam.y);    // 相机变换

    // 世界外区域压暗（衬托可玩范围）
    var M = Math.max(vw, vh) + 80;
    ctx.fillStyle = 'rgba(58,50,56,0.10)';
    ctx.fillRect(-M, -M, walls.W + 2 * M, M);
    ctx.fillRect(-M, walls.H, walls.W + 2 * M, M);
    ctx.fillRect(-M, 0, M, walls.H);
    ctx.fillRect(walls.W, 0, M, walls.H);

    // 视口内的淡墨点阵（运动参照物，帮助感知移动）
    ctx.fillStyle = 'rgba(58,50,56,0.10)';
    var step = 140;
    var x0 = Math.max(0, Math.floor(cam.x / step) * step);
    var y0 = Math.max(0, Math.floor(cam.y / step) * step);
    var x1 = Math.min(walls.W, cam.x + vw);
    var y1 = Math.min(walls.H, cam.y + vh);
    for (var gx = x0; gx <= x1; gx += step) {
      for (var gy = y0; gy <= y1; gy += step) {
        ctx.beginPath();
        ctx.arc(gx, gy, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 边界墙 + 内部墙
    drawBoundary(ctx, walls, cam, vw, vh);
    for (var i = 0; i < walls.rects.length; i++) {
      var r = walls.rects[i];
      if (r.x + r.w < cam.x - 20 || r.x > cam.x + vw + 20 ||
          r.y + r.h < cam.y - 20 || r.y > cam.y + vh + 20) continue; // 视口裁剪
      drawWallRect(ctx, r, i + 11);
    }

    // 道具：普通色块 + 特殊道具（万能色/炸弹/减速）；略小、旋转 + 脉动
    var bs = cfg.BLOCK_RADIUS * 2;
    for (i = 0; i < spawner.blocks.length; i++) {
      var b = spawner.blocks[i];
      if (b.x < cam.x - 40 || b.x > cam.x + vw + 40 || b.y < cam.y - 40 || b.y > cam.y + vh + 40) continue;
      var pulse = 1 + 0.09 * Math.sin(game.timeMs / 280 + b.phase);
      var seedX = Math.round(b.x / 10), seedY = Math.round(b.y / 10);
      if (b.kind && b.kind !== 'color') {
        drawItemBlock(ctx, b, b.x, b.y, bs, seedX, seedY, (u.hash2(seedX, seedY, 7) - 0.5) * 0.55, pulse);
      } else {
        drawCrayonBlock(ctx, b.x - bs / 2, b.y - bs / 2, bs, cfg.COLORS[b.color], seedX, seedY, {
          rot: (u.hash2(seedX, seedY, 7) - 0.5) * 0.55,
          scale: pulse,
          wobble: 1.0
        });
      }
    }

    // 流星砖块：带拖尾的彩色光球，从四周飞入命中身体
    for (i = 0; i < spawner.meteors.length; i++) {
      var m = spawner.meteors[i];
      if (m.x < cam.x - 60 || m.x > cam.x + vw + 60 || m.y < cam.y - 60 || m.y > cam.y + vh + 60) continue;
      drawMeteor(ctx, m);
    }

    // 蛇：从尾画到头，头在最上层；节为圆形蜡笔块沿轨迹排布
    // 节间距 SEG_SPACING ≥ 直径+间隙，描边 SEG_STROKE 加粗加深——相邻节一眼可辨、可逐个数清
    // 多人对战：被咬的蛇附带 MP_BITE_FLASH_MS 毫秒的闪白 + 抖动反馈
    var playerFlash = 0;
    if (game.mode === 'multi' && game.mp && game.mp.playerEntry) {
      playerFlash = Math.max(0, game.mp.playerEntry.bittenUntil - game.mp.timeMs);
    }
    this.drawSnakeBody(snake, cam, vw, vh, 200, playerFlash);
    // 多人对战：AI 蛇（同一套蜡笔渲染）+ 头顶昵称标签
    if (game.mode === 'multi' && game.mp) {
      var bots = game.mp.bots;
      for (i = 0; i < bots.length; i++) {
        if (!bots[i].alive) continue;
        var botFlash = Math.max(0, bots[i].bittenUntil - game.mp.timeMs);
        this.drawSnakeBody(bots[i].snake, cam, vw, vh, 200 + bots[i].id * 131, botFlash);
      }
      this.drawNameLabels(game, cam, vw, vh);
    }

    // 粒子（世界坐标，随相机）
    this.drawParticles(game);

    ctx.restore();
  };

  /**
   * 画一条蛇的身体（玩家/AI 共用）：seedBase 区分不同蛇的手绘抖动种子。
   * segPos 比 colors 多 1 节：末尾恒为尾巴节（v2.3），画成深色蜡笔小尾鳍，
   * 一眼可辨"这节消不掉"；尾巴节不做闪白覆盖（不可被咬），但随全蛇一起抖动。
   * @param {number} flashMs 被咬反馈剩余毫秒（>0 时全节闪白 + 抖动，幅度随剩余时间衰减）
   */
  Renderer.prototype.drawSnakeBody = function (snake, cam, vw, vh, seedBase, flashMs) {
    var ctx = this.ctx;
    var ss = cfg.SEG_RADIUS * 2;
    var n = snake.segPos.length; // = colors.length + 1（末尾为尾巴节）
    var shake = flashMs > 0 ? Math.min(1, flashMs / cfg.MP_BITE_FLASH_MS) : 0;
    var tb = Math.floor((flashMs || 0) / 45); // 抖动时间桶：每 45ms 换一组确定性偏移
    for (var i = n - 1; i >= 0; i--) {
      var p = snake.segPos[i];
      var ox2 = 0, oy2 = 0;
      if (shake > 0) { // 被咬抖动（种子含时间桶，画面抖动但不随机闪烁）
        ox2 = (u.hash2(i + seedBase, tb, 91) - 0.5) * 7 * shake;
        oy2 = (u.hash2(tb, i + seedBase, 92) - 0.5) * 7 * shake;
      }
      var px = p.x + ox2, py = p.y + oy2;
      if (px < cam.x - 60 || px > cam.x + vw + 60 || py < cam.y - 60 || py > cam.y + vh + 60) continue;
      if (snake.colors[i] === 'wild') { // 万能色节：白底星标块（消除时通配任意相邻同色）
        ctx.save();
        ctx.translate(px - ss / 2, py - ss / 2);
        drawWildSeg(ctx, 0, 0, ss, seedBase + i, 41);
        ctx.restore();
        if (shake > 0) {
          ctx.save();
          ctx.globalAlpha = 0.6 * shake;
          ctx.save();
          ctx.translate(px - ss / 2, py - ss / 2);
          drawWildSeg(ctx, 0, 0, ss, seedBase + i, 41);
          ctx.restore();
          ctx.restore();
        }
        if (i === 0) drawEyes(ctx, px, py, ss, snake.headDir());
        continue;
      }
      if (i >= snake.colors.length) { // 尾巴节：深色圆润圆块 + 小尾尖，朝向 = 前一节 → 尾巴节
        var prev = snake.segPos[i - 1] ||
          { x: p.x - Math.cos(snake.angle) * cfg.SEG_SPACING, y: p.y - Math.sin(snake.angle) * cfg.SEG_SPACING };
        var tdx = p.x - prev.x, tdy = p.y - prev.y;
        var tl = Math.sqrt(tdx * tdx + tdy * tdy) || 1;
        drawTail(ctx, px, py, tdx / tl, tdy / tl, ss, seedBase + i, 43);
        continue;
      }
      var rot = (u.hash2(i, 77, 3) - 0.5) * 0.5;
      var wob = i === 0 ? 0.8 : 1.2;
      drawCrayonBlock(ctx, px - ss / 2, py - ss / 2, ss, cfg.COLORS[snake.colors[i]], seedBase + i, 41, {
        rot: rot, wobble: wob, stroke: cfg.SEG_STROKE
      });
      if (shake > 0) { // 闪白覆盖（纸白蜡笔块，透明度随剩余时间衰减）
        ctx.save();
        ctx.globalAlpha = 0.6 * shake;
        drawCrayonBlock(ctx, px - ss / 2, py - ss / 2, ss, '#FFFDF5', seedBase + i, 41, {
          rot: rot, wobble: wob, stroke: cfg.SEG_STROKE
        });
        ctx.restore();
      }
      if (i === 0) drawEyes(ctx, px, py, ss, snake.headDir());
    }
  };

  /** 多人对战：头顶昵称小手绘标签（深色描边文字，无底板；玩家标签为「我」，蜡笔黄） */
  Renderer.prototype.drawNameLabels = function (game, cam, vw, vh) {
    var ctx = this.ctx;
    var es = game.mp.allEntries();
    ctx.save();
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.lineJoin = 'round';
    for (var i = 0; i < es.length; i++) {
      var e = es[i];
      if (!e.alive) continue;
      var hx = e.snake.x, hy = e.snake.y - cfg.SEG_RADIUS - 8;
      if (hx < cam.x - 40 || hx > cam.x + vw + 40 || hy < cam.y - 40 || hy > cam.y + vh + 40) continue;
      ctx.lineWidth = 3;
      ctx.strokeStyle = cfg.INK;
      ctx.strokeText(e.name, hx, hy);
      ctx.fillStyle = e.isPlayer ? '#FFD94A' : '#FFFDF5';
      ctx.fillText(e.name, hx, hy);
    }
    ctx.restore();
  };

  // ---------------- 粒子 ----------------

  Renderer.prototype.drawParticles = function (game) {
    var ctx = this.ctx;
    for (var i = 0; i < game.particles.list.length; i++) {
      var p = game.particles.list[i];
      var t = p.life / p.maxLife; // 1 → 0
      if (p.type === 'crumb') {
        ctx.save();
        ctx.globalAlpha = Math.min(1, t * 1.6);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
        ctx.strokeStyle = cfg.INK;
        ctx.lineWidth = 0.8;
        ctx.strokeRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
        ctx.restore();
      } else if (p.type === 'star') {
        var prog = 1 - t;
        var sc = p.scale || 1; // 连锁逐级放大
        ctx.save();
        ctx.globalAlpha = t;
        starPath(ctx, p.x, p.y, (8 + prog * 34) * sc, prog * 0.6);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.strokeStyle = cfg.INK;
        ctx.lineWidth = 1.6 * Math.min(sc, 1.6);
        ctx.stroke();
        ctx.restore();
      } else if (p.type === 'text') {
        // 连锁文字：手绘风「N连锁！」，深色描边 + 蜡笔黄填充，上飘淡出
        ctx.save();
        ctx.globalAlpha = Math.min(1, t * 2.2); // 短暂停留，末尾淡出
        ctx.font = 'bold ' + Math.round(p.size) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.lineWidth = Math.max(3, p.size * 0.16);
        ctx.strokeStyle = cfg.INK;
        ctx.strokeText(p.text, p.x, p.y);
        ctx.fillStyle = '#FFD94A';
        ctx.fillText(p.text, p.x, p.y);
        ctx.restore();
      } else if (p.type === 'ring') {
        // 消除高亮：扩张圆环 + 中心 ✕，标出被消除节位置（非连续消除也清楚可见）
        var prog = 1 - t; // 0 → 1
        ctx.save();
        ctx.globalAlpha = Math.min(1, t * 1.5);
        var sc = p.scale || 1;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(2, 3 * (1 - prog) + 1.5);
        ctx.beginPath();
        ctx.arc(p.x, p.y, (5 + prog * 30) * sc, 0, Math.PI * 2);
        ctx.stroke();
        var s = 6 * sc;
        ctx.lineWidth = Math.max(1.5, 2 * sc);
        ctx.beginPath();
        ctx.moveTo(p.x - s, p.y - s); ctx.lineTo(p.x + s, p.y + s);
        ctx.moveTo(p.x + s, p.y - s); ctx.lineTo(p.x - s, p.y + s);
        ctx.stroke();
        ctx.restore();
      } else if (p.type === 'streak') {
        // 自吃牵引线：从身体接触点拉向蛇头，表达「砖块被吸到头部」
        ctx.save();
        ctx.globalAlpha = Math.min(1, t * 1.8);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(2.5, 4 * t + 1);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.x1, p.y1);
        ctx.lineTo(p.x2, p.y2);
        ctx.stroke();
        // 头部端的箭头小三角（指示被拉过去的方向）
        var ang = Math.atan2(p.y2 - p.y1, p.x2 - p.x1);
        var ah = 7;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(p.x2, p.y2);
        ctx.lineTo(p.x2 - Math.cos(ang - 0.4) * ah, p.y2 - Math.sin(ang - 0.4) * ah);
        ctx.lineTo(p.x2 - Math.cos(ang + 0.4) * ah, p.y2 - Math.sin(ang + 0.4) * ah);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }
  };

  // ---------------- 小地图 ----------------

  /** HUD 内小地图：世界边界、墙、色块、视口框、蛇头亮点 */
  Renderer.prototype.drawMinimap = function (game, mx, my, mw) {
    var ctx = this.ctx, walls = game.walls;
    var scale = mw / walls.W;
    var mh = walls.H * scale;

    // 底
    wobblyRoundRect(ctx, mx, my, mw, mh, 4, 17, 29, 1.0);
    ctx.fillStyle = '#F3ECDD';
    ctx.fill();
    ctx.save();
    ctx.clip();

    // 边界墙带（与世界内一致的排线墙样式：灰底 + 斜线排线 + 细描边）
    var bt = Math.max(2.5, cfg.WALL_THICK * scale);
    var strips = [
      { x: mx, y: my, w: mw, h: bt },            // 上
      { x: mx, y: my + mh - bt, w: mw, h: bt },  // 下
      { x: mx, y: my, w: bt, h: mh },            // 左
      { x: mx + mw - bt, y: my, w: bt, h: mh }   // 右
    ];
    for (i = 0; i < 4; i++) {
      var st = strips[i];
      ctx.fillStyle = cfg.WALL_FILL;
      ctx.fillRect(st.x, st.y, st.w, st.h);
      ctx.save();
      ctx.beginPath();
      ctx.rect(st.x, st.y, st.w, st.h);
      ctx.clip();
      ctx.strokeStyle = 'rgba(58,50,56,0.45)';
      ctx.lineWidth = 0.7;
      for (var d = -st.h; d < st.w + st.h; d += 4) {
        ctx.beginPath();
        ctx.moveTo(st.x + d, st.y + st.h + 1);
        ctx.lineTo(st.x + d + st.h + 2, st.y - 1);
        ctx.stroke();
      }
      ctx.restore();
      ctx.strokeStyle = cfg.INK;
      ctx.lineWidth = 0.8;
      ctx.strokeRect(st.x, st.y, st.w, st.h);
    }

    // 内部墙
    ctx.fillStyle = 'rgba(58,50,56,0.5)';
    for (var i = 0; i < walls.rects.length; i++) {
      var r = walls.rects[i];
      ctx.fillRect(mx + r.x * scale, my + r.y * scale, Math.max(1.5, r.w * scale), Math.max(1.5, r.h * scale));
    }
    // 色块
    for (i = 0; i < game.spawner.blocks.length; i++) {
      var b = game.spawner.blocks[i];
      ctx.fillStyle = cfg.COLORS[b.color];
      ctx.fillRect(mx + b.x * scale - 1, my + b.y * scale - 1, 2.5, 2.5);
    }
    // 视口框
    var l = game.layout();
    ctx.strokeStyle = 'rgba(58,50,56,0.45)';
    ctx.lineWidth = 1;
    ctx.strokeRect(mx + game.camera.x * scale, my + game.camera.y * scale,
      l.areaW * scale, this.H * scale);
    // 多人对战：AI 蛇亮点（各自头部颜色小点），画在玩家亮点下层
    if (game.mode === 'multi' && game.mp) {
      var bots = game.mp.bots;
      for (var bi = 0; bi < bots.length; bi++) {
        if (!bots[bi].alive) continue;
        var bsn = bots[bi].snake;
        ctx.beginPath();
        ctx.arc(mx + bsn.x * scale, my + bsn.y * scale, 2.2, 0, Math.PI * 2);
        ctx.fillStyle = cfg.COLORS[bsn.headColor()] || '#8A8278';
        ctx.fill();
      }
    }
    // 蛇头亮点（描边高光点，大地图里一眼定位）
    var hx = mx + game.snake.x * scale, hy = my + game.snake.y * scale;
    ctx.beginPath();
    ctx.arc(hx, hy, 3.2, 0, Math.PI * 2);
    ctx.fillStyle = '#FFD94A';
    ctx.fill();
    ctx.strokeStyle = cfg.INK;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();

    // 外框
    wobblyRoundRect(ctx, mx, my, mw, mh, 4, 17, 29, 1.0);
    ctx.strokeStyle = cfg.INK;
    ctx.lineWidth = 1.6;
    ctx.stroke();
    return mh;
  };

  // ---------------- 右侧 HUD 面板 ----------------

  Renderer.prototype.drawPanel = function (game) {
    var ctx = this.ctx, l = game.layout();
    var px = l.panelX, pw = l.panelW, H = this.H;
    var cx = px + pw / 2;

    ctx.save();
    // 面板底：略亮纸色 + 左侧手绘分隔线
    ctx.fillStyle = 'rgba(255,253,245,0.72)';
    ctx.fillRect(px, 0, pw, H);
    ctx.strokeStyle = 'rgba(58,50,56,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    var seg = 10;
    for (var i = 0; i <= seg; i++) {
      var ly = H * i / seg;
      var lx = px + (u.hash2(i, 7, 3) - 0.5) * 5;
      if (i === 0) ctx.moveTo(lx, ly); else ctx.lineTo(lx, ly);
    }
    ctx.stroke();

    ctx.fillStyle = cfg.INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 标题
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText('消食蛇', cx, 24);

    // 模式 / 关卡号
    ctx.font = '12px sans-serif';
    ctx.globalAlpha = 0.75;
    var modeText = game.mode === 'level' ? ('闯关模式 · 第 ' + game.levelCfg.level + ' 关')
      : (game.mode === 'multi' ? '多人对战 · 7 蛇同场' : '无尽模式');
    ctx.fillText(modeText, cx, 46);
    ctx.globalAlpha = 1;

    // 分数
    ctx.font = '11px sans-serif';
    ctx.globalAlpha = 0.6;
    ctx.fillText('分数', cx, 74);
    ctx.globalAlpha = 1;
    ctx.font = 'bold 28px sans-serif';
    ctx.fillText(String(game.score), cx, 100);

    // 目标 / 最高分 + 进度条
    ctx.font = 'bold 13px sans-serif';
    if (game.mode === 'level') {
      ctx.fillText('目标 ' + game.levelCfg.targetScore, cx, 126);
      var barW = pw - 44, barH = 9, bx = cx - barW / 2, by = 136;
      var prog = u.clamp(game.score / game.levelCfg.targetScore, 0, 1);
      wobblyRoundRect(ctx, bx, by, barW, barH, 4, 9, 3, 0.8);
      ctx.fillStyle = 'rgba(58,50,56,0.12)';
      ctx.fill();
      if (prog > 0.02) {
        wobblyRoundRect(ctx, bx, by, Math.max(8, barW * prog), barH, 4, 9, 3, 0.8);
        ctx.fillStyle = cfg.COLORS.green;
        ctx.fill();
      }
      wobblyRoundRect(ctx, bx, by, barW, barH, 4, 9, 3, 0.8);
      ctx.strokeStyle = cfg.INK;
      ctx.lineWidth = 1.4;
      ctx.stroke();
    } else if (game.mode === 'multi') {
      ctx.fillText('最佳 ' + Math.max(game.mpBest.len, game.snake.length()) + '节 · ' +
        Math.max(game.mpBest.score, game.score) + '分', cx, 126);
    } else {
      ctx.fillText('最高 ' + Math.max(game.best, game.score), cx, 126);
    }

    // 分数构成
    ctx.font = '10px sans-serif';
    ctx.globalAlpha = 0.6;
    ctx.fillText('存活 ' + game.survivalScore + ' · 消除 ' + game.elimScore, cx, 160);
    // 当前速度（动态加速可视化：随长度/时间提升，吃减速道具时回落）
    var spd = Math.round(game.currentSpeed());
    var slow = (game.slowUntil && game.timeMs < game.slowUntil);
    ctx.fillStyle = slow ? '#2EC4B6' : cfg.INK;
    ctx.fillText('速度 ' + spd + (slow ? ' (减速)' : '') + ' px/s', cx, 176);
    ctx.fillStyle = cfg.INK;
    ctx.globalAlpha = 1;

    // 多人对战：实时排行榜（按当前节数降序，玩家高亮加粗）
    var yOff = 0;
    if (game.mode === 'multi' && game.mp) {
      var lb = game.mp.leaderboard();
      ctx.font = '11px sans-serif';
      ctx.globalAlpha = 0.6;
      ctx.fillText('排行榜', cx, 180);
      ctx.globalAlpha = 1;
      var rowH = 16, ly = 194;
      for (var li = 0; li < lb.length; li++) {
        var rowY = ly + li * rowH;
        var row = lb[li];
        ctx.globalAlpha = row.isPlayer ? 1 : 0.8;
        ctx.fillStyle = row.isPlayer ? '#C47F17' : cfg.INK;
        ctx.font = (row.isPlayer ? 'bold ' : '') + '11px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText((li + 1) + '. ' + row.name, px + 16, rowY);
        ctx.textAlign = 'right';
        ctx.fillText(row.length + '节', px + pw - 16, rowY);
        ctx.textAlign = 'center';
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = cfg.INK;
      yOff = 30 + lb.length * rowH; // 排行榜占用的纵向高度，后续板块整体下移
    }

    // 已解锁颜色预览（4 列 x 2 行，未解锁灰色带叉）
    ctx.font = '11px sans-serif';
    ctx.globalAlpha = 0.6;
    ctx.fillText('已解锁颜色', cx, 186 + yOff);
    ctx.globalAlpha = 1;
    var sw = 20, gap = 7, cols = 4;
    var gridW = cols * sw + (cols - 1) * gap;
    var sx = cx - gridW / 2, sy = 196 + yOff;
    for (i = 0; i < cfg.MAX_COLORS; i++) {
      var col = i % cols, row = Math.floor(i / cols);
      var bx2 = sx + col * (sw + gap), by2 = sy + row * (sw + gap);
      if (i < game.unlockedCount) {
        drawCrayonBlock(ctx, bx2, by2, sw, cfg.COLORS[cfg.COLOR_KEYS[i]], 30 + i, 4, {
          rot: (u.hash2(i, 5, 2) - 0.5) * 0.3, wobble: 0.9
        });
      } else {
        ctx.save();
        ctx.globalAlpha = 0.45;
        wobblyRoundRect(ctx, bx2, by2, sw, sw, sw * 0.28, 30 + i, 4, 0.9);
        ctx.fillStyle = '#CFC8BC';
        ctx.fill();
        ctx.strokeStyle = cfg.INK;
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.beginPath(); // 锁定叉号
        ctx.moveTo(bx2 + sw * 0.3, by2 + sw * 0.3);
        ctx.lineTo(bx2 + sw * 0.7, by2 + sw * 0.7);
        ctx.moveTo(bx2 + sw * 0.7, by2 + sw * 0.3);
        ctx.lineTo(bx2 + sw * 0.3, by2 + sw * 0.7);
        ctx.stroke();
        ctx.restore();
      }
    }

    // 小地图
    var mapTop = sy + 2 * (sw + gap) + 18;
    ctx.font = '11px sans-serif';
    ctx.globalAlpha = 0.6;
    ctx.fillText('小地图', cx, mapTop);
    ctx.globalAlpha = 1;
    var mh = this.drawMinimap(game, px + 14, mapTop + 10, pw - 28);

    // 底部操作提示（空间不足时省略，多人模式面板较长）
    if (mapTop + 10 + mh < H - 60) {
      ctx.font = '11px sans-serif';
      ctx.globalAlpha = 0.55;
      ctx.fillText('方向键 / WASD 转向', cx, H - 44);
      ctx.fillText('或按住左下摇杆拖动', cx, H - 26);
    }
    ctx.restore();
  };

  // ---------------- 摇杆（固定底座，视口区左下角） ----------------

  Renderer.prototype.drawJoystick = function (game) {
    var j = game.joystick;
    var ctx = this.ctx;
    ctx.save();
    if (!j.active) {
      // 未激活：淡淡的提示圆盘
      ctx.globalAlpha = 0.28;
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = cfg.INK;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(j.baseX, j.baseY, j.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = cfg.INK;
      ctx.fillText('摇杆', j.baseX, j.baseY);
      ctx.restore();
      return;
    }
    ctx.globalAlpha = 0.55;
    // 底盘
    ctx.beginPath();
    ctx.arc(j.baseX, j.baseY, j.radius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,253,245,0.6)';
    ctx.fill();
    ctx.strokeStyle = cfg.INK;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    // 摇杆头
    ctx.beginPath();
    ctx.arc(j.knobX, j.knobY, 20, 0, Math.PI * 2);
    ctx.fillStyle = cfg.PANEL;
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  };

  // ---------------- 界面（菜单 / 选关 / 结算） ----------------

  Renderer.prototype.drawButton = function (b) {
    var ctx = this.ctx;
    ctx.save();
    ctx.globalAlpha = b.enabled ? 1 : 0.35;
    wobblyRoundRect(ctx, b.x, b.y, b.w, b.h, 12, Math.round(b.x), Math.round(b.y), 1.6);
    ctx.fillStyle = cfg.PANEL;
    ctx.fill();
    ctx.strokeStyle = cfg.INK;
    ctx.lineWidth = 2.2;
    ctx.stroke();
    ctx.save();
    ctx.translate(1, -0.8);
    ctx.globalAlpha *= 0.3;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = cfg.INK;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
    ctx.restore();
  };

  Renderer.prototype.drawOverlay = function (alpha) {
    var ctx = this.ctx;
    ctx.fillStyle = 'rgba(251,246,233,' + (alpha === undefined ? 0.94 : alpha) + ')';
    ctx.fillRect(0, 0, this.W, this.H);
  };

  Renderer.prototype.drawMenu = function (game) {
    var ctx = this.ctx;
    this.drawOverlay(0.0); // 主菜单直接用纸面
    var cx = this.W / 2;
    var ty = this.H * 0.22; // 标题基线 Y

    // ---- 标题「消食蛇」美术设计 ----
    // 设计意图：每个字用不同颜色（红=消除、绿=吃、蓝=蛇身），
    //   字间穿插小蜡笔色块（体现"蛇由色块组成"），
    //   底部蜡笔波浪下划线 + 少量砖块沿线缓慢往返滑动（手绘感，平滑不跳动）
    ctx.save();
    var titleChars = ['消', '食', '蛇'];
    var titleColors = [cfg.COLORS.red, cfg.COLORS.green, cfg.COLORS.blue]; // 红(消) 绿(食) 蓝(蛇)
    var fontSize = 52;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + fontSize + 'px sans-serif';

    // 测量总宽以便居中
    var totalW = 0;
    for (var tc = 0; tc < titleChars.length; tc++) totalW += ctx.measureText(titleChars[tc]).width;
    var charGap = 8; // 字间距
    totalW += charGap * (titleChars.length - 1);
    var startX = cx - totalW / 2;

    // 逐字绘制（每字独立颜色 + 轻微蜡笔描边）
    var curX = startX;
    for (var ci = 0; ci < titleChars.length; ci++) {
      var ch = titleChars[ci];
      var chW = ctx.measureText(ch).width;
      var chCx = curX + chW / 2;

      // 字体颜色（深色描边 + 彩色填充，保证在浅色背景可读）
      ctx.font = 'bold ' + fontSize + 'px sans-serif';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = cfg.INK;
      ctx.strokeText(ch, chCx, ty);
      ctx.fillStyle = titleColors[ci];
      ctx.fillText(ch, chCx, ty);

      curX += chW + charGap;
    }

    // 蜡笔波浪下划线（手绘感，贯穿标题下方）
    ctx.beginPath();
    var ulY = ty + fontSize * 0.48;
    var ulW = totalW + 40;
    var ulX0 = cx - ulW / 2;
    ctx.moveTo(ulX0, ulY);
    for (var wx = 1; wx <= 12; wx++) {
      var px = ulX0 + (wx / 12) * ulW;
      var py = ulY + Math.sin(wx * 1.3 + 0.7) * 3.5;
      ctx.lineTo(px, py);
    }
    ctx.strokeStyle = cfg.COLORS.orange; // 橙色下划线（第 4 色，点缀用）
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.stroke();

    // 标题两侧各飘 1 个稍大的装饰色块（四色各一，表达"四色消除"核心机制）
    var decorBlocks = [
      { x: cx - totalW / 2 - 28, y: ty - 6, color: cfg.COLORS.orange, size: 14, rot: -0.25 },
      { x: cx + totalW / 2 + 26, y: ty + 10, color: cfg.COLORS.purple, size: 12, rot: 0.35 }
    ];
    for (var di = 0; di < decorBlocks.length; di++) {
      var db = decorBlocks[di];
      ctx.save();
      ctx.translate(db.x, db.y);
      ctx.rotate(db.rot);
      drawCrayonBlock(ctx, -db.size / 2, -db.size / 2, db.size, db.color,
        di * 77, di * 43, { rot: db.rot * 0.8, wobble: 1.0 });
      ctx.restore();
    }

    // 标题下方「色块滑动 → 触发消除」循环动效（多色轮播 + 随机效果）
    this.drawTitleFx(game);

    ctx.restore();
    // ---- 标题结束 ----

    // 副标题：四个起始色块做装饰（保留原有设计，位置随标题下移）
    ctx.save();
    ctx.fillStyle = cfg.INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '15px sans-serif';
    ctx.fillText('自由游动 · 吃色补头 · 四连消除 · 别撞墙', cx, this.H * 0.35);
    ctx.font = '13px sans-serif';
    ctx.globalAlpha = 0.7;
    ctx.fillText('无尽模式最高分：' + game.best + '    已解锁关卡：' + game.unlocked + ' / 10', this.W / 2, this.H * 0.89);
    ctx.fillText('多人对战最佳：最长 ' + game.mpBest.len + ' 节 · 最高 ' + game.mpBest.score + ' 分', this.W / 2, this.H * 0.89 + 22);
    ctx.restore();
    this.drawParticles(game); // 标题消除动效的粒子（屏幕坐标，无相机变换）
    this.drawButtons(game);
  };

  /**
   * 标题下方装饰动效：小蛇「向左走」一边吃砖块一边凑 4 连消除，循环演示每种颜色各来一次。
   * 蛇头朝左、蛇身向右铺开；砖块从左侧远处流入、被蛇头吃掉补到头部（与游戏内 unshift 一致），
   * 同色节在头侧累积，凑够 4 连即触发消除（蜡笔屑迸裂 + 高亮环 + 星形闪光 + 飘字「4连消除！」），随后循环。
   * 颜色按 COLOR_KEYS 顺序轮播（红→蓝→绿→橙→紫→黄→青→粉→…），保证每种颜色都演示一次再循环。
   * 状态挂在 renderer 实例上（this.titleFx），逐帧更新。
   */
  Renderer.prototype.drawTitleFx = function (game) {
    var ctx = this.ctx;
    var fx = this.titleFx;
    if (!fx) fx = this.titleFx = {
      segs: ['red', 'blue', 'green', 'orange', 'purple'], // 常驻蛇身（多色、无 4 连同色），保证蛇一直有身体在"走"
      feeder: null,      // 正在流入、待"吃"下的砖块 {color, x}
      lastMs: game.timeMs,
      feedTimer: 300,    // 距下一块砖出现的间隔
      colorCursor: 0,    // 当前这一轮要连吃的颜色在 COLOR_KEYS 里的下标
      runLeft: 0,        // 该色还差几块才凑满一轮（一轮=4）
      runColor: cfg.COLOR_KEYS[0],
      bite: 0,           // 蛇头咬合动画剩余时长(ms)
      bob: 0             // 行走摆动相位
    };
    var nowMs = game.timeMs;
    var dt = nowMs - fx.lastMs;
    fx.lastMs = nowMs;
    if (dt < 0) dt = 0;
    if (dt > 80) dt = 80; // 切后台回来防跳帧
    fx.bob += dt;

    var cx = this.W / 2;
    var ty = this.H * 0.22;
    var fontSize = 52;
    var laneY = ty + fontSize * 0.95;             // 标题与副标题之间的一条轨道
    var SEG = 24, BLK = 20, MAXLEN = 14;
    var headX = cx - Math.min(this.W * 0.16, 130); // 蛇头在偏左（朝左走），蛇身向右铺开
    var walkSpeed = 175;                           // 砖块从左侧流入、向右被吃（视觉上=蛇向左走）

    // 1) 出块：COLOR_KEYS 顺序轮一遍（红→蓝→绿→…→粉→红…），每色喂 4 块凑 4 连
    fx.feedTimer -= dt;
    if (!fx.feeder && fx.feedTimer <= 0) {
      fx.feedTimer = 360 + Math.random() * 200;    // 0.36~0.56s 出一块（连续走、不断粮）
      if (fx.runLeft <= 0) {                       // 上一轮凑满，切到下一色
        fx.runColor = cfg.COLOR_KEYS[fx.colorCursor % cfg.COLOR_KEYS.length];
        fx.colorCursor++;
        fx.runLeft = 4;
      }
      fx.feeder = { color: fx.runColor, x: headX - 200 }; // 从左侧远处流入
      fx.runLeft--;
    }

    // 2) 推进待吃砖块（向左流入 → 到蛇头被吃下）；补到头部，超长去尾
    if (fx.feeder) {
      fx.feeder.x += walkSpeed * dt / 1000;
      if (fx.feeder.x >= headX) {
        fx.segs.unshift(fx.feeder.color);          // 补头（与游戏一致：吃到→unshift 到头部）
        if (fx.segs.length > MAXLEN) fx.segs.pop(); // 尾部掉落，总长有界
        fx.bite = 160;
        game.particles.ring(headX, laneY, cfg.COLORS[fx.feeder.color], 0.9); // 咬合小高亮
        fx.feeder = null;
        // 头侧 4 连（前 4 个同色）→ 消除
        var L = fx.segs.length;
        if (L >= 4 && fx.segs[0] === fx.segs[1] && fx.segs[1] === fx.segs[2] && fx.segs[2] === fx.segs[3]) {
          var col = cfg.COLORS[fx.segs[0]];
          for (var k = 0; k < 4; k++) {
            var px = headX + k * SEG;
            game.particles.burst(px, laneY, col, 7, 1.3);
            game.particles.ring(px, laneY, col, 1.3);
          }
          game.particles.flash(headX + 1.5 * SEG, laneY, '#FFD94A', 1.4, 3);
          game.particles.chainText(headX + 1.5 * SEG, laneY - 26, '4连消除！', 20);
          fx.segs.splice(0, 4); // 移除头侧 4 节（常驻蛇身保留）
        }
      }
    }
    if (fx.bite > 0) fx.bite -= dt;

    // 3) 绘制：蛇头在左（朝左走、眼睛朝左），常驻蛇身向右铺开；整体波浪式摆动表现"走"
    ctx.save();
    ctx.textBaseline = 'middle';
    for (var i = 0; i < fx.segs.length; i++) {
      var sx = headX + i * SEG;
      var isHead = (i === 0);
      var sz = isHead ? BLK + 2 : BLK;
      var py = laneY + Math.sin(fx.bob / 240 - i * 0.55) * 2.6; // 蛇身波浪式摆动
      if (sx > headX + MAXLEN * SEG + 30) continue;
      drawCrayonBlock(ctx, sx - sz / 2, py - sz / 2, sz, cfg.COLORS[fx.segs[i]], i * 53 + 17, 41,
        { rot: 0.08, wobble: 1.0, stroke: cfg.SEG_STROKE });
      if (isHead) {
        var sc = 1 + Math.max(0, fx.bite) / 160 * 0.18; // 咬合瞬间微微鼓一下
        ctx.save();
        ctx.translate(sx, py);
        ctx.scale(sc, sc);
        drawEyes(ctx, 0, 0, sz, { x: -1, y: 0 }); // 朝左（行进方向=向左走）
        ctx.restore();
      }
    }
    if (fx.feeder) { // 正在流入、待吃的砖块（带轻微脉冲提示"正在靠近"）
      var fsz = BLK * (1 + 0.08 * Math.sin(nowMs / 120));
      ctx.save();
      ctx.globalAlpha = 0.95;
      drawCrayonBlock(ctx, fx.feeder.x - fsz / 2, laneY - fsz / 2, fsz, cfg.COLORS[fx.feeder.color], 7, 41,
        { rot: 0.08, wobble: 1.0, stroke: cfg.SEG_STROKE });
      ctx.restore();
    }
    ctx.restore();
  };


  Renderer.prototype.drawLevels = function (game) {
    var ctx = this.ctx;
    this.drawOverlay(0.0);
    ctx.save();
    ctx.fillStyle = cfg.INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 26px sans-serif';
    ctx.fillText('选择关卡', this.W / 2, this.H * 0.22);
    ctx.font = '13px sans-serif';
    ctx.globalAlpha = 0.65;
    ctx.fillText('通关可解锁后续关卡，每 2 关解锁 1 种新颜色', this.W / 2, this.H * 0.22 + 34);
    ctx.restore();
    this.drawButtons(game);
  };

  Renderer.prototype.drawResult = function (game, isClear) {
    var ctx = this.ctx;
    this.drawOverlay(0.9);
    ctx.save();
    ctx.fillStyle = cfg.INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 32px sans-serif';
    ctx.fillText(isClear ? '过关！' : '游戏结束', this.W / 2, this.H * 0.30);
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText('得分 ' + game.score, this.W / 2, this.H * 0.39);
    ctx.font = '14px sans-serif';
    ctx.globalAlpha = 0.75;
    if (isClear) {
      ctx.fillText('存活 ' + game.survivalScore + ' 分 + 消除 ' + game.elimScore + ' 分', this.W / 2, this.H * 0.45);
    } else if (game.mode === 'endless') {
      ctx.fillText('历史最高 ' + game.best + ' 分', this.W / 2, this.H * 0.45);
    } else {
      ctx.fillText('目标分数 ' + game.levelCfg.targetScore + '，再接再厉', this.W / 2, this.H * 0.45);
    }
    ctx.restore();
    this.drawButtons(game);
  };
