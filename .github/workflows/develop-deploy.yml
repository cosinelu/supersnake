name: develop-deploy

# 测试环境部署：push develop 自动触发（也允许手动补发）
# 链路：全量测试 → OIDC 换临时凭证 → TAT 下发 deploy-remote.sh → 公网验收
# 设计文档：docs/deploy/02-tencentcloud-hk-ci.md

on:
  push:
    branches: [develop]
  workflow_dispatch:
    branches: [develop]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC 必需
  contents: read

env:
  ENV: dev
  BRANCH: develop
  # 公网验收 URL。后端 8090/8091 已改为仅监听 127.0.0.1，公网入口统一为 nginx:80。
  # 无域名阶段：测试环境在 80 上无法与正式区分 → 留空，由服务器内部自检兜底
  #             （deploy-remote.sh 已 curl 127.0.0.1:8091）。
  # 有域名后：填 http://dev-snake.<你的域名>/ 即可恢复端到端公网验收。
  PUBLIC_URL: ""

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run full test suite
        run: node test/smoke.js && cd server && npm ci && npm test

      - name: OIDC auth to Tencent Cloud
        uses: everpcpc/tencentcloud-oidc-auth@v1
        with:
          role-arn: ${{ vars.TENCENT_ROLE_ARN }}
          oidc-provider-id: github
          region: ap-hongkong

      - name: Install tccli
        run: pip install tccli

      - name: Deploy via TAT and verify
        env:
          INSTANCE_ID: ${{ vars.TAT_INSTANCE_ID }}
        run: bash scripts/ci-deploy.sh
